 July 2017","No longer sold or updated; still worked on Windows 7, 8.1 and 10."]],"d":["weyes"],"req":["9.4: Windows Vista, Server 2008, 7, 8 or 10","Last documented: Windows 7, 8.1 or 10"],"src":["https://afb.org/aw/3/1/14962","https://afb.org/aw/18/6/15200","https://web.archive.org/web/2016/http://www.gwmicro.com/Window-Eyes/Version_History/","https://en.wikipedia.org/wiki/Window-Eyes","https://afb.org/aw/5/3/14752","https://www.freelists.org/post/slikom/Fw-WindowEyes-50-Beta-1-Has-Been-Released","https://afb.org/aw/6/2/14635","https://window-eyes.informer.com/versions/"]},{"id":"ztv","n":"ZoomText versions","co":"fs","h":"ZoomText milestones.","v":[["ZoomText for DOS","1988","First version."],["ZoomText for Windows","1991","First Windows version."],["10.1 (update 10.11.8)","May 2017","Support for the Windows 10 Creators Update."],["2025 (2025.2502.63)","2025","ARM64 support on Windows 11; required for Windows 11 25H2."],["2026","2025 to 2026","Current; 64-bit Windows 10 and 11."]],"d":["ztdos","ztwin"],"req":["Current: 64-bit Windows 10 or 11, 16 GB RAM recommended, DirectX 11, 2 GB disk"],"src":["https://afb.org/aw/18/6/15200","https://support.freedomscientific.com/downloads/arm64","https://support.freedomscientific.com/content/documents/manuals/ZoomText/ZoomText_User_Guide_English_US.pdf"]},{"id":"outv","n":"outSPOKEN versions","co":"berkeley","h":"outSPOKEN milestones.","v":[["outSPOKEN for Macintosh","1989","Off-screen model; mouse pointer used as a review cursor."],["outSPOKEN for Windows","1994","For Windows 3.1."]],"d":["outmac","outwin"],"src":["https://en.wikipedia.org/wiki/OutSPOKEN"]},{"id":"mobsv","n":"Mobile Speak versions","co":"codefactory","h":"Code Factory's mobile screen reader milestones.","v":[["Mobile Accessibility for Symbian","2003","First affordable phone access solution."],["Mobile Speak for Symbian","2004","Full screen reader, launched in 20 countries."],["Mobile Speak Pocket","2005","Windows Mobile Pocket PCs; described as the first touch-based screen reader."],["Mobile Speak Smartphone","2006","Windows Mobile Smartphones; AFB reviewed version 1.2."],["Mobile Speak 2.8","2006","Version AFB tested; uses Fonix DECtalk."],["Mobile Speak 3.0","2006 to 2007","Bundled Mobile Magnifier."]],"d":["mobilespeak"],"src":["https://codefactoryglobal.com/company/","https://afb.org/aw/8/1/14407","https://afb.org/aw/8/4/14343"]},{"id":"brlttyv","n":"BRLTTY versions","co":"linuxcommunity","h":"BRLTTY milestones.","v":[["0.22 beta","December 1995","First announced release."],["1.0","July 26, 1996","Drivers for CombiBraille, ALVA and TSI Navigator."],["1.0.1","September 1996","Initial speech support."],["1.9.0","1998","Nicolas Pitre becomes maintainer."],["2001 onward","2001","Dave Mielke becomes maintainer."]],"d":["brltty"],"src":["https://brltty.app/pipermail/brltty/2015-December/013007.html","https://www.ibiblio.org/pub/historic-linux/ftp-archives/sunsite.unc.edu/Sep-29-1996/system/Access/brltty-1.0.2.README"]},{"id":"sysaccv","n":"System Access milestones","co":"serotek","h":"Serotek's and Pneuma Solutions' System Access screen reader. Per-version release notes were not found.","v":[["FreedomBox","Date not given in the sources cited for this history","Serotek's FreedomBox was a simplified, speech-driven portal for the web, email and other services; AccessWorld reviewed it as a system for 'the liberty to use a computer'. It evolved into System Access in 2005."],["System Access","2005","Full screen reader access to Word, Excel, Outlook Express, Internet Explorer and PowerPoint text."],["System Access to Go","2007 (free from February 2008)","Launched in 2007 as a web-based screen reader that needs no install. From 2008 it was free through the AIR Foundation (Accessibility Is a Right). It ran from a website on any compatible PC: web, email, forms, PDF and operating-system tasks."],["Pneuma Solutions","2020","Mike Calvo and Matt Campbell co-founded Pneuma Solutions."]],"d":["sysaccess"],"req":["System Access to Go (2008): Windows XP or Vista, an Internet connection, a sound card and a recent Internet Explorer.","Other versions: not listed in the sources cited (System Access release notes were not found)."],"src":["https://pneumasolutions.com/about/","https://afb.org/aw/7/3/14499","https://afb.org/aw/7/3/14499","https://www.bbc.co.uk/blogs/access20/2007/06/sa_to_go_on_the_go.shtml","https://pneumasolutions.com/serotek-releases-the-worlds-first-web-based-access-technology-tool-for-the-blind/","https://blindaccessjournal.com/2008/02/why-not-enjoy-a-little-fresh-air/","https://www.vomitcomet.org/2008/02/07/system-access-to-go/"]},{"id":"googletts","n":"Google speech engines on Android","co":"google","h":"From SVOX Pico in Android 1.6 to the Google Text-to-Speech app and WaveNet neural voices.","v":[["SVOX Pico","September 2009","Built into Android 1.6 Donut: US and UK English, French, German, Italian, Spanish."],["Google Text-to-Speech app","October 2013","Standalone Play Store app."],["WaveNet","October 4, 2017","Neural voices for Google Assistant US English and Japanese."]],"d":["pico","gtts","wavenet","talkback"],"src":["https://android-developers.googleblog.com/2009/09/introduction-to-text-to-speech-in.html","https://en.wikipedia.org/wiki/Google_Text-to-Speech","https://www.androidpolice.com/2013/11/06/new-app-google-text-to-speech-arrives-in-the-play-store-paves-way-for-future-updates-fixes-awful-default-voices-on-note-3-and-others/","https://deepmind.google/blog/wavenet-launches-in-the-google-assistant/"]},{"id":"siriv","n":"Siri voices","co":"apple","h":"Siri voice changes since 2011.","v":[["Original voices","October 14, 2011","Susan Bennett (US), Jon Briggs (UK), Karen Jacobsen (Australia)."],["Male voice option","June 2013","Changes not listed in the sources cited for this history"],["iOS 11","2017","Deep-learning voices."],["iOS 14.5","April 2021","Two new American English voices; no default voice."],["iOS 15.4 beta","February 2022","Gender-neutral voice (Quinn)."]],"d":["siri2011","siri2017","siri2021","siriquinn"],"src":["https://en.wikipedia.org/wiki/Siri","https://arstechnica.com/gadgets/2021/04/apple-releases-ios-14-5-the-biggest-update-since-ios-14-first-launched/"]},{"id":"vomacv","n":"VoiceOver for macOS versions","co":"apple","h":"VoiceOver on the Mac. Apple announced a 'Spoken Interface' in 2004, and VoiceOver shipped in Mac OS X 10.4 Tiger on April 29, 2005. AppleVis calls this the first fully functional screen reader built into an operating system, with no separate installation. Before it, the Mac depended on Berkeley Systems' outSPOKEN (1989), which never came to Mac OS X. System requirements are those of each macOS release; VoiceOver has no separate requirements or price.","req":["Any Mac that runs Mac OS X 10.4 Tiger or later; included free with the OS."],"v":[["Spoken Interface preview","2004","Apple announced it was working on a Spoken Interface."],["VoiceOver 1 (Mac OS X 10.4 Tiger)","April 29, 2005","First built-in Mac screen reader. Unlike Narrator, it offered a full command set to explore the interface, not just echo keyboard focus. Mac OS X 10.2 Jaguar's Universal Access had come first."],["VoiceOver 2 (Mac OS X 10.5 Leopard)","October 2007","A major upgrade: the Alex voice, braille display support, positional audio, Keyboard and NumPad Commanders, and object navigation."],["Mac OS X 10.6 Snow Leopard","August 2009","Trackpad gestures, the rotor, quick navigation, Auto Web Spots, better web and table navigation, the ability to label items, and customization."],["Mac OS X 10.7 Lion","July 2011","23 built-in languages, downloadable higher-quality voices, and VoiceOver Activities (per-app or per-task settings)."],["macOS Catalina","2019","Voice Control (a general accessibility feature) arrived on the Mac alongside iOS 13."],["macOS Ventura","2022","More than 20 additional VoiceOver languages and locales, and Text Checker for formatting errors."],["Later versions","Date not given in the sources cited for this history","Version-by-version macOS VoiceOver changes after Ventura are not documented in the sources used."]],"d":["vomac"],"src":["https://www.applevis.com/blog/voiceover-turns-10","https://web.archive.org/web/20061116183631/http:/www.apple.com/macosx/leopard/accessibility.html","https://web.archive.org/web/20091027153017/http:/www.apple.com/macosx/accessibility/","https://maccessibility.net/2009/08/28/mac-os-x-10-6-snow-leopard-with-voiceover","https://www.macstories.net/stories/a-timeline-of-ios-accessibility-it-started-with-36-seconds/","https://www.apple.com/newsroom/2022/05/apple-previews-innovative-accessibility-features/"]},{"id":"voiosv","n":"VoiceOver for iOS and iPadOS versions","co":"apple","h":"VoiceOver for iPhone was announced in 36 seconds of the WWDC keynote on June 8, 2009 and shipped on the iPhone 3GS on June 19, 2009. Older iPhones could not run iPhone OS 3 accessibly, so blind users needed a 3GS or the third-generation iPod touch (fall 2009). Before that, the 2008 iPod nano had a 'VoiceOver' made of audio files that iTunes generated. The iPad (2010) was the first Apple product accessible from day one.","req":["iPhone 3GS or later, or third-generation iPod touch or later, on iPhone OS 3 or later; each later iOS version follows Apple's hardware support list. iOS 6 was the last version for the iPhone 3GS."],"v":[["iPod nano 'VoiceOver'","Spring 2008","Spoken menus built from text-to-speech audio files that iTunes generated; iTunes on the Mac became VoiceOver accessible at the same time."],["iPhone OS 3 (iPhone 3GS)","June 19, 2009","Touch to hear what's under your finger, double-tap to activate, the rotor (two-finger twist), and three-finger scrolling. Shipped with Zoom, White on Black and Mono Audio."],["iPad / iPhone OS 3.2","Spring 2010","iBooks readable with VoiceOver, the two-finger scrub gesture, and Touch Typing."],["iOS 4","Fall 2010","Bluetooth keyboards, Bluetooth braille displays, Touch Typing on iPhone, and a web rotor in Safari."],["iOS 5","Fall 2011","VoiceOver usable during setup (triple-click Home starts it), enhanced voices, the Item Chooser, web keyboard shortcuts, custom labels, rotor customization, and face detection in Camera."],["iOS 6","Fall 2012","VoiceOver Actions (flick up or down) and Maps' Pause to Follow and points-of-interest rotor. Last iOS for the iPhone 3GS."],["iOS 7","Fall 2013","VoiceOver Handwriting, Switch Control, and Accessibility moved near the top of Settings."],["iOS 8","Fall 2014","Braille Screen Input, Direct Touch Typing, the Alex voice from macOS, and Speak Screen."],["iOS 9","Fall 2015","3D Touch Peek and Pop, Split View gestures, and text-selection rotor changes."],["iOS 10","Fall 2016","Pronunciation editor, audio routing, and basic image descriptions in Photos."],["iOS 11","Fall 2017","Drag and drop, iPhone X gestures, multi-app moving, and Type to Siri."],["iOS 12","Fall 2018","Fixes for many iOS 11 braille and VoiceOver bugs."],["iOS 13","Fall 2019","Continued braille improvements; Voice Control."],["iOS 14","Fall 2020","Screen Recognition, which uses on-device machine learning to label unlabeled buttons and controls, plus image descriptions and text recognition."],["iOS 15","Fall 2021","Richer image descriptions and Live Text in VoiceOver."],["iOS 16","Fall 2022","Magnifier Detection Mode with Door Detection, People Detection and Image Descriptions; 20+ new languages."],["iOS 17","Fall 2023","Point and Speak in Magnifier, which reads labels on physical buttons using LiDAR; Personal Voice and Live Speech."],["iOS 18","Fall 2024","Configurable voices, rotor and audio ducking, new tutorials, haptics, and live-region announcements."]],"d":["voios"],"src":["https://www.macstories.net/stories/a-timeline-of-ios-accessibility-it-started-with-36-seconds/","https://www.applevis.com/blog/voiceover-turns-10","https://www.perkins.org/resource/ios-14-screen-recognition/","https://support.apple.com/en-us/111799","https://www.apple.com/newsroom/2022/05/apple-previews-innovative-accessibility-features/","https://www.apple.com/newsroom/2023/05/apple-previews-live-speech-personal-voice-and-more-new-accessibility-features/","https://www.afb.org/blog/entry/ios-18-accessibility-features"]},{"id":"orcav","n":"Orca versions","co":"gnome","h":"Orca is the GNOME desktop's free screen reader, written in Python. Marc Mulcahy, a blind programmer at Sun Microsystems, built the first prototype in May 2004. Sun's Accessibility Program Office, led by Willie Walker, carried it to v1.0 in GNOME 2.16 (September 2006), replacing Gnopernicus. After Oracle bought Sun, Walker was laid off (early 2010) and volunteers led by Joanmarie Diggs took over. Igalia hired Diggs on September 7, 2011. Orca follows GNOME's six-month release cycle.","req":["Linux or another Unix-like OS with GNOME's AT-SPI accessibility stack, Python, and a speech engine through Speech Dispatcher (eSpeak NG by default on most distributions); BRLTTY for braille."],"v":[["Prototype","May 2004","First prototype by Marc Mulcahy at Sun."],["0.x development releases","2004 to 2006","Early test releases, ending with v0.9.0."],["1.0.0","September 3, 2006","First official release, in GNOME 2.16. It targeted the GNOME desktop, yelp, gedit, gnome-terminal, Evolution 2.8, gaim and OpenOffice 2.0.4/StarOffice, with updated guides, speech-engine fallback and Java/OpenOffice fixes. Shipped in Solaris, Ubuntu and Fedora."],["2.17.x","Late 2006 to early 2007","Development series with 'significant usability improvements' over 1.0."],["1.0.1","January 28, 2007","Translation-only release for GNOME 2.16.3."],["Volunteer era","2010 onward","After Oracle's layoffs, led by Joanmarie Diggs; supported by Igalia from September 2011."],["48.1","May 1, 2025","Stable release listed on Wikipedia; Orca now uses GNOME version numbers."]],"d":["orca"],"src":["https://mail.gnome.org/archives/gnome-announce-list/2006-September/msg00008.html","https://lists.gnome.org/archives/gnome-announce-list/2007-January/msg00096.html","https://en.wikipedia.org/wiki/Orca_(assistive_technology)","https://lwn.net/Articles/373475/"]},{"id":"fenrirv","n":"Fenrir versions","co":"linuxcommunity","h":"A Python 3 user-space screen reader for the Linux console (TTY), by Chrys with Storm Dragon and others. Because it runs in user space, it does not need to be compiled into the kernel like Speakup. The GitHub repository was created on July 4, 2016. Development later moved to the Stormux git server.","req":["Linux (vcsa, evdev and pty drivers); macOS, BSD and Windows through the pty driver. Python 3.3 or later, python-evdev, pyudev, the uinput kernel module, access to /dev/vcsa and /dev/input, and eSpeak or Speech Dispatcher; sox for sound icons."],"v":[["0.1a0","October 5, 2016","Early alpha uploaded with its history. It needed python-espeak, python-evdev and uinput; braille was not implemented yet."],["1.0","February 7, 2017","First stable release, announced by Storm Dragon."],["1.9","Date not given in the sources cited for this history","Recommended for production. Speech and sound icons, clipboard history (10 entries), desktop, laptop and PTY layouts, learn mode, spell check and definable windows."],["1.9.2","July 16 (year not given in the release notes)","Import from the X clipboard, barrier mode for dialog-style windows, better highlight tracking and attribute sound icons."],["1.9.6","February 15 (year not given in the release notes)","Menu-style macros and a settings menu; reworked Speech Dispatcher driver (voice and language swapped)."],["1.9.7","May 17 (year not given in the release notes)","Device-detection fix, gstreamer driver no longer experimental, Russian translation, real Unicode in VCSA and faster pty backends."]],"d":["fenrir"],"src":["https://git.stormux.org/storm/fenrir/commit/ee7eb3a9c6688081e55b20b42fa087b2cab8ac38","https://lists.gnome.org/archives/orca-list/2017-February/msg00079.html","https://github.com/chrys87/fenrir","https://github.com/chrys87/fenrir/releases"]},{"id":"speakupv","n":"Speakup versions","co":"linuxcommunity","h":"A screen review package built into the Linux kernel, written by Kirk Reiser and Andy Berdan. It speaks console output and offers review commands such as say word, say line and announce cursor position. It talks to hardware synthesizers, or to software speech through espeakup.","req":["A Linux kernel with Speakup modules (in mainline since 2.6.37, in drivers/accessibility since 5.9), plus a hardware synthesizer (DoubleTalk, DECtalk, Apollo and others) or a software synth through espeakup."],"v":[["0.01 alpha","October 29, 1998","First alpha, as kernel patches for development kernels 2.1.123 and 2.1.125. It supported only the internal DoubleTalk synthesizer and lacked automatic cursor reading."],["2.2.x / 2.4.x / 2.6.x patches","1999 to 2010","Out-of-tree releases for the 2.2, 2.4 and 2.6 kernels from linux-speakup.org."],["Staging (Linux 2.6.37)","Late 2010 / January 2011","Merged into the kernel's staging tree."],["Graduation (Linux 5.9)","2020","After 47 releases in staging, Samuel Thibault finished the TODO items; Speakup moved to drivers/accessibility/speakup (commit of July 29, 2020)."]],"d":["speakup"],"src":["https://lkml.iu.edu/9810.3/0735.html","http://linux-speakup.org/speakup.html","https://lwn.net/Articles/798258/","https://upd.dev/torvalds/linux/commit/2067fd92d75b6d9085a43caf050bca5d88c491b8"]},{"id":"voiceviewv","n":"VoiceView versions","co":"amazon","h":"Amazon's Fire tablet screen reader, a full rewrite that replaced the TalkBack integration on earlier Fire tablets.","req":["An Amazon Fire tablet running Fire OS 5 or later (Fire OS 5 is based on Android 5.1.1). Braille needs a 4th-generation or newer Fire tablet and a supported Bluetooth display."],"v":[["Before VoiceView","2011 to 2015","Fire tablets used an integration of Android TalkBack."],["VoiceView 1 (Fire OS 5 'Bellini')","September 2015","Linear and touch navigation, IVONA voices, a wide speed range, lower latency, simplified gestures, new earcons, a jog-wheel gesture, a tutorial, and braille through BrailleBack."],["Braille update","September 2017","Native Bluetooth braille input and output in contracted, uncontracted, UEB and computer braille, with chord commands; BAUM, HumanWare and Orbit Reader 20 displays."]],"d":["voiceview"],"src":["https://blog.the-ebook-reader.com/2015/09/22/fire-os-5-adds-new-accessibility-features-to-fire-tablets/","https://www.aboutamazon.com/news/devices/improving-device-accessibility-for-customers-with-disabilities","https://www.aboutamazon.com/news/devices/introducing-new-accessibility-features-for-amazon-fire-tablets-and-fire-tv","https://www.lifewire.com/history-of-fire-os-4582380"]},{"id":"commv","n":"Commentary (Jieshuo) versions","co":"jieshuodev","h":"Jieshuo ('解说'), known in English as Commentary Screen Reader or CSR and earlier as TalkMan, is an Android screen reader by Chinese developer Weiliang Li. A Czech review says it began as a more capable TalkBack alternative for the developer's brother, who was unhappy with TalkBack. It spread beyond China in April (2019 per the GitHub record) when a Polish user, 'Nuno', translated it into English. Version-by-version release notes were not found in English sources.","req":["An ARM 32- or 64-bit Android device (x86 not guaranteed), Android 4.4.2 or later (some features need Android 8 or later), at least 1 GB RAM and 50 MB storage."],"v":[["Chinese releases","About 2017 to 2019","Developed in China. The Czech review says development started 'two years' before its 2019 international release."],["International / English release","2019","English translation by 'Nuno'; GitHub documentation repository created July 14, 2019."],["Current feature set","Not dated","Voice assistant with custom commands, OCR anywhere you touch, Commentary Camera for scenes and objects, CAPTCHA recognition, fast translation, virtual screen with object navigation, plugins, sound schemes, per-app gestures, granular editing and selection, list copying, article reading mode, and automatic pausing for braille keyboards. Many advanced features need the paid full version."]],"d":["jieshuo"],"src":["https://github.com/nirenr/jieshuo/","https://accessibleandroid.com/glossary/jieshuo-2/","https://aryaniraula.com.np/guide-for-jieshuo-commentary-screen-reader/","https://www.portal-pelion.cz/commentary-screen-reader-novy-impuls-v-pristupnosti-androidu-pro-nevidome/","https://blindhelp.net/software/jieshuo"]},{"id":"samsungvav","n":"Samsung Voice Assistant versions","co":"samsung","h":"Samsung's own Android screen reader for Galaxy phones. Reports say it was first called Galaxy TalkBack (Samsung's build of Google's reader) before being renamed Voice Assistant; the exact rename date was not found in the sources checked. Samsung co-developed the 'all-new TalkBack' with Google, and from One UI 3 (Android 11) TalkBack replaced Voice Assistant as the default on all Galaxy devices, keeping its multi-finger gestures and menu ideas.","req":["Samsung Galaxy phones and tablets running TouchWiz or One UI up to One UI 2.x (Android 10)."],"v":[["Galaxy TalkBack / Voice Assistant","About 2015 (Galaxy S6 era, per device entry)","Samsung-specific screen reader with multi-finger gestures and a quick menu."],["One UI 3.0 (Android 11)","Late 2020","Voice Assistant removed and replaced by Google TalkBack."],["TalkBack 9.1 (co-developed)","February 23, 2021","Google and Samsung released the all-new TalkBack: a dozen multi-finger gestures, reading controls, more than 25 voice commands, a customizable menu, and Arabic and Spanish braille keyboards."]],"d":["samsungva","talkback"],"src":["https://blog.google/products-and-platforms/platforms/android/all-new-talkback/","https://www.androidpolice.com/2020/09/14/heres-the-changelog-for-samsungs-first-one-ui-3-0-beta-based-on-android-11/","https://www.samsung.com/us/sustainability/accessibility/mobile/voice-assistant/"]}],"TRIV":[{"t":"The Braillo 270 (January 1980) was the world's first double-sided braille embosser. The first unit ran at a Norwegian school for 33 years.","d":"braillo270","lv":"Medium"},{"t":"Index Braille's first embossers were built in co-founder Björn Löfstedt's garage in 1984.","d":"idx37","lv":"Medium"},{"t":"About 15,000 Optacons were sold between 1971 and 1996.","d":"optacon","lv":"Medium"},{"t":"The first Kurzweil Reading Machine (1976) cost $30,000 to $50,000 and spoke with a Votrax synthesizer.","d":"krm","lv":"Medium"},{"t":"DECtalk's default voice is Perfect Paul. Its nine voices include Kit the Kid and Whispering Wendy.","d":"dt_paul","lv":"Easy"},{"t":"outSPOKEN was the only Macintosh screen reader ever available before VoiceOver.","d":"outmac","lv":"Easy"},{"t":"HumanWare's DeafBlind Communicator (2008) filled a gap left when the TeleBraille went out of production in 1993.","d":"dbc","lv":"Hard"},{"t":"The BrailleNote Apex 18 (2010) was the tenth notetaker in the BrailleNote line.","d":"bnapex18","lv":"Hard"},{"t":"Sendero GPS launched on the BrailleNote Classic in 2001.","d":"bnclassic","lv":"Medium"},{"t":"Speakup's first alpha in 1998 supported only one synthesizer, the DoubleTalk.","d":"speakup","lv":"Hard"},{"t":"T. V. Raman realized Emacspeak was special when he speech-enabled the Emacs calendar in November 1994.","d":"emacspeak","lv":"Hard"},{"t":"Each MacinTalk 3 voice hid a joke phrase. Bubbles says 'Pull the plug! I'm drowning!'","d":"mac_bubbles","lv":"Hard"},{"t":"The Macintosh introduced itself in 1984 with MacinTalk: 'Hello. I'm Macintosh. It sure is great to get out of that bag.'","d":"mt1984","lv":"Easy"},{"t":"APH/HumanWare's Monarch was named one of TIME's Best Inventions of 2025.","d":"monarch","lv":"Easy"},{"t":"Blazie notetakers were so popular that AFB reported about 70,000 in use.","d":"bns","lv":"Medium"},{"t":"ViewPlus exists because physicist John Gardner went blind in 1988 and his team invented TIGER tactile graphics.","d":"tigeradv","lv":"Medium"},{"t":"S.A.M., the Software Automatic Mouth (1982), talked with no extra hardware on the Atari and cost $59.95.","d":"sam","lv":"Easy"},{"t":"Siri's original US voice belongs to Susan Bennett, who recorded it in July 2005, six years before Siri launched on the iPhone 4S.","d":"siri2011","lv":"Easy"},{"t":"Since iOS 14.5 (2021), Siri has no default voice: you pick one when setting up the device.","d":"siri2021","lv":"Easy"},{"t":"VoiceOver came to the iPhone with the iPhone 3GS in 2009.","d":"voios","lv":"Easy"},{"t":"TalkBack was announced in October 2009 with two siblings, SoundBack and KickBack.","d":"talkback","lv":"Easy"},{"t":"VoiceOver became a standard Mac feature in Mac OS X 10.4 Tiger (2005).","d":"vomac","lv":"Easy"},{"t":"Apple's Alex voice debuted with Mac OS X 10.5 Leopard in 2007.","d":"mac_alex","lv":"Easy"},{"t":"JAWS stands for Job Access With Speech.","d":"jaws","lv":"Easy"},{"t":"The Braille 'n Speak 2000 arrived in 1997.","d":"bns2000","lv":"Easy"},{"t":"APH's Book Port (2003) weighed 6 ounces with its two AA batteries.","d":"bookport","lv":"Easy"},{"t":"Google Assistant's voices became neural in October 2017, when DeepMind's WaveNet started generating them.","d":"wavenet","lv":"Easy"},{"t":"APH called the Braille Plus 18 the world's first Android smartphone designed for blind students and professionals.","d":"bplus18","lv":"Easy"},{"t":"Orbit Research announced the Orbit Reader 40 at CSUN in March 2020.","d":"or40","lv":"Easy"},{"t":"The explorē 8 magnifier has two cameras: one for close-up reading and one for distance.","d":"explore8","lv":"Easy"},{"t":"The NuEyes Pro 3 glasses (2020) weigh just 88 grams.","d":"nuepro3","lv":"Easy"},{"t":"Window-Eyes 1.0 shipped on October 16, 1995.","d":"weyes","lv":"Easy"},{"t":"Google's Text-to-Speech app speaks for TalkBack, Google Play Books and Google Translate.","d":"gtts","lv":"Easy"},{"t":"HIMS launched the Braille Hansone in 2002, two years before the BrailleSense.","d":"hansone","lv":"Easy"},{"t":"Hansone, the name of HIMS's first notetaker, means 'to see the world through one fingertip.'","d":"hansone","lv":"Medium"},{"t":"Android's first built-in voices, SVOX Pico in Android 1.6 (2009), spoke US and UK English, French, German, Italian and Spanish.","d":"pico","lv":"Medium"},{"t":"The BrailleNote Classic's 18- and 32-cell models shared one case, so an 18-cell unit could be upgraded to 32 cells.","d":"bnclassic","lv":"Medium"},{"t":"In 2000 a BrailleNote 32 cost $4,995 and the 18-cell model $3,395.","d":"bnclassic","lv":"Medium"},{"t":"The 2004 BrailleSense had a VGA video-out port, two USB ports and a LAN port.","d":"bsense","lv":"Medium"},{"t":"GW Micro, maker of Window-Eyes, distributed the first BrailleSense in the US.","d":"bsense","lv":"Medium"},{"t":"JAWS 4.5 (August 2002) introduced quick navigation keys for web pages.","d":"jaws","lv":"Medium"},{"t":"JAWS 7.0 (2005) could run from a thumb drive.","d":"jaws","lv":"Medium"},{"t":"JAWS switched to year-based names with JAWS 2018, released in October 2017.","d":"jaws","lv":"Medium"},{"t":"Henter-Joyce, the original maker of JAWS, was founded in 1985 with $180,000 from Bill Joyce.","d":"jaws","lv":"Medium"},{"t":"JAWS 13 (October 2011) was the first version with built-in OCR.","d":"jaws","lv":"Medium"},{"t":"NVDA 2019.3 (February 2020) moved NVDA to Python 3 and rewrote its speech system.","d":"nvda","lv":"Medium"},{"t":"Window-Eyes 7.0 (2008) added standard scripting.","d":"weyes","lv":"Medium"},{"t":"Window-Eyes' last release was 9.5.3, on September 14, 2016.","d":"weyes","lv":"Medium"},{"t":"With version 6.2 in June 2018, TalkBack became the Android Accessibility Suite.","d":"talkback","lv":"Medium"},{"t":"TalkBack 8.2 (April 2020) added an on-screen braille keyboard.","d":"talkback","lv":"Medium"},{"t":"In Google's tests WaveNet's US English voice scored 4.347 out of 5 for naturalness; real human speech scored 4.667.","d":"wavenet","lv":"Medium"},{"t":"Google Text-to-Speech became a standalone Play Store app in late 2013, so voices could update without a new Android r.","d":"polaris","lv":"Medium"},{"t":"HIMS made only two VoiceSense models: the original (2007) and the QWERTY (2010).","d":"vsense","lv":"Medium"},{"t":"OrCam was founded in 2010 by Amnon Shashua and Ziv Aviram.","d":"orcam1","lv":"Medium"},{"t":"HumanWare's Brailliant BI X displays run KeySoft Lite, a small set of notetaker apps.","d":"bi40x","lv":"Medium"},{"t":"Talking Arch is a speech- and braille-enabled Arch Linux live image with no graphical installer.","d":"talkingarch","lv":"Medium"},{"t":"Sonar GNU/Linux was based on Manjaro.","d":"sonar","lv":"Medium"},{"t":"The Commodore 64 version of S.A.M. blanked the screen while speaking; a 'light' mode kept it on but made the voice gravelly.","d":"sam","lv":"Hard"},{"t":"S.A.M. accepted about 50 phonemes written as ASCII codes such as IY, AE and NX, with stress digits 1 to 8.","d":"sam","lv":"Hard"},{"t":"S.A.M. was the basis of the original MacinTalk.","d":"sam","lv":"Hard"},{"t":"Production WaveNet generated 24,000 samples a second at 16-bit, 1,000 times faster than DeepMind's research version.","d":"wavenet","lv":"Hard"},{"t":"TalkBack's 2009 authors were T. V. Raman, Charles Chen and Svetoslav Ganov.","d":"talkback","lv":"Hard"},{"t":"Early TalkBack users navigated with the phone's trackball.","d":"talkback","lv":"Hard"},{"t":"JAWS for Windows 1.0 (January 1995) ran on Windows 3.1 and Windows for Workgroups 3.11.","d":"jaws","lv":"Hard"},{"t":"JAWS 10 (2008) introduced Tandem remote support, and JAWS 11 (2009) shipped on DVD.","d":"jaws","lv":"Hard"},{"t":"JAWS 8 (2006) bundled RealSpeak Solo voices and dropped Windows 98 and ME.","d":"jaws","lv":"Hard"},{"t":"Window-Eyes 4.0 came out on October 16, 2000, exactly five years after 1.0.","d":"weyes","lv":"Hard"},{"t":"NVDA 2026.1 dropped Windows 8.1, Windows 10 on ARM and 32-bit Windows, and added 64-bit SAPI5 voices.","d":"nvda","lv":"Hard"},{"t":"NVDA 2024.1 dropped Windows 7 and 8 and was built with Python 3.11.","d":"nvda","lv":"Hard"},{"t":"On the first Bra  var prods=DEV.filter(function(d){return d.co===c.id;}).sort(sortD),oses=OSL.filter(function(o){return o.co===c.id;}),h="";
 h+=head(c.n)+P("Founded: "+(c.f||ND)+" · "+prods.length+(prods.length===1?" product":" products"))+'<div class="row">'+favBtn("co:"+c.id)+txtLink("co:"+c.id,c.n)+'</div>';
 h+='<h3>History</h3>'+P(c.h);
 CATS.forEach(function(cat){var l=prods.filter(function(d){return d.cat===cat;});if(l.length)h+='<h3>'+esc(cat)+' ('+l.length+')</h3><ul class="list">'+l.map(function(d){return devItem("cat:",d);}).join("")+'</ul>';});
 if(oses.length)h+='<h3>Operating systems and software history</h3><ul class="list">'+oses.map(function(o){return item("cos:"+o.id,o.n,o.v.length+" versions","os:"+o.id,isFav("os:"+o.id));}).join("")+'</ul>';
 h+='<h3>Sources</h3>'+srcList(c.src);return h;
}
function osPage(o){
 var h=head(o.n)+P(coName(o.co))+'<div class="row">'+favBtn("os:"+o.id)+txtLink("os:"+o.id,o.n)+'</div><h2>Overview</h2>'+P(o.h)+'<h2>Version history</h2>';
 o.v.forEach(function(x){h+='<h3>'+esc(x[0])+'</h3>'+P("Released: "+(x[1]||ND))+P(x[2]||ND);});
 h+='<h2>Devices and software that ran it</h2>'+linkList("odev:",o.d);
 h+='<h2>System Requirements</h2>'+(o.req&&o.req.length?bul(o.req):P(ND))+'<h2>Sources</h2>'+srcList(o.src);return h;
}
function scrName(s){return s.k==="co"?coName(s.id):s.k==="dev"?(DM[s.id]?DM[s.id].n:s.id):(OM[s.id]?OM[s.id].n:s.id);}
function opts(list,val){return list.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?" selected":"")+'>'+esc(o[1])+'</option>';}).join("");}
var catOpts=[["All","All categories"]].concat(CATS.map(function(c){return [c,c];}));
var coOpts=[["All","All companies"]].concat(CO.slice().sort(function(a,b){return a.n.localeCompare(b.n);}).map(function(c){return [c.id,c.n];}));
function searchRes(){var s=st.q.trim().toLowerCase();if(!s&&st.qCat==="All")return null;
 var d=DEV.filter(function(x){return (st.qCat==="All"||x.cat===st.qCat)&&(!s||(x.n+" "+coName(x.co)+" "+x.cat+" "+x.y+" "+(x.o||"")+" "+(x.h||"")+" "+(x.s?Object.keys(x.s).map(function(k){return x.s[k];}).join(" "):"")).toLowerCase().indexOf(s)>=0);}).sort(sortD);
 var c=s&&st.qCat==="All"?CO.filter(function(x){return (x.n+" "+x.h).toLowerCase().indexOf(s)>=0;}):[];
 var o=s&&st.qCat==="All"?OSL.filter(function(x){return (x.n+" "+x.h+" "+x.v.map(function(v){return v.join(" ");}).join(" ")).toLowerCase().indexOf(s)>=0;}):[];
 return {d:d,c:c,o:o};}
function searchResultsHtml(){var r=searchRes();if(!r)return "";var h="";
 if(r.d.length)h+='<h3>Devices and software ('+r.d.length+')</h3><ul class="list">'+r.d.map(function(d){return devItem("s:",d);}).join("")+'</ul>';
 if(r.c.length)h+='<h3>Companies ('+r.c.length+')</h3><ul class="list">'+r.c.map(function(c){return item("sc:"+c.id,c.n,"Company","co:"+c.id,isFav("co:"+c.id));}).join("")+'</ul>';
 if(r.o.length)h+='<h3>Operating systems ('+r.o.length+')</h3><ul class="list">'+r.o.map(function(o){return item("so:"+o.id,o.n,"OS history","os:"+o.id,isFav("os:"+o.id));}).join("")+'</ul>';
 if(!h)h=P("No matches.");return h;}
function tlList(){return DEV.filter(function(x){return (st.tlCo==="All"||x.co===st.tlCo)&&(st.tlCat==="All"||x.cat===st.tlCat);}).sort(sortD);}
function tlHtml(){var l=tlList(),decs=[];l.forEach(function(d){var k=d.yr?Math.floor(d.yr/10)*10:0;if(decs.indexOf(k)<0)decs.push(k);});decs.sort(function(a,b){return (a||99999)-(b||99999);});
 var h=P(l.length+" entries, grouped by decade and year.");
 decs.forEach(function(dec){var inD=l.filter(function(d){return (d.yr?Math.floor(d.yr/10)*10:0)===dec;}),ys=[];inD.forEach(function(d){if(ys.indexOf(d.yr)<0)ys.push(d.yr);});
  h+='<h3>'+(dec?dec+"s":"Year not documented")+'</h3>';ys.forEach(function(y){if(y)h+='<h4>'+y+'</h4>';h+='<ul class="list">'+inD.filter(function(d){return d.yr===y;}).map(function(d){return devItem("tl:",d);}).join("")+'</ul>';});});
 return h;}
function tabView(){var t=st.tab,h="";
 if(t==="companies"){h=head("Companies")+P(CO.length+" companies. Choose one to see its history and product catalog.")+'<ul class="list">'+CO.slice().sort(function(a,b){return a.n.localeCompare(b.n);}).map(function(c){return item("co:"+c.id,c.n,"Founded "+(c.f||ND)+" · "+DEV.filter(function(d){return d.co===c.id;}).length+(DEV.filter(function(d){return d.co===c.id;}).length===1?" product":" products"),"co:"+c.id,isFav("co:"+c.id));}).join("")+'</ul>';}
 else if(t==="search"){h=head("Search")+'<div role="search"><label for="q">Search devices, companies, voices and operating systems</label><input id="q" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" value="'+esc(st.q)+'" placeholder="For example: BrailleNote, Eloquence, Android"><label for="qcat">Category</label><select id="qcat">'+opts(catOpts,st.qCat)+'</select></div><div id="sres">'+searchResultsHtml()+'</div>';}
 else if(t==="timeline"){h=head("Timeline")+'<label for="tlco">Company</label><select id="tlco">'+opts(coOpts,st.tlCo)+'</select><label for="tlcat">Category</label><select id="tlcat">'+opts(catOpts,st.tlCat)+'</select><div id="tlres">'+tlHtml()+'</div>';}
 else if(t==="os"){h=head("OS History")+P("Operating systems, firmware and screen-reader version histories.")+'<ul class="list">'+OSL.map(function(o){return item("os:"+o.id,o.n,coName(o.co)+" · "+o.v.length+" versions","os:"+o.id,isFav("os:"+o.id));}).join("")+'</ul>';}
 else if(t==="favorites"){var fd=DEV.filter(function(d){return isFav("dev:"+d.id);}).sort(sortD),fc=CO.filter(function(c){return isFav("co:"+c.id);}),fo=OSL.filter(function(o){return isFav("os:"+o.id);});h=head("Favorites");
  if(!fd.length&&!fc.length&&!fo.length)h+=P("Use the Favorite button on any device, company or operating system page to save it here. Favorites are stored on this device.");
  if(fd.length)h+='<h3>Devices and software ('+fd.length+')</h3><ul class="list">'+fd.map(function(d){return devItem("f:",d);}).join("")+'</ul>';
  if(fc.length)h+='<h3>Companies ('+fc.length+')</h3><ul class="list">'+fc.map(function(c){return item("fc:"+c.id,c.n,"Company","co:"+c.id,true);}).join("")+'</ul>';
  if(fo.length)h+='<h3>Operating systems ('+fo.length+')</h3><ul class="list">'+fo.map(function(o){return item("fo:"+o.id,o.n,"OS history","os:"+o.id,true);}).join("")+'</ul>';}
 else if(t==="trivia"){h=head("Trivia")+'<section id="quiz" aria-label="Quiz">'+quizHtml()+'</section><h3>Facts</h3>'+P(TRIV.length+" facts in three levels: Easy, Medium and Hard.")+["Easy","Medium","Hard"].map(function(lv){var n=TRIV.filter(function(x){return x.lv===lv;}).length;return '<h3>'+lv+' ('+n+')</h3><ul class="list triv">'+TRIV.map(function(x,i){return x.lv!==lv?"":'<li>'+P(x.t)+(x.d&&DM[x.d]?'<button type="button" class="btn" data-key="tv:'+i+'" data-act="dev:'+esc(x.d)+'">Open '+esc(DM[x.d].n)+'</button>':"")+'</li>';}).join("")+'</ul>';}).join("");}
 else if(t==="downloads"){h=head("Downloads")+P("Every ATGuide entry as a plain text file, made for screen readers and braille displays: "+(DL.files||"")+" files covering every device, notetaker, braille display, synthesizer, voice, screen reader, version history and company. Files are organized in one folder per company, with a README.txt index.")+
  '<div class="row"><a class="btn dl" href="'+BASE+'ATGuide-TXT.zip" download>Download all as ZIP'+(DL.size?' ('+esc(DL.size)+')':'')+'</a><a class="btn dl" href="'+BASE+'txt/README.txt">Open the README index (TXT)</a></div>'+
  P("Each file lists its sections in the same order as the app: Overview, Specs, Physical Description, Features, History, Ports, Operating System, System Requirements and Sources, separated by blank lines. To get a single entry, open its page and choose Download as TXT.");}
 return h;}
function renderNav(){var top=st.stack.length>0;nav.innerHTML='<ul>'+TABS.map(function(x){var on=st.tab===x[0]&&!top;return '<li><button type="button" class="nav'+(on?" on":"")+'" data-tab="'+x[0]+'"'+(on?' aria-current="page"':"")+'>'+x[1]+'</button></li>';}).join("")+'</ul>';}
function render(focus){renderNav();var top=st.stack[st.stack.length-1],h="";
 if(top){var prev=st.stack.length>1?scrName(st.stack[st.stack.length-2]):TABS.filter(function(x){return x[0]===st.tab;})[0][1];h='<div class="row"><button type="button" class="btn" id="back">Back to '+esc(prev)+'</button></div>';
  h+=top.k==="dev"?devPage(DM[top.id]):top.k==="co"?coPage(CM[top.id]):osPage(OM[top.id]);}
 else h=tabView();
 main.innerHTML=h;document.title=(top?scrName(top)+" – ":"")+"ATGuide";
 if(focus==="@head"){var e=document.getElementById("head");if(e){e.focus();window.scrollTo(0,0);}}
 else if(focus){var b=main.querySelector('[data-key="'+(window.CSS&&CSS.escape?CSS.escape(focus):focus)+'"]');if(b){b.focus();b.scrollIntoView({block:"center"});}}
}
function open(act,from){var i=act.indexOf(":");st.stack.push({k:act.slice(0,i),id:act.slice(i+1),from:from});render("@head");}
document.addEventListener("click",function(ev){var b=ev.target.closest&&ev.target.closest("button");if(!b)return;
 if(b.dataset.qz){quizAct(b.dataset.qz);return;}
 if(b.dataset.tab){st.stack=[];st.tab=b.dataset.tab;render("@head");return;}
 if(b.id==="back"){var top=st.stack.pop();render(top?top.from:"@head");return;}
 if(b.dataset.fav){var k=b.dataset.fav,on=isFav(k);favs=on?favs.filter(function(x){return x!==k;}):favs.concat([k]);try{localStorage.setItem(FAVKEY,JSON.stringify(favs));}catch(e){}
  b.setAttribute("aria-pressed",on?"false":"true");b.firstChild.textContent=on?"☆ ":"★ ";var n=document.getElementById("head");say((n?n.textContent:"Item")+(on?" removed from favorites":" added to favorites"));return;}
 if(b.dataset.act)open(b.dataset.act,b.dataset.key);});
var timer=null;
function announceSearch(){var r=searchRes();if(r)say(r.d.length+" devices, "+r.c.length+" companies, "+r.o.length+" operating systems found");}
main.addEventListener("input",function(ev){if(ev.target.id==="q"){st.q=ev.target.value;document.getElementById("sres").innerHTML=searchResultsHtml();clearTimeout(timer);timer=setTimeout(announceSearch,700);}});
main.addEventListener("change",function(ev){var id=ev.target.id;
 if(id==="qcat"){st.qCat=ev.target.value;document.getElementById("sres").innerHTML=searchResultsHtml();announceSearch();}
 if(id==="tlco"||id==="tlcat"){if(id==="tlco")st.tlCo=ev.target.value;else st.tlCat=ev.target.value;document.getElementById("tlres").innerHTML=tlHtml();say(tlList().length+" entries in timeline");}});
main.addEventListener("keydown",function(ev){if(ev.target.id==="q"&&ev.key==="Enter"){ev.preventDefault();announceSearch();}});
render(null);
document.getElementById("count").textContent=CO.length+" companies, "+DEV.length+" devices, software and voices, "+OSL.length+" operating system histories.";
})();
</script>
</body>
</html>
