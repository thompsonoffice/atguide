 is a six-key block: Insert, Home and End on the left, and Delete, Page Up and Page Down on the right. Beneath it are the arrow keys.","The bottom key row reads Control, Function, Windows, Alt, Space, Alt, Applications, Control in Microsoft layout, or Function, Control, Option, Command, Space, Command, Option, Control in Apple layout. Above that row are the eight Perkins braille keys. AppleVis users noted that the space bar sits high, above the braille cells, and that the cells have tactile ridges around them.","The box includes a 2 GB SD card, a USB-C cable, a power adapter, the first two chapters of the manual in braille, and a sturdy carrying case with shoulder strap and magnetic closure. Built-in apps include a notepad, DAISY reader, clock, stopwatch, alarm, calendar and calculator. It has no Wi-Fi."],"h":" Scott Davert reviewed it for AccessWorld in September 2020 on firmware 2.4. He found the braille sharp but a little spongy, and battery life of 16 to 18 hours. He had trouble with JAWS over Bluetooth and could not switch past more than one window with Alt+Tab. In AccessWorld's January 2021 comparison of 40-cell displays he reported that HIMS's November 2020 update had fixed the JAWS Bluetooth issue. He noted that it was the only one of the four with one-handed mode and that a support request went unanswered."},{"id":"emotion","n":"Braille eMotion","co":"hims","cat":"Braille Displays","yr":2024,"y":"2024","o":"An Android-based braille display and book reader.","ph":"740 g.","s":{"os":"Android 12","ram":"4 GB","sto":"64 GB","bat":"5,000 mAh"},"src":["https://www.himsintl.com/en/company/prd_history.php","https://nfb.org/images/nfb/publications/bm/bm25/bm2506/bm250606.htm","https://striveability.uk/2025/03/30/whats-causing-a-commotion/"],"desc":["The Braille eMotion is a 40-cell smart braille display from Selvas BLV, formerly HIMS. It has a Perkins-style keyboard and built-in apps: a text editor, file manager, calculator, book downloads, a media player and a recorder. It is the only size Selvas makes.","The front edge has two panning keys, one at each end, with F1 through F4 between them from left to right. In the middle is a Home button with a microphone on each side. Every front control except Home and the microphones is angled slightly toward the top surface.","The right side has the volume buttons and a Mode button that changes their function, with the headphone jack and USB-C port behind them. On the left edge is a USB-A port near the front, with a Record button behind it.","On top, the braille display runs along the front edge, with the Spacebar, Control and Alt keys in front of it. Each cell has a cursor-routing key, and capsule-shaped panning buttons sit at both ends. It was the first Selvas display that pans with either those end buttons or the front keys. Behind the display is the Perkins keyboard, with a center key between dots 1 and 4.","Speakers sit at the two back corners, with the Power button just left of the right speaker. Just right of the left speaker are three small keys labeled W, B and C in braille. They toggle Wi-Fi and Bluetooth, or hold them to open settings, and the C key opens the Connectivity app. It also has a microSD slot."],"h":" The Braille Monitor (NFB) compared it with the HumanWare Brailliant BI 40X in 2025. Both start in about 20 seconds, both connect to five Bluetooth devices and one USB device, and both download books from Online DAISY, Bookshare, NFB-NEWSLINE and NLS braille. The eMotion adds a media player, a downloadable BARD Mobile app and legacy braille drivers for Android versions before 15. Selvas makes only a 40-cell version."},{"id":"pacmate","n":"PAC Mate BX400 / QX400","co":"fs","cat":"PDAs","yr":2002,"y":"2002 (AccessWorld); some sources say 2003","o":"An accessible Pocket PC running JAWS for Pocket PC, with a braille (BX) or QWERTY (QX) keyboard and optional 20- or 40-cell braille.","f":["JAWS for Pocket PC","Two CompactFlash Type II slots"],"io":"USB OTG (mini-USB), IrDA, 2 CF Type II slots, headphone and microphone jacks","s":{"cpu":"Intel XScale 400 MHz","ram":"64 MB","sto":"32 MB flash ROM; 2 CompactFlash Type II slots","os":"Windows CE .NET 4.2 with Pocket PC 2003; JAWS for Pocket PC; Eloquence speech","tts":"Eloquence","bat":"Lithium-polymer, about 4 h to recharge; warnings at 20% and 12%","price":"BX/QX400 $2,395; 420 (20 cells) $3,795; 440 (40 cells) $5,595","dim":"BX400: 11 × 4.87 × 1.93 in (BX420 with 20-cell display: 11 × 6.81 × 1.93 in); QX400: 12.3 × 6.27 × 1.62 in (QX420: 12.3 × 8.21 × 1.62 in)","wt":"BX400: 1 lb 13 oz (0.82 kg); BX420: 3 lb 9 oz; QX400: 2 lb (0.90 kg); QX420: 3 lb 12 oz; about 4 lb with a 40-cell display (AccessWorld)"},"suc":["pacomni"],"vo":["eti"],"src":["http://www2.freedomscientific.com/fs_products/PACmate_bx400info.asp","https://www.afb.org/aw/6/3/14628","https://www2.freedomscientific.com/fs_support/PAC_Mate_BX/Docs/PAC_Mate_Owner's_Manual_BX.txt","https://www2.freedomscientific.com/fs_support/PAC_Mate_QX/Docs/PAC_Mate_Owner's_Manual_QX.txt","https://www2.freedomscientific.com/fs_products/PACmate_bx400info.asp","https://www2.freedomscientific.com/fs_products/PACmate_qx400info.asp"],"h":"AccessWorld (2005) says the PAC Mate was first released in 2002. The braille display detaches: a 40-cell BX weighs about 4 lb, and under 2 lb without the display. Its software included FS Edit. Both owner's manuals are dated December 2003. AccessWorld (2005) noted that the PAC Mate was originally released in 2002 and was then in its second generation. Unlike its competitors, its braille display could be detached and used with JAWS or Window-Eyes on a desktop. AccessWorld praised that feature and the access to third-party Pocket PC software, but criticized inconsistent contracted braille and occasional instability.","desc":["The PAC Mate BX400 and QX400 are Pocket PC-based notetakers from Freedom Scientific, running JAWS on Windows CE. The BX400 has a braille keyboard and measures 11 by 4.87 by 1.93 inches and 1 pound 13 ounces. The QX400 has a QWERTY keyboard and measures 12.3 by 6.27 by 1.62 inches and 2 pounds. All keys are on top, and all ports and switches are on the back.","The BX400 keyboard has eight braille keys, ordered left to right 7, 3, 2, 1, 4, 5, 6 and 8, with a space bar near the front center. Between keys 1 and 4 sits a four-way 'cursor cross' for the arrows. Above each braille key is a matching function key: F7, F3, F2, F1, F4, F5, F6 and F8. F1 is Escape, F2 the menu bar, F4 the Start menu and F6 FSEdit. The speaker is just left of F7 and the internal microphone just right of F8.","On the back panel, from right to left, are the On/Off switch, the power jack, a mini A/B USB port, two CompactFlash Type II slots, an infrared port, a 2.5 mm microphone jack and a 3.5 mm headset jack. CompactFlash cards go in one way only and click gently into place.","On the bottom, left of the left middle rubber foot, is a small round reset button; pressing it erases all data. Across from it on the right is the release for detaching the braille display or drawer. A 20- or 40-cell PAC Mate Portable Braille Display slides onto the front and locks in. With a 40-cell display the BX weighs about 4 pounds, and without it just under 2 pounds.","Inside is a 400 MHz Intel XScale processor with 64 MB of RAM and 32 MB of flash. A lithium-polymer battery recharges in about 4 hours and announces warnings at 20 and 12 percent. It runs Pocket PC 2003 with Freedom Scientific's FSEdit, FSCalc and Stopwatch, with JAWS and Eloquence speech."]},{"id":"pacomni","n":"PAC Mate Omni","co":"fs","cat":"PDAs","yr":2007,"y":"Fall 2007","o":"The Windows Mobile 6 update of the PAC Mate. Models: BX400, BX420 and BX440 (braille keyboard) and QX400, QX420 and QX440 (QWERTY).","ph":"BX400: 11 x 4.9 x 1.9 in, 1 lb 13 oz. BX420: 3 lb 9 oz. QX400: 2 lb. QX420: 3 lb 12 oz.","s":{"ram":"64 MB","sto":"128 MB flash ROM; 2 CompactFlash slots","os":"Windows Mobile 6","bat":"Over 20 hours","tts":"Eloquence","cpu":"Intel XScale 400 MHz","dim":"QX400: 12.3 × 6.27 × 1.62 in (31.24 × 15.93 × 4.11 cm)","wt":"QX400: 2 lb (0.90 kg)","power":"12 V AC adapter/charger"},"pre":["pacmate"],"vo":["eti"],"src":["https://en.wikipedia.org/wiki/Freedom_Scientific","https://support.freedomscientific.com/content/Documents/Manuals/PAC-Mate/PAC-Mate-Omni-QX-Owners-Manual.pdf","https://www.freedomscientific.com/Content/Documents/ProductFlyers/PAC_Mate_Omni_Flyer.pdf"],"desc":["The PAC Mate Omni is the Windows Mobile 6 generation of Freedom Scientific's PAC Mate. It keeps the earlier PAC Mate's shell, with a 400 MHz XScale processor, 64 MB of RAM and 128 MB of flash. The QWERTY QX400 measures 12.3 by 6.27 by 1.62 inches and weighs 2 pounds. Keys are on top, and ports and switches are on the back.","The QX400 keyboard has six rows. Escape, called the Close button, is first on the left of the top row, followed by F1 through F12. Three finger bumps between F4 and F5, F8 and F9, and F12 and Print Screen keep you oriented. The bottom row runs FN, Ctrl, Windows, Alt, Backslash, Space, Insert, Alt, Windows and Applications. The arrows are in the lower right, with Up above the other three. Delete, Home, Page Up, Page Down and End run down the right side.","On the back, from right to left, are the On/Off switch, the power jack, a mini A/B USB port, two CompactFlash slots, an infrared port, a 2.5 mm headset/microphone jack and a 3.5 mm headphone jack. On the top surface, the speaker is above F3 and the internal microphone is above Print Screen and Scroll Lock.","On the bottom, turned over with the back facing you, is a rectangular recess holding the serial number sticker. Just above it is a small round reset button you press with a paper clip or braille stylus. Across from it on the right is the release for the drawer or braille display. A 20- or 40-cell PAC Mate Portable Braille Display slides on and locks.","The lithium-polymer battery gives a warning at 30 percent and a critical alert at 12 percent; the flyer rates battery life at more than 20 hours. The braille BX models use the eight-key Perkins layout of the earlier BX400."],"h":" Freedom Scientific's launch flyer presented the Omni as the newest generation of the PAC Mate. It ran Windows Mobile 6.0, which Freedom Scientific called the most keyboard-friendly version yet, with full soft-key support. The flyer says the new hardware 'does not appreciably change its outer appearance.' Because all data is stored in flash, files survive a reset or a flat battery. It came in six models: BX400, BX420, BX440, QX400, QX420 and QX440. The flyer also lists Mobile Office including PowerPoint, Direct Push e-mail, Windows Live Search and Messenger voice clips, and plug-and-play Wi-Fi, Bluetooth, Ethernet and modem cards."},{"id":"icon","n":"LevelStar Icon Mobile Manager","co":"levelstar","cat":"PDAs","yr":2006,"y":"December 2006","o":"A screenless, pocket-sized Linux PDA built with the Internet at its core: news stand, RSS, podcasts, email and books.","h":"Announced in September 2006 at $1,395 (keyboard docking station $395), it reached market that December. Jay Leventhal reviewed it for AccessWorld in 2007 at $1,395. He praised the intuitive menus and Bookshare integration, which stored your password and unpacked books on download. He criticized slow text entry, limited contact and planner fields, poor table reading and its start-up beeps.","f":["Detachable braille or QWERTY keyboard dock","Bookshare integration"],"io":"USB, Wi-Fi 802.11b, Bluetooth 1.1","s":{"cpu":"Intel XScale PXA270 at 520 MHz","ram":"64 MB","sto":"30 GB hard drive (later 40 GB) plus 256 MB flash","os":"Linux 2.6.18","price":"$1,395","dim":"5.09 × 3.35 × 0.975 in","wt":"7.4 oz","bat":"Rechargeable lithium-ion"},"src":["http://visually-impaired.blogspot.com/2006/09/pda-for-visually-impaired.html","https://linuxdevices.org/device-profile-levelstar-icon-pda-for-visually-impaired-users/index.html","https://afb.org/aw/8/4/14333"],"desc":["The LevelStar Icon is a Linux-based PDA for blind users. It measures 5.09 by 3.35 by 0.975 inches and 7.4 ounces. It has a 30-gigabyte hard drive and Wi-Fi. It plays MP3 and DAISY books, records voice, and includes a web browser, e-mail, an address book, a planner, a word processor, a calculator and a stopwatch.","On the top edge, from left to right, are an external microphone jack, a miniSD slot, a headphone jack and a headset jack. Stereo speakers sit at the top of the left and right sides. Further down the left side are the volume up and down control, a button that switches between the speakers and the mono earpiece, and the Voice Record button.","At the bottom of both the left and right sides are buttons that open the battery compartment for the lithium-ion battery. On the bottom edge is the Power/Sync cable port.","On the front, at the bottom, is a standard 12-key telephone keypad. Directly above the 1, 2 and 3 keys are OK, Menu and Cancel; holding Cancel turns the Icon on. Above that row is a large diamond-shaped Arrow key; you press its top, bottom, left or right edge to move. A small Select key is in its middle, with the Status key to its left and the Help key to its right.","The top row of keys, from left to right, holds the hot key, the Applications Menu key and the Wi-Fi On/Off key. The package included an AC adapter, a USB cable, a case, a CD with the manual and an HTML Quick Start guide, and a braille Quick Start guide."]},{"id":"brplus","n":"APH Braille+ Mobile Manager","co":"aph","cat":"PDAs","yr":2007,"y":"May 2007 to 2012","o":"APH's version of the LevelStar Icon, with a six-key braille keyboard in place of the phone keypad.","h":"Available in May 2007 (catalog 1-07450-00, $1,395) and discontinued in 2012. Its successor, the Braille Plus 18, added a cell phone, camera, GPS and braille display and was discontinued in February 2015.","f":["RSS, podcasts, newsstand, DAISY, email","Linux console apps"],"io":"USB, Bluetooth, Wi-Fi","s":{"cpu":"Intel XScale PXA270 at 520 MHz","ram":"64 MB","sto":"40 GB hard drive (NFB); a later report says 60 GB","os":"Linux","price":"$1,395","dim":"5.125 × 3.25 × 1 in","wt":"7.4 oz"},"src":["https://cbcbvi.tripod.com/html/News/07news86.htm","https://thedotexperience.pastperfectonline.com/Webobject/B4C197A5-6F06-4D35-BDA9-045150994936","https://tech.aph.org/pda_doc.htm","https://nfb.org/images/nfb/publications/bm/bm09/bm0902/bm090211.htm","https://aphmuseum.org/record/aph-braille-mobile-manager/","http://earchive.tpu.ru/handle/11683/26197"],"desc":["The APH Braille+ Mobile Manager, made by LevelStar for APH, is a pocket-sized device about 5⅛ inches tall, 3¼ inches wide and 1 inch deep, weighing 7.4 ounces. Its gray plastic case has a brushed aluminum faceplate.","The face looks like a telephone. At the bottom is a 12-key rubber telephone keypad with a nib on the 5. Above it are OK, Menu and Cancel (Cancel is also the power key). Higher up is a four-way navigation pad with a Select button, with Status and Help keys beside it, Program 1 and Program 2 keys at the sides, and a long Applications key between them.","Flanking the rubber keys are nine blue plastic braille keys turned 90 degrees: six dot keys on one side and Shift, Space and Control on the other. To type braille you turn the unit a quarter turn clockwise, so the braille keys are farthest from you and Shift, Space and Control are nearest.","The left side has the volume key, a speaker toggle and a Record button. At the top are a phone-style earpiece in the middle and small stereo speakers on each side. The top edge has line-in, headphone and headset jacks and a mini SD slot. The bottom edge has the keypad lock switch and the power/USB connector.","It came with a 40 GB hard drive and a black nylon case with a belt loop. An optional QWERTY docking station plugs into the connector on the bottom edge."]},{"id":"mpo","n":"ALVA MPO 5500","co":"alva","cat":"PDAs","yr":2003,"y":"2003","o":"A braille PDA with a built-in GSM phone.","s":{"cpu":"Intel PXA255","ram":"64 MB","sto":"64 MB flash","os":"Windows CE.NET 4.1","disp":"20 cells"},"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"elba","n":"Papenmeier ELBA","co":"pap","cat":"Notetakers","yr":2001,"y":"2001","o":"An early Linux-based braille notetaker.","s":{"cpu":"StrongARM","ram":"32 MB","sto":"16 MB flash","os":"Linux"},"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" The NFB timeline records Papenmeier's Elba (2001) as the first Linux-based notetaker, with both braille and QWERTY keyboards and a refreshable braille display."},{"id":"pronto","n":"BAUM Pronto! 18 V3","co":"baum","cat":"Notetakers","yr":2014,"y":"2014","o":"BAUM's compact Windows CE notetaker. Earlier Pronto hardware was the basis for the BrailleNote PK.","ph":"498 g.","s":{"cpu":"520 MHz","sto":"1 GB","os":"Windows CE","disp":"18 cells"},"src":["https://en.wikipedia.org/wiki/BrailleNote","https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" At the 2004 NFB convention HumanWare released the BrailleNote PK, then the smallest notetaker sold in the U.S., with an 18-cell display and speech. According to the NFB timeline its hardware was BAUM's Pronto."},{"id":"vario","n":"BAUM VarioUltra","co":"baum","cat":"Braille Displays","yr":2014,"y":"2014 (NFB overview published February 2, 2015)","o":"A braille display with built-in notetaking.","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://nfb.org/blog/varioultra-overview","https://afb.org/aw/18/4/15220"],"desc":["The VarioUltra is a very thin braille display and basic note-taker from BAUM, in 20- and 40-cell sizes. The 20-cell model is 7.4 by 3.5 by 0.7 inches and weighs 0.7 pounds; the 40-cell model is 12.4 inches long and weighs 1.1 pounds. Reviewers describe it as slim and well built.","The front of the top is sloped at about 30 degrees. On that slope, from left to right, are system keys S1 and S2, a spacebar, a round joystick called the NaviStick, a second spacebar, and system keys S3 and S4. The NaviStick also presses down to select.","Behind these is the braille display, with three buttons stacked in a vertical line at each end for panning and other functions. Behind the display are the cursor-routing keys, and at the back is a standard eight-key braille keyboard.","The right side has only the power button, just behind the front edge. The left side has, from front to back, a keyboard lock switch, a switch between note-taker and display modes, a micro-USB port and a full-size USB port. The back edge is empty. The two front corners have attachment points for a shoulder strap.","It came in a leather case that closes with magnets and lets you use the display while carrying it by the strap."],"h":" Made by BAUM Retec AG in 20- and 40-cell sizes. Built-in apps include a word processor, PDF and spreadsheet viewers, a calculator, timers and an alarm clock. It has no SD slot; files move over USB, with the unit appearing as a drive on a PC. AccessWorld compared the VarioUltra 40 with the HIMS Braille Edge 40 ($2,795) in 2017, finding the VarioUltra lighter and slimmer but over $1,000 dearer.","s":{"price":"VarioUltra 20: $2,395; VarioUltra 40: $3,995 (AccessWorld 2017)","dim":"VU20: 7.4 × 3.5 × 0.7 in; VU40: 12.4 × 3.5 × 0.7 in","wt":"VU20: 0.7 lb; VU40: 1.1 lb"}},{"id":"orbspeak","n":"Orbit Speak","co":"orbit","cat":"Notetakers","yr":2022,"y":"Announced at CSUN, March 2022","o":"A low-cost speech-only notetaker with a braille keyboard.","ph":"180 g.","io":"USB-C","src":["https://www.orbitresearch.com","https://nfb.org/resources/publications-and-media/access-podcast/comprehensive-review-and-demonstration-orbit-speak","https://www.orbitresearch.com/products/blindness-products/braille-devices/orbit-speak/"],"desc":["The Orbit Speak is a pocket note-taker from Orbit Research, with a braille keyboard and speech but no braille display. It is a small bar about 6.5 inches long, under 3 inches wide and 0.6 inch thick, about the weight of a smartphone. Orbit Research gives 180 grams; the NFB's review gives 210 grams.","Place it on a desk. At the back of the top surface is a six-key Perkins-style keyboard with quiet scissor keys. Between dots 1 and 4 is a navigation pad of up, down, left and right arrows around a Select button.","Directly in front of the pad is the spacebar. Immediately left and right of the spacebar are the keys for dots 7 and 8, used for Backspace and Enter and pressed with the thumbs, which keeps the unit narrow. Beyond them are function keys: F1 and F2 on the left, F3 and F4 on the right.","The left side has a 3.5 mm headphone jack and the power button, which has a distinctive raised nub. Holding it from a full shutdown gives a series of vibrations; a tap puts it into hibernation and a second tap wakes it where you left off. The right side has a USB-C port for charging and accessories, including USB audio devices.","The SD card slot is on the front edge. It has a built-in speaker and vibration feedback."],"h":" Jonathan Mosen's review for the NFB's Access On podcast notes that it answered calls for a modern Braille 'n Speak and predates the return of the Blazie brand. It is braille in and speech out, with no braille display. The standard and Plus models are physically identical. The Plus adds a music player and more, and upgrading later costs $50 more than buying the Plus at first. Its menus use chords from as far back as the VersaBraille of the 1980s.","s":{"price":"Orbit Speak $599; Orbit Speak Plus $749","dim":"6.3 × 2.6 × 0.6 in (Orbit Research); 6.7 × 2.9 × 0.6 in (NFB review)","wt":"5 oz / 180 g (Orbit Research); 7.4 oz / 210 g (NFB review)","sto":"32 GB, plus SD up to 2 TB","bat":"About 15 hours of continuous playback at full volume","tts":"RUNA TTS (Vocalizer voices; Zoe by default in the US), or Google TTS"}},{"id":"bnote","n":"Eurobraille b.note","co":"eurob","cat":"Notetakers","yr":2021,"y":"2021 (manual copyright 2021–2024); second generation later","o":"A braille notetaker and display from Eurobraille.","src":["https://www.eurobraille.fr","https://www.eurobraille.fr/wp-content/uploads/2025/04/bnote-Manual-3.1.0-EN.pdf","https://www.eurobraille.com/product/b-note-40/"],"desc":["The b.note is a braille display and notetaker from Eurobraille, made with 20 or 40 eight-dot cells. The 40-cell version is a long, slim bar 365 millimetres wide, 105 deep and 27 high, weighing 600 grams; the 20-cell version is 235 millimetres wide and 500 grams. A protective bumper wraps the case, and a zippered case comes with it.","The braille cells run across the top. Above each cell is a routing key with two contacts: a light press moves the display forward or back, so you need not hunt for a scroll key, and a firm press routes the cursor.","Eight braille keys sit in a row above the routing keys, with two thumb keys below the display, ten keys in all. On the standard and basic versions they are a Perkins-style keyboard; the light versions have none. At each end of the display is a keypad of four buttons; the up key on the left keypad opens the b.note menu.","On the left edge are a small reset hole for a paper clip, the USB-C port for charging and computers, a 3.5 mm headphone jack and the key lock switch. The power button is a pull-to-activate lock: a short press puts it in transport mode and a long press of more than 2 seconds in standby. On the second generation, a USB-A port on the back takes memory sticks.","Underneath, a screwed panel covers the SD card, for service only. On the second generation, two grilles at the front let out the sound of two built-in speakers."],"h":" Eurobraille sells it in standard, basic, light and basic/light versions, with or without the Perkins keyboard and Bluetooth/internal apps. Built-in functions include a file explorer, editor (docx, odt, pdf, epub, brf, txt), MP3 player, web radio and podcasts, agenda, EOLE library reader, Wikipedia access, a braille learning mode and games. A second generation adds two speakers and a USB-A port. The free b.view app shows the display to sighted companions. The 40-cell model was listed as out of stock on Eurobraille's site in October 2026.","s":{"cells":"20 or 40, 8-dot","dim":"235 (20) / 365 (40) × 105 × 27 mm","wt":"500 g (20) / 600 g (40)","bat":"6000 mAh, over 14 hours; 30% in 25 min","cpu":"STM32L1 + quad-core ARM Cortex-A53 1.4 GHz","ram":"512 MB","sto":"64 GB SD","net":"Wi-Fi, Bluetooth 4.2 (up to 4 devices), USB-C"}},{"id":"versab","n":"VersaBraille","co":"tsi","cat":"Notetakers","yr":1979,"y":"December 1979","o":"A paperless-braille device that stored braille on C-60 cassettes, an ancestor of modern notetakers.","ph":"4.625 x 13.5 x 9.75 in.","s":{"sto":"C-60 audio cassette tape","disp":"20-cell refreshable braille display","cpu":"Processor model not found in TSI or APH sources. The VersaBraille stored braille on C-60 audio cassettes and showed it on a 20-cell display.","ram":"No RAM figure is published. Storage was by cassette: pages of 1,000 braille cells, about 400 pages per C-60 cassette.","syns":"None (braille and recorded audio only)","price":"$5,250 (early 1980s quote); $6,700 (1982 Braille Research Newsletter)","used":"No used or eBay listing surfaced in this research pass (eBay blocks direct page checks).","dim":"4.625 × 13.5 × 9.75 in (APH Museum unit)"},"suc":["versab2"],"src":["https://afb.org/aw/6/4/14611","https://sites.aph.org/museum-virtual-exhibit/vex2/A8918B72-511E-44D5-841D-383803736892.htm","https://www.duxburysystems.org/downloads/library/texas/apple/cnthesis/versabr.htm","https://www.duxburysystems.org/downloads/library/history/holladay_tsi.htm","https://www.duxburysystems.org/downloads/library/history/1982_06_xx%20Gill%20J%20M%20Clark%20L%20L%20and%20Foulke%20E%20-%20Braille%20Research%20Newsletter%20n13.pdf","https://aphmuseum.org/record/the-versabraille-system/"],"h":" Telesensory Systems introduced VersaBraille in December 1979. The APH Museum says it was the first refreshable braille device designed in the United States, inspired by Oleg Tretiakoff's Elinfa Digicassette (France, 1975–1977). A donor called it 'the first piece of computer equipment for the blind'. It stored braille on C-60 cassettes formatted into pages of 1,000 cells (about 400 pages per tape), with editing, search and an audio-recording mode. A later model added a computer interface. A Texas rehabilitation agency paid $2,500 of one $5,250 unit. An early-1980s proposal by a VersaBraille owner quotes its '$5250 price tag', with the state vocational rehabilitation agency paying $2,500. APH calls it the first refreshable braille device designed in the US (December 1979), inspired by Oleg Tretiakoff's Elinfa Digicassette.","desc":["The VersaBraille is a portable, battery-powered box about 13½ inches wide, 9¾ inches deep and 4⅝ inches tall, about the size of a large briefcase-style tape recorder. It came with a separate battery charger and power supply.","On top is a braille keyboard of six dot keys plus a space bar, one key for each dot of the braille cell, for typing braille directly.","The output is a 20-cell refreshable braille display, where small pins rise to form braille that changes as you move through the text.","Built into the unit is a standard audio cassette drive. You insert a high-quality C-60 tape, and the VersaBraille formats it into electronic pages. Braille is written to the tape instead of paper, and audio can also be recorded on it.","The shipping carton included two Maxell C-60 tapes, an earphone, an external microphone, a head-cleaning tape, a 'Master Overlay' tape, an I/O cable for connecting to a computer, and print and braille owner's manuals in two volumes."]},{"id":"versab2","n":"VersaBraille II+","co":"tsi","cat":"Notetakers","yr":1987,"y":"1987","o":"A floppy-disk VersaBraille.","ph":"5.2 kg.","s":{"sto":"Internal 3.5-inch floppy disk drive","dim":"3.5 × 15.25 × 10.25 in (H × W × D)","disp":"20-cell piezoelectric braille display"},"pre":["versab"],"src":["https://afb.org/aw/6/4/14611","https://sites.aph.org/museum-virtual-exhibit/vex2/4C6CA28D-5B55-4717-BDF0-166038125352.htm"],"desc":["The VersaBraille II+ (about 1987) is a portable braille computer in an ivory aluminum chassis with rounded edges. The APH Museum unit measures 3.5 inches high, 15.25 inches wide and 10.25 inches deep. Four black rubber feet tilt the top slightly toward you.","On top are seven brown rubber keys: six braille keys that get taller from the center outward, with a long space bar below. On the left is a 12-key numeric keypad, slightly below separate On and Off buttons and a brown rubber joystick pad.","Above the keyboard, on a brown bar, is a 20-cell piezoelectric refreshable braille display. An aluminum TSI logo plate is in the upper right.","A built-in 3.5-inch floppy drive is in a recess at the front left; the original VersaBraille used cassette tape. A brown plastic carrying handle folds under the back and doubles as a keyboard stand.","The back jack panel has, from left to right, the power jack, an on/off slider, two RS-232 serial ports, an external disk drive jack and a parallel printer jack. Owners David and Howard Goldstein liked its disk drive and printer support but found its proprietary software clumsy and its keyboard hard on the wrists."]},{"id":"braillex","n":"BRAILLEX","co":"pap","cat":"Braille Displays","yr":1975,"y":"1975","o":"Papenmeier's early refreshable braille system.","src":["https://nfb.org/sites/default/files/images/nfb/publications/fr/fr28/fr280109.htm","https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" Papenmeier Reha worked with Dr. Werner Boldt of Dortmund University and in 1975 produced the BRAILLEX, an electronic device with a refreshable braille display. The same year Klaus Peter Schönherr of Horb-Nordstetten invented the first piezoelectric braille module, the basis of refreshable braille cells for the next forty years."},{"id":"navigator","n":"TSI Navigator","co":"tsi","cat":"Braille Displays","yr":1989,"y":"1989","o":"Braille displays for PCs. In 1996 BRLTTY developers reverse-engineered its protocol in one day to write the third BRLTTY driver.","s":{"disp":"20, 40 or 80 cells"},"src":["https://afb.org/aw/6/4/14611","https://brltty.app/pipermail/brltty/2015-December/013007.html","https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" The NFB timeline dates the Navigator to 1989 as TSI's first dedicated refreshable braille display for PC access. It came in 20-cell (six-dot desktop), 40-cell (eight-dot) and 80-cell versions, sat below the PC keyboard and had cursor routing keys. The PowerBraille line replaced it in the mid-1990s."},{"id":"pb40","n":"PowerBraille 40","co":"fs","cat":"Braille Displays","yr":1994,"y":"1994 (TSI introduced the PowerBraille line)","o":"A 40-cell desktop display.","ph":"14 x 13 x 1.5 in, 5 lb.","s":{"disp":"40 cells"},"src":["https://www.freedomscientific.com","https://sites.aph.org/museum-virtual-exhibit/vex2/B9113F0E-60F5-4EC7-87DC-908226712520.htm"],"h":"Telesensory introduced the PowerBraille line in 1994. Blazie Engineering bought TSI's blindness division in about 1998 and kept selling PowerBraille displays, including an unusual 65-cell model; the line later passed to Freedom Scientific."},{"id":"pb80","n":"PowerBraille 80","co":"fs","cat":"Braille Displays","yr":1994,"y":"1994 (TSI introduced the PowerBraille line)","o":"An 80-cell desktop display.","ph":"10 lb.","s":{"disp":"81 cells (80 plus status)"},"src":["https://www.freedomscientific.com","https://sites.aph.org/museum-virtual-exhibit/vex2/B9113F0E-60F5-4EC7-87DC-908226712520.htm"],"h":"Part of the PowerBraille line Telesensory introduced in 1994 and Blazie Engineering sold from about 1998."},{"id":"abt3","n":"ALVA ABT-3 series","co":"alva","cat":"Braille Displays","yr":0,"y":"No release year was found in the NFB's 2026 Braille technology timeline or in ALVA material. For context, ALVA's cursor-routing patent was filed in the Netherlands in 1987 and granted in the US in 1991 (NFB timeline).","o":"ALVA's desktop braille terminals of the 1990s, with cursor routing.","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"sat544","n":"ALVA Satellite 544","co":"alva","cat":"Braille Displays","yr":2003,"y":"By 2003 (in use May 2003)","o":"A 44-cell ALVA Satellite display.","s":{"disp":"44 cells"},"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://inbox.the-brannons.com/blinux/Pine.LNX.4.53.0305072200490.8303@wright.online.de/T/","https://portale.siva.it/en-GB/databases/products/detail/id-15433"]},{"id":"bc640","n":"ALVA BC640 / BC680","co":"alva","cat":"Braille Displays","yr":2010,"y":"About 2010","o":"Later ALVA 40- and 80-cell displays.","s":{"disp":"40 or 80 cells"},"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://imreverhoeven.wordpress.com/2010/04/02/alva-bc640-braille-displaynotetaker/"]},{"id":"bwave","n":"Handy Tech Braille Wave","co":"ht","cat":"Braille Displays","yr":1999,"y":"1999","o":"A portable display with notetaking functions.","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"bstar","n":"Handy Tech Braille Star","co":"ht","cat":"Braille Displays","yr":2002,"y":"2002","o":"A 40- or 80-cell display.","suc":["actstar"],"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"actb","n":"Handy Tech Active Braille","co":"ht","cat":"Braille Displays","yr":2011,"y":"2011","o":"A 40-cell portable with ATC (Active Tactile Control) reading detection.","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"actstar","n":"Handy Tech Active Star","co":"ht","cat":"Braille Displays","yr":2015,"y":"2015","o":"A 40-cell display with a shelf for a tablet or phone.","pre":["bstar"],"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"focus44","n":"Focus 44 / 70 / 84","co":"fs","cat":"Braille Displays","yr":2004,"y":"2004","o":"The first generation of Freedom Scientific's Focus displays.","s":{"disp":"44, 70 or 84 cells"},"suc":["focus40b"],"src":["https://en.wikipedia.org/wiki/Freedom_Scientific","https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" Freedom Scientific's first Focus line came out in 2004 in 44-, 70- and 84-cell sizes. A second generation offered 40 and 80 cells, and Focus Blue added Bluetooth. The NFB timeline calls Focus one of the most widely used displays among JAWS users."},{"id":"focus40b","n":"Focus 40 Blue (5th generation)","co":"fs","cat":"Braille Displays","yr":2019,"y":"2019","o":"Freedom Scientific's current 40-cell Bluetooth display.","ph":"368 x 78 x 19 mm, 565 g.","io":"USB-C, Bluetooth 4.1 (5 Bluetooth plus 1 USB connections), microSD up to 32 GB","s":{"bat":"About 20 hours on Bluetooth","disp":"40 cells","price":"$2,995 (AccessWorld 2018)","io":"USB-C; microSD; 5 Bluetooth plus 1 USB"},"pre":["focus44"],"src":["https://www.freedomscientific.com","https://www.afb.org/aw/19/4/15103"],"desc":["The Focus 40 Blue 5th Generation is a 40-cell braille display from Freedom Scientific (VFO). The 5th generation is made of solid aluminum, with rubber bumpers on each side to absorb drops, which make it slightly longer than the 4th generation.","With the front controls nearest you, the front edge holds, from left to right: Left Panning button, Left Rocker bar, Left Selector, Left Shift, Right Shift, Right Selector, Right Rocker bar and Right Panning button. This is the same layout as the 4th generation.","On the left side, behind the left bumper and almost against it, is a microSD slot, then the Power button, with the USB-C port furthest back. The right side has nothing but the right bumper.","On top, closest to you, is a pronounced space bar. Behind it are the 40 braille cells, with a cursor-routing button behind each. At each end of the display is a Nav rocker bar with a Nav Mode button behind it.","Behind the cells is an eight-dot Perkins keyboard, with a Menu button between dots 1 and 4; Menu is the only new surface control. It connects to five Bluetooth devices and one USB device, runs about 20 hours on Bluetooth, and comes with a case."],"h":" Reviewed by Scott Davert in AccessWorld in April 2018. He wrote that early Focus displays used a serial cable, had audio jacks and only three front controls, and were meant for desktops. The 5th generation added a rugged body and a well-designed case. At launch its microSD slot could not yet be used, and VFO promised a spring firmware update for reading and writing BRF files."},{"id":"focus14b","n":"Focus 14 Blue (5th generation)","co":"fs","cat":"Braille Displays","yr":2017,"y":"December 15, 2017","o":"A pocket 14-cell Focus.","ph":"195 x 78 x 19 mm, 283 g.","s":{"disp":"14 cells","price":"$1,295 (AccessWorld 2018)","bat":"About 20 hours on Bluetooth","io":"USB-C; microSD; 5 Bluetooth plus 1 USB"},"src":["https://www.freedomscientific.com","https://vispero.com/news/freedom-scientific-introduces-a-new-generation-of-the-focus-14-blue-braille-display/","https://www.afb.org/aw/19/4/15103"],"desc":["The Focus 14 Blue 5th Generation is a 14-cell braille display from Freedom Scientific (VFO). The 5th generation is made of solid aluminum, with rubber bumpers on each side to absorb drops, which make it slightly longer than the 4th generation.","With the front controls nearest you, the front edge holds, from left to right: Left Selector, Left Rocker bar, Left Panning button, Left Shift, Right Shift, Right Panning button, Right Rocker bar and Right Selector. This order differs from the Focus 40.","On the left side, behind the left bumper, is a microSD slot, then the Power button, with the USB-C port furthest back. The right side has only the right bumper.","On top, closest to you, is the space bar. Behind it are the 14 braille cells with cursor-routing buttons behind them, and a Nav rocker bar with a Nav Mode button at each end.","Behind the cells is an eight-dot Perkins keyboard with a Menu button between dots 1 and 4. It runs about 20 hours on Bluetooth, connects to five Bluetooth devices plus USB, and cost $1,295 in 2018."],"h":" Reviewed alongside the Focus 40 in AccessWorld (April 2018). Davert noted that the 4th-generation 14-cell display had been hard to get into its case, and that the new case fixed this."},{"id":"brl2040","n":"Brailliant 20 / 40","co":"hw","cat":"Braille Displays","yr":2004,"y":"2004","o":"Described as the first Bluetooth braille displays.","s":{"disp":"20 or 40 cells"},"suc":["bi40x"],"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"bi40x","n":"Brailliant BI 40X","co":"hw","cat":"Braille Displays","yr":2021,"y":"On sale by April 2021 (Helen Keller Services review)","o":"A 40-cell HumanWare display from the Brailliant BI X series, with the KeySoft Lite notetaker apps.","ph":"690 g.","io":"USB-C, Bluetooth 5 (5 Bluetooth plus 1 USB connections)","s":{"bat":"2,500 mAh, about 20 hours","disp":"40 cells","price":"$3,195 (BI 20X: $1,895), per AccessWorld 2021"},"pre":["brl2040"],"src":["https://store.humanware.com","https://www.braillecast.com/podcast/e026/","http://kentucky-acb.org/pipermail/scholarship-comm_kentucky-acb.org/attachments/20210506/d8ae4b7e/attachment-0003.pdf","https://afb.org/aw/22/7/17621","https://www.helenkeller.org/a-review-of-the-brailliant-bi-20x/"],"h":" AccessWorld called it a new class of smart braille display. It can connect to Wi-Fi and log into NLS BARD, and its KeyPad editor is meant for quick notes: press Power and you can type within about five seconds. The reviewer missed a spellchecker. The smaller BI 20X has Bluetooth 4.0 instead of 5.0 and an SD slot instead of a USB storage port.","desc":["The Brailliant BI 40X is a 40-cell braille display from HumanWare with simple built-in apps. It weighs about 690 grams.","On the top surface, from back to front, are eight braille keys for dots 1 to 8, then 40 cursor-routing buttons, then the 40 braille cells. At each end of the cells are three command keys arranged like a braille cell. In front of the cells are two spacebars, one under each thumb.","The front edge has four thumb keys for navigation, with a round Home/Select button in the center.","The left edge has, from back to front, a USB-C port for a computer or charger, the Power button, and a USB-A port for flash drives. The right edge has an earphone jack and volume up and down buttons.","The top also has built-in stereo speakers. At the 2021 review they only gave system beeps, though HumanWare planned to add audio."]},{"id":"nlsereader","n":"NLS eReader","co":"nls","cat":"Braille Displays","yr":2020,"y":"2020","o":"A free braille e-reader for NLS patrons. The HumanWare model is based on the Brailliant BI 20X.","s":{"disp":"20 cells"},"src":["https://www.loc.gov/nls/","https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" The National Library Service began piloting free 20-cell braille displays for patrons in 2020, funded by a five-million-dollar Congressional appropriation. Two models were chosen: one by HumanWare, based on the Brailliant BI 20X, and one by Zoomax."},{"id":"refresh18","n":"Refreshabraille 18","co":"aph","cat":"Braille Displays","yr":2010,"y":"2010","o":"APH's 18-cell Bluetooth display.","ph":"130 x 90 x 25 mm, 310 g.","io":"Bluetooth 1.2, mini-USB","s":{"bat":"About 30 hours on Bluetooth, up to 100 on USB; about 2-hour charge; not user-replaceable","disp":"18 cells","price":"$1,695 (AccessWorld, July 2010)"},"src":["https://www.aph.org","https://afb.org/aw/11/3/16054"],"desc":["The Refreshabraille 18 is APH's 18-cell Bluetooth braille display and keyboard. Its footprint is about the size of an index card, roughly 3 by 5 inches, and it weighs about 11 ounces. It is housed in a sturdy metal case.","Hold it with the display furthest from you. There are 18 eight-dot piezoelectric cells, with a cursor-routing button below each. Below those are three evenly spaced rectangular buttons.","Next is a straight row of six braille keys. Centered below them, where a spacebar might be, is a round joystick, and directly below that is the spacebar itself. On either side of the spacebar is a key for dot 7 or dot 8. Because the unit is narrow, these sit below the other keys and are pressed with the thumbs.","The power button is centered on the front edge, flush with the case, so the outline stays smooth.","The mini-USB port is in a cut-out on the bottom, so a plugged-in cable lies under the display, protected."],"h":" Deborah Kendrick reviewed it for AccessWorld in July 2010. It works as both a braille display and a braille keyboard. It shipped with a USB cable, a CD of documentation and drivers, and quick-start sheets in print and braille, but no AC adapter. When powered off, all dots stand up; a press of about two seconds on Power vibrates it and shows APH and the serial number."},{"id":"or20","n":"Orbit Reader 20","co":"orbit","cat":"Braille Displays","yr":2017,"y":"Announced March 2016, shipped 2017","o":"A low-cost 20-cell reader and display that premiered at $449. APH stopped distributing it in April 2021.","io":"SD card (4 to 32 GB), USB, Bluetooth","s":{"price":"$449 (APH, AccessWorld 2018)","disp":"20 cells, refreshed cell by cell","dim":"About 6 × 4 × 1 in (AccessWorld)","sto":"SD card (supplied inserted)","io":"Micro USB; Bluetooth"},"suc":["or40"],"src":["https://www.orbitresearch.com","https://www.aph.org","https://afb.org/aw/19/1/15167"],"desc":["The Orbit Reader 20 is a low-cost 20-cell braille display and book reader from Orbit Research, sold in the US by APH. AccessWorld measured it at about 6 inches wide, 4 inches deep and just over 1 inch high.","With the braille display toward you, the 20 cells run along the front. At each end is a panning button that rocks up or down. Orientation dots sit above cells 5, 10 and 15. Behind the display, from left to right, are Dot 7, the space bar and Dot 8.","Directly behind the space bar are four arrow keys around a round Select button. Behind them is the six-key Perkins-style keyboard, with oval keys set straight across from each other.","On the back edge, from left to right, are the power button, an SD card slot with a card already inserted, and a Micro USB connector for charging and USB connection. On the front are two holes, one on each side, for a strap or lanyard, which is not supplied.","On the underside are many screws, four rubber feet and a plastic battery door held by two screws. It has no cursor-routing buttons. In standalone mode it offers a file manager, reader and editor; in remote mode it is a display for computers, phones and tablets over USB or Bluetooth."],"h":" Scott Davert's AccessWorld review (2018) credits Orbit Research and the Transforming Braille Group with holding the price to $449, distributed in the US by APH. It reaches that price by refreshing the cells one at a time rather than all at once. That causes a slight delay with external devices but almost none in the built-in reader, and the refresh is a bit noisy, 'no worse than a rather loud laptop.' The reader handles plain text and digital braille files only, and no case is included; Executive Products sold one for $78.95."},{"id":"or40","n":"Orbit Reader 40","co":"orbit","cat":"Braille Displays","yr":2020,"y":"Announced March 11, 2020 (CSUN)","o":"A 40-cell Orbit Reader that Orbit Research called the world's most affordable 40-cell display.","ph":"750 g.","s":{"disp":"40 cells","price":"$1,899 (Orbit Research, 2026); under $1,500 when reviewed in October 2021","dim":"11.6 × 3.8 × 1.3 in (29.5 × 9.6 × 3.3 cm)","wt":"1.65 lb (750 g)"},"pre":["or20"],"suc":["orq40"],"src":["https://www.orbitresearch.com","https://www.orbitresearch.com/orbit-research-introduces-the-worlds-most-affordable-40-cell-braille-display/","https://www.helenkeller.org/a-review-of-the-orbit-reader-40/","https://www.orbitresearch.com/products/blindness-products/braille-devices/orbit-reader-40/","https://www.orbitresearch.com/support/orbit-reader-40-support/"],"h":" Scott Davert of the Helen Keller National Center reviewed it in October 2021. Unlike the Orbit Reader 20, it added cursor-routing buttons, built-in braille translation and connections to up to five Bluetooth devices. It has no internal memory: files live on an SD card (4 to 32 GB) or a USB drive. He estimated battery life at 20 to 22 hours of heavy use and found the cells quieter than the Orbit Reader 20's but the keyboard louder. The user-replaceable battery cost $44.95 at the time and $49.95 by January 2023.","desc":["The Orbit Reader 40 is a 40-cell braille display and note-taker from Orbit Research. It is a flat bar 11.6 inches long, 3.8 inches deep and 1.3 inches thick, weighing 1.65 pounds (750 grams). Orbit Research calls the construction solid and resistant to fluids and dust.","Place it with the Spacebar nearest you. Behind the Spacebar is the line of 40 cells, with a cursor-routing button behind each cell. At each end of the line is a rectangular rocker key that you press toward or away from you to pan.","Behind the routing buttons is a Perkins-style keyboard. From left to right are the keys for dots 7, 3, 2 and 1, then a four-way navigation pad with a Select button in its center, then dots 4, 5, 6 and 8. The front panel has two rectangular slots near each end for attaching a case or strap.","The left side has a USB-A port for thumb drives. The right side has, from front to back, the Power button, the USB-C port for charging and computer connection, and a 3.5 mm headphone jack. The SD card slot is on the back edge.","Underneath, each corner has a rubber foot. There are several screws, and a compartment for the user-replaceable battery. No case comes in the box. Orbit Research sold a padded nylon zip case with a top pocket for $59.95; a leather case was also offered."]},{"id":"orq40","n":"Orbit Reader Q40","co":"orbit","cat":"Braille Displays","yr":2024,"y":"Announced March 19, 2024; shipping from June 2024","o":"A 40-cell Orbit Reader with a QWERTY keyboard.","pre":["or40"],"src":["https://www.orbitresearch.com","https://www.orbitresearch.com/products/qwerty-product/orbit-reader-q40/","https://www.orbitresearch.com/orbit-research-expands-its-revolutionary-braille-product-family-with-the-launch-of-orbit-reader-q20-and-q40/"],"desc":["The Orbit Reader Q40 combines a 40-cell braille display with a full typewriter keyboard in one case. It is about 11 inches wide, 7 inches deep and a little over an inch high, and weighs about two and a half pounds. Orbit describes it as dust- and fluid-resistant.","The keyboard is a full-size, laptop-style layout of 78 sculpted keys. It has a full row of twelve function keys, arrow keys in an inverted T, and Windows and Mac keys, but no separate numeric keypad.","The display has 40 eight-dot cells using Orbit's TrueBraille mechanism, with a cursor routing button for each cell. A rocker key at each end of the display pans the text, and configurable thumb keys help with navigation.","For connections it has a USB-C port for charging and computers, a USB-A host port for flash drives, and a full-size SD card slot.","It gives audio and haptic feedback, and has a fast-charging, long-life battery."],"h":" Orbit Research announced the Q40 and 20-cell Q20 on March 19, 2024 (press release datelined Anaheim), pairing the Orbit Reader with a laptop-style keyboard; shipping was planned for June 2024. It works standalone as a book reader and note-taker, or as a display connected to up to six devices over USB and Bluetooth with JAWS, NVDA, VoiceOver, TalkBack and others. It translates braille in more than 70 languages and works with Orbit Teacher and Orbit Chat.","s":{"cells":"40, 8-dot","price":"$1,999 (Orbit Research, 2026)","dim":"About 11 × 7 × 1 in","wt":"About 2.5 lb","kbd":"78-key QWERTY"}},{"id":"slate","n":"Orbit Slate 340 / 520","co":"orbit","cat":"Braille Displays","yr":2022,"y":"2022","o":"Multiline braille displays.","src":["https://www.orbitresearch.com","https://www.orbitresearch.com/wp-content/uploads/2022/07/Orbit-Slate-520-Brochure-v0.4.pdf","https://pianojuan.com/review-resena-orbit-slate-520-el-siguiente-nivel-en-braille-electronico-y-portatil/"],"desc":["The Orbit Slate 520 is a five-line, 20-cell braille display from Orbit Research; the Slate 340 has three lines of 40 cells. The Slate 520 is about the length of a letter-size sheet but about 2 inches narrower. It is 1.3 inches thick, like a closed thin laptop, weighs 3.15 pounds, and is made of very smooth plastic.","From the back, the top has a row of cursor-routing buttons, then a braille line, then a separator, then the next braille line, and so on. The separators carry raised vertical lines, with every fifth line more prominent, to help you count across.","At each end of each braille line is a pair of rocker buttons for scrolling. The top line's buttons move one line at a time; the lower ones move further, up to five lines at once.","Near the front is a round direction pad with a Select button in the middle, and a Perkins-style keyboard with oval keys for dots 7 and 8 beside the spacebar, used as Backspace and Enter.","The left edge has a small square power button. The SD card slot is in the middle of an edge toward the right corner. The right edge has the USB-C port for computer connection and charging, and a USB-A port for flash drives. It beeps and vibrates to confirm actions, and came with a padded zip cloth case with a front pocket."],"h":" Orbit Research's brochure calls the Slate 520 the world's first multi-line braille display. It suggests uses such as spatial math with fractions and matrices, braille music and spreadsheets. It offers 2D cursor routing, onboard translation in over 40 languages, a book reader, a note-taker and clock, calendar and calculator apps. A Spanish-language review from February 2024 reports that early units shipped late because of component quality problems.","s":{"disp":"Slate 520: 5 lines × 20 cells (100 cells); Slate 340: 3 lines × 40 cells","dim":"Slate 520: 16.6 × 29.0 × 3.3 cm (6.3 × 11.4 × 1.3 in)","wt":"Slate 520: 1,430 g (3.15 lb)","io":"USB-C, USB-A, full-size SD card; Bluetooth (up to 5 hosts)","price":"Slate 520 $3,495 and Slate 340 $3,995 including shipping (June 2023 purchase, per Juan Pablo's review)"}},{"id":"graphiti","n":"Graphiti","co":"orbit","cat":"Braille Displays","yr":2016,"y":"Announced August 2, 2016 (APH and Orbit Research)","o":"A tactile graphics display with a 60 x 40 pin array.","s":{"disp":"60 × 40 pins (2,400), four pin heights, touch-sensitive","io":"SD card, USB host, micro-USB, HDMI, Bluetooth","bat":"User-replaceable rechargeable"},"src":["https://www.orbitresearch.com","https://sites.aph.org/pr/aph-and-orbit-research-announce-the-worlds-first-affordable-refreshable-tactile-graphics-display/","https://manualzz.com/doc/73535418/orbit-research-graphiti-user-manual"],"h":" APH and Orbit Research announced it on August 2, 2016 as the world's first affordable refreshable tactile graphics display, built on Orbit's Tactuator technology. Each of its 2,400 pins, in a 60 by 40 array, can rise to different heights to represent topographic maps and shades of gray or color, and can blink individually. It connects by USB-C to computers, tablets, phones or the Orion TI-84 Plus talking graphing calculator, and has an HDMI port that makes it appear as a monitor. It also has a cursor pad, an SD card slot for standalone use, and a touch interface where tracing a shape with a fingertip raises the pins along the path. Orbit Research's user manual (version 1.0, October 25, 2021, with revisions back to October 2017) calls it a prototype. It can be used on its own, reading images and PDFs (first page only) from an SD card or USB drive, or connected to a PC, an HDMI source or the Orion TI-84 Plus calculator. You can draw on it by touch and save drawings as BMP files. It zooms up to 32x, rotates and inverts images, and offers several monochrome and grayscale processing variants.","desc":["Graphiti is a tactile graphics display from Orbit Research: a flat panel of 2,400 pins, 60 across and 40 down, each able to rise to one of four heights to form pictures you read by touch. The panel's surface is touch-sensitive, so you can also draw on it with a finger, and a slight vibration confirms many actions.","Set it on a table with the keypad closest to you. The pin panel takes up the far part of the top; the keypad is in front of it, and a single status light at the left of the keypad shows red for power and green when ready.","The keypad has the six braille keys in a row just below the display, dots 3, 2 and 1 on the left and 4, 5 and 6 on the right. Below them, in the middle, is a navigation pad with Up, Down, Left and Right arrows around a Select button. Nearest you is a row of three keys: a wide Space bar in the middle, Dot 7 to its left and Dot 8 to its right.","On the front edge is a full-size SD card slot. On the left edge, front to back, the manual lists the on/off button, HDMI, standard USB host, micro-USB, a main power slider switch (slide it away from you to turn on) and the power jack. A note in the same manual says the power button and jack are on the right edge on some units.","Small tactile dots under the sockets identify them: one dot for power, two for micro-USB, three for standard USB and four for HDMI. The battery is rechargeable and user-replaceable."]},{"id":"mantis","n":"Mantis Q40","co":"aph","cat":"Braille Displays","yr":2020,"y":"Shipping 2020","o":"An APH/HumanWare 40-cell display with a QWERTY keyboard.","ph":"290 x 170 x 20 mm, 950 g.","io":"Bluetooth 4.2, Wi-Fi, 5 Bluetooth plus 1 USB connections","s":{"sto":"16 GB internal; SD up to 64 GB; USB-A flash drives","disp":"40 cells","price":"$2,495 (APH, AccessWorld 2020)","bat":"12 to 17 hours depending on Bluetooth and Wi-Fi use; about 1% per hour asleep","io":"USB-C, USB-A; up to 5 Bluetooth plus 1 USB"},"src":["https://www.aph.org","https://afb.org/aw/21/8/17143","https://afb.org/aw/22/1/17349"],"desc":["The Mantis Q40 is a 40-cell braille display with a full laptop-style QWERTY keyboard instead of braille keys, made by HumanWare with APH. It cost $2,495 in 2020.","With the display nearest you, the front edge has five thumb keys. From left to right they are Previous, Pan Left, Home (which also works as Escape), Pan Right and Next.","Along the left side, nearest you, is a USB-A port for flash drives, then a small round Power button, then the USB-C port for charging and connecting. Hold Power about two seconds to start; it takes about 15 seconds to boot, and a brief press puts it to sleep or wakes it. The back edge has an SD card slot.","On top, closest to you, are the 40 braille cells, each with a cursor-routing button behind it. Behind those is the QWERTY keyboard, laid out like a laptop without a number pad.","The bottom key row, from left to right, is Control, FN, Windows, Left Alt, Space, Right Alt, Right Control, then Left, Down and Right arrows, with Up slightly above Down. On a Mac or iOS device the left keys act as Control, FN, Option and Command. It has 16 GB of storage and downloads from Bookshare and NFB-NEWSLINE."],"h":" A collaboration between APH and HumanWare. Scott Davert reviewed it for AccessWorld in July 2020. He reported one crash before firmware 1.01 and none after it. He noted that switching devices meant pressing Home to leave the current connection, that updates could require re-pairing Bluetooth, and that start-up took about 15 seconds. He found the braille spongy, much like the BrailleNote Touch."},{"id":"cham20","n":"Chameleon 20","co":"aph","cat":"Braille Displays","yr":2020,"y":"2020","o":"An APH/HumanWare 20-cell display with a Perkins-style keyboard.","ph":"3.66 x 7.16 x 0.9 in, 400 g.","io":"USB-C, SD","s":{"bat":"15+ hours","disp":"20 cells","dim":"About 3.5 × 7 × 1 in (NFB review)","wt":"About 1 lb","io":"USB-C, USB-A, SD; Bluetooth"},"src":["https://www.aph.org","https://nfb.org/blog/tech-review-chameleon-20-braille-display-aph"],"desc":["The Chameleon 20 is a 20-cell braille display and notetaker from APH. It measures roughly 3.5 by 7 by 1 inches and weighs about a pound.","The front edge has four thumb keys with a Home button in the middle. The outer two go to the previous and next item, the inner two pan the display left and right, and Home returns to the menu from any app.","The left edge has, from front to back, a standard USB-A port for flash drives, the power button and a USB-C port for charging or connecting. The only thing on the back edge is an SD card slot near the left. The right edge has two volume buttons and an audio jack.","On top, two space bars run along the front edge, with the 20 braille cells behind them and a cursor-routing key behind each cell. Near the back is the eight-key Perkins-style keyboard.","When it is charging while off, the display shows 'Charging' and then 'Charge Complete.' Hold the power button a few seconds to start; 'Starting' appears with two dots spinning as a progress indicator. Enter+P reports the battery, Enter+T the time and Enter+D the date."],"h":" APH's Chameleon 20 runs HumanWare-style software. NFB's review noted that the thumb keys 'operate exactly the same' as on HumanWare devices. At the time of the review its volume buttons and audio jack were not yet usable; APH planned full text-to-speech and audio playback later. Apps include an Editor, Terminal, Library, Calculator, File Manager, Date and Time, Settings and Online Services for Bookshare and NFB-NEWSLINE."},{"id":"canute","n":"Canute 360","co":"bbt","cat":"Braille Displays","yr":2020,"y":"2020","o":"A multiline braille e-reader with 9 lines of 40 cells.","ph":"37 x 19 x 4 cm, 2.8 kg.","s":{"disp":"9 lines × 40 six-dot cells (360 cells)","price":"Under $2,900 (AccessWorld 2022)","dim":"14.5 × 7.5 × 1.5 in (37 × 19 × 4 cm)","wt":"6 lb (2.8 kg)","bat":"None; mains power only","io":"HDMI, 3.5 mm jack (unused), SD, 2 USB-A, USB-B"},"src":["https://bristolbraille.org","https://afb.org/aw/23/6/17972"],"desc":["The Canute 360 is a multi-line braille e-reader from Bristol Braille Technology. It shows nine lines of 40 six-dot cells at once. It is 14.5 inches long, 7.5 inches deep and 1.5 inches high, weighs 6 pounds, and is meant to sit on a table. The case is aluminum with a plastic reading surface.","The nine lines are spaced further apart than in a braille book, like a double-spaced page. At the left end of each line is a braille line number and a triangular Line Select button. Above button 1 is a round Help button labeled H, and below button 9 is a square button labeled 0 for entering page numbers.","The front edge has three large rectangular buttons, with braille labels above them on the top: Back, Menu and Forward.","On the left side, from front to back, are an HDMI port that shows the braille on a monitor in a high-contrast braille font, and a 3.5 mm audio jack not yet used. About halfway back, at the very bottom of that side, is an SD card slot. Further back are two USB-A ports and a USB-B port for computers.","The back is mostly smooth. At its far right end is the power socket, with a spring-loaded on/off button just to its right. The right side has nothing. There is no battery, so it must be plugged in. It takes about a minute to start, refreshing the lines one at a time, and ticks quietly while idle."],"h":" Made by Bristol Braille Technology, a UK not-for-profit founded in 2011. After fourteen prototypes, the Canute 360 began shipping in 2020. Founder Ed Rogers named it after King Canute the Great, who was infamous for trying to hold back the ocean, because earlier multi-line displays had failed. AccessWorld noted that it takes about a minute to start and makes a quiet ticking sound while idle."},{"id":"dotwatch","n":"Dot Watch","co":"dot","cat":"Braille Displays","yr":2017,"y":"2017","o":"A braille smartwatch with 4 refreshable cells.","ph":"27 g.","io":"Bluetooth LE 4.2","s":{"disp":"4 cells","price":"$399 (Dot Watch 2, AccessWorld January 2019)","dim":"43 mm round aluminum case","bat":"7 to 8 days (AccessWorld); magnetic USB charger","conn":"Bluetooth to Android and iOS"},"src":["https://www.dotincorp.com","https://afb.org/aw/20/1/14990"],"desc":["The Dot Watch 2 is a smartwatch from Dot Incorporated with a 4-cell refreshable braille display instead of a screen. It has a round aluminum 43-millimeter case, about the size of an Apple Watch though shaped differently, and cost $399 in 2019.","On the right side is a crown that turns either way, with a button on each side of it. Worn on the left wrist, the button nearer your hand is Home, which puts the watch in standby, and the other is Select, which wakes it. Holding Home for three seconds turns it on.","A protective cover over the face keeps debris out. On a slightly lower surface beneath it is the 4-cell braille display. Past a metal bar level with the cover is another bar, and behind that, parallel to cells 2 and 3, are two touch sensors: the one by cell 2 pans back and the one by cell 3 pans forward.","The band is a magnetic metal mesh, similar to Apple's Milanese Loop, and arrives already attached. Underneath the watch is a small indentation; the magnetic charger has three dots forming braille L, and lining the indentation up with them aligns the magnets. The watch vibrates when charging starts.","In Tactile mode, the default, the time uses Dot's own code: at 3:00, cell 1 is blank, cell 2 shows three pins, and each dot in cells 3 and 4 is five minutes. Braille mode uses ordinary braille, and the watch can be flipped for the right wrist. Even the box is tactile, with 'Dot Watch' embossed in braille."],"h":" AccessWorld's January 2019 review states that the first-generation Dot Watch was discontinued in June 2018 and replaced by the Dot Watch 2. Scott Davert found battery life of seven to eight days. He noted that the default Tactile mode uses Dot's own time code, while Braille mode shows standard braille, and that notifications from a paired phone make it useful for deafblind users."},{"id":"dotpad","n":"Dot Pad","co":"dot","cat":"Braille Displays","yr":2021,"y":"2021","o":"A tactile graphics display.","s":{"disp":"300 eight-pin cells (30 × 10) = 2,400 pins, plus a 20-cell braille line","bat":"10,000 mAh 3.7 V; 8 to 11 hours","dim":"273.5 × 228.5 × 31 mm (Dot Pad, Dot Inc.); 27.3 × 22.8 × 1.6 cm (Dot Pad X, RNIB)","wt":"1.2 kg (Dot Pad); 1.4 kg (Dot Pad X, RNIB); about 2.5 lb (NFB)","cpu":"ARM Cortex-M4 32-bit, 120 MHz (Dot Pad X)","io":"Bluetooth LE 5.0; two USB-C ports (Dot Pad X)","price":"Dot Pad: $10,000 to $12,000 range (Dot Inc.); Dot Pad X: about $6,000 (NFB, May 2026); £6,495 ex VAT (RNIB)"},"src":["https://www.dotincorp.com","https://nfb.org/images/nfb/publications/bm/bm26/bm2605/bm260506.htm","https://www.dotincorp.com/en/product/pad","https://shop.rnib.org.uk/products/dot-pad"],"desc":["The Dot Pad is a tactile graphics display from Dot Inc. The NFB compares the Dot Pad X to an iPad Pro in size: under an inch thick and about 2.5 pounds. Dot Inc. gives the original Dot Pad as 273.5 by 228.5 by 31 millimeters and 1.2 kilograms.","Most of the top is the graphics area: 300 eight-pin cells, 30 across by 10 down, making 2,400 pins. It can show a raised picture, or multi-line braille at 20 cells per line. A protective membrane covers the pins and gives them a distinctive feel.","It has six tactile buttons that can be assigned to functions. They move forward and back through text and invert, zoom, rotate or pan images.","Below the graphics area, and below these controls, is a separate single line of 20 braille cells for text. You can read text there with one hand while exploring a graphic with the other.","The Dot Pad X has two USB-C ports for charging and data. A blue light shows a Bluetooth connection and a red light shows charging. The cells will not refresh while a finger rests on them, so lift your hands briefly to let the picture change."],"h":" Made by Dot Inc. of South Korea, whose cell technology is also used in the Monarch. The Dot Pad X uses a newer generation of the cell that refreshes faster. It is a display, not a computer: it has no operating system, document storage, keyboard or cursor routing, and relies on an iPhone, iPad or Windows PC running VoiceOver, NVDA or JAWS. Dot Inc. offers Dot Book for reading up to ten lines of six-dot braille, and the Dot Cloud graphics library. The NFB found its battery outlasted the stated eight hours."},{"id":"monarch","n":"Monarch","co":"aph","cat":"Braille Displays","yr":2024,"y":"Shipping from September 17, 2024","o":"An APH/HumanWare dynamic tactile device with 10 lines of 32 cells for braille and graphics, using Dot cells. Named one of TIME's Best Inventions of 2025.","ph":"403.5 x 266.5 x 35.5 mm (15.89 x 10.49 x 1.40 in), 2.1 kg (4.65 lb).","f":["Touch sensing (Neonode IR sensor)","Over 250 braille tables","KeySoft applications"],"io":"USB-C 3.0, USB-A 3.0, HDMI 2.0, Wi-Fi 802.11ac, Bluetooth 5.1, audio jack","s":{"cpu":"Quad-core 64-bit Cortex-A55 at 2.0 GHz","ram":"4 GB LPDDR4","sto":"128 GB","os":"Android with KeySoft","disp":"3,840 pins (10 lines x 32 cells)","bat":"Over 24 hours (APH); 8 hours planned in the early spec sheet","price":"About $15,000, varying by region and channel (NFB Braille Monitor, May 2026)"},"src":["https://www.humanware.com/wp-content/uploads/Monarch-Technical-Specification-Document.pdf","https://www.aph.org/product/monarch/","https://nfb.org/resources/publications-and-media/access-on-podcast/hands-monarch-dynamic-tactile-multi-line-braille","https://nfb.org/images/nfb/publications/fr/fr43/4/fr430409.htm","https://www.aph.org/blog/making-the-monarch-a-revolutionary-device-for-all/","https://nfb.org/images/nfb/publications/bm/bm26/bm2605/bm260506.htm"],"desc":["The Monarch is a multi-line braille and tactile graphics device from APH and HumanWare. It is about the size of a 15-inch gaming laptop: 15.9 inches wide, 10.5 inches deep and 1.4 inches high, weighing about 4.65 pounds (2.1 kilograms). The NFB calls it a workstation rather than a portable note-taker. It ships in a protective bubble sleeve with a hard carrying case.","Most of the top is the tactile surface: a continuous grid of 96 by 40 evenly spaced pins, 3,840 in all. It shows ten lines of 32 braille cells, or a raised picture across the whole surface. Because the pins are evenly spaced, line spacing can be widened for beginning readers. A user-replaceable membrane protects it from dust and spills.","Nearest you is an eight-key Perkins-style braille keyboard. APH lists up and down arrows, direction pads, Android navigation keys and controls for paging and zooming. Infrared sensors detect touch gestures on the surface, and a vibration motor gives haptic feedback.","For connections, it has a USB-C port, a USB-A port, an HDMI port that shows a sighted teacher or classmate what is on the display, and an audio jack. It also has a microphone, stereo speakers, Wi-Fi and Bluetooth.","When the display refreshes, many pins move at once with an audible clatter, and you must lift your hands for it to refresh correctly. A double press of the refresh button redraws it."],"h":" APH partnered with HumanWare just over four years before launch; HumanWare designed the display around the braille cell from the South Korean company Dot, and the NFB took part in development. APH began shipping it to students on September 17, 2024. Apps include KeyWord, a braille editor for BRF and eBRF files, the Tactile Viewer linked to APH's Tactile Graphics Image Library of over two thousand graphics, KeyMath, a graphing calculator built with Desmos, and Victor Reader for Bookshare and NFB-NEWSLINE. It carries a two-year warranty and is available with federal quota funds. The NFB's reviewer noted you must lift your hands as it refreshes, and that refreshing is noisy."},{"id":"perk80","n":"Perkins 80-cell display (Seika)","co":"perkins","cat":"Braille Displays","yr":2010,"y":"2010","o":"An 80-cell USB display made by Seika and sold by Perkins Products for $3,900.","io":"USB","s":{"price":"$3,900","disp":"80 cells"},"src":["https://afb.org/aw/11/4/16038"]},{"id":"votraxtnt","n":"Votrax Type 'N Talk","co":"votrax","cat":"Speech Synthesizers","yr":1980,"y":"1980","o":"A stand-alone text-to-speech box built on the SC-01A phoneme chip.","io":"Serial","s":{"cpu":"Motorola MC6802","tts":"Votrax SC-01A"},"vo":["votraxvoice"],"src":["https://en.wikipedia.org/wiki/Votrax","https://archive.org/stream/VotraxTypeNTalkManual/Votrax%20Type%20%27N%20Talk%20Manual_djvu.txt","https://www.thehenryford.org/collections/explore/artifact/388923?AssetId=THF156826","https://www.atarimagazines.com/v1n2/taritalkers.php"],"h":" Its manual is copyrighted 1981, and The Henry Ford museum dates its unit (Model 100) to 1981. Antic magazine's review (volume 1, number 2) tested it on the Atari 400 and 800, which needed the Atari 850 interface and a cable (about $30 from the maker). It listed for $375 plus a speaker, since the unit needed an external 8-ohm speaker, from Votrax at 500 Stephenson Highway, Troy, Michigan. It spoke an unlimited vocabulary from plain English text at 300 baud and could output the phoneme codes it generated, so users could hand-tune pronunciation. The reviewer had used it for six months, but at a science fair most first-time listeners found Street Electronics' ECHO-GP ($369.95) clearly easier to understand. He also complained that the on/off switch was on the back and there was no power light."},{"id":"votraxpss","n":"Votrax Personal Speech System","co":"votrax","cat":"Speech Synthesizers","yr":1982,"y":"1982","o":"A Z80-based external speech synthesizer.","s":{"cpu":"Zilog Z80","price":"$449 (AbleData listing)"},"vo":["votraxvoice"],"src":["https://en.wikipedia.org/wiki/Votrax","https://web.archive.org/web/20110606065104/www.abledata.com/abledata.cfm?pageid=113583&productid=94209&top=0&trail=0"],"h":" AbleData described it as a text-to-speech unit using phonetic rules and exception tables, able to play music, with RS-232 and parallel connections. Votrax released the Personal Speech System in 1982. It used the SC-01-A chip, controlled by a Zilog Z80 processor with two 8K EPROMs, four TTL chips and 2K of RAM, all sealed in epoxy so the design couldn't be copied. Its text-to-speech was based on the text-to-phoneme rules Votrax developed with the U.S. Naval Research Laboratory in 1973, the same rules used in the Type 'N Talk. Votrax restructured in 1984 and stopped making new consumer products, but kept selling the PSS, on and off, until at least October 1990."},{"id":"echo2","n":"Echo II","co":"street","cat":"Speech Synthesizers","yr":1982,"y":"1982","o":"A speech card for the Apple II, widely used with talking software.","s":{"tts":"TI TMS5220 with Textalker software"},"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://www.duxburysystems.org/downloads/library/texas/apple/manuals/echo.htm","https://www.trs-80.org/echo-80-speech-synthesizer.html"],"h":" Street Electronics' Echo II is a slot card for the Apple II built on Texas Instruments' TMS5200/5220 LPC speech chip. Its Textalker software turned text into speech and its Speakeasy program worked with phonemes, with adjustable pitch and volume."},{"id":"dectalk","n":"DECtalk DTC01","co":"dec","cat":"Speech Synthesizers","yr":1984,"y":"1984","o":"DEC's hardware synthesizer, based on Dennis Klatt's research. Its default voice was Perfect Paul.","ph":"18 x 12 x 4 in, 16 lb.","io":"RS-232","s":{"price":"$4,000","tts":"DECtalk (Perfect Paul default)"},"vo":["dt_paul","dt_betty","dt_harry","dt_frank","dt_kit","dt_rita","dt_ursula","dt_dennis","dt_wendy"],"src":["https://en.wikipedia.org/wiki/DECtalk","https://www.inc.com/magazine/19840301/3858.html"],"h":" DEC announced the DTC01 in December 1983 and delivered the first units in February 1984. It connected over RS-232C and could also handle telephone touch tones. Dennis Klatt began looking for an industrial partner for his MIT work in 1981. Larger quantities shipped in March 1984. The units had two telephone jacks, one for the phone line and one for a handset, so DECtalk could answer and place calls, read email aloud, and run touch-tone alert systems. Uses ranged from public information services to giving a voice to people with speech disabilities. Later versions came on ISA cards for PCs and as software: DECtalk Software for Digital UNIX and for Windows NT, and DECtalk Access32."},{"id":"synph200","n":"SynPhonix 200","co":"artic","cat":"Speech Synthesizers","yr":1985,"y":"1985","o":"An Artic Technologies PC speech card.","suc":["synph215"],"src":["https://web.archive.org/web/20060327064418/http://www.artictech.com/history.htm","https://web.archive.org/web/20110728031437/http://www.articannex.ws/artictec.htm","https://speechchips.com/devices/synphonix200.html"],"h":" Artic Technologies was founded in 1984 by Art Velthoven, Dale McDaniel, Kathy Gargagliano and Tim Gargagliano. All four came from the research and development group at Votrax, the speech synthesis subsidiary of Federal Screw Works. In Artic's own history, the SynPhonix 200 card, released in 1985, was the company's first commercial product; SpeechChips.com notes that the SynPhonix family was already being advertised for IBM and Apple computers in 1984. The card fit inside an IBM PC and spoke through the 263 phoneme chip (the SSI 263, originally Votrax's SC-02), which built words from individual speech sounds. Artic recalls building synthesizers in the founders' basements and moving offices several times in those early years. The 200 became an important partner for screen-reading software, and in 1987 it was replaced by the SynPhonix 215."},{"id":"synph215","n":"SynPhonix 215","co":"artic","cat":"Speech Synthesizers","yr":1987,"y":"1987","o":"An updated SynPhonix card.","pre":["synph200"],"src":["https://web.archive.org/web/20060327064418/http://www.artictech.com/history.htm","https://web.archive.org/web/20110728031437/http://www.articannex.ws/artictec.htm","https://afb.org/aw/1/5/16151","https://www.freelists.org/post/raspberry-vi/Still-no-go-for-more-voices,32"],"h":" Artic released the SynPhonix 215 in 1987, the year it moved into its own building in Troy, Michigan. It replaced the 200, and Artic later described it as still known for its fast speech rate, accurate text-to-speech, responsiveness, and instant silencing. It was usually paired with Artic's Business Vision screen reader (1987). AccessWorld noted that SynPhonix and Artic's screen readers were significant, lower-cost competitors to DECtalk and JAWS. Related ISA cards included the 210 and 216, and there was also a laptop version, the SynPhonix 225, and a PCMCIA card, the P27. All are now out of production. Users still remembered the 215 decades later; in 2021 a former Smith-Kettlewell staff member listed it on a mailing list among the synthesizers he used there after the early Votrax."},{"id":"transport","n":"Artic TransPort","co":"artic","cat":"Speech Synthesizers","yr":1992,"y":"Fall 1992","o":"Artic's external portable synthesizer.","src":["http://cd.textfiles.com/nfbfiles/newsletters/VN0892.TXT","https://web.archive.org/web/20110728031437/http://www.articannex.ws/artictec.htm","https://web.archive.org/web/20060327064418/http://www.artictech.com/history.htm"],"h":" Artic announced TransPort in its Visions newsletter in fall 1992, after years of users asking for a portable, battery-powered synthesizer as responsive as its internal cards. TransPort was 0.75 inch high, 4.125 inches wide and 7.5 inches long, and weighed about 15 ounces. It had an aluminum case, used the Artic 263 speech chip, had thumbwheels for volume and tone, and could use its built-in speaker, headphones or an external speaker. It ran about 16 hours on rechargeable batteries, warned when the battery was low, and could be used while charging. The flagship model 615 included Artic's Business Vision screen reader, which could be copied from its ROM disk to any PC; the VEST speech rules; a clock with 16 alarms; battery-backed file storage; and a port for Artic's Gizmo pad or Turbo Pedals. The model 611 was the same without Business Vision. Both could emulate Artic's own PortTalk codes or the external Accent synthesizer, so other screen readers could drive them. Later came the palm-sized Mini TransPort 621 and 622; all are now out of production."},{"id":"dtpc","n":"DoubleTalk PC","co":"rcs","cat":"Speech Synthesizers","yr":1992,"y":"1992","o":"An internal 8-bit ISA speech card. It was the only synthesizer the first Speakup alpha supported (1998).","io":"8-bit ISA","src":["https://lkml.iu.edu/9810.3/0735.html","https://www.duxburysystems.org/downloads/library/news/new95.htm","https://manualzilla.com/doc/5788162/doubletalk-pc-lt-user-s-manual","https://www.rcsys.com/dt.htm"],"h":" RC Systems' manual says the card fits an 8- or 16-bit ISA slot and needs no IRQ, DMA or system memory. Its sibling, the DoubleTalk LT, is the external serial version."},{"id":"dtlt","n":"DoubleTalk LT","co":"rcs","cat":"Speech Synthesizers","yr":1991,"y":"About 1991 (APH Museum)","o":"An external serial DoubleTalk.","io":"RS-232","s":{"tts":"RC8650 chipset"},"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://aphmuseum.org/record/doubletalk-lt-speech-synthesizer/","https://www.rcsys.com/dt.htm","https://www.rcsys.com/Downloads/dtfacts.pdf"],"h":" The LT plugs into a serial port on almost any PC or laptop and runs on a 9-volt battery or an AC adapter."},{"id":"accent","n":"Accent SA","co":"aicom","cat":"Speech Synthesizers","yr":1992,"y":"On the market by 1992","o":"Aicom's serial speech synthesizer.","io":"Serial","src":["http://cd.textfiles.com/nfbfiles/newsletters/VN0892.TXT","https://www.freelists.org/post/jfw/jaws-61,13","https://www.freelists.org/post/raspberry-vi/Still-no-go-for-more-voices,32","https://www.cs.vassar.edu/~priestdo/emacspeak/list.archive.2005/msg00179.html"],"h":" A
