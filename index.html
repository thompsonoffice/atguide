, 2020 (see its entry). The Pro 4 is sold through eye-care professionals; a Pro 4 LV brochure was published in October 2024. The earliest dated Pro 4 material found is the October 2024 brochure.","s":{"disp":"Binocular 1080p OLED displays, 43-degree field of view; 12 MP camera","bat":"About 6 hours (powered from the tethered phone)","price":"Pro 4 LV bundle (glasses, Samsung phone, case): $3,895 at a US retailer"},"ph":"102 g, tethered by USB-C."},{"id":"eye","n":"Eyedaptic EYE series (EYE1 to EYE6)","co":"eyed","cat":"Vision Wearables","yr":2019,"y":"EYE1 2019, EYE2 2020, EYE3 June 2021, EYE4 2021, EYE5 October 2022, EYE6 August 2024","o":"Augmented-reality low-vision glasses. The EYE6 has 1080p displays and weighs 3 oz.","src":["https://eyedaptic.com"]},{"id":"bd3","n":"Triformation BD-3","co":"et","cat":"Embossers","yr":1971,"y":"1971","o":"An early computer braille embosser from Triformation Systems, later Enabling Technologies.","suc":["led120"],"src":["https://nfb.org/sites/default/files/images/nfb/publications/fr/fr28/fr280109.htm","https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" The NFB's Braille Technology Timeline (2026 edition) says Triformation Systems, later Enabling Technologies, released its first embosser, the BD 3, in 1971. Triformation made the first embossers able to print eight-dot computer braille in the early 1970s, partly building on the Braille Mboss developed at MIT."},{"id":"led120","n":"Triformation LED-120","co":"et","cat":"Embossers","yr":1974,"y":"1974","o":"A Triformation braille embosser.","pre":["bd3"],"src":["https://nfb.org/sites/default/files/images/nfb/publications/fr/fr28/fr280109.htm","https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" The NFB's Braille Technology Timeline (2026) calls the LED 120 Triformation's popular embosser of the late 1970s, which differs from this entry's earlier 1974 date. It followed the BD 3 (1971), and Triformation later became Enabling Technologies."},{"id":"juliet","n":"Enabling Technologies Juliet","co":"et","cat":"Embossers","yr":1992,"y":"1992","o":"An interpoint tractor-feed embosser. Later models reached 55 to 60 characters per second.","suc":["juliet120"],"src":["https://sites.aph.org/museum-virtual-exhibit/vex1/7D6044E7-F4E9-4189-A3F0-428547426285.htm"]},{"id":"romeo","n":"Romeo Attaché / Attaché Pro","co":"et","cat":"Embossers","yr":2004,"y":"2004","o":"A compact embosser at 15 characters per second. The Pro adds single-sheet tractor feeding and speech.","s":{"price":"$2,295 (Enabling Technologies price list, July 1, 2012)","dim":"17 × 11.25 × 5.75 in","wt":"16.75 lb"},"src":["https://www.freelists.org/post/duxuser/DBT-105,19","https://www.yumpu.com/en/document/view/38152810/romeo-attache-romeo-attache-pro-enabling-technologies","https://manualzilla.com/doc/5765358/romeo-attach%C3%A9-romeo-attach%C3%A9-pro-romeo-25-and-romeo-pro-50","https://www.yumpu.com/en/document/view/38152810","https://www.yumpu.com/en/document/view/9450828/prices-and-ordering-information-enabling-technologies","https://cdn.thomasnet.com/ccp/01055195/75393.pdf"],"desc":["The Romeo Attaché is a small, portable, single-sided impact braille embosser for teachers and students. It measures 17 × 11.25 × 5.75 inches and weighs 16.75 pounds.","It embosses at 15 characters per second on a line of up to 32 characters.","It uses tractor-feed paper up to 8.5 inches wide, letter-size, with sprocket holes along the edges.","It supports 6- and 8-dot braille and graphics.","Its launch price wasn't found; Enabling Technologies' price list effective July 1, 2012 shows the Romeo Attaché at $2,295 and the Attaché Pro at $2,495."]},{"id":"juliet120","n":"Juliet 120","co":"et","cat":"Embossers","yr":1992,"y":"1992 (Juliet embosser museum record)","o":"A modern Juliet at 120 characters per second.","pre":["juliet"],"src":["https://www.insidevision.fr/pdf_cat/Fiche_Produit_Braille_Imprimantes_Romeo60_Juliet120_01.pdf","https://sites.aph.org/museum-virtual-exhibit/vex1/7D6044E7-F4E9-4189-A3F0-428547426285.htm"]},{"id":"idx37","n":"Index Computer Braille Printer (Index 3.7)","co":"index","cat":"Embossers","yr":1984,"y":"1984","o":"Index's first small batch of embossers, built in Björn Löfstedt's garage and named after the firmware version.","suc":["idxbluebar"],"src":["https://www.braillecast.com/podcast/e020/","https://indexbraille.com/about-us/"],"h":" Index began in 1979 as a university project to build a braille typewriter with a copy function. Björn Löfstedt was inspired by his mother, who went blind at 32. With support from a Swedish disability organization, he and Torvald Lundqvist founded Polar Print Production (later Index Braille AB) in 1982. A small batch of Index Computer Braille Printers was built in Löfstedt's garage in 1984; they became known as the 'Index 3.7' after the firmware version. Index moved into its current premises in 1985, paid for by distributing assistive technology around Sweden."},{"id":"idxbluebar","n":"Index Blue Bar","co":"index","cat":"Embossers","yr":1988,"y":"1988","o":"A tractor-feed embosser that launched the Index Braille brand.","pre":["idx37"],"suc":["everestd"],"src":["https://www.braillecast.com/podcast/e020/","https://www.medicalexpo.com/prod/index-braille/product-108385-1043623.html","https://sastltd.zohodesk.eu/portal/en/kb/articles/index-embosser-version-identification"],"h":" Index's history of the Basic-D says the Basic Blue Bar was developed in 1988 as part of its first generation of modern braille embossers. It took tractor-fed paper. A UK service note describes the V1 Basic by the blue or red bar on its steel case; V1 production ran until 1995, and no spare parts remain."},{"id":"everestd","n":"Index Everest-D (V1)","co":"index","cat":"Embossers","yr":1992,"y":"1992","o":"A cut-sheet embosser that Index describes as the first double-sided small printer.","pre":["idxbluebar"],"suc":["idxv2"],"src":["https://indexbraille.com/about-us/","https://www.braillecast.com/podcast/e020/","https://sastltd.zohodesk.eu/portal/en/kb/articles/index-embosser-version-identification"],"h":" Released in 1992, the Everest-D V1 took cut-sheet paper and, Index says, was the first small double-sided braille printer. V1 machines are end-of-life with no parts available."},{"id":"idxv2","n":"Index Basic and Everest (V2 platform)","co":"index","cat":"Embossers","yr":1995,"y":"February 1995 to 2002","o":"The second Index platform. A user in Chandigarh reports using a Basic-D since 1997.","pre":["everestd"],"suc":["idxv3"],"src":["https://www.braillecast.com/podcast/e020/","https://indexbraille.com/","https://sastltd.zohodesk.eu/portal/en/kb/articles/index-embosser-version-identification","https://www.medicalexpo.com/prod/index-braille/product-108385-1043623.html"],"h":" A UK service note dates V2 production from February 1995 to 2002. The Basic had a red lid on a black case, and the only interface was parallel; the serial port was for service only. Index says the Basic V2 already looked much like today's Basic. Support for V2 ended on January 1, 2011."},{"id":"idx4x4","n":"Index 4X4 Pro","co":"index","cat":"Embossers","yr":1998,"y":"1998","o":"A booklet-printing embosser.","src":["https://www.braillecast.com/podcast/e020/"],"h":" Introduced in 1998, the 4X4 Pro was Index's booklet-printing embosser. It came between the V2 platform (1995) and the V3 platform (2002 to 2004)."},{"id":"idxv3","n":"Index V3 platform","co":"index","cat":"Embossers","yr":2002,"y":"2002 to 2011","o":"Added USB and network connectivity.","io":"USB, network","pre":["idxv2"],"suc":["idxv4"],"src":["https://www.braillecast.com/podcast/e020/","https://sastltd.zohodesk.eu/portal/en/kb/articles/index-embosser-version-identification","https://www.medicalexpo.com/prod/index-braille/product-108385-1043623.html"],"h":" Basic-D V3 came out in 2002. A UK service note describes V3 machines as having a black case, red lid and yellow buttons, with USB, Ethernet and parallel ports (the serial port is for service only), and serial numbers from 30000 to 49999. Production ran until 2011. V3 is now end-of-life with no parts available."},{"id":"idx4waves","n":"Index 4Waves Pro","co":"index","cat":"Embossers","yr":2005,"y":"2005","o":"A high-speed production embosser.","src":["https://www.braillecast.com/podcast/e020/"],"h":" Introduced in 2005, the 4Waves Pro was Index's high-speed production embosser. It came between the V3 platform (2002 to 2004) and the V4 platform (2011)."},{"id":"idxv4","n":"Index V4 platform","co":"index","cat":"Embossers","yr":2011,"y":"2011","o":"Added built-in braille translation and high-speed cut-sheet production.","pre":["idxv3"],"suc":["idxv5"],"src":["https://www.braillecast.com/podcast/e020/","https://sastltd.zohodesk.eu/portal/en/kb/articles/index-embosser-version-identification","https://www.medicalexpo.com/prod/index-braille/product-108385-1043623.html","http://www.itacconsulting.com/img/products/braille%20embrossers/pdfs/Index%20BrailleBox-presentation.pdf"],"h":" Basic-D V4 (2011) was Index's first black-and-white Basic: a white case with a black lid. The control panel changed to a Menu button with up and down arrows. Production ran from 2011 to 2016. The BrailleBox, a sheet-fed production embosser with three embossing heads and a 300-page sheet feeder, came out in 2011 as part of V4. Index calls it the most advanced development work it had ever done."},{"id":"idxv5","n":"Index V5 line (Basic-D, Everest-D, BrailleBox)","co":"index","cat":"Embossers","yr":2016,"y":"2016 to present","o":"The current line, with Wi-Fi, Bluetooth, faster embossing, remote support and printing directly from a USB stick.","io":"Wi-Fi, Bluetooth, USB memory stick, network","pre":["idxv4"],"src":["https://indexbraille.com/about-us/","https://www.braillecast.com/podcast/e020/","https://sastltd.zohodesk.eu/portal/en/kb/articles/index-embosser-version-identification","https://www.medicalexpo.com/prod/index-braille/product-108385-1043623.html","http://www.itacconsulting.com/img/products/braille%20embrossers/pdfs/Index%20BrailleBox-presentation.pdf"],"h":" Index released the V5 line in 2016. The Basic-D V5 has a white case and black lid, embosses 140 characters per second double-sided with a dot height of 0.58 mm, and has a control panel labeled in braille and print. V5 added Index-direct-Braille (printing doc, docx, PDF and EPUB 3 files without a braille editor), printing from phones and tablets, Wi-Fi, wired network or USB connections, printing from a USB stick with speech guidance, and the BrailleApp web interface. The BrailleBox V5 cut the number of circuit boards from 4 to 2, replaced the mechanical door with a DOOR key and moved all controls to its panel. The BrailleBox has won design awards including Red Dot, Good Design and the German Design Award."},{"id":"braillo270","n":"Braillo 270","co":"braillo","cat":"Embossers","yr":1980,"y":"January 1980","o":"The world's first double-sided (interpoint) braille embosser, developed with SINTEF.","h":"The first unit went to Norway's Tambartun School for the Blind and ran until the school closed in 2013. It evolved into the Braillo 400 S.","suc":["braillo200","braillo440sf"],"src":["https://braillo.com/about-us/"]},{"id":"braillo200","n":"Braillo 200","co":"braillo","cat":"Embossers","yr":1986,"y":"1986","o":"A compact interpoint embosser known for reliability.","pre":["braillo270"],"src":["https://braillo.com/about-us/"]},{"id":"braillo440sf","n":"Braillo 440 SF","co":"braillo","cat":"Embossers","yr":0,"y":"Predates the S2 line, which Braillo introduced after American Thermoform bought the company in 2016 (braillo.com). The original introduction year was not found.","o":"Braillo calls it the first fully automated braille book production system. It followed the 400 S, 400 SR and 440 SW.","h":"After American Thermoform's 2016 acquisition, the S2 line (300 S2 to 650 SF2) raised speeds by about 50 percent.","pre":["braillo270"],"src":["https://braillo.com/about-us/"]},{"id":"tigeradv","n":"ViewPlus Tiger Advantage","co":"viewplus","cat":"Embossers","yr":2000,"y":"Shipping 2000 (announced 2001)","o":"Embosses multi-height tactile graphics and braille using TIGER technology.","suc":["emprint","vpmax"],"src":["https://nfb.org/sites/default/files/images/nfb/publications/fr/fr28/fr280109.htm","https://viewplus.com/about/","https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"],"h":" The NFB timeline dates ViewPlus's announcement of the Tiger Advantage, its first braille-capable tactile graphics printer, to 2001."},{"id":"emprint","n":"ViewPlus Emprint","co":"viewplus","cat":"Embossers","yr":2006,"y":"May 16, 2006","o":"A braille embosser combined with a color HP inkjet, so pages carry both ink and braille.","pre":["tigeradv"],"src":["https://viewplus.com/viewplus-introduces-emprint-new-braille-printer-with-color-hp-inkjet/"]},{"id":"vpmax","n":"ViewPlus VP Max","co":"viewplus","cat":"Embossers","yr":2009,"y":"2009 to 2021","o":"A large-format tactile graphics embosser, retired in 2021.","pre":["tigeradv"],"src":["https://viewplus.com/the-max-has-gone-rogue/"]},{"id":"thielbx3","n":"Thiel Beta-X3","co":"thiel","cat":"Embossers","yr":1986,"y":"About 1986 (US distribution by VTEK)","o":"A German high-speed single-sided embosser rated at 130 characters per second.","src":["https://nfb.org/sites/default/files/images/nfb/publications/fr/fr28/fr280109.htm"]},{"id":"perkinsbr","n":"Perkins Brailler","co":"perkins","cat":"Embossers","yr":1951,"y":"1951 to present","o":"A manual braillewriter (not an electronic embosser) designed by David Abraham. It is the classic tool for writing braille.","suc":["smartbr"],"src":["https://www.perkins.org","https://www.acb.org/perkins-brailler-turns-seventy","https://brailler.perkins.org/pages/brailler-comparison","https://brailler.perkins.org/pages/perkins-brailler-faq","https://www.ebay.nl/itm/158272750760","https://www.braillebookstore.com/Refurbished-Perkins-Brailler.1","https://lightningauctions.auctionmobility.com/lots/view/1-AMFBZL/perkins-brailler-writing-machine"],"h":" In the 1800s many mechanical braille writers were tried, including the Daisy Writer and Frank H. Hall's 1892 machine. Howe Press's cast-iron braillers were heavy, noisy and broke easily. In the 1930s Perkins director Gabriel Farrell asked David Abraham, an English-born industrial-arts teacher and former Royal Flying Corps mechanic, to design a new one with Dr. Edward Waterhouse. Abraham built it in his home workshop with help from tool-and-die maker Fred Lehman and showed the prototype to the trustees in 1941. Wartime material shortages delayed production. The trustees voted to subsidize production in 1946, and AFB helped secure $40,000 in loans. Shipping began in 1951 at $70. Perkins expected to need about 1,000 units but soon had orders for more than 2,000. The machine has more than 600 parts; assemblers built about 40 a day. Abraham retired in 1961. In the 1990s production also moved to England, India and South Africa, and more than 395,000 braillers have shipped to 200 countries and territories. Perkins Brailler #1 came back from the Oregon School for the Blind into the Perkins archives.","s":{"cpu":"None (fully mechanical)","ram":"None (mechanical)","syns":"None; a mechanical braille writer with no speech","price":"$70 (original 1951 price); about $810 new today","used":"eBay: a refurbished unit with new parts and new paint listed at about US$449.87 plus $28.87 shipping. Braille Superstore sells refurbished units for $454.95. An estate auction in May 2025 sold one for $40.","wt":"10.6 lb (4.8 kg)","dim":"37 × 23 × 15 cm","disp":"Embosses up to 42 cells per line and 26 lines per page"},"desc":["The Classic Perkins Brailler is a solid, heavy metal machine about the size of a small, boxy typewriter. It is about 37 cm long, 23 cm high and 15 cm deep, and weighs 10.6 lb (4.8 kg), so you can lift it with two hands but it doesn't slide around on a desk. The body is aluminum with a baked-enamel finish. It usually comes in gray, and newer machines also come in blue.","Along the front edge sits a single row of nine keys. In the middle is the space bar key. To its left are three dot keys for dots 3, 2 and 1, and to its right are dots 4, 5 and 6, so each hand rests on three keys. At the far left end is the line-space key, which advances the paper one line, and at the far right end is the backspace key. Pressing several dot keys together embosses one braille cell.","On top, toward the back, is a rounded roller drum that holds the paper. Two paper-feed knobs on the sides roll the paper in and out. Pressure-roller levers, which you pull toward you to open and push away to close, clamp the sheet in place. The paper goes in from the back and lines up against the left side.","The embossing head is inside the machine, riding on a carriage that moves from left to right as you type. A carriage lever lets you return it to the left starting position. Each line holds up to 42 braille cells, and a page holds about 26 lines.","It is purely mechanical, with no power cord or battery. Users say a well-kept machine lasts for decades; ACB's author still used the one she got as a first grader more than 60 years later. Variations include the Unimanual model, whose keys lock down for one-handed brailling, the Light-Touch Electric model, and the SMART Brailler, which adds a screen and speech."]},{"id":"smartbr","n":"SMART Brailler","co":"perkins","cat":"Embossers","yr":2012,"y":"2012","o":"A Perkins Brailler with a screen, speech and digital output.","ph":"3.9 kg.","s":{"disp":"4.3-inch screen"},"pre":["perkinsbr"],"src":["https://www.perkins.org"]},{"id":"optacon","n":"Optacon","co":"tsi","cat":"Other","yr":1971,"y":"1971 to 1996 (models included the R1C and R1D)","o":"A reading machine that turned printed letters into vibrating tactile images under the fingertip. About 15,000 were sold.","h":"Conceived by Stanford electrical engineering professor John Linvill in 1962. During a sabbatical he saw an IBM high-speed printer in Germany whose small pins hammered out letters, and reasoned that his blind daughter Candy could read print if she could feel those pins. With graduate students G.J. Alonzo and John Hill, and with Office of Naval Research support, he developed vibrating piezoelectric bimorph reeds as the tactile pins. He filed for a patent in 1964, and U.S. Patent 3,229,387 was granted in January 1966. James Bliss of SRI joined him. Bliss's computer simulation had Candy reading over 30 words a minute after a few hours. The Veterans Administration would fund the work only if Linvill gave it his patent, and he refused. The U.S. Office of Education then gave over $1.8 million over four years, which paid for custom integrated circuits: a 24 x 6 silicon retina of phototransistors and bimorph drivers. The first self-contained prototype was finished on September 1, 1969. It measured 13.5 x 8 x 2.25 in, weighed 9 lb and ran about 12 hours on rechargeable batteries. The Model S-15 shrank that to 8 x 6 x 2 in and 4 lb, and won an IR-100 award in 1971. The S-15 is now at the Computer History Museum. Linvill and Bliss co-founded Telesensory Systems to make it, and TSI sold the Optacon from 1971 to 1996. Early buyers included the U.S. Office of Education, St Dunstan's in London, and programs in Germany, Sweden, Japan, Italy, France and Scandinavia. About 15,000 were sold. TSI announced in 1996 that it would stop making the Optacon and would service it only until 2000. TSI shut down suddenly in March 2005.","s":{"disp":"24 x 6 array of 144 vibrating metal rods (rows 1 mm apart, columns 2 mm apart), vibrating at 250 to 300 Hz","cpu":"No general-purpose processor; custom Stanford-developed integrated circuits (24 x 6 phototransistor silicon retina and 12-channel bimorph driver chips switching 5 V logic to the 45 V bimorph drive)","ram":"None (not a computer)","sto":"None","os":"None","tts":"None (tactile output only)","syns":"None. The Optacon has no speech; output is a vibrating tactile image.","bat":"Built-in rechargeable battery, not user-removable; external charger. The 1969 prototype ran about 12 hours.","price":"About $3,400 in 1974 and 1977 (users' reports); about $3,000 in 1985 (user report). One user recalled about $5,000 in 1972.","used":"An eBay listing for a Model R1D, started December 29, 2025, asked $400 (sold as parts or repair; powers on, untested). Users on the optacon-l list reported paying about $550 on average for used units (2012), and serviced R1C and R1D units were advertised for $800 in October 2019. No eBay sold listings were found."},"suc":["optacon2"],"src":["https://en.wikipedia.org/wiki/Optacon","https://afb.org/aw/6/4/14611","https://www.freedomscientific.com/Content/Documents/Manuals/Legacy/Optacon/OptaconOwnersManualModelR1D.txt","https://aphmuseum.org/record/model-r1d-optacon/","https://nfb.org/optacon-past-present-and-future","https://www.freelists.org/post/optacon-l/was-Jim-Blisss-death-Now-Buying-Used-Optacons,1","https://www.freelists.org/post/optacon-l/Jim-Blisss-death,39","https://www.freelists.org/archive/optacon-l/10-2019","https://www.bibliotecanacional.ao/xlWZ1M5z","https://interfacemuseum.com/exhibits/optacon-ii/"],"ph":"Main unit about the size of a textbook: the R1D electronics section measures 2.25 x 6.3 x 8.5 in and weighs under 4 lb. It is connected by a thin cable to a camera about the size of a pocket knife (lens module 0.75 x 3.5 x 1.75 in). Carried in a leather case with a shoulder strap.","io":"Back panel, left to right: battery charger jack, Battery Check button, Normal-Invert switch, and an Input/Output connector for the Visual Display, a Repeater Cable to a second Optacon, or other accessories.","desc":["The Optacon (OPtical-to-TActile-CONverter) lets a blind person read ordinary print by touch, with no braille transcription and no speech. You slide a small camera along a line of print with one hand while the index finger of the other hand rests on a small vibrating pad. The pad forms a moving tactile picture of each letter the camera sees. Because it shows the actual shape of the print rather than recognized characters, it works with any typeface or language, and with drawings and screen layouts.","The main unit is a flat, rectangular box about the size of a textbook. The Model R1D electronics section is about 8.5 in long, 6.3 in deep and 2.25 in high, and weighs less than 4 lb. The museum record lists its materials as leather, steel, plastic and rubber, and one eBay listing describes the unit as black. It lives in a leather case with an adjustable shoulder strap and a flap. A padded vinyl soft-pack with a zipper top and pocket holds the Optacon and its charger, and can be carried by hand, over the shoulder or as a backpack.","The reading surface is on the far right of a compartment in the top of the chassis. It is a concave finger plate with holes in it. Under it are 144 thin metal rods in 24 rows and 6 columns, an area about one fingertip wide. The rods push up through the holes and buzz at 250 to 300 times a second wherever the camera sees black. You lay your index finger flat in the hollow of the plate. The tracking camera and its cable can be stored inside this same compartment in a plastic holder with a clip, with the cable wound around flanges on the holder.","The camera is a small module about 3.5 in long. It has a rectangular nose containing the camera opening, small rollers so it glides along the page, and a rounded barrel end where the cable attaches. A movable zoom (magnification) button on top, on the side opposite the rollers, adjusts for type from 6 to 20 point; an optional F4A magnifier lens reads type down to 4 point. The lens module twists off the retina module so other lens modules can be fitted for reading a typewriter, a CRT screen or a calculator display.","There are four basic controls. On the right side of the front panel are a slide-up On-Off switch and two knobs: Stimulator Intensity, which sets how strongly the rods vibrate, and Threshold, which sets how dark something must be to make the rods vibrate. The camera's zoom button is the fourth. The back panel has the charger jack, a Battery Check button, a Normal-Invert switch for light print on a dark background, and an I/O connector for accessories. Accessories included a Visual Display that shows the same image in lights for a sighted teacher, metal tracking aids that keep the camera straight, and a Portable Line Scanner for practicing tracking. The manual says about 50 hours of instruction teaches the basics, and practice over months can bring reading speed to about 80 words a minute."]},{"id":"optacon2","n":"Optacon II","co":"tsi","cat":"Other","yr":1985,"y":"1985 (developed with Canon)","o":"A redesigned Optacon developed by Telesensory with Canon Inc., with improved packaging and the ability to connect to a computer, so users could read computer screens.","s":{"disp":"100-pin tactile array (reduced from the original 144)","cpu":"No processor is named in TSI or museum descriptions. The Optacon II (1985, built with Canon) is described as having a 100-pin tactile array (down from 144) and a computer interface.","ram":"No memory figure is published. The Optacon converts the camera image to the tactile array directly, with no OCR or text storage (HCI Museum).","tts":"None (tactile output only)","syns":"None. Tactile output only.","price":"No Optacon II list price was found. Related figures: an Optacon bought in 1985 for about $3,000 (optacon-l, model not stated); TSI's Optacon price was $4,495 in the 1990s (NFB-RD list).","used":"No eBay listings for the Optacon II were found."},"pre":["optacon"],"src":["https://en.wikipedia.org/wiki/Optacon","https://interfacemuseum.com/exhibits/optacon-ii/","https://www.freelists.org/post/optacon-l/was-Jim-Blisss-death-Now-Buying-Used-Optacons,1","https://nfbcal.org/nfb-rd/0949.html"],"h":"In 1985 Canon Inc. and Telesensory cooperated on the Optacon II. To lower its cost, the tactile array was cut from 144 pins to 100, and that decision is cited as the reason the Optacon II was not commercially successful. It was discontinued with the rest of the Optacon line in 1996.","desc":["The Optacon II is the second-generation Optacon, made by Telesensory with Canon in 1985. Like the original, it turns print seen by a small handheld camera into a vibrating tactile picture under one fingertip. Its main change was a computer interface for reading what is on a screen.","Its tactile array had 100 pins instead of the original 144. The change was made to cut cost, and sources say it made the device less usable and hurt sales.","Like every Optacon, it has two parts: a small handheld camera probe about the size of a penknife, and a main unit with the tactile pin array, joined by a thin cable. You slide the camera across a line of print with one hand while resting the index finger of the other hand on the array.","Its array is 20 rows by 5 columns of tiny metal rods that vibrate where the camera sees black. As the camera moves, letter shapes flow across your fingertip. Controls have traditionally been minimal: vibration strength, a black/white threshold and a polarity setting.","Canon redesigned the packaging. Special lens modules let the camera read typewriters, calculators and computer screens, and a dedicated computer interface let it read screen text directly. Long-time users largely kept their older 144-pin Optacons."]},{"id":"speechplus","n":"Speech+ talking calculator","co":"tsi","cat":"Other","yr":1976,"y":"1976","o":"A talking calculator with a 24-word vocabulary.","ph":"180 x 115 x 35 mm; 4 AA batteries.","s":{"cpu":"Texas Instruments TMC1007NL (based on the TMS1000 4-bit microcontroller) for calculation; Telesensory S14001A custom speech processor","sto":"4 KB ROM","price":"US$395 (1976); APH Student Speech+ $455 (1978)","ram":"No RAM figure is published. It has a calculator memory register; the TMS1000-based chip handles calculation and the 24-word vocabulary sits in a TSI-programmed ROM (vintagecalculators.com).","syns":"Built-in TSI speech chip with a fixed 24-word vocabulary (S14001A plus speech ROM)","used":"No used or eBay listing surfaced in this research pass (eBay blocks direct page checks).","wt":"500 g (calculator.org); the Computer History Museum records its S1C example at 1 lb","dim":"180 × 115 × 35 mm (7.1 × 4.5 × 1.4 in); APH Student model 4.75 × 7 × 1.125 in","bat":"4 × AA rechargeable (4.8 V)"},"src":["https://www.vintagecalculators.com/html/speech-.html","http://www.vintagecalculators.com/html/speech-.html","https://interfacemuseum.com/exhibits/tsi-speech-plus/","http://www.vintagecalculators.com/html/calculators_for_the_blind.html","https://sites.aph.org/museum-virtual-exhibit/vex3/955E229A-FC96-4E21-ACFE-954356102956.htm","https://www.calculator.org/calculators/TSI_SPEECH_PLUS.html","https://www.computerhistory.org/collections/catalog/102662875"],"h":" Telesensory Systems' Speech+ (model S1A) was the first commercial handheld talking calculator. It went on sale in 1976 at US$395, was distributed through the American Foundation for the Blind, and was covered by Popular Electronics in May 1976. TSI built a custom speech processor to replace about 50 separate chips. APH and TSI made a blue 'APH Student Speech+' (S1D), introduced in 1978 at $455 and discontinued by 1982.","desc":["The Speech+ is a handheld calculator about the size of a thick paperback: 18 cm long, 11.5 cm wide and 3.5 cm thick (about 7 × 4½ × 1½ inches). It has a small loudspeaker and runs on four rechargeable AA batteries.","Near the top is an 8-digit red LED number display. On the top right is a round knob: you pull it out to turn the calculator on, and then turn it to set the volume. When it powers up it says 'clear'.","The number keys use a touch-tone telephone layout, with 1, 2 and 3 across the top and 7, 8 and 9 near the bottom. That is the reverse of most calculators, chosen because blind users already knew phone keypads. Function keys cover the four operations, percent, square root, memory and change sign; the change-sign key says 'times minus'.","Below the equals key is a key with a loudspeaker symbol that speaks the number on the display. Next to it, a slide switch silences the spoken keys, so experienced users can work quietly and still press the speaker key to hear the answer. Pressing a new key cuts off the word being spoken, so fast typing gives a quick staccato of words.","Its operating instructions came on an audio cassette tape instead of paper. The APH Student version looks the same but is blue plastic with black function keys, has large high-contrast key labels for low-vision students, and came with a battery charger."]},{"id":"krm","n":"Kurzweil Reading Machine","co":"kurz","cat":"Other","yr":1976,"y":"Unveiled January 13, 1976","o":"The first print-to-speech reading machine for the blind.","ph":"Processing unit 21 x 21.75 x 31.25 in.","s":{"ram":"64 KB","tts":"Votrax (first generation)","price":"$30,000 to $50,000; NFB's six preproduction units cost $50,000 each","cpu":"A built-in minicomputer of about 250,000 instructions per second; sources searched do not name the model","syns":"Kurzweil's own built-in text-to-speech; read at about 200 words per minute","used":"No used or eBay listing surfaced in this research pass (eBay blocks direct page checks).","dim":"Scanner unit 18⅞ × 11¾ × 19¾ in (Computer History Museum); whole machine 'about the size of a small dishwasher' (NFB)"},"suc":["knfb"],"vo":["votraxvoice"],"src":["https://www.computerhistory.org/collections/catalog/X236.83","https://en.wikipedia.org/wiki/Votrax","https://www.kurzweiltech.com/kcp.html","https://www.afb.org/aw/5/5/14692","https://nfb.org/sites/default/files/images/nfb/publications/bm/bm06/bm0607/bm060703.htm","https://www.computerhistory.org/collections/catalog/102692759","https://mirrors.meulie.net/bitsavers.org/pdf/federalScrewWorks/Votrax_Talking_Points/Votrax_Talking_Points_Vol_2_No_9.pdf"],"h":" Ray Kurzweil built the KRM by combining three inventions: omni-font OCR, the CCD flatbed scanner and text-to-speech. The idea came after a blind man on a plane told him that print was his only real barrier. The prototype was finished in late 1975 and announced with the NFB on January 13, 1976; Walter Cronkite used it to read his sign-off on CBS. NFB scientists asked for no braille labels and for a 'Nominator' key that announces what other keys do. A federal contract placed units at Perkins and in the Boston schools.","desc":["The original Kurzweil Reading Machine is a large, stand-alone machine about the size of a small dishwasher. Its scanner section alone, held by the Computer History Museum, is about 19 inches wide, 12 inches high and 20 inches long.","On top is a glass plate. You place a book, magazine or typed page face down on the glass, as on a photocopier, and close a cover over it.","Inside, a CCD optical scanner driven by the built-in minicomputer finds the first line of print, scans it, then moves to the next line and continues to the end of the page. The machine handles most common typefaces but not handwriting, decorative type or poor printing.","The user controls it from a separate keypad. At NFB's suggestion the keys had no braille labels, and a Nominator key let you press any key to hear what it did. The keypad also controlled reading by word, line or spelling.","The speech came from its own text-to-speech system, a robotic but understandable voice reading about 200 words per minute. The 1976 press release said only basic familiarity with its 'accent' was needed."]},{"id":"knfb","n":"K-NFB Reader","co":"knfb","cat":"Other","yr":2005,"y":"2005","o":"A portable reading machine: a digital camera combined with a PDA.","ph":"6 x 3 x 2.5 in, 15 oz.","s":{"price":"$3,495"},"pre":["krm"],"suc":["knfbm"],"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"knfbm","n":"KNFB Reader Mobile","co":"knfb","cat":"Other","yr":2008,"y":"2008","o":"Reading-machine software for the Nokia N82 phone.","s":{"os":"Symbian (Nokia N82)"},"pre":["knfb"],"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"sara","n":"SARA scanning and reading appliance","co":"fs","cat":"Other","yr":2006,"y":"2006","o":"A stand-alone scanner and reader.","ph":"20 x 12 x 3.5 in, 18 lb.","s":{"sto":"60 GB hard drive"},"src":["https://www.freedomscientific.com","https://support.freedomscientific.com/Content/Documents/Manuals/SARA/SARA_User_Guide.pdf","https://afb.org/aw/6/6/14568"],"desc":["SARA (Scanning and Reading Appliance) is a self-contained desktop reading machine about 20 by 12 inches and 3.5 inches high, weighing about 18 pounds. No computer is needed: it combines a flatbed scanner, text recognition, a RealSpeak speech synthesizer, and front-mounted stereo speakers in one box. It runs from a separate black power adapter, which plugs into the far right socket on the back.","The top holds the scanner lid and a large, colorful keypad with raised symbols. The lid's back edge lifts so it rests level on an open book. Freedom Scientific warns never to press down on the lid, because the glass can break. Put the page face down, close the lid, and press SCAN: a red oval key with a raised circle at the upper left of the keypad. SARA says \"Scanning,\" beeps while it works, and starts reading on its own.","The keypad also has a green READ key to start and pause reading, four blue arrow keys in the center (up and down move by line, left and right by word), a SELECT key, rewind and fast-forward keys, MENU, and a yellow HELP key. Press HELP and then any key to hear what that key does.","The sloping front panel holds more controls. At the far left is a small round green POWER button; press once for on, and press again for a choice between power off (POWER again) and sleep (DOWN ARROW). To its right is an orange VOLUME rocker with a raised loudspeaker shape: press the left end for softer and the right end for louder. Next come four small round function keys you can assign, then a rocker for voice speed. A headset jack sits at the lower right of the front, and there's a CD slot on the front.","USB ports on the back accept thumb drives and external drives. SARA reads OBX, ARK, RTF, TXT, DOC, PDF, HTML and XML files, plays DAISY and audio CDs, and can save scanned books to CD or USB. It can also connect to a computer monitor for large print, or to a braille display. In the box: the unit, a power cord and adapter, a headset, a large-print guide, an audio training recording and a test page."]},{"id":"openbook","n":"OpenBook","co":"ark","cat":"Other","yr":0,"y":"An Arkenstone product. Arkenstone merged with Henter-Joyce and Blazie Engineering in 2000 to form Freedom Scientific, which continued OpenBook (Wikipedia). The first release year was not found.","o":"Arkenstone's PC scanning and reading software, later sold by Freedom Scientific.","src":["https://en.wikipedia.org/wiki/Freedom_Scientific"]},{"id":"trekker","n":"Trekker","co":"visuaide","cat":"Other","yr":2003,"y":"2003 (AccessWorld review, July 2003); version 2.0 reviewed 2004","o":"VisuAide's PDA-based talking GPS for blind travelers.","suc":["breeze"],"src":["https://afb.org/aw/6/6/14572","https://afb.org/aw/4/4/14834","https://afb.org/aw/5/6/14675"],"desc":["The Trekker is not one box but four parts worn together on a strap around the neck: an off-the-shelf pocket PC (PDA), a GPS receiver, a speaker and a battery pack. The set weighs 1.3 pounds.","The PDA is the part you work with. Static stencils came with it to use as a braille keyboard on the PDA. The on/off button sits above the screen, but it gives no sound to confirm the PDA is off.","Trekker's own controls are a large oval Navigation key that works as a four-way cursor cross, with two round buttons on each side. To its right are Enter, which starts Trekker, opens menus and answers questions, and Where Am I?. To its left are Escape and the Mode button, which switches between reading and browsing.","On the left side of the PDA is the Record button, which uses its built-in microphone to record your own points of interest. Trekker talks using the Eloquence synthesizer.","In the box were a PDA charger and cradle, styli, the keyboard stencils and a user guide. Reviewers warned that pieces, such as the speaker cable, could come apart easily."],"h":" AccessWorld reviewed the first version in July 2003. It announced streets, intersections about 30 feet ahead and points of interest from a commercial database, and could record your own landmarks, but it could not tell your direction, plan routes or change speech rate. Version 2.0 added an adjustable speech rate and route planning and following, and its case and strap hooks were sturdier. The off-the-shelf PDA kept the price down, but it gave no sign of whether the PDA was off and draining its battery.","s":{"price":"$1,595","wt":"1.3 lb (600 g)","out":"Eloquence speech"}},{"id":"breeze","n":"Trekker Breeze","co":"hw","cat":"Other","yr":2008,"y":"2008","o":"A handheld, all-in-one talking GPS.","ph":"129 x 60 x 29 mm, 200 g.","s":{"cpu":"SiRF III GPS","bat":"Lithium-ion polymer, replaceable; about 8 hours, 5-hour charge","price":"$929 including one regional map (AccessWorld 2012); €799 in France","dim":"129 × 60 × 29 mm","wt":"About 8 oz (AccessWorld); 240 g in its case (CERTAM)"},"pre":["trekker"],"suc":["trek"],"src":["https://afb.org/aw/6/6/14572","https://afb.org/aw/10/2/16127","https://afb.org/aw/13/1/15891","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/trekker-breeze-navigateur-gps-de-humanware"],"desc":["The Trekker Breeze is a handheld talking GPS from HumanWare. AccessWorld compared it to a chubby TV remote. It is 129 by 60 by 29 millimeters and weighs about 8 ounces. It came in a leather case with a belt clip, a shoulder strap, and a small external speaker with a clip.","The face has nine large buttons in three rows of three, each a different shape and color and easy to tell apart by touch. Above them, at the top left, is a microphone for recording landmark names, and at the top right is the built-in speaker.","The top row has Information, then a large orange circular Where Am I button in the middle, then Repeat. The middle row has the Left arrow, Confirm and the Right arrow. The bottom row has Explore, Record and Go To.","The left side has a volume thumb wheel, the SD card slot and the USB connector, under a protective flap. The right side has the power switch and a Reset button, and the power connector at the lower right under a rubber flap. The jack for the external speaker is in the middle of the rounded top edge.","The battery compartment is on the back. A lanyard attaches at the base. It beeps once at power-on and twice at power-off, and says \"Initializing Breeze\" with the battery level."],"h":" AccessWorld reviewed it in March 2009. HumanWare had heard from users and mobility instructors that existing GPS products were too complicated, and that many Trekker owners only used Where Am I and their own recorded landmarks. So the Breeze has 9 buttons instead of the Trekker's 39 and no keypad for typing destinations: you must visit and record a landmark before it can guide you there. Leader Dogs for the Blind helped shape it. It finds satellites in about two to three minutes and describes intersections about 30 feet ahead."},{"id":"sam","n":"S.A.M. (Software Automatic Mouth)","co":"dontask","cat":"TTS Voices","yr":1982,"y":"1982 (reviewed in Antic, October 1982)","o":"One of the first commercial all-software speech synthesizers, written by Mark Barton. It needed no extra hardware on the Atari and cost $59.95 for the Atari version.","h":"The Apple II version came with an expansion card holding an 8-bit DAC; the Atari version used the POKEY chip; the Commodore 64 used the SID chip's 4-bit volume DAC and blanked the screen while speaking (a 'light' mode kept it on but made the voice gravelly). Input could be plain text, converted by the RECITER rules, or about 50 ASCII phoneme codes such as IY, AE and NX with stress digits 1 to 8. S.A.M. was the basis of the original MacinTalk.","s":{"syn":"All-software phoneme synthesis; RECITER rule-based text-to-phoneme","plat":"Apple II, Lisa, Atari 8-bit, Commodore 64","def":"No named presets are documented; sources describe a single SAM voice with adjustable speed and pitch settings","price":"$59.95 (Atari version)"},"suc":["mt1984"],"src":["https://en.wikipedia.org/wiki/Software_Automatic_Mouth"]},{"id":"pico","n":"SVOX Pico (Android)","co":"svox","cat":"TTS Voices","yr":2009,"y":"September 2009 (Android 1.6 Donut)","o":"The SVOX Pico engine, Android's first built-in text-to-speech.","h":"Shipped with Android 1.6 Donut and spoke US and UK English, French, German, Italian and Spanish. SVOX announced Pico as a small-footprint engine first released for Symbian, in British English and German. It needs under 400 KB of ROM per engine (plus 400 KB per language and 500 KB per voice) and under 250 KB of RAM on an ARM9-class processor.","s":{"syn":"HMM-based statistical parametric synthesis (SVOX)","plat":"Android 1.6 and later","def":"Android's built-in engine from 1.6"},"suc":["gtts"],"src":["https://android-developers.googleblog.com/2009/09/introduction-to-text-to-speech-in.html","https://www.speechtechmag.com/Articles/ReadArticle.aspx?ArticleID=51509","https://www.dre.vanderbilt.edu/~schmidt/android/android-4.0/external/svox/pico_resources/docs/SVOX_Pico_Manual.pdf"]},{"id":"gtts","n":"Google Text-to-Speech (Speech Services by Google)","co":"google","cat":"TTS Voices","yr":2013,"y":"October 2013 on Google Play (reported November 6, 2013)","o":"Google's Android speech engine, delivered as a Play Store app so voices can update without a new Android release. It speaks for TalkBack, Google Play Books and Google Translate.","s":{"syn":"Google does not publish the on-device technique. Google's WaveNet powers Assistant and Cloud voices, and its WaveRNN model was designed to run on phones; on Wear OS Google uses small ML prosody models.","plat":"Android; current versions need Android 8 or later","def":"Used by TalkBack, Play Books and Translate"},"pre":["pico"],"src":["https://en.wikipedia.org/wiki/Google_Text-to-Speech","https://www.androidpolice.com/2013/11/06/new-app-google-text-to-speech-arrives-in-the-play-store-paves-way-for-future-updates-fixes-awful-default-voices-on-note-3-and-others/","https://www.theverge.com/2013/11/7/5077034/google-brings-android-text-to-speech-to-google-play","https://9to5google.com/2021/11/09/speech-services-by-google-reaches-10-billion-play-store-downloads/","https://deepmind.google/research/wavenet/","https://android-developers.googleblog.com/2024/03/introducing-new-text-to-speech-engine-wear-os.html"],"h":" Android Police noted the Play Store app could replace the weak default voices on phones such as the Galaxy Note 3. The app was later renamed Speech Services by Google (Speech Recognition and Synthesis), which passed 10 billion Play Store downloads in November 2021."},{"id":"wavenet","n":"WaveNet voices (Google)","co":"google","cat":"TTS Voices","yr":2017,"y":"October 4, 2017 (Google Assistant)","o":"DeepMind's neural model that generates raw audio waveforms, used for the Google Assistant's US English and Japanese voices from October 2017 and in Google Cloud Text-to-Speech.","h":"The production version generated 24,000 samples a second at 16-bit, 1,000 times faster than the original research model. In listening tests the new US English voice scored a mean opinion score of 4.347, against 4.667 for human speech. Google had bought DeepMind in 2014.","s":{"syn":"Neural network generating the raw waveform","plat":"Google Assistant; Google Cloud Text-to-Speech","def":"Google Assistant US English and Japanese (2017)"},"pre":["gtts"],"src":["https://deepmind.google/blog/wavenet-launches-in-the-google-assistant/","https://www.androidpolice.com/2017/10/09/google-assistant-now-sounds-natural-thanks-deepminds-wavenet-technology/"]},{"id":"siri2011","n":"Siri original voices","co":"apple","cat":"TTS Voices","yr":2011,"y":"October 14, 2011 (iPhone 4S)","o":"Siri's first voices: Susan Bennett for US English (recorded in July 2005), Jon Briggs for UK English and Karen Jacobsen for Australian English.","h":"A male voice option arrived in June 2013. Siri itself began as a spin-out of SRI International's Artificial Intelligence Center and the DARPA-funded CALO project, co-founded by Dag Kittlaus, Tom Gruber and Adam Cheyer. Nuance supplied its speech recognition. The voice actors recorded around 2005 without knowing how the recordings would be used; Briggs told The Guardian the original system was recorded for a US company called ScanSoft, \"who were then bought by Nuance.\" Bennett revealed her role in October 2013, and audio forensics expert Ed Primeau confirmed it. Most countries started with a female voice only (the UK, France and the Netherlands started male). In June 2013 Apple announced a gender option adding a counterpart voice, and with iOS 11 (2017) it replaced the voices with new deep-learning ones built from hours of recordings of newly auditioned talent.","s":{"syn":"Unit selection (Apple says it moved Siri to deep-learning-based voices starting in iOS 10)","plat":"iOS 5 and later (iPhone 4S)","def":"Siri"},"suc":["siri2017"],"src":["https://en.wikipedia.org/wiki/Siri","https://machinelearning.apple.com/research/siri-voices"]},{"id":"siri2017","n":"Siri deep-learning voices (iOS 11)","co":"apple","cat":"TTS Voices","yr":2017,"y":"2017 (iOS 11)","o":"iOS 11 gave Siri new voices produced with deep learning.","s":{"syn":"Deep learning","plat":"iOS 11 and later","def":"Siri"},"pre":["siri2011"],"suc":["siri2021"],"src":["https://en.wikipedia.org/wiki/Siri","https://machinelearning.apple.com/research/siri-voices","https://www.isca-archive.org/interspeech_2017/capes17_interspeech.pdf"],"h":" Apple's Machine Learning Journal (August 6, 2017) says Siri voices have been based on deep learning since iOS 10. iOS 11 used on-device deep mixture density networks to guide hybrid unit selection, from a new US English voice talent recorded for over 20 hours. The system was presented at Interspeech 2017."},{"id":"siri2021","n":"Siri voices (iOS 14.5)","co":"apple","cat":"TTS Voices","yr":2021,"y":"April 2021 (iOS 14.5)","o":"iOS 14.5 added two American English voices. The four US voices are labeled Voice 1 to Voice 4, and Siri no longer has a default voice: users choose one at setup.","s":{"syn":"Apple Neural TTS built from recorded voice talent","plat":"iOS 14.5 and later","def":"None; chosen at setup"},"pre":["siri2017"],"suc":["siriquinn"],"src":["https://arstechnica.com/gadgets/2021/04/apple-releases-ios-14-5-the-biggest-update-since-ios-14-first-launched/","https://9to5mac.com/2021/03/31/hands-on-ios-14-5-beta-6-changes-features-siri-battery-recalibration-tool-video/","https://www.macworld.com/article/331864/ios-14-5-features-airtags-siri-unlock-with-apple-watch-how-to-install.html","https://www.apple.com/newsroom/2021/04/ios-14-5-offers-unlock-iphone-with-apple-watch-diverse-siri-voices-and-more/","https://en.wikipedia.org/wiki/Siri"],"h":" Apple's April 2021 announcement said Siri would no longer default to a female voice; users pick a voice when setting up the device. Apple announced the change on March 31, 2021, saying Siri would no longer default to a female or male voice. Wikipedia notes earlier criticism of the default, such as The Conversation's argument that a soft female default voice reinforced women's roles as secondary. In February 2022 Apple added a fifth US option, Quinn, its first gender-neutral voice."},{"id":"siriquinn","n":"Siri Voice 5 (Quinn)","co":"apple","cat":"TTS Voices","yr":2022,"y":"February 2022 (iOS 15.4 beta)","o":"A gender-neutral American English Siri voice, nicknamed Quinn.","s":{"syn":"Apple has not described Voice 5's technique. Apple's machine-learning papers describe the iOS 11-era Siri voices as deep-learning-guided unit selection.","plat":"iOS 15.4 and later","def":"Optional"},"pre":["siri2021"],"src":["https://en.wikipedia.org/wiki/Siri","https://techcrunch.com/2022/02/24/siri-gains-a-new-gender-neutral-voice-option-in-latest-ios-update/","https://www.theverge.com/2022/2/23/22947150/ios-15-4-quinn-siri-voice-5-american","https://machinelearning.apple.com/research/siri-voices"],"h":" It appeared as 'Voice 5' in the iOS 15.4 beta in February 2022. Apple said it was recorded by a member of the LGBTQ+ community. iOS 15.4 shipped March 14, 2022."},{"id":"maestro","n":"VisuAide Maestro","co":"visuaide","cat":"PDAs","yr":2004,"y":"2004 (reported July 1, 2004)","o":"VisuAide's accessible Pocket PC: an HP iPAQ h4150 with text-to-speech and a tactile keypad overlay on the touchscreen.","f":["Tactile keypad overlay on the touchscreen","Text-to-speech","Bluetooth and Wi-Fi","Optional braille keyboard"],"io":"Bluetooth, Wi-Fi","s":{"os":"Pocket PC","tts":"Text-to-speech on the HP iPAQ h4150; Engadget and AccessWorld do not name the engine"},"src":["https://www.engadget.com/2004-07-01-the-maestro-visuaides-pocket-pc-for-the-blind.html","https://afb.org/aw/6/4/14610"]},{"id":"bplus18","n":"Braille Plus 18","co":"aph","cat":"PDAs","yr":2012,"y":"2012 to February 2015 (discontinued)","o":"APH's Android device with an 18-cell, 8-dot braille display, billed as the world's first Android smartphone designed for blind students and professionals.","ph":"Under 6.5 x 4.1 in and just over 1 in thick.","f":["18-cell 8-dot braille display","5 MP camera","GPS, Wi-Fi and 3G"],"io":"SD card, USB","s":{"os":"Android","disp":"18 cells, 8-dot","bat":"4 to 6 hours to charge; about a full day of use","price":"$3,599 (2012)"},"h":"The FCC honored it for innovation in communications technology in 2014. APH discontinued it in February 2015.","pre":["brplus"],"src":["https://tech.aph.org/plus_doc.htm","http://nfbnet.org/pipermail/nfbmi-talk_nfbnet.org/2012-October/008078.html","https://thedotexperience.pastperfectonline.com/Webobject/B4C197A5-6F06-4D35-BDA9-045150994936","https://sites.aph.org/pr/20140611-fcc-honors-american-printing-house-for-the-blinds-braille-plus-18-for-innovation-in-communications-technology/"]},{"id":"vinux","n":"Vinux","co":"linuxcommunity","cat":"Accessible Linux","yr":2008,"y":"2008 to January 18, 2017 (discontinued)","o":"An Ubuntu remaster for blind and visually impaired users by Tony Sales of RNC Hereford. It began as Vibuntu and was renamed Vinux in January 2009.","f":["Orca screen reader","Speakup console speech","Compiz magnifier","USB braille display support"],"h":"Releases include 1.4 (March 2009), 1.5 (May 2009), 2.0 (September 2009), 3.0 (listed on DistroWatch on June 1, 2010) and 5.1 (January 18, 2017), the last. Tony Sales of technical support at the Royal National College for the Blind in Hereford, UK, began Vinux in 2008. It was a remastered Ubuntu with the Orca and Speakup screen readers, Compiz magnification, global font size and color changes, and automatic support for USB braille displays in grade 1 and 2. It could run live from a CD or USB stick or be installed. DistroWatch first listed it on June 1, 2010, as Vinux 3.0.","s":{"os":"Ubuntu-based"},"src":["https://en.wikipedia.org/wiki/Vinux","https://lists.gnome.org/archives/gnome-accessibility-list/2009-March/msg00052.html"]},{"id":"sonar","n":"Sonar GNU/Linux","co":"linuxcommunity","cat":"Accessible Linux","yr":2013,"y":"April 2013 (Sonar 13.04) to 2017","o":"A Manjaro-based accessible distribution offered in three editions.","s":{"os":"Manjaro-based"},"src":["https://opensource.com/life/15/8/accessibility-linux-blind-disabled","https://www.pcworld.com/article/456724/new-linux-distro-will-target-disabled-users.html","https://lists.gnome.org/archives/orca-list/2013-April/msg00214.html","https://mail.gnome.org/archives/orca-list/2014-July/msg00182.html","https://lists.ubuntu.com/archives/ubuntu-accessibility/2017-March/007282.html"],"h":" Developer Jonathan Nadeau, blind since a 1992 car accident, launched the Sonar Project on Indiegogo in early 2013, seeking $20,000 to build a free, Ubuntu-based Linux distribution for blind, low-vision, dyslexic and motor-impaired users. PCWorld noted on February 4, 2013 that it had raised $2,385. Sonar 13.04 was announced on the Orca list in April 2013, and Sonar 2014 in July 2014. In March 2017 Sonar GNU/Linux merged with Vinux."},{"id":"talkingarch","n":"Talking Arch","co":"linuxcommunity","cat":"Accessible Linux","yr":0,"y":"Last release October 3, 2017","o":"A speech- and braille-enabled Arch Linux live image with no graphical installer.","s":{"os":"Arch Linux"},"src":["https://opensource.com/life/15/8/accessibility-linux-blind-disabled","https://unix.stackexchange.com/questions/542098","https://archiveos.org/talkingarch/"],"h":" TalkingArch began as Chris Brannon's personal project to make installing Arch Linux with speech easier. With community help and the Archiso tooling, it grew into an unofficial modified Arch install and live image with speech and braille support, also used for rescue and recovery. It aimed to stay as consistent as possible with the official Arch image. ArchiveOS lists New Zealand as its origin, a text-only (CLI) environment, x86_64, and a last release dated October 3, 2017."},{"id":"oralux","n":"Oralux","co":"linuxcommunity","cat":"Accessible Linux","yr":2003,"y":"July 3, 2003 (0.03)","o":"A Knoppix-based live CD with an audio desktop for blind users.","s":{"os":"Knoppix (Debian) live CD"},"src":["https://lwn.net/Articles/39195/","https://lwn.net/Articles/45329/","https://lwn.net/Articles/52826/"],"h":" Oralux was announced in mid-2003 as a Knoppix-based live CD for blind and visually impaired users, so it ran straight from CD with no installation. LWN described it in August 2003: a crowing rooster at startup let you set the volume, then you chose a language (English only in version 0.04, using Flite), a keyboard and, optionally, DECtalk. Version 0.05 (October 2003) moved to Knoppix 3.3 and added Emacspeak with Festival and MBROLA for English or French, optional Spanish and German DECtalk files, and a startup menu in four languages."},{"id":"adriane","n":"ADRIANE (Knoppix)","co":"linuxcommunity","cat":"Accessible Linux","yr":2007,"y":"2007 (presented June 2007; part of KNOPPIX since 5.3)","o":"Klaus Knopper's talking desktop with optional braille, started by typing 'adriane' at the KNOPPIX boot prompt.","f":["SBL braille and screen reader","speech-dispatcher with eSpeak","Orca and Compiz in graphics mode","GPLv2"],"s":{"os":"KNOPPIX (Debian-based)"},"src":["https://www.knopper.net/knoppix-adriane/index-en.html","https://knopper.net/knoppix/knoppix741-en.html","https://knopper.net/knoppix-adriane/index-en.html","https://winfuture.de/news,30673.html","https://ress.at/linux-fuer-blinde-aber-nicht-nur-news04062007151257.html"],"h":" ADRIANE (Audio Desktop Reference Implementation and Networking Environment) is a talking desktop by Knoppix creator Klaus Knopper, named after his wife Adriane, who lost her sight at 15 and helped develop it. Knopper announced it at CeBIT in March 2007 for release that April, aimed at beginners as well as blind users, and it was presented at the end of Linuxwochen Vienna in June 2007. Simple menus are driven with the arrow keys and Enter, with Caps Lock used for speech functions, giving easy access to email, the web, SMS and scanning printed documents, with optional braille. It uses the SBL screen reader by Marco Skambraks and Halim Sahin with speech-dispatcher and eSpeak, and works with Orca in graphical mode. It has been part of KNOPPIX since version 5.3: the boot option 'adriane' starts it with speech."},{"id":"nuepro3","n":"NuEyes Pro 3","co":"nueyes","cat":"Vision Wearables","yr":2020,"y":"Announced December 15, 2020","o":"NuEyes' augmented-reality smart glasses for low vision, medical and training use.","ph":"Tethered glasses weighing 88 g.","f":["4K displays","51-degree field of view","Three versions; the first tethers to a NuEyes controller with dual 6DoF cameras and a forward-facing 20 MP camera"],"s":{"disp":"Dual 4K displays, about 51–52° field of view","wt":"88 g","price":"£3,995 (UK retailer)"},"pre":["nueasy"],"suc":["nuepro4"],"src":["https://www.nueyes.com/nueyes-announces-new-pro-3-augmented-reality-smart-glass-solution","https://www.prnewswire.com/news-releases/nueyes-technologies-announces-new-pro-3-augmented-reality-smart-glass-solution-301192660.html","https://www.visionaid.co.uk/nueyes-pro-3"],"desc":["The NuEyes Pro 3, announced December 15, 2020, is a lightweight black binocular augmented-reality headset weighing 88 g. It is tethered by cable, with no built-in battery mentioned.","It has two 4K displays with a wide field of view of about 51 to 52 degrees.","The main version connects to a proprietary controller with two motion-tracking cameras and a forward-facing 20-megapixel camera.","The Pro 3-C version has a 5-megapixel camera and a USB-C plug for phones, tablets and laptops that output video. A third version is for thermal imaging.","It went on sale December 18, 2020. A UK retailer listed it at £3,995."]},{"id":"blazeez","n":"Blaze EZ","co":"hims","cat":"Book Readers","yr":2014,"y":"2014","o":"A HIMS book player in the Blaze line. HIMS lists the Blaze EZ (2014) under 'DAISY Player and OCR Multi Player' in its product history, between the BookSense XT (2009) and the Blaze ET (2015).","src":["https://www.himsintl.com/en/company/prd_history.php","https://lssproducts.com/content/251076.pdf","https://www.sightandsound.co.uk/a-review-of-the-hims-blaze-ez-by-jackie-brown/","https://www.bapingroup.com/blaze-ez.html"],"desc":["The Blaze EZ is a pocket book player and reader from HIMS, about the size and shape of a smartphone. Its manual gives it as 59.3 millimeters wide, 116.9 long and 16.4 thick, and 118 grams; a reviewer weighed it at 138 grams. The case is white, with contrasting color on the Power, Media, Radio and Books buttons.","Hold it keypad up. At the top center is a slightly recessed square Power button, with a stereo speaker grille on each side. Below and to the left is a round Record button. Below that is a row of three square buttons with braille letters: M for Music or Media, R for Radio and B for Books.","Below them is a circular navigation pad of Up, Down, Left and Right with a small round Select button in the middle. Below that are three buttons: a square Cancel on the left, a small dot-like Explorer button in the middle, and a square OCR button marked with braille O on the right. At the very bottom are two status lights on the left and the microphone on the right.","The left side has the SD card slot in its lower part. The right side has a rotary volume control, a control for speed and voice guidance, and a lock key. The bottom edge has the headphone socket, the micro-USB charging port and a line-in socket. A small hole in the center of the top edge takes the lanyard.","On the back, near the top, is the camera lens. A removable cover on the back hides the flat rectangular battery. An accessory pack added a stand for OCR, a spare battery and charger, a remote and a charging cradle."],"h":" Model T70EZ. Similar in size to its predecessor, the BookSense, but with fewer keys, it added a built-in camera for one-button OCR. It plays DAISY, NLS, Bookshare and Learning Ally books, music and podcasts, and has an FM radio and recorder. Jackie Brown's review for Sight and Sound found a 4.5-hour charge gave about 17 hours of use, liked the sound, but missed a phone-style keypad like the Victor Reader Stream's.","s":{"dim":"116.9 × 59.3 × 16.4 mm (manual); 4.59 × 2.31 × 0.64 in","wt":"118 g (manual); 138 g (Sight and Sound review)","sto":"16 GB (about 12 GB free)","io":"Micro-USB, SD slot, headphone, line-in, Wi-Fi b/g/n, Bluetooth","price":"$595 (BAPIN Group listing)"}},{"id":"blazeet","n":"Blaze ET","co":"hims","cat":"Book Readers","yr":2015,"y":"2015","o":"A HIMS book player in the Blaze line. HIMS lists the Blaze ET (2015) under 'DAISY Player and OCR Multi Player' in its product history, after the Blaze EZ (2014) and before the SensePlayer OCR (2023).","pre":["blazeez"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/lecteur-multimedias-machine-lire-de-poche-blaze-et"],"desc":["The Blaze ET is a pocket book player and reader from HIMS, close to the size of a mobile phone: 116 by 58 by 16 millimeters, and 136 grams with its battery. It has no screen; small lights show battery, Wi-Fi and Bluetooth status.","At the top of the front are grilles over the stereo speakers, with the Power button between them. A long press of about four seconds turns it on or off, and a short press gives the date and time. Below are three keys, left to right: Info, Home and OCR.","In the middle is a five-key pad of four arrows around an OK key. Just below are three keys: Cancel, Menu and Review, which repeats the last announcement. The lower part of the front is a number keypad. A long press of the star key starts a key describer.","The left side has, from top to bottom, a voice-control key that chooses what to adjust, plus and minus keys, and the SD card slot. The right side has the Record key, a key-lock slider and a reset hole. The bottom edge has, from left to right, a 3.5 mm headphone jack, a micro-USB port for charging and file transfer, and a 3.5 mm jack for an external microphone or line-in.","The top edge has the lanyard attachment. On the back, the camera lens is in the middle near the top, and the battery compartment covers about three quarters of the back."],"h":" Made by the Korean company HIMS in partnership with Visiole. The French CERTAM evaluation (published December 16, 2016) gives a French release date of February 2016. It differs from the Blaze EZ mainly by its number keypad, which adds navigation and text entry. It has 28 keys in all. Features include DAISY and media playback, podcasts and web radio, recording in MP3, WAV or DAISY, an FM radio, OCR with the camera, color detection, a calculator and alarms.","s":{"dim":"116 × 58 × 16 mm","wt":"136 g with battery","bat":"Lithium polymer 3.7 V, 2,050 mAh, removable; 13 hours; 3-hour charge (4 from a computer); spare battery included","cam":"5 MP","price":"€990; €1,180 with the Premium pack (France, 2016)","tts":"Acapela"}},{"id":"senseplayer","n":"SensePlayer OCR","co":"hims","cat":"Book Readers","yr":2023,"y":"2023","o":"A HIMS player with OCR. HIMS lists the SensePlayer OCR (2023) as its latest 'DAISY Player and OCR Multi Player', following the Blaze ET (2015).","src":["https://www.himsintl.com/en/company/prd_history.php","https://nfb.org/blog/access-tech-review-hims-sense-player","https://himsintl.com/en/daisyplayer/view.php?idx=12"],"desc":["The SensePlayer is a thin rectangular book and media player from HIMS, about 64 by 130 millimeters and 14.5 millimeters thick, weighing about 140 grams.","Most of the front is a 12-key telephone-style keypad. Above it is a ring of four direction buttons with a confirm button in the center, and four more function keys around them. Stereo speakers run along the top and bottom edges of the front.","The top row of keys has two distinct clicks: a short press, and a deeper press you can also hold. These keys switch between modes, manage Wi-Fi and Bluetooth, and open Smart Connect. A short press usually announces a status, a deep press toggles it, and a long press opens its settings.","The left edge has a Record button at the top, then a mode button, two volume buttons and a microSD slot. The mode button changes what the volume buttons adjust, such as voice speed or the music equalizer. The right edge has the power button and a key-lock switch. The bottom edge has the headphone jack on the left and the USB-C port on the right.","On the back is a lanyard loop at the top. On the OCR version, the camera is directly below the loop. The rest of the back is the cover over the removable battery."],"h":" Sold in a standard version and a slightly dearer OCR version with a camera. It plays music, DAISY books, documents, podcasts and internet radio, and can install a limited selection of Android apps such as Audible, BARD Mobile and Netflix. Its Smart Connect mode turns it into a Bluetooth keypad for an iPhone or Android phone, for navigating, typing, calling and media control. The NFB's review found the OCR good but not better than phone apps such as Seeing AI or Lookout, and found Smart Connect sometimes slow to reconnect.","s":{"dim":"About 64 × 130 × 14.5 mm","wt":"About 140 g","bat":"Li-polymer 3.8 V, 2,300 mAh (8.74 Wh); removable","io":"USB-C, 4-pole earphone jack, microSD, Wi-Fi, Bluetooth","cam":"13 MP with LED flash (OCR model)"}},{"id":"govision","n":"GoVision","co":"hims","cat":"Magnifiers","yr":2016,"y":"2016","o":"A HIMS video magnifier. HIMS lists GoVision (2016) under 'Low Vision Digital Magnifier' in its product history.","suc":["govisionpro"],"src":["https://www.himsintl.com/en/company/prd_history.php"]},{"id":"govisionpro","n":"GoVision Pro","co":"hims","cat":"Magnifiers","yr":2018,"y":"2018","o":"A later GoVision model. HIMS lists GoVision Pro (2018) under 'Low Vision Digital Magnifier', after GoVision (2016) and before GoVision Move (2026).","pre":["govision"],"src":["https://www.himsintl.com/en/company/prd_history.php"]},{"id":"bns640","n":"Braille 'n Speak 640","co":"blazie","cat":"Notetakers","yr":1991,"y":"October 1991","o":"A higher-capacity Braille 'n Speak with more storage, a smart calendar and the ability to run third-party programs.","s":{"ram":"640K file memory, 256K program memory (APH unit)","tts":"Built-in Blazie speech","bat":"Built-in rechargeable","cpu":"Processor model not named in Blazie literature. The 640 is described only as a 'souped up' Braille 'n Speak with 640 KB of RAM (Raised Dot Computing Newsletter, Nov–Dec 1991).","syns":"Built-in Blazie speech only","price":"$1,300 new, or $500 with a trade-in of an older Braille 'n Speak (Raised Dot Computing Newsletter, Nov–Dec 1991)","used":"No current eBay listings or eBay sold prices for complete units were found. Blind Bargains has posted eBay finds of a likely-working Braille 'n Speak for $59.97 and units starting at $50 (dates not given)."},"ph":"About 4.1 x 4.1 x 0.9 inches (APH museum unit); sand-colored plastic case with seven braille keys.","io":"Serial port, disk-drive port, earphone jack, power jack.","h":"Blazie Engineering introduced it in October 1991, with more storage and room for added features, including third-party programs written by outside developers. Owners of older units could get hardware upgrades. One owner reported upgrading an original unit into a '640 with super flash, and double speed'.","pre":["bns"],"suc":["bns2000"],"src":["https://www.blazietech.com/post/from-braille-n-speak-to-bt-speak-a-personal-reflection","https://sites.aph.org/museum-virtual-exhibit/vex2/2AEEBF8E-D463-4207-AA5A-417408112058.htm","https://www.blindbargains.com/ebay.php?num=6","https://www.duxburysystems.org/downloads/library/news/new93.htm","https://support.freedomscientific.com/Content/Documents/Manuals/Legacy/Braille_N_SpeakDocs/Braille_N_Speak_UserMan.txt"],"desc":["The Braille 'n Speak 640 is the 1991 successor to the original Braille 'n Speak, named for its 640K of file memory. Blazie introduced it in October 1991. It could run third-party programs written by outside developers.","The APH museum unit measures about 4.1 x 4.1 x 0.9 in and has a sand-colored plastic case with seven braille keys (six dot keys and a space bar) in Perkins order. Like every Braille 'n Speak it has no braille display; it speaks.","Like the original it combined a notetaker, Grade 2 braille-to-print translator, clock, calendar, phone book and calculator. It could also connect to a computer as a terminal or speech synthesizer. Blazie's Braille 'n Speak user manual (Freedom Scientific legacy edition, which refers to the 12-volt charger of later units) describes the layout for Braille 'n Speak units generally. With the space bar toward you, the on/off rocker switch is about halfway back on the right side; rock it away from you for on. Just behind it is an earphone jack that can also feed an external speaker or a tape recorder. On the left side is an indented rectangular opening holding two identical round DIN serial ports, with the AC power and charger jack behind it.","On the right side are the earphone jack and a switch; on the left are the power jack and serial and disk-drive ports. The speaker is on top at the right, and black rubber rests are on the bottom (APH museum unit, model BS2).","APH added the 640 to its catalog in 1996, though not on quota. The museum unit has 640K of file memory, 256K of program memory and a built-in rechargeable battery."]},{"id":"bnsscholar","n":"Braille 'n Speak Scholar","co":"blazie","cat":"Notetakers","yr":2000,"y":"Spring 2000 (APH catalog) to 2004","o":"A student version of the Braille 'n Speak sold through APH, with seven-key braille input and speech output.","s":{"tts":"DoubleTalk speech","price":"$1,140 for the upgraded model (APH 1-07320-01, 2004); listed at $1,249 in 2006, then discounted to $800 for the next 400 units","io":"Serial port (8-pin mini-DIN; PC cable 9-pin female to mini-DIN 8 male)"},"h":"APH listed it from spring 2000 until 2004 (APH catalog number 1-07309-01). In September 2004 APH sent its entire stock back to Freedom Scientific to upgrade it with higher-quality DoubleTalk speech, better PC formatting and printing and a better appointment book. The upgraded model got the new catalog number 1-07320-01 and a $1,140 price, and existing owners were offered an upgrade for about $425. In October 2006 APH cut the price from $1,249 to $800 for the next 400 units ordered.","src":["https://sites.aph.org/museum-virtual-exhibit/vex2/2AEEBF8E-D463-4207-AA5A-417408112058.htm","https://aphmuseum.org/record/braille-n-speak-scholar-3/","https://sites.aph.org/news/september-2004/","https://sites.aph.org/news/october-2006/","https://sites.aph.org/news/june-2007/","https://sites.aph.org/news/february-2007/"],"desc":["The Braille 'n Speak Scholar is a student version of Blazie's Braille 'n Speak pocket notetaker, sold through the American Printing House for the Blind (APH) in partnership with Freedom Scientific. APH recommended it for ages 8 and up and described it as an entry-level notetaker, with a simpler interface for first-time users.","Like the Braille 'n Speak it is based on, the Scholar has no braille display. You type on a seven-key braille-style keyboard: six dot keys plus a space bar, laid out like a Perkins braillewriter. Everything is spoken back through a built-in speaker or an earphone. After the 2004 upgrade the voice was DoubleTalk speech.","Built-in tools include a word processor with file organizing, a braille-to-print back translator for printing in braille or print, and a talking clock. There is also a countdown timer, a stopwatch, a phone directory, a calendar, an appointment book and a scientific graphing calculator.","It connects to a PC through a serial cable. The cable has a 9-pin female plug at the PC end and an 8-pin mini-DIN plug at the Scholar end, so the port on the unit is a small round mini-DIN socket. APH sold parallel-printer and ImageWriter cables separately.","In the box were a soft leather carrying case, a battery charger/AC adapter, an earphone, the serial cable, braille and print reference manuals, a cassette tutorial with demos, a longer manual on CD-ROM, WinDisc and WinPrint software and a one-year warranty. APH product photos show students seated at a table, with their hands on the seven-key keyboard or listening through earphones."]},{"id":"blazer","n":"Braille Blazer","co":"blazie","cat":"Embossers","yr":1990,"y":"1990","o":"A portable single-sided braille embosser with built-in speech that could also act as a Braille 'n Speak-style speech synthesizer for screen readers.","s":{"tts":"Built-in synthesizer (emulates a Braille 'n Speak)","disp":"34 cells per line, 27 lines per page; 15 characters per second","price":"About $1,700 (1990); $1,695 (1994)"},"ph":"About 12 to 14 lb; 14.75 x 9.5 x 5 in (1994 NFB evaluation). Paper up to 8.5 in wide, tractor feed.","io":"Serial and parallel ports, earphone jack.","h":"Invented by Deane Blazie and Tim Cranmer. Later sold by Freedom Scientific.","src":["https://www.csmonitor.com/1990/0313/d1eka1.html","https://www.duxburysystems.org/downloads/library/history/00-nfb1994-tech-eval.pdf","https://afb.org/aw/3/6/14896"]},{"id":"romeo25","n":"Romeo RB-25 (Romeo 25)","co":"et","cat":"Embossers","yr":0,"y":"In use by 2006, per an Enabling Technologies brochure. The introduction year was not found.","o":"A rugged single-sided tractor-feed embosser at 25 characters per second.","s":{"disp":"40-character line, 25 characters per second, about 85 pages per hour; 6- or 8-dot braille; graphics at 12.5 or 17 DPI","cpu":"Not stated by Enabling Technologies; the published specs give an 18,000-character text buffer and 25 characters per second","ram":"18,000-character text buffer","syns":"None built in (some units have an optional 'ET Speaks' serial speech-feedback port)","price":"$2,195 (RL & Associates dealer listing, early 2000s)","used":"eBay: Enabling Technologies Romeo RB-25 listed used at US$100 or best offer plus $26 shipping (Santa Ana, CA; seen October 2026)","wt":"32 lb (14.5 kg)","dim":"21.25 × 13.25 × 8.25 in (53.9 × 33.6 × 20.9 cm); 6 in high without lid","io":"Centronics parallel, EIA-232D serial (9-pin); newer units add USB; optional ET Speaks serial port"},"ph":"22 x 14 x 9 inches, 32 lb.","io":"USB, parallel, serial.","f":["Multi-copy up to 99 copies","Dynamic Braille Scaling","Paper width 1.5 to 13.25 in"],"src":["https://www.yumpu.com/en/document/view/38159759/worlds-leading-manufacturer-of-braille-embossers-enabling-","https://cecitech.com/en/?product=romeo-25-braille-embosser","https://macosx.com/threads/romeo-rb25-braille-embosser.277528/","https://www.yumpu.com/en/document/view/6157847/romeo-25-romeo-pro-50-enabling-technologies","https://veterans.networkofcare.org/Riverside/AssistiveDevices/ProductDetail?productId=87366","https://www.yumpu.com/en/document/view/9450828/prices-and-ordering-information-enabling-technologies","https://www.ebay.com.au/itm/188871407318","http://www.rla.com/embossers.html"],"h":" Enabling Technologies' Romeo 25 (model RB-25) is a rugged, transportable single-sided impact embosser for students, home and office. It embosses a 40-cell Library of Congress line at 25 characters per second. Features include Dynamic Braille Scaling (Library of Congress, California sign, Jumbo, relaxed spacing and Japanese 'petite' braille), normal and high-resolution graphics, 6- or 8-dot braille, sideways printing, multiple strikes, impact control for plain paper, 16 setup menus, and Multi-Copy of up to 99 copies. It meets ENERGY STAR guidelines by entering low-power mode after three minutes. Its sibling, the Romeo Pro 50, embosses at 50 cps.","desc":["The Romeo 25 is a medium-sized, boxy braille embosser built into a plastic carrying case with a handle, so it can be picked up and carried like a heavy suitcase. It is about 21¼ inches wide, 13¼ inches deep and 8¼ inches tall with its lid on (6 inches without it). At 32 lb (14.5 kg) it is portable but heavy.","Paper is continuous-form, tractor-feed braille paper with sprocket holes along both edges. It runs through sprocket wheels that pull it past the print head. The paper width adjusts from 1.5 to 13.25 inches (up to 11.5 inches for braille, per a dealer), the page length from 3 to 14 inches, and it takes paper from light 20-lb computer paper up to heavy 100-lb braille paper.","Inside, an impact print head hammers the dots up from underneath the paper, moving in both directions across the page. The dots are 0.020 inch high and 0.090 inch apart, and lines are 0.4 inch apart for 6-dot braille. It is loud while working, averaging 75 decibels, about as loud as a vacuum cleaner.","On the back are the computer connections: a Centronics parallel port and a 9-pin serial port, and on newer units a USB port. Some units have a third serial port for 'ET Speaks', Enabling Technologies' speech feedback that announces menu settings. The embosser runs on household AC power with a fuse; there is no battery.","A control panel with buttons lets you step through its 16 menus to change braille size, graphics resolution, number of copies and other settings. It also connects directly to braille notetakers. The rated mean time between failures is 50 million characters, and the print head lasts about 100 million characters."]},{"id":"romeopro50","n":"Romeo Pro 50","co":"et","cat":"Embossers","yr":0,"y":"Sold alongside the Romeo 25 in Enabling Technologies' brochure. The introduction year was not found in that brochure or at atkratter.com.","o":"The faster sibling of the Romeo 25, at 50 characters per second with ET Speaks speech feedback and single-sheet tractors.","s":{"disp":"40-character line, 50 characters per second, about 170 pages per hour","dim":"21.25 × 13.25 × 8.25 in","wt":"32 lb (14.5 kg)"},"ph":"22 x 14 x 9 inches, 32 lb.","src":["https://www.yumpu.com/en/document/view/38159759/worlds-leading-manufacturer-of-braille-embossers-enabling-","http://atkratter.com/braille/et/romeo.htm","https://www.yumpu.com/en/document/view/6157847/romeo-25-romeo-pro-50-enabling-technologies","https://cdn.thomasnet.com/ccp/01055195/75393.pdf"],"desc":["The Romeo Pro 50 is the faster sibling of the Romeo 25, sold by Enabling Technologies for schools, small offices and personal use. It has the same rugged case: 21.25 inches wide, 13.25 inches deep and 8.25 inches high (6 inches without the lid), weighing 32 lb (14.5 kg).","It embosses single-sided braille at 50 characters per second on lines of up to 40 characters, with 6- or 8-dot braille
