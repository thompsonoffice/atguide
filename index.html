eech","https://e-flt.nus.edu.sg/wp-content/uploads/docroot/v3n12006/rev_harashima.pdf","https://afb.org/aw/10/6/16088","https://www.webbie.org.uk/Veli-Pekka/reviews_of_speech_synths.html"]},{"id":"att_voices","n":"AT&T Natural Voices (Crystal, Mike)","co":"att","cat":"TTS Voices","yr":0,"y":"2001: AT&T Labs launched the Natural Voices TTS Engine on July 31, 2001.","o":"AT&T Labs voices. In 2007 Engadget treated them as a high-end benchmark when comparing Apple's Alex.","s":{"syn":"Concatenative","plat":"Windows (SAPI)","def":"Not a default in any OS; a commercial SAPI 5.1 engine"},"src":["https://jctnpedia.fandom.com/wiki/Text-to-Speech_Downloadables_List","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://resna.stanford.edu/SIG-11/archive/FreedomBox.htm","https://www.isca-archive.org/eurospeech_1999/beutnagel99_eurospeech.pdf","https://en.wikipedia.org/wiki/Comparison_of_speech_synthesizers"],"h":" AT&T Labs launched its Natural Voices Text-to-Speech Engine on July 31, 2001. It grew out of AT&T's unit-selection research (Beutnagel and colleagues, Eurospeech 1999), which picks and joins recorded units from a large speech corpus. It shipped about 20 voices across English variants, French, German, Italian and Spanish for Windows and Linux."},{"id":"cepstral_voices","n":"Cepstral David and Diane","co":"cepstral","cat":"TTS Voices","yr":0,"y":"Available by 2007","o":"Commercial voices sold for $30 each, which Macworld recommended in 2007.","s":{"syn":"Concatenative (Cepstral Swift engine; founders came from Festival/Flite)","plat":"Mac OS X, Windows, Linux","def":"Not a default; sold as add-on voices","price":"$30 each"},"src":["https://www.macworld.com/article/185797/voicemac.html","https://en.wikipedia.org/wiki/cepstral_(company)","https://www.engadget.com/2005-03-22-hate-fred-and-veronica-try-david-and-linda.html","http://jonhoyle.com/maccompanion/mirror/archives/march2006/software/cepstral.htm","https://en.wikipedia.org/wiki/Cepstral_(company)"],"h":" Cepstral was founded in Pittsburgh in 2000 by Kevin Lenzo and Alan W Black, authors of Festival-lite. Engadget described David as a new Mac voice in March 2005, and Diane is in the Swift 4.0.1 voice list (2006). Cepstral LLC was founded in June 2000 by Carnegie Mellon University scientists, including Kevin Lenzo and Alan W. Black, and is based in Pittsburgh, Pennsylvania. The company makes synthetic voices for telephony systems, mobile apps and desktop programs, and voices that work with the open-source Festival system. David and Diane are among its US English voices sold to individual users."},{"id":"espeak","n":"eSpeak","co":"espeakproj","cat":"TTS Voices","yr":2007,"y":"2007 (origins 1995)","o":"A compact multilingual formant synthesizer, clear at high speeds.","h":"Jonathan Duddington started 'speak' for Acorn RISC OS in 1995 and rewrote it as eSpeak in 2007 with more languages. Development passed to eSpeak NG in 2015. Jonathan Duddington released Speak for RISC OS computers in 1995, supporting British English. Speak 1.05 came out under the GPLv2 on February 17, 2006, first for Linux, with a Windows SAPI 5 version in January 2007. After version 1.14 it was renamed eSpeak, and from 1.27 it used the GPLv3. It is a compact formant synthesizer covering many languages; many of the people who improved its languages were blind users. Google Translate used it for 27 languages in 2010. The last development release was 1.48.15, on April 16, 2015.","s":{"syn":"Formant","plat":"Linux, Windows and others","def":"The voice file named \"default\", used whenever no voice is specified (eSpeak NG voice documentation)"},"suc":["espeakng"],"src":["https://github.com/espeak-ng/espeak-ng","https://github.com/espeak-ng/espeak-ng/blob/master/docs/voices.md","https://en.wikipedia.org/wiki/ESpeak"]},{"id":"espeakng","n":"eSpeak NG","co":"espeakproj","cat":"TTS Voices","yr":2015,"y":"Late 2015 to present","o":"The maintained fork of eSpeak, supporting over 100 languages. It can use Klatt synthesis or MBROLA voices.","h":"Forked officially in late 2015 from Reece H. Dunn's GitHub maintenance branch (from 2010). In August 2024, version 1.52-dev supported 137 languages. HumanWare added it to the Stream 3 in firmware 1.7 (September 2026). Fenrir's default generic speech driver calls espeak or espeak-ng. Reece Dunn forked eSpeak on GitHub on June 25, 2010 (from release 1.43.46), at first to make it easier to build on Linux and other POSIX systems. After Jonathan Duddington had been inactive for eight months, the espeak-ng fork was started on December 11, 2015, and its first release, 1.49.0, came out on September 10, 2016. Because it is small and covers many languages, eSpeak NG ships with the NVDA screen reader and with Android, Ubuntu and other Linux distributions.","s":{"syn":"Formant (optionally Klatt or MBROLA)","plat":"Linux, Windows, Android and others","def":"Fenrir generic speech driver; optional on Victor Reader Stream 3"},"pre":["espeak"],"src":["https://github.com/espeak-ng/espeak-ng","https://praat.org/manual/eSpeak.html","https://github.com/chrys87/fenrir","https://en.wikipedia.org/wiki/ESpeak"]},{"id":"festival","n":"Festival","co":"cstr","cat":"TTS Voices","yr":1996,"y":"1996 to present","o":"A complete open-source TTS framework from Edinburgh's CSTR.","h":"First version in 1996, with updates through 2007 (better intonation, larger lexicons). It underpins HTS work and spin-offs such as Rhetorical Systems and CereProc. Festival was originally developed by Alan W. Black, Paul Taylor and Richard Caley at the University of Edinburgh's Centre for Speech Technology Research, with substantial contributions from Carnegie Mellon University. It is written in C++ with a Scheme-like command interpreter and released under a free, BSD-style license. It supports British and American English, Welsh and Spanish, and voice packages exist for other languages. Version 2.5 came out in December 2017.","s":{"syn":"Concatenative (plus statistical with HTS)","plat":"Unix/Linux and others","def":"Set by voice_default. With all the distributed voices installed the default is voice_rab_diphone (British male 'Roger'); many installs default to voice_kal_diphone (American male)."},"suc":["flite"],"src":["https://ppls.ed.ac.uk/linguistics-and-english-language/research/impact/speech-synthesis-technology","https://zeehio.github.io/festival/doc/Site-initialization.html","https://www.cstr.ed.ac.uk/emasters/summer_school_2005/tutorial3/tutorial.html","https://en.wikipedia.org/wiki/Festival_Speech_Synthesis_System"]},{"id":"flite","n":"Flite","co":"cmu","cat":"TTS Voices","yr":2001,"y":"Version 1.0 beta, August 27, 2001","o":"Festival-lite, a small-footprint synthesizer for handhelds and servers.","h":"Alan W Black and colleagues wrote it in 2001 as a reimplementation of Festival's core design. Flite ('festival-lite') was written at Carnegie Mellon University by Alan W. Black and Kevin A. Lenzo as a small, fast run-time engine for voices built with the Festival and FestVox tools, for embedded systems, handhelds and busy servers. They presented it at the 4th ISCA Workshop on Speech Synthesis in 2001, and version 1.0 beta was posted on August 27, 2001, including an ARM Linux binary.","s":{"syn":"Concatenative (diphone and unit selection)","plat":"Embedded, Linux and others","def":"kal, an 8 kHz US English diphone voice derived from cmu_us_kal and the single voice Flite originally shipped with (later releases also add the awb, rms and slt voices)"},"pre":["festival"],"src":["https://www.cs.cmu.edu/~awb/papers/ISCA01/flite/node1.html","https://github.com/festvox/flite","http://www.cs.cmu.edu/~awb/papers/ISCA01/flite/flite.html","http://cmuflite.org/packed/flite-1.0/"]},{"id":"orpheus","n":"Dolphin Orpheus","co":"dolphin","cat":"TTS Voices","yr":1998,"y":"Version 1.01 released June 30, 1998","o":"Dolphin's software speech synthesizer, bundled for years with its SuperNova, HAL and Lunar Plus programs.","s":{"syn":"Parallel formant synthesis","plat":"Windows","def":"Bundled speech for Dolphin Hal and SuperNova"},"src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://www.scrigroup.com/limba/engleza/87/Orpheus-Speech-Synthesiser-Ver44875.php","https://github.com/rommix0/dolphin-apollo-ii-reborn","https://speech.meridian-one.co.uk/orpheus.html","https://speech.meridian-one.co.uk/newsold.html","https://www.webbie.org.uk/Veli-Pekka/reviews_of_speech_synths.html"],"h":" Later versions added sample-based (concatenative) voices alongside the formant voices. Dolphin transferred the Orpheus rights to Meridian One in August 2006, which added SAPI support, more languages and faster speech. Orpheus 1 was a fully synthetic, formant-style engine with robotic-sounding but very clear speech and strong pronunciation; the default voice was Dave. Outside Dolphin's own products it worked only with programs supporting Dolphin's SAM interface. Orpheus 2 added SAPI 4 and 5 support, many more languages including Chinese, an exception dictionary, a Windows CE port, and recorded (sampled) voices alongside the synthetic ones, with one male and one female sampled voice per language plus synthetic Dave and Andy. Reviewer Veli-Pekka Tätilä found the synthetic voices understandable even near the top rate of 700. Orpheus development later passed to Meridian, which hosted its home page."},{"id":"ibmsr","n":"IBM Screen Reader (DOS)","co":"ibm","cat":"Screen Readers","yr":1986,"y":"1986","o":"Created by IBM researcher Jim Thatcher. Often cited as the first screen reader for DOS.","h":"Followed by IBM Screen Reader/2 for OS/2. Jim Thatcher, an IBM mathematician and one of the first computer science PhDs (1963), built it with his former thesis adviser Jesse Wright, who was blind. They began work on audio access for the IBM PC in 1984, developing an IBM Raleigh prototype talking terminal called SAID (Synthetic Audio Interface Driver), and the research project was called PC SAID. IBM announced Screen Reader in 1986, and Thatcher's 1994 paper says the DOS product was released in January 1988 and upgraded twice. It was at first mainly for IBM's own blind staff, dozens of whom beta tested it. Its distinguishing features were a separate 18-key keypad and full programmability. Screen Reader/2 for OS/2, a complete redesign that Thatcher led, was the first screen reader for a PC graphical interface; it was programmed in the Profile Access Language (PAL) and also gave access to Windows and DOS programs running under OS/2.","s":{"os":"PC DOS"},"suc":["ibmsr2"],"src":["https://www.sigaccess.org/wp-content/uploads/2012/05/jim_thatcher.pdf","https://ashton.codes/dai11y-19-01-2021/","https://afb.org/aw/5/2/14760","https://doi.org/10.1007/3-540-58476-5_108","https://knowbility.org/blog/2021/a-brief-history-of-screen-readers"]},{"id":"ibmsr2","n":"IBM Screen Reader/2","co":"ibm","cat":"Screen Readers","yr":1992,"y":"About 1992","o":"IBM's screen reader for OS/2 (and Windows under OS/2).","s":{"os":"OS/2","price":"$600 ($500 upgrade) in 1992"},"pre":["ibmsr"],"src":["https://sharktastica.co.uk/resources/docs/txt/IBM_292-363_SR2_1992_IBM.txt"],"h":" IBM announced it on June 23, 1992 (Announcement Letter 292-363), with availability planned for September 8, 1992. It was $600, or $500 as an upgrade from Screen Reader 1.x. IBM called it the first OS/2 access product for blind users and the first to speak text from IBM's graphical user interface. It ran in all OS/2 2.0 sessions, followed the visual focus, read menus automatically, could emulate mouse point-and-click and named icons. It came with ready-made profiles and a full profiling language and compiler. It needed the IBM Screen Reader Keypad, which plugged into the mouse port on IBM PS systems or into a Screen Reader Adapter card on other computers, and a non-IBM speech synthesizer. Messages and documentation were translated into twelve languages, and installation instructions came in print, audio, online and braille."},{"id":"jawsdos","n":"JAWS for DOS","co":"hj","cat":"Screen Readers","yr":1989,"y":"1989","o":"Henter-Joyce's first JAWS (Job Access With Speech), for MS-DOS.","s":{"os":"MS-DOS"},"suc":["jaws"],"src":["https://en.wikipedia.org/wiki/Freedom_Scientific","https://ashton.codes/dai11y-19-01-2021/","https://afb.org/blindness-and-low-vision/using-technology/interviews-technology-pioneers/ted-henter","https://msa.maryland.gov/megafile/msa/speccol/sc5300/sc5339/000113/000000/000447/unrestricted/20040917e/4-art.html"],"h":" Ted Henter and Bill Joyce founded Henter-Joyce in 1987 and developed JAWS, first as a DOS screen reader and later for Windows (AFB). On October 2, 1998, Henter-Joyce said JAWS for DOS 2.31 'brought the company to prominence' in 1988. The company announced it would become free to download on January 1, 1999, when sales, shipments and technical support would end, since most users had moved to Windows and JAWS for Windows. It still needed one of the hardware speech synthesizers it supported."},{"id":"jaws","n":"JAWS for Windows","co":"fs","cat":"Screen Readers","yr":1995,"y":"January 1995 (1.0) to present (2026)","o":"The most widely deployed commercial Windows screen reader, with scripting, braille support and speech from Eloquence and Vocalizer Expressive.","h":"Version 1.0 shipped in January 1995 from Henter-Joyce, and Freedom Scientific has developed it since 2000. JAWS 2026 (2026.2609.84, September 2026) adds an AI page explorer, AI graphic labeling and FSCompanion. See OS History for the version-by-version list. JAWS stands for Job Access With Speech. Henter-Joyce was founded in 1985 with $180,000 from Bill Joyce.","f":["Five cursors (PC, JAWS, invisible, touch)","Scripting with built-in compiler","OCR, DAISY reader, MathML","Braille displays"],"s":{"os":"Windows 10 and 11 (64-bit), Windows Server 2016 to 2025; ARM64 on Windows 11","tts":"Eloquence and Vocalizer Expressive","price":"1,900 euros (home) or 2,940 euros (professional), France 2026"},"req":["64-bit Windows 11, 10 or Server 2016 to 2025; ARM64 on Windows 11 (JAWS 2023 or later)","2.0 GHz i5 dual-core or faster recommended","16 GB RAM or more recommended","2 GB disk plus voices; SSD recommended","DirectX 9 graphics with WDDM 1.0 driver, 1024x768","Windows-compatible sound card"],"pre":["jawsdos"],"vo":["eti","vocalizer"],"src":["https://support.freedomscientific.com/Downloads/JAWS/jaws-system-requirements","https://support.freedomscientific.com/Downloads/jaws","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/jaws-version-2026","https://en.wikipedia.org/wiki/JAWS_(screen_reader)"]},{"id":"outmac","n":"outSPOKEN for Macintosh","co":"berkeley","cat":"Screen Readers","yr":1989,"y":"1989","o":"One of the first commercial GUI screen readers. It introduced an off-screen model and used the mouse pointer as a review cursor.","h":"Written by Wes Boyd and Bruce Berkhalter. It was the only Mac screen reader ever available before VoiceOver. It was the only Mac screen reader before VoiceOver. Berkeley Systems sold outSPOKEN and all its other accessibility assets to ALVA Access Group of the Netherlands in 1996. On June 10, 2003, ALVA announced it would stop developing outSPOKEN and the inLARGE magnifier for the Mac, to focus on stand-alone products such as the ALVA MPO. outSPOKEN 9.2 stayed on sale for the rest of 2003, with warranties and service agreements honored. Optelec acquired ALVA's assets in September 2005.","s":{"os":"Classic Mac OS"},"suc":["outwin","vomac"],"vo":["mt1984"],"src":["https://en.wikipedia.org/wiki/OutSPOKEN","https://www.macworld.com/article/166605/alva.html","https://lists.w3.org/Archives/Public/w3c-wai-ig/2003AprJun/0718.html"]},{"id":"outwin","n":"outSPOKEN for Windows","co":"berkeley","cat":"Screen Readers","yr":1994,"y":"1994","o":"Berkeley Systems' Windows 3.1 screen reader, considered one of the first truly effective Windows screen readers.","h":"Developed primarily by Ben Drees and Peter Korn, with interface design by Marc Sutton and Joshua Miele. It ran on Windows 3.1, and the interface was designed by Marc Sutton and Joshua Miele. Like the Mac version, it used an off-screen model and could use the mouse pointer as a review cursor. Berkeley Systems sold it with its other accessibility products to ALVA Access Group in 1996, and Optelec acquired ALVA's assets in September 2005.","s":{"os":"Windows 3.1"},"pre":["outmac"],"src":["https://en.wikipedia.org/wiki/OutSPOKEN"]},{"id":"vocaleyes","n":"Vocal-Eyes","co":"gw","cat":"Screen Readers","yr":1990,"y":"1990","o":"GW Micro's DOS screen reader, finished and released shortly after the company's founding.","s":{"os":"MS-DOS"},"suc":["weyes"],"src":["https://afb.org/aw/3/1/14962"],"h":" Doug Geoffray began writing Vocal-Eyes in 1988 at Computer Aids Corporation (CAC). It was one of the first DOS screen readers for PCs, and it was nearly finished when CAC went out of business in November 1989. Geoffray and Dan Weirich then founded GW Micro in February 1990. Vocal-Eyes, the Sounding Board speech synthesizer and support for older CAC talking products were the company's main products in its early years. GW Micro's later Window-Eyes was deliberately kept similar to Vocal-Eyes, which Geoffray said had proved powerful yet easy to configure (AccessWorld, 2002)."},{"id":"weyes","n":"Window-Eyes","co":"gw","cat":"Screen Readers","yr":1995,"y":"October 16, 1995 (1.0) to 9.5.3 (September 14, 2016)","o":"GW Micro's Windows screen reader. It was also offered free to Microsoft Office users through a Microsoft and GW Micro program.","h":"Version 1.0 came out in October 1995. After the 2014 merger with Ai Squared and the 2016 move to VFO, development stopped in 2017. Registered owners of 9.0 or later got a free migration to JAWS 18, and Window-Eyes kept working on Windows 7, 8.1 and 10 without updates. GW Micro of Fort Wayne, Indiana released Window-Eyes in 1995. Version 7 added standard scripting, and it came in 14 languages. GW Micro merged with AI Squared in 2014, and that year a partnership with Microsoft made Window-Eyes free for users of certain versions of Microsoft Office. By July 2017 it was no longer sold in the U.S. and Canada; only support continued, and new customers were pointed to JAWS. Version 9.4 supported Windows Vista through Windows 10.","s":{"os":"Windows"},"req":["Window-Eyes 9.4: Windows Vista, Server 2008, 7, 8 or 10"],"pre":["vocaleyes"],"src":["https://afb.org/aw/3/1/14962","https://afb.org/aw/18/6/15200","https://web.archive.org/web/2016/http://www.gwmicro.com/Window-Eyes/Version_History/","https://en.wikipedia.org/wiki/Window-Eyes"]},{"id":"asap","n":"ASAP (Automatic Screen Access Program)","co":"microtalk","cat":"Screen Readers","yr":0,"y":"DOS era; latest found version January 2002","o":"MicroTalk's DOS screen reader. A Windows counterpart, ASAW, also existed.","s":{"os":"MS-DOS"},"src":["https://allinaccess.com/happ/","https://en.wikipedia.org/wiki/List_of_screen_readers","https://www.duxburysystems.org/downloads/library/news/new95.htm"],"h":" Developed by MicroTalk, ASAP was sold by Raised Dot Computing from 1992 (RDC Newsletter, March–April 1992). Instead of needing to be set up for each program, it decided what to speak by watching how the application reacted to keystrokes, focusing automatically on light bars, soft cursors and pop-up windows. Its features included Instant Silence, Turbo Browse (skip a little text), Quick Review from the numeric keypad, Auto Read, a user-expandable pronunciation lexicon and column detection. It needed about 30K of memory and could load high. RDC also sold an 'ASAP Classic' package with a DoubleTalk PC synthesizer modified for better performance with ASAP."},{"id":"softvert","n":"Soft Vert","co":"tsi","cat":"Screen Readers","yr":1987,"y":"On the market by 1987","o":"Telesensory's DOS screen reader.","s":{"os":"MS-DOS"},"src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://www.duxburysystems.org/downloads/library/history/nbp_2nd_begin.pdf","https://allinaccess.com/happ/","http://oman.org/blinux/list-archive/blinux-list/2002/msg00823.html"],"h":" Soft Vert was Telesensory Systems' talking screen-access program for the IBM PC and compatibles. Joe Lazzaro and Curtis Chong reviewed it in National Braille Press's Second Beginner's Guide to Personal Computers for the Blind and Visually Impaired (1987). It cost $395, came on an MS-DOS floppy with print, cassette and disk manuals and a braille reference card, and was said to work with WordStar, dBASE, PFS programs and most text-mode software. It supported many synthesizers, including the Artic SynPhonix 200, Votalker IB, Type 'N Talk, Votrax PSS, Echo GP and PC, and DECtalk, but not Speech Plus CallText. Internal speech cards needed Artic's or Votrax's PORTTALK program. Control-0 entered its review mode, which read by character, word, line or screen, and in review mode F3 to F6 changed rate and pitch. The reviewers called it one of the most feature-rich screen review systems then available. In 2002 a Linux user was still running Soft Vert in DOSEMU with an Accent SA. Today the Historical Access Preservation Project lists it as missing software, with no known surviving copy."},{"id":"haldos","n":"Hal for DOS","co":"dolphin","cat":"Screen Readers","yr":0,"y":"DOS era. Wikipedia lists Hal for both DOS and Windows; the Windows version was later superseded by SuperNova and Dolphin ScreenReader. The DOS release year was not found.","o":"Dolphin's original Hal screen reader for DOS.","s":{"os":"MS-DOS"},"suc":["halwin"],"src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://www.prweb.com/releases/dolphin_computer_access_celebrate_their_30th_anniversary_launching_an_accessible_ios_reading_app_for_blind_low_vision_dyslexic_readers/prweb14405612.htm","https://yourdolphin.com/About-Dolphin","https://yourdolphin.com/news?id=563"],"h":" Hal for DOS was one of the first products of Dolphin Computer Access, founded in 1986 in Worcester, UK and led by Noel Duffy. It was a software screen reader that spoke through a hardware synthesizer, Dolphin's Apollo. Dolphin says the pairing was sold in more than 30 languages and became an industry leader worldwide."},{"id":"halwin","n":"Hal for Windows","co":"dolphin","cat":"Screen Readers","yr":1997,"y":"By 1997 (Hal 1.04 for Windows 95)","o":"Dolphin's Windows screen reader, later superseded by Supernova and Dolphin ScreenReader.","h":"Dolphin's 1997 schedule included Hal 1.04 for Windows 95. Later versions supported Windows 95, 98, ME, 2000, NT and XP.","s":{"os":"Windows 95 to XP"},"pre":["haldos"],"suc":["supernova"],"src":["https://nfbcal.org/nfb-rd/1332.html","https://afb.org/aw/7/1/14545"]},{"id":"supernova","n":"Dolphin Supernova","co":"dolphin","cat":"Screen Readers","yr":1998,"y":"Launched 1998","o":"Dolphin's combined magnifier and screen reader. Version 8.01 for Windows Vista was reported in 2007.","s":{"os":"Windows"},"pre":["halwin"],"src":["http://therangerstation.blogspot.com/2007/07/","https://en.wikipedia.org/wiki/List_of_screen_readers","https://www.prweb.com/releases/dolphin_computer_access_celebrate_their_30th_anniversary_launching_an_accessible_ios_reading_app_for_blind_low_vision_dyslexic_readers/prweb14405612.htm","https://www.freelists.org/post/access-uk/Fw-UKVISE-FW-Dolphin-News-October-2005,1","https://yourdolphin.com/news?id=563"],"h":" Dolphin launched SuperNova in 1998 as, in its words, the first fully integrated magnifier and screen reader, developed at its Worcester headquarters. SuperNova USB followed in 2005 as the first assistive technology to run portably from a USB thumb drive. The Dolphin Pen could carry SuperNova, Hal or Lunar from PC to PC, and was nominated for a British Chamber of Commerce innovation award in 2005. SuperNova remains one of Dolphin's flagship products."},{"id":"pockethal","n":"Pocket Hal / Smart Hal","co":"dolphin","cat":"Screen Readers","yr":2005,"y":"Late 2005 (final beta October 2005)","o":"Dolphin's screen readers for Windows Mobile Pocket PCs (Pocket Hal) and Smartphones (Smart Hal).","s":{"os":"Windows Mobile"},"src":["https://afb.org/aw/8/4/14343","https://www.freelists.org/post/access-uk/Fw-UKVISE-FW-Dolphin-News-October-2005,1","https://afb.org/aw/8/5/14324","https://www.freelists.org/post/access-uk/Fw-Showcasing-Pocket-Hal"],"h":" Pocket Hal was a full screen reader for Windows Mobile PDAs, based on the desktop Hal. Dolphin showed it at Sight Village in July 2005. In October 2005 it was in final beta, with release planned for the next month. It gave speech and braille access to Pocket Word, Pocket Excel, Pocket Outlook and Pocket Internet Explorer, plus MSN and phone features. Dolphin said it would be the first screen reader for off-the-shelf PDAs to support Bluetooth or plug-in braille devices and keyboards."},{"id":"blindows","n":"Blindows","co":"baum","cat":"Screen Readers","yr":1997,"y":"In use by February 1999; development ended 2006","o":"A Windows screen reader from Audiodata, later BAUM Retec, replaced by COBRA.","s":{"os":"Windows"},"suc":["cobra"],"src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://www.welt.de/print-welt/article566363/Mit-Blindows-durch-das-Internet.html","https://de.wikipedia.org/wiki/Cobra_(Screenreader)"],"h":" Blindows was the Windows screen reader of the German company Frank Audiodata, later Audiodata GmbH. Die Welt covered it in February 1999 as a way for blind users to browse the web. After BAUM bought Frank Audiodata in 2004, BAUM had two quite different screen readers, Blindows and its own VIRGO, and the two teams began a joint successor. Development of both ended in 2006, and COBRA replaced them."},{"id":"cobra","n":"COBRA","co":"baum","cat":"Screen Readers","yr":2008,"y":"November 2008 (COBRA 8) onward","o":"BAUM Retec's commercial Windows screen reader, with MSAA and Java Access Bridge support.","s":{"os":"Windows"},"pre":["blindows"],"src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://de.wikipedia.org/wiki/Cobra_(Screenreader)"],"h":" COBRA, made by BAUM Retec AG of Wiesenbach, Germany, is the joint successor to Blindows and BAUM's VIRGO. COBRA 8 came out in November 2008 and 8.1 in April 2009, with braille and speech only, still using BAUM's WebFormator add-on for Internet Explorer to read web pages. COBRA 9 (January 2010) added magnification and replaced WebFormator with a built-in COBRA Explorer. Version 9.1 came in December 2010, 10 in November 2012 (Windows XP to 7) and 11 in May 2016 (Windows 8 and 10). Features include OCR of images, text snippets, splitting braille displays and running more than one at once, and VBScript scripting. A 2011 Aktion Mensch article named it as JAWS's runner-up in Germany. After BAUM went insolvent, VisioBraille took over its assets and still offers COBRA downloads and license activation."},{"id":"msscreenreader","n":"Microsoft Screen Reader (requested entry)","co":"ms","cat":"Screen Readers","yr":0,"y":"2000: Microsoft's built-in screen reader, Narrator, debuted in Windows 2000 on February 17, 2000 (AbilityNet, 'Microsoft Narrator turns 21').","o":"You asked for this as Narrator's Windows 2000-era predecessor, but no source found during research documents a separate Microsoft product by this name. Narrator itself first shipped in Windows 2000.","suc":["narrator"],"src":["https://abilitynet.org.uk/news-blogs/microsoft-narrator-turns-21-we-celebrate-coming-age"],"h":" No source found documents a separate Microsoft product called Microsoft Screen Reader. Microsoft's first built-in screen reader is Narrator, which debuted in Windows 2000 on February 17, 2000. AbilityNet's Robin Christopherson recalls that blind users long mocked it as the screen reader you used only to download and install a proper one, such as JAWS (first released for Windows in early 1995). By early 2021, though, he judged Narrator a viable competitor to JAWS and NVDA, with richer hotkeys and better handling of Office. Narrator starts with Ctrl+Windows+Enter. This entry is kept so the requested name points readers to Narrator."},{"id":"narrator","n":"Microsoft Narrator","co":"ms","cat":"Screen Readers","yr":2000,"y":"February 17, 2000 to present","o":"The screen reader built into Windows.","h":"Debuted in Windows 2000, speaking with Microsoft Sam. It gained braille support in 2017, and the Windows 10 Creators Update changed its toggle to Ctrl+Windows+Enter. Windows 10 and 11 voices include David, Zira, Mark and Hazel. Narrator was developed by Professor Paul Blenkhorn in 2000. It made Windows 2000 the first Microsoft operating system with some access for blind people built in, so a blind person could use any such computer right away. The Windows 2000 version used SAPI 4 and could use other SAPI 4 voices. The Windows XP version used SAPI 5 but only the default voice, Microsoft Sam. Vista and 7 moved it to SAPI 5.3 and the Anna voice. Windows 10 offered it in many languages with voices including David, Zira and Mark. Windows 11 redesigned it and added natural voices. Windows Phone had a simpler version.","s":{"os":"Windows 2000 and later"},"req":["Included with Windows 2000 and later; no separate requirements documented"],"vo":["ms_sam","ms_david","ms_zira","ms_mark","ms_hazel"],"src":["https://abilitynet.org.uk/news-blogs/microsoft-narrator-turns-21-we-celebrate-coming-age","https://afb.org/aw/18/6/15200","https://support.microsoft.com/en-us/accessibility/windows/narrator/appendix-a-supported-languages-and-voices","https://en.wikipedia.org/wiki/Narrator_(Windows)"]},{"id":"sysaccess","n":"System Access","co":"serotek","cat":"Screen Readers","yr":2005,"y":"December 2005","o":"Serotek's low-cost Windows screen reader, which grew out of FreedomBox. It supported Internet Explorer (including DHTML, Ajax and Flash), Outlook, Office, Skype and Adobe Reader.","s":{"os":"Windows"},"src":["https://pneumasolutions.com/about/","https://afb.org/aw/7/3/14499","https://en.wikipedia.org/wiki/List_of_screen_readers","http://blog.serotek.com/2012/02/our-story-at-ten.html","http://blog.serotek.com/2007/07/changes-in-system-access-23087.html"],"h":" System Access grew out of FreedomBox, an internet appliance Mike Calvo developed first with Russian programmers. Calvo founded Serotek in 2001; Matt Campbell later took over FreedomBox development. Serotek's own ten-year history dates System Access to 2004. AccessWorld reports that the FreedomBox System Access feature arrived in December 2005, giving speech access to Word, Excel, Outlook Express, PowerPoint text and Internet Explorer without another screen reader. The reviewer noted occasional hangs but strong promise, and said it was hard to call it anything but a screen reader. Serotek pushed for low prices and portability, moving FreedomBox from a box nearly the size of a microwave oven onto a thumb drive (System Access To Go). In July 2007, with version 2.3.0.87, FreedomBox and its network were renamed the System Access Mobile Network. Calvo later founded Pneuma Solutions."},{"id":"nvda","n":"NVDA (NonVisual Desktop Access)","co":"nv","cat":"Screen Readers","yr":2006,"y":"2006 (version 0.5 in 2007) to present","o":"A free, open-source Windows screen reader written in Python and C++, available in 62 languages.","h":"Michael Curran began it in April 2006, motivated by the cost of commercial screen readers, and named it NVDA late that year. Version 0.5 came in 2007, and the 0.6 releases (2008 to 2009) added better web browsing, braille output and more languages. NV Access was founded in 2007. NVDA releases about four times a year; 2026.2 came out on August 31, 2026 and 2026.3 is current.","s":{"os":"Windows 10 (22H2 or later) and 11, 64-bit; Server 2016 to 2025","tts":"eSpeak NG on Windows 7/8; Windows OneCore voices by default on Windows 10 and later (since NVDA 2019.3)","price":"Free"},"req":["Minimum: 64-bit Windows 10 or 11, or Windows Server 2016, 2019, 2022 or 2025","Windows 11 AMD64 and ARM64 supported (including Copilot+ PCs); ARM64 Windows 10 not supported","At least 500 MB storage","Recommended: at least 4 GB RAM"],"src":["https://en.wikipedia.org/wiki/NonVisual_Desktop_Access","https://download.nvaccess.org/documentation/en/userGuide.html","https://www.nvaccess.org/about-nv-access/","https://github.com/nvaccess/nvda/issues/8176","https://api.nvaccess.org/releases/2019.3/nvda_2019.3_changes.html"]},{"id":"vomac","n":"VoiceOver (macOS)","co":"apple","cat":"Screen Readers","yr":2005,"y":"Mac OS X 10.4 Tiger (2005) to present","o":"Apple's built-in Mac screen reader.","h":"A preview called 'Spoken Interface Preview' appeared for Mac OS X 10.3 Panther. VoiceOver shipped in 10.4 Tiger in 2005, and the Alex voice arrived with 10.5 Leopard in 2007. Mac OS X 10.7 Lion added downloadable Nuance RealSpeak voices. Before Alex, Mac voices descended directly from the early-1990s Speech Manager; Alex added natural-sounding breaths. VoiceOver's Screen Curtain, which blanks the display, is available on the Mac as well as iOS. Apple brought VoiceOver to the iPod shuffle (with spoken playlists from the 2010 model) and, in September 2010, to the iPod nano. In macOS Big Sur 11.3, Apple removed the gender labels from all its voices.","s":{"os":"Mac OS X 10.4 and later"},"req":["Included with Mac OS X 10.4 and later"],"pre":["outmac"],"vo":["mac_alex"],"src":["https://en.wikipedia.org/wiki/VoiceOver","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://en.wikipedia.org/wiki/PlainTalk"]},{"id":"voios","n":"VoiceOver (iOS / iPadOS)","co":"apple","cat":"Screen Readers","yr":2009,"y":"iPhone 3GS (2009) to present","o":"The gesture-based touchscreen screen reader that made the iPhone accessible to blind users.","h":"Arrived with the iPhone 3GS in 2009, then the 3rd-generation iPod touch, and the iPad from its launch. Later added braille display support (iOS 4, 2010), Braille Screen Input (iOS 8, 2014) and Braille Access (2025). VoiceOver on iOS works by gestures: sliding a finger around the screen speaks whatever is under it, so blind users can explore the real layout of an app, and a double-tap activates the selected item. Screen Curtain turns the display off but leaves touch active, saving battery. VoiceOver is turned on in Settings, Accessibility; it can also be set to toggle with a triple-click of the Home or side button, or turned on and off by asking Siri.","s":{"os":"iOS 3 and later"},"req":["iPhone 3GS or later (first supported hardware)"],"src":["https://en.wikipedia.org/wiki/VoiceOver"]},{"id":"talkback","n":"TalkBack","co":"google","cat":"Screen Readers","yr":2009,"y":"October 2009 (Android 1.6 Donut) to present","o":"Google's Android screen reader, part of Android Accessibility Suite.","h":"Announced on the Google Open Source Blog on October 20, 2009, with SoundBack and KickBack, when Android 1.6 Donut added an accessibility API. Written by T. V. Raman, Charles Chen and Svetoslav Ganov; early users navigated with the trackball and might need to install it from Android Market. Single-finger gestures came in Android 4.1. Version 6.2 (June 2018) became the Android Accessibility Suite. A braille keyboard came in 8.2 (2020), multi-finger gestures and a new menu in 9.1 (2021), and image captions in 12.1. Since Android 11, Samsung ships its own TalkBack build. Version 17.1 (September 17, 2026) needs Android 9 or later. Open source under Apache 2.0.","s":{"os":"Android 9 or later (TalkBack 17.1)"},"src":["https://accessibleandroid.com/a-decade-with-android-highlighting-observations-and-shifts/","https://accessibleandroid.com/comparing-talkback-and-jieshuo-strengths-and-weaknesses-of-two-screen-readers/","https://opensource.googleblog.com/2009/10/talkback-open-source-screenreader-for.html","https://en.wikipedia.org/wiki/TalkBack"],"req":["TalkBack 17.1 (September 2026): Android 9 or later","2009 release: Android 1.6 Donut"]},{"id":"samsungva","n":"Samsung Voice Assistant","co":"samsung","cat":"Screen Readers","yr":2015,"y":"2015 (Galaxy S6 / Note 5, Android 5.1.1) until One UI 3.1","o":"Samsung's own Galaxy screen reader. It supported multi-finger gestures well before Google's TalkBack did.","h":"It coexisted with TalkBack for years. Samsung discontinued it with One UI 3.0 (Android 11), when an agreement made Samsung's TalkBack build the only built-in reader. That build launched with bugs and initially lacked a braille keyboard.","s":{"os":"Samsung Android (TouchWiz / One UI)"},"suc":["talkback"],"src":["https://accessibleandroid.com/opinion-why-samsung-google-talkback-separation-is-nothing-but-a-headache/","https://accessibleandroid.com/a-decade-with-android-highlighting-observations-and-shifts/","https://www.inclusiveandroid.com/content/what-are-differences-between-galaxy-talkback-and-google-talkback"]},{"id":"jieshuo","n":"Jieshuo (Commentary Screen Reader)","co":"jieshuodev","cat":"Screen Readers","yr":2019,"y":"By 2019 (GitHub repository created July 2019); still active","o":"A feature-rich Chinese Android screen reader, formerly known as Commentary or TalkMan. Features include a timer, translation, media controls, object and text recognition, and light detection.","h":"Developed by Weiliang Li. It gained an international following after English translation, but is not on the Play Store. New features appear first in Chinese, and volunteer translators follow.","s":{"os":"Android"},"src":["https://accessibleandroid.com/glossary/jieshuo-2/","https://accessibleandroid.com/comparing-talkback-and-jieshuo-strengths-and-weaknesses-of-two-screen-readers/","https://github.com/nirenr/jieshuo/","https://pixeldash.pl/jeshuo/"]},{"id":"prudence","n":"Prudence Screen Reader","co":"prudence","cat":"Screen Readers","yr":0,"y":"Current Android app. Neither its Google Play listing nor AudibleGame's page shows a first-release date.","o":"An Android screen reader with iFlytek voices (including Chinese dialects), speech recognition and voice typing, run by touch gestures or two-way voice commands.","s":{"os":"Android"},"src":["https://play.google.com/store/apps/details?id=com.prudence.reader&hl=en_US","https://www.audiblegame.com/prudence-screen-reader"],"h":" Prudence is an Android screen reader from Prudence Interactive. Its current product page describes iFlytek voices, including premium voices and several Chinese dialects, built-in speech recognition and voice typing, and two ways to operate: touch gestures or voice commands. With the Xiao Zhi voice assistant turned on, every action can be done by two-way voice conversation, hands free. The app has a rewards scheme that uses regular points and Guangming Points, and an interface designed to visual-accessibility standards for blind and low-vision users, older people, and sighted people in no-look situations. The page gives no launch date."},{"id":"spiel","n":"Spiel","co":"darilek","cat":"Screen Readers","yr":2010,"y":"2010 to about 2013","o":"An open-source, scriptable, English-only Android screen reader.","h":"Released on the Android Market in 2010 and updated through 2013. It no longer works on current Android.","s":{"os":"Android (early versions)"},"src":["https://accessibleandroid.com/history-of-android-8-a-brief-overview-of-spiel-screen-reader/","https://blindbargains.com/bargains.php?m=5654"]},{"id":"mobilespeak","n":"Mobile Speak","co":"codefactory","cat":"Screen Readers","yr":2004,"y":"2004 (Symbian); 2005 (Pocket PC); 2006 (Smartphone)","o":"The first screen reader to support both Symbian and Windows Mobile. It handled calls, SMS, email, web browsing and more.","h":"Launched for Symbian in 20 countries in 2004. Code Factory called the 2005 Pocket PC version the first touch-based screen reader, and Smartphone support followed in 2006. AFB tested version 2.8 in 2006 and Mobile Speak Smartphone 1.2. It used Fonix DECtalk. It became obsolete as Symbian ended. Code Factory, founded in 1998 near Barcelona, Spain, by Eduard Sánchez, first made games for the blind and in 2003 released Mobile Accessibility, a simpler talking phone interface. Mobile Speak was announced in April 2004 with Acapela's PocketBabil synthesizer for Nokia Series 60 phones and the Siemens SX1. AccessWorld's 2004 review of version 1.0 found it used Eloquence and cost $295 in the US through Optelec. Code Factory says it launched in 20 countries. Pocket PC support came in 2005 and Windows Mobile Smartphone support in 2006, when Vodafone began offering it. Nokia partnered with Code Factory in 2007, it won an AFB Access Award in 2008, and in 2011 Code Factory supplied Nokia with a branded version called Nokia Screen Reader, while moving to Android with Mobile Accessibility.","s":{"os":"Symbian S60, Windows Mobile","tts":"Fonix DECtalk (among others)"},"vo":["dt_paul"],"src":["https://codefactoryglobal.com/company/","https://codefactory.es/descargas/family_4/ms58_userguide_symbian.html","https://afb.org/aw/8/1/14407","https://afb.org/aw/8/4/14343","https://afb.org/aw/5/6/14676","https://www.innovations-report.de/wissenschaft-technik/innovative-produkte/bericht-28529/"]},{"id":"talks","n":"Nuance TALKS (and ZOOMS)","co":"nuance","cat":"Screen Readers","yr":0,"y":"By 2004 to about 2013","o":"A screen reader for Symbian Series 60 and Series 80 phones, mostly Nokia, using Eloquence speech.","h":"AFB tested TALKS and ZOOMS Premium Edition 3.0 in October 2006. It ran on about 20 Series 60 phones and about 5 Series 80 phones. It became obsolete when Symbian was discontinued in 2013. AccessWorld's 2004 review lists TALKS as produced by Brand & Gröber Communications and tested version 1.30.6 for Series 60 on a Nokia 6620 against Code Factory's Mobile Speak 1.0. Both used Eloquence. TALKS ran on the Nokia 3600, 3620, 3650, 3660, 6600, 6620, 7650, N-Gage and the Siemens SX1.","s":{"os":"Symbian S60 3rd/5th Edition, Symbian^3, Series 80","tts":"Eloquence"},"vo":["eti"],"src":["https://afb.org/aw/8/1/14407","https://en.wikipedia.org/wiki/List_of_screen_readers","https://afb.org/aw/5/6/14676"]},{"id":"chromevox","n":"ChromeVox","co":"google","cat":"Screen Readers","yr":2011,"y":"May 2011 (developer beta) to present","o":"The built-in screen reader for Chrome OS, originally built as a Chrome extension using only web technologies.","h":"Unveiled at Google I/O 2011 by T. V. Raman's team as an early developer beta. It used experimental TTS and accessibility extension APIs and exposed an API for web developers. T.V. Raman announced the developer beta, which used Chrome's experimental tts and accessibility extension APIs and offered web developers a simple screen reader API. Over time it moved from a separate extension into the operating system, and its code now lives in the Chromium tree. Google rebuilt it from the ground up as ChromeVox Next, which became the default on all Chromebooks with Chrome 56 at the end of January 2017. Next changed the modifier from Shift+Search to Search alone and added a ChromeVox panel with menus, braille captions and navigation from USB braille display keyboards.","s":{"os":"Chrome OS (also as a Chrome extension)"},"src":["https://blog.chromium.org/2011/05/chromevox-built-in-spoken-feedback-for.html","https://developers.googleblog.com/en/chromevox-built-in-spoken-feedback-for-chrome-os/","https://www.youtube.com/watch?v=NyuuK7tB9fM","https://chromium.googlesource.com/chromium/src/+/refs/heads/main/docs/accessibility/os/chromevox.md"]},{"id":"orca","n":"Orca","co":"gnome","cat":"Screen Readers","yr":2006,"y":"2006 to present","o":"The GNOME desktop screen reader, with speech, braille and magnification.","h":"Released in 2006 by Sun Microsystems. It replaced Gnopernicus in GNOME 2.16. Orca began in May 2004 as a prototype by Marc Mulcahy, a blind programmer at Sun Microsystems. Sun's Accessibility Program Office carried on the work and released the first official version on September 3, 2006. From GNOME 2.16 it replaced Gnopernicus as GNOME's default screen reader, and it ships with Solaris, Fedora, openSUSE and Ubuntu. After Oracle bought Sun in 2010 and cut the full-time GNOME accessibility jobs, including maintainer Willie Walker's, volunteers led by Joanmarie Diggs kept it going. Igalia hired Diggs on September 7, 2011 to continue the work. The name continues a tradition of naming screen readers after sea creatures, like JAWS, Flipper and Dolphin.","s":{"os":"Linux / Unix with GNOME (AT-SPI)"},"pre":["gnopernicus"],"src":["https://ashton.codes/dai11y-19-01-2021/","https://en.wikipedia.org/wiki/List_of_screen_readers","https://en.wikipedia.org/wiki/Orca_(assistive_technology)"]},{"id":"gnopernicus","n":"Gnopernicus","co":"gnome","cat":"Screen Readers","yr":2001,"y":"December 7, 2001 (first release) to 2006 (1.1.2, August 21, 2006)","o":"An earlier GNOME screen reader and magnifier developed by BAUM Engineering, using AT-SPI.","h":"Bundled with GNOME until Orca replaced it in GNOME 2.16. Development began in 2001, and the first release is dated December 7, 2001. Gnopernicus was a free, LGPL-licensed, one-size-fits-all program written in C that gave speech, braille and magnification through GNOME's AT-SPI accessibility layer. Users could customize voices, keyboard commands, braille display keys and magnification, and even edit the XML files that defined speech and braille output. It became the default screen reader in GNOME 2.4 on September 10, 2003. The last release, 1.1.2, came on August 21, 2006, and Orca then replaced it in GNOME.","s":{"os":"Unix-like (GNOME)"},"suc":["orca"],"src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://en.wikipedia.org/wiki/Gnopernicus"]},{"id":"speakup","n":"Speakup","co":"linuxcommunity","cat":"Screen Readers","yr":1998,"y":"October 29, 1998 to present","o":"A Linux kernel-level console screen reader.","h":"Kirk Reiser announced the first alpha (v0.01) on October 29, 1998 as kernel patches for development kernels 2.1.123 and 2.1.125, supporting only the DoubleTalk synthesizer. Andy Berdan, John Covici, and Brian and David Borowski contributed. Its 2004 FAQ says it works with kernels 2.6.18 or later; Speakup 2.0 covered 2.4 and early 2.6 kernels.","s":{"os":"Linux (kernel)"},"req":["1998 alpha: Linux kernels 2.1.123 or 2.1.125 and a DoubleTalk synthesizer","Later: kernel 2.6.18 or later (2.0 for 2.4 and early 2.6 kernels)"],"src":["https://lkml.iu.edu/9810.3/0735.html","http://www.linux-speakup.org/faq.html"]},{"id":"emacspeak","n":"Emacspeak","co":"linuxcommunity","cat":"Screen Readers","yr":1994,"y":"October 1994 (open source April 1995) to present","o":"T. V. Raman's complete audio desktop for Emacs. It speaks the underlying information rather than reading the visual screen.","h":"Raman began it in October 1994 on a Linux laptop with a DECtalk Express, and speech-enabled the Emacs calendar in its first weeks. Its speech-server abstraction let it add IBM ViaVoice in 1999. The 2004 Speakup FAQ listed it at version 20. Emacspeak was developed mainly by T. V. Raman, blind since childhood, and first released in April 1995. Rather than reading the screen, it is a speech-enabled 'audio desktop' built into Emacs, written largely in Emacs Lisp, with some Tcl. It speaks content directly and uses short sounds for actions such as opening a menu or closing a file. As of 2002 its default synthesizer was IBM ViaVoice TTS, which can be swapped for other software synthesizers. In 2014 Raman wrote about how its design had changed over 20 years.","s":{"os":"Emacs on Unix/Linux and others","tts":"DECtalk Express originally"},"vo":["dt_paul"],"src":["https://emacspeak.sourceforge.net/raman/publications/bc-emacspeak/publish-emacspeak-bc.html","http://www.linux-speakup.org/faq.html","https://en.wikipedia.org/wiki/Emacspeak"]},{"id":"brltty","n":"BRLTTY","co":"linuxcommunity","cat":"Screen Readers","yr":1995,"y":"1995 (0.22 beta) to present","o":"A background service that gives braille-display access to the Linux text console.","h":"Started in 1995 by Cambridge students Nikhil Nair and James Bowden; Nair wanted to use his CombiBraille. Version 0.22 beta was announced in December 1995 and 1.0 in July 1996. Speech support came in 1.0.1. Nicolas Pitre took over in 1998 (1.9.0), and Dave Mielke from 2001. BRLTTY runs as a background daemon that drives a refreshable braille display for the Linux and Unix text console. It can start at boot, so it reads login prompts and console messages, and it is suitable for system administration. Features include full screen review, cursor routing, cut and paste between virtual terminals, table-driven contracted braille (English, French and German provided), several braille codes, screen freezing, a preferences menu, basic speech and an API for other programs.","s":{"os":"Linux / Unix"},"src":["https://brltty.app/pipermail/brltty/2015-December/013007.html","https://www.ibiblio.org/pub/historic-linux/ftp-archives/sunsite.unc.edu/Sep-29-1996/system/Access/brltty-1.0.2.README","https://brltty.app/"]},{"id":"fenrir","n":"Fenrir","co":"linuxcommunity","cat":"Screen Readers","yr":2017,"y":"Repository July 2016; 1.0 released February 7, 2017","o":"A modern, modular user-space console screen reader written in Python 3.","h":"The GitHub project (chrys87/fenrir) was created in July 2016, and version 1.0 was announced on February 7, 2017. Development later moved to a new home. It runs on Linux and, through its pty driver, on macOS, BSD and Windows.","s":{"os":"Linux (vcsa, evdev and pty drivers); macOS, BSD and Windows through the pty driver","tts":"espeak or espeak-ng via the generic driver (default); Speech Dispatcher"},"req":["Python 3.3 or later","Linux evdev input: python-evdev 0.6.3 or later, pyudev, uinput kernel module","vcsa screen driver: python-dbus and read access to /dev/vcsa","Speech: espeak or espeak-ng, or Speech Dispatcher with python-speechd"],"vo":["espeakng"],"src":["https://github.com/chrys87/fenrir","https://lists.gnome.org/archives/orca-list/2017-February/msg00079.html"]},{"id":"jenux","n":"Jenux","co":"linuxcommunity","cat":"Accessible Linux","yr":0,"y":"Active by January 2023 (the Jenux-2023.01.17 dual ISO on the Blinux list); ISO, Docker and Crostini builds were updated in October 2026.","o":"An Arch Linux-based distribution for blind users that speaks during installation and boot, with Orca on MATE and Fenrir.","h":"Developed by Daniel Nash. A dual ISO (Jenux-2023.01.17) was discussed on the Blinux list in January 2023. ISO, Docker and Crostini builds were updated at jenux.dev in October 2026.","s":{"os":"Arch Linux base, MATE desktop"},"src":["https://jenux.dev/","https://www.mail-archive.com/blinux-list@redhat.com/msg08419.html"]},{"id":"coconut","n":"Accessible-Coconut","co":"zendalona","cat":"Accessible Linux","yr":2014,"y":"Releases through 22.04.04 (ISO July 2025) and 24.04.01","o":"A community GNU/Linux distribution based on Ubuntu MATE, fully accessible without vision.","f":["Screen reader with speech and braille","Print reading with a scanner","Six-key braille input","Typing tutor, math tutor, accessible chess","DAISY player and ebook speaker","Console (TTY) screen reader","Screen magnification"],"s":{"os":"Ubuntu MATE base (22.04 and 24.04 series)"},"req":["64-bit (amd64) PC; ISO about 3.7 GB (22.04.04)"],"src":["https://github.com/zendalona/accessible-coconut","https://sourceforge.net/projects/accessible-coconut/","https://zendalona.com/about-us/"],"h":" Accessible-Coconut comes from the Zendalona community in Kerala, India. Its roots go back to K. Sathyaseelan, who lost his sight at age 10 in 1970 and moved to Ubuntu and the Orca screen reader in 2007. Nalin Sathyan, Zendalona's founder and a three-time Google Summer of Code winner, built tools such as Easy-OCR (2009), Lios OCR (2011), Sharada Braille Writer (2012) and IBus-Braille (accepted into Debian in 2015). The first Accessible-Coconut release came in 2014. The group took the name Zendalona in 2020, registered as a non-profit in 2022, and became a Google Summer of Code mentoring organization in 2024."},{"id":"ztdos","n":"ZoomText for DOS","co":"ai","cat":"Screen Readers","yr":1988,"y":"1988","o":"Ai Squared's original DOS screen magnifier.","s":{"os":"MS-DOS"},"suc":["ztwin"],"src":["https://afb.org/aw/18/6/15200","https://en.wikipedia.org/wiki/ZoomText","https://afb.org/aw/2/6/15003","https://afb.org/aw/1/1/16188","https://web.archive.org/web/20100407084612/http:/www.aisquared.com/about_us"],"h":" Ai Squared, of Manchester Center, Vermont, began making screen and text access products in 1987 and grew from a one-man operation. AccessWorld called ZoomText the first screen magnification program on the market, in 1988. The first Windows version followed in 1991. DOS support lived on as a bundle: in AccessWorld's reviews of around 2000 and 2001 the 'Plus' levels of ZoomText Xtra included ZoomText for DOS, at $595 (magnifier) or $795 (with speech), $200 more than the Windows-only levels. Ai Squared later merged with GW Micro, and Freedom Scientific acquired it in 2016."},{"id":"ztwin","n":"ZoomText (Windows) / Fusion","co":"fs","cat":"Screen Readers","yr":1991,"y":"1991 to present","o":"A screen magnifier with screen reading. Fusion bundles ZoomText with JAWS.","h":"The Windows version arrived in 1991. ZoomText 10.1 got update 10.11.8 for the Windows 10 Creators Update (2017). Version 2025 (2025.2502.63) added ARM64. Versions 2025 or later are required for Windows 11 25H2. Ai Squared first released ZoomText for MS-DOS in 1988. Freedom Scientific bought Ai Squared in 2016. ZoomText comes in two editions, Magnifier and Magnifier/Reader (with a built-in screen reader); it magnifies up to 60 times and supports two monitors. After version 11 (2017), it switched to year-based version numbers, and updates now arrive every four to six weeks. Version 2026.2605.28 came out in May 2026.","s":{"os":"Windows 10 and 11 (64-bit); ARM64 on Windows 11"},"req":["64-bit Windows 11, 10 or Server 2016 to 2025; ARM64 on Windows 11 (ZoomText 2025.2502.63 or later)","2 GHz i7 dual-core recommended","16 GB RAM recommended","DirectX 11 graphics","2 GB disk; SSD recommended","5-point multitouch display for touch support; USB 2.0 for ZoomText Camera"],"pre":["ztdos"],"src":["https://support.freedomscientific.com/content/documents/manuals/ZoomText/ZoomText_User_Guide_English_US.pdf","https://support.freedomscientific.com/downloads/arm64","https://afb.org/aw/18/6/15200","https://en.wikipedia.org/wiki/ZoomText"]},{"id":"viewscan","n":"Viewscan","co":"pulse","cat":"Magnifiers","yr":1980,"y":"1980","o":"A portable video magnifier from Wormald Sensory Aids, the group that became Pulse Data.","suc":["viewscants"],"src":["https://afb.org/aw/6/6/14572"]},{"id":"viewscants","n":"Viewscan Text System","co":"pulse","cat":"Magnifiers","yr":1983,"y":"1983","o":"A Viewscan with text-processing functions.","pre":["viewscan"],"src":["https://afb.org/aw/6/6/14572"]},{"id":"topaz","n":"TOPAZ","co":"fs","cat":"Magnifiers","yr":2005,"y":"December 2005","o":"A desktop video magnifier, up to 70x on a 17-inch monitor.","s":{"disp":"17-inch monitor, up to 70x"},"suc":["topazocr"],"src":["https://www.freedomscientific.com"]},{"id":"topazocr","n":"TOPAZ OCR","co":"fs","cat":"Magnifiers","yr":2017,"y":"December 15, 2017","o":"A TOPAZ with OCR and speech.","s":{"disp":"24-inch screen, 1.9x to 67x"},"pre":["topaz"],"src":["https://vispero.com"]},{"id":"ruby","n":"RUBY","co":"fs","cat":"Magnifiers","yr":2009,"y":"June/July 2009","o":"A pocket video magnifier.","ph":"7.7 oz.","s":{"disp":"4.3-inch, 2x to 14x","bat":"AAA batteries, rechargeable or disposable; about 2 hours","mag":"5x to 10x flat; 2x to 14x with handle extended"},"suc":["rubyhd"],"src":["https://www.freedomscientific.com","https://support.freedomscientific.com/content/Documents/Manuals/RUBY/RUBY-Users-Guide.pdf","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/ruby-une-loupe-electronique-portable-de-freedom","https://www.freedomscientific.com/products/lowvision/ruby/"],"desc":["RUBY is a pocket video magnifier from Freedom Scientific: a compact, brightly colored plastic case weighing 7.7 ounces, with a 4.3-inch widescreen color display on the front and a camera on the back. Freedom Scientific sells it in red with colored buttons, and a RUBY+ version in gray with high-contrast black and white buttons.","Four large buttons sit beside the screen, two on each side, each a different color with a raised dot on the spot you press. On the left are Power (green and yellow) and Color Select (blue), which cycles through full color, black on white, white on black, yellow on blue and yellow on black. On the right are Magnification (yellow), which steps through three levels, and Freeze Frame (red).","On the back is a fold-out handle with an opening in the middle so the camera can see through it when the handle is folded. The camera window is in the center, with an LED light at each end of the case. Unfold the handle to hold RUBY like a magnifying glass; fold it under to rest RUBY flat on a page.","The handle locks when open and doubles as the battery compartment. Unfolded flat, it is about 10 cm long and 4.5 cm wide, with a hatch for the AAA batteries, which can be rechargeable or disposable. Near the handle's hinge, in the lower right corner, is a post for the wrist strap.","On the top edge, toward the left, is the socket for the charger, with a small light beside it that shows charging or a low battery. Lying flat on a page, RUBY magnifies 5x and goes to 7.5x and 10x with the yellow button. With the handle out, it ranges from 2x to 14x depending on distance. A set of batteries lasts about two hours."]},{"id":"rubyhd","n":"RUBY HD","co":"fs","cat":"Magnifiers","yr":2014,"y":"January 2014","o":"An HD pocket magnifier.","s":{"disp":"2x to 13x"},"pre":["ruby"],"src":["https://www.freedomscientific.com"]},{"id":"merlin","n":"Merlin elite Pro","co":"ev","cat":"Magnifiers","yr":0,"y":"An Enhanced Vision desktop video magnifier, now sold under Vispero. Vispero's site gives no introduction year.","o":"Enhanced Vision's desktop magnifier.","s":{"disp":"24-inch, up to 70x"},"src":["https://vispero.com"]},{"id":"clearview","n":"Optelec ClearView C","co":"optelec","cat":"Magnifiers","yr":2014,"y":"2014","o":"A modular desktop video magnifier.","src":["https://vispero.com"]},{"id":"compactplus","n":"Optelec Compact+","co":"optelec","cat":"Magnifiers","yr":2007,"y":"2007","o":"A handheld electronic magnifier.","src":["https://vispero.com"]},{"id":"traveller","n":"Optelec Traveller HD","co":"optelec","cat":"Magnifiers","yr":2015,"y":"2015","o":"A portable HD magnifier.","src":["https://vispero.com"]},{"id":"explore8","n":"explorē 8","co":"hw","cat":"Magnifiers","yr":2017,"y":"Announced August 2017","o":"An 8-inch handheld HD magnifier with a touchscreen and physical buttons, and two cameras: one for close viewing and one for distance.","ph":"580 g.","s":{"disp":"8-inch 1280x800, 2x to 30x, two 21 MP cameras","bat":"Non-removable 6,700 mAh lithium polymer, 4.5 hours; 3.5-hour charge","price":"$1,099 (2017)","dim":"204 × 153.2 × 24 mm (8 × 6 × 0.94 in)","wt":"580 g (1.3 lb)","io":"USB-C, HDMI"},"src":["https://store.humanware.com","https://afb.org/aw/18/9/15172","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/loupe-electronique-portable-explore-8-dhumanware","https://www.maxiaids.com/product/humanware-explore-8-inch-handheld-electronic-video-magnifier"],"h":" Its two 21-megapixel cameras cover close work from 8.5 to 15 cm and distance from 15 cm to infinity. It offers 17 color schemes and auto-shutoff after 1, 2, 5 or 10 minutes. Its LED lights turn off when it is lifted. It is for low vision, with no speech output.","desc":["The explorē 8 is an 8-inch handheld video magnifier from HumanWare. It is 8 inches wide, 6 inches tall and just under an inch thick, and weighs 580 grams, about 1.3 pounds. It has a rubberized grip.","The front is almost entirely an 8-inch touchscreen. Below it is a control panel with three large physical buttons: Zoom minus on the left, a contrast or color button in the middle, and Zoom plus on the right. The zoom buttons change magnification in half steps, or continuously when held.","The left side has, from the top, the power button, an HDMI port for a TV and a USB-C port for charging and a computer. On the top edge, at the right, is a capture button: a press freezes the image, and a long press saves it.","On the back, at the top center, are two cameras, one for close-up reading and one for distance, flanked by two rows of three LED lights.","Along the bottom of the back is a solid alloy folding stand the full width of the device. Opened, it tilts the screen about 30 degrees toward you on a table and switches to the close-up camera."]},{"id":"prodigi","n":"Prodigi","co":"hw","cat":"Magnifiers","yr":2013,"y":"Announced 2013","o":"A tablet-based magnifier and reader. Its software lives on in the Connect 12.","suc":["connect12"],"src":["https://store.humanware.com"]},{"id":"connect12","n":"Connect 12","co":"hw","cat":"Magnifiers","yr":2017,"y":"2nd generation 2017; current tablet on Android 12","o":"A 12-inch Android magnifier tablet with a folding stand, OCR in 58 languages and TTS in 20.","ph":"Folded 240 x 400 x 29 mm, 1,940 g. Tablet alone 301 x 186 x 10 mm, 840 g.","io":"USB-C, 3.5 mm jack, Wi-Fi a/b/g/n/ac, Bluetooth 5.0, GPS, microSD up to 64 GB","s":{"cpu":"Quad-core","sto":"32 GB eMMC","os":"Android 12","disp":"11.6-inch 1920x1080; live 1x to 40x; 13 MP camera","bat":"7+ hours (tablet), 4.5 hours with stand light"},"pre":["prodigi"],"src":["https://store.humanware.com/int/connect-12-smart-portable-hd-magnifier.html"]},{"id":"svgrad","n":"SmartView Graduate","co":"hw","cat":"Magnifiers","yr":0,"y":"A HumanWare desktop video magnifier. HumanWare's store page gives no introduction year.","o":"A desktop distance and near magnifier, up to 50x.","src":["https://store.humanware.com"]},{"id":"es1","n":"eSight (1st generation)","co":"esight","cat":"Vision Wearables","yr":2013,"y":"2013","o":"The first eSight: a camera with two LCD screens, wired to a handheld controller and power unit.","f":["1.5x to 14x zoom","Six color modes"],"s":{"bat":"No onboard battery (wired controller)","price":"$15,000 (introductory 2013 price reported as $9,750)"},"suc":["es2"],"src":["https://en.wikipedia.org/wiki/ESight","https://betakit.com/kanata-based-esight-launches-smart-glasses-to-cure-the-legally-blind/","https://oepatients.org/esight-up-close/","https://newatlas.com/esight-seeing-aid/29514"],"desc":["The original eSight, produced commercially from fall 2013, mounts on a prescription-style frame worn like glasses.","At the front is an HD camera, and in front of the eyes are two small near-eye screens showing the enhanced live image.","A wire runs from the headset to a hand-held controller that processes the image and adjusts zoom and contrast.","The controller has a separate battery pack rated at about four hours, carried on a belt or in a pouch. The headset itself has no battery. One user report found it heavier than expected.","It cost $15,000; an introductory 2013 price of $9,750 was also reported."]},{"id":"es2","n":"eSight 2","co":"esight","cat":"Vision Wearables","yr":2015,"y":"May 2015","o":"Upgraded HD OLED screens, better color and resolution, and longer battery life.","s":{"disp":"HD OLED; 1.5x to 14x","price":"About $15,000"},"pre":["es1"],"suc":["es3"],"src":["https://en.wikipedia.org/wiki/ESight","https://ww1.prweb.com/prfiles/2015/03/26/12609757/esight_features.pdf","https://healthtechinsider.com/2015/09/03/esight-eyewear-making-daily-life-easier-improving-vision/"],"desc":["The eSight 2 (May 2015) is a headset with two HD OLED screens in front of the eyes and a high-resolution camera at the front. 2015 reports call it lightweight but don't give a weight.","You adjust magnification, contrast and color for your vision.","Like the first eSight, it uses a separate controller. The controller holds a swappable battery giving about four hours, and it can stay plugged in to charge while you use the headset.","Its price was about $15,000, with financial help available through eSight.","The sources checked give no exact measurements for the headset."]},{"id":"es3","n":"eSight 3","co":"esight","cat":"Vision Wearables","yr":2017,"y":"February 2017","o":"A lighter headset with a high-resolution autofocus camera.","ph":"104 g.","io":"HDMI, USB, Bluetooth, Wi-Fi, SD","s":{"disp":"Dual 1024x768 OLED, 37.5 degree diagonal field of view; 21.5 MP autofocus camera; up to 24x","bat":"Integrated lithium-ion, about 6 hours","wt":"104 g (headset)"},"pre":["es2"],"suc":["es4"],"src":["https://esighteyewear.com/wp-content/uploads/2020/03/Customer-Facing-eSight-3-Specifications-Sheet-4.pdf","https://www.theverge.com/circuitbreaker/2017/2/16/14637804/esight-3-augmented-reality-headset-legally-blind-see","https://displaydaily.com/the-esight-3-headset-offers-help-to-the-vision-impaired/","https://www.usatoday.com/story/tech/columnist/2017/02/15/high-tech-glasses-helping-blind-people-see/97960470/","https://esighteyewear.com/wp-content/uploads/2020/03/eSight-3-User-Guide-4000338-Rev-G-EN.pdf","https://www.manualslib.com/manual/1643221/Esight-3.html"],"desc":["eSight 3 has two parts: a headset worn like glasses and a hand-sized controller. The headset weighs 104 grams. It has a lensless frame with a nosepad (prescription lenses can be fitted), a padded forehead band, and a headstrap that wraps around the back of the head and snaps on magnetically. Fitted properly, the band and strap form a snug halo and the headset doesn't move when you shake your head.","The front of the headset holds a 21.5-megapixel autofocus camera and a small light. Inside are two OLED screens, one for each eye. The whole display unit tilts on a hinge, from 45 degrees up to 10 degrees down: fully down for reading or TV, half up so you look under it with your own vision when moving around, or fully up out of the way for conversation. eSight warns never to walk with it fully down.","The controller has dials on both sides. On the right side are two dials you roll up or down and also press: the top one is contrast (press to change contrast modes) and the other is focus (press to switch between near manual, far manual and auto focus). On the left side are the zoom dial (roll for up to 24x; press and hold for a quick unmagnified view), the power button, a photo button, and a power and battery light.","The face of the controller has a trackpad surrounded by four buttons at the compass points: north is Home (resets to start-up settings), south is Menu Back and Control Lock, west freezes and resumes the picture, and the fourth button turns on panning mode. Pressing the trackpad opens the menu, and sliding a finger up or down moves through it. Hold the power button for on, standby or off. A door on the controller covers its USB-C charging port.","The headset has speakers for spoken menus, and a micro HDMI input lets you watch a computer, TV box or game console directly in the screens. In the box: the headset and controller, the frame, a USB cable and wall adapter, a belt clip, wrist and neck lanyards, a digital video cable, an SD card, a spare forehead band, a microfiber bag and a carry case. eSight says not to use it in rain or snow."]},{"id":"es4","n":"eSight 4","co":"esight","cat":"Vision Wearables","yr":2020,"y":"2020","o":"The fourth eSight, with swappable batteries.","s":{"disp":"Two 1280 × 960 OLED screens","bat":"Swappable, about 3 hours each","dim":"Not published by eSight (its spec sheet lists weight only, 596 g)","wt":"596 g (1.31 lb) with battery","price":"$5,950 (2020)","sto":"256 GB","syns":"Spoken menus only (no document text-to-speech at review time)"},"pre":["es3"],"suc":["esgo"],"src":["https://esighteyewear.com","https://afb.org/aw/21/11/17299","https://www.visionaid.co.uk/esight-4","https://esighteyewear.com/wp-content/uploads/2021/08/eSight-4-Technical-Specifications.pdf"],"desc":["The eSight 4 (2020) is worn like large sunglasses rather than ski goggles. A visor sits in front of your eyes, mounted on a padded 'halo comfort band' that goes around your head. It weighs about 596 g (1.31 lb) with a battery.","The halo band adjusts to your head size. The visor slides closer or farther from your eyes so you can wear prescription glasses underneath, tilts in or out, and flips up out of the way. It doesn't cover your whole face, so you keep some peripheral vision.","An 18-megapixel camera is mounted on the visor just above your nose. Inside the visor are two 1280 × 960 OLED screens, one for each eye.","On the right arm is a small touchpad with a line of bumps before and after it. You slide forward or back to zoom. A power button and a context button are on the headset, and three speakers are built in. A separate wireless remote gives the full menu, and a phone app works too.","At the back of the head, a lithium-ion battery pack plugs into a quick-connect port. Two packs come in the box, each rated at 3 hours, and the headset holds enough charge to swap batteries without shutting down. It has 256 GB of storage, Wi-Fi, Bluetooth and HDMI."]},{"id":"esgo","n":"eSight Go","co":"esight","cat":"Vision Wearables","yr":2024,"y":"Announced January 3, 2023 (CES); commercial availability 2024","o":"eSight's fifth-generation wearable: a lightweight glasses-style headset with a neck battery pack.","ph":"170 g glasses-style device with a neck battery pack.","s":{"disp":"Two 1920 × 1080 OLED screens, 45° field of view","bat":"About 3 hours (device plus neck battery pack)","price":"$4,950 MSRP (current)","syns":"None (a magnification headset, not a speech device)","wt":"About 170 g"},"pre":["es4"],"src":["https://esighteyewear.com","https://www.globenewswire.com/news-release/2023/01/03/2582388/0/en/esight-announces-newest-generation-of-assistive-device-for-the-legally-blind-esight-go.html","https://www.esighteyewear.com/esight-go-pricing/","https://www.esighteyewear.com/esight-go-landing-page/","https://www.esighteyewear.com/wp-content/uploads/2024/06/eSight-User-Manual-10.pdf","https://www.forbes.com/sites/gusalexiou/2024/01/26/what-gentexs-acquisition-of-esight-means-for-the-low-vision-eyewear-market/","https://www.esighteyewear.com/wp-content/uploads/2024/08/eSight-Go-User-Manual_7_24_24.pdf"],"io":"USB-C, Wi-Fi (2.4 GHz only), Bluetooth, remote control, integrated speakers.","desc":["The eSight Go is shaped like glasses rather than a headset. The glasses part weighs about 170 g.","Inside are two 1920 × 1080 OLED screens with a 45-degree field of view.","An autofocus camera at the front gives up to 24× zoom, with adjustable contrast and color filters.","Instead of a head strap, a battery pack hangs around your neck; a neck lanyard spreads the weight. Batteries in the device and the neck pack give about 3 hours (180 minutes) per charge.","Its current list price is $4,950."]},{"id":"orcam1","n":"OrCam MyEye (1st generation)","co":"orcam","cat":"Vision Wearables","yr":2015,"y":"2015","o":"A glasses-mounted camera wired to a base unit that reads text aloud.","suc":["orcam2"],"src":["https://www.orcam.com","https://afb.org/aw/18/2/15244"],"desc":["The first OrCam has two parts joined by a cable: a small camera and speaker that clips onto your glasses, and a processor unit you carry in a pocket or on a belt. When something is in front of the camera, it reads the text aloud or names the item.","The head unit snaps onto the right arm of nearly any standard-size pair of glasses or sunglasses; wire frames would not work. Once attached, the 8-megapixel camera sits at the very front of the frame and the speaker toward the back, aimed at your right ear. It weighs just over an ounce.","Some prerelease units used bone-conduction earphones, but the released version has a single speaker. Users with hearing loss in the right ear can plug headphones, an external speaker or a hearing aid into the processor unit instead.","The processor unit has an audio jack and a charging port. On one edge are the Power button and a Volume Up/Down rocker; on the opposite edge is the Trigger button.","Press the Trigger to scan, or hold it for two seconds with either Volume button to open Settings. Most essential features can be used without pressing the Trigger at all."],"s":{"disp":"8 MP camera"}},{"id":"orcam2","n":"OrCam MyEye 2","co":"orcam","cat":"Vision Wearables","yr":2017,"y":"2017","o":"A self-contained magnetic clip-on reader.","ph":"22.5 g; 76 x 21 x 14.9 mm.","s":{"disp":"13 MP camera","bat":"320 mAh"},"pre":["orcam1"],"suc":["orcam3"],"src":["https://www.orcam.com","https://afb.org/aw/19/8/15066","https://device.report/m/b0a794314e8928ae68d7e03019e300fdd0654aaf7f7bf054c6a0d2fe3a840004.pdf"],"desc":["The OrCam MyEye 2 is a single small bar, about 3 inches long, 0.83 inch high and 0.59 inch thick, that clips magnetically to the arm of a pair of glasses. There's no cable and no separate box: the camera, speaker, battery and controls are all in the bar.","The camera is at the front end, facing forward, with small lights beside it for dim places. The back end, near your ear, has the speaker, the charging port and a small loop for the lanyard. Wear the lanyard: the unit can be knocked off the glasses.","The outer side, facing away from your head, is rounded and has a raised touch bar running along it that clicks when pressed, plus an indicator light. Tap it to read or recognize what's in front of you; swipe forward or back to change the volume or skip through text; double-tap to pause or resume.","The inner side, against the glasses, is flat. It has the magnets that hold it to the mount, the power button near the speaker end, and a second indicator light. A short press of power suspends it; a second press before it suspends turns it off.","The box includes glasses with a mount already fitted, a mount kit with small scissors to fit other frames (on either arm), a charger, a leather case and the lanyard. AccessWorld noted that the small size and touch bar may be hard for anyone with limited dexterity."]},{"id":"orcam3","n":"OrCam MyEye 3 Pro","co":"orcam","cat":"Vision Wearables","yr":2024,"y":"2024","o":"The current OrCam MyEye.","pre":["orcam2"],"src":["https://www.orcam.com","https://img1.wsimg.com/blobby/go/b705e79c-b611-4aa3-af3a-dddf36dee121/downloads/590732a7-209c-4f42-82d3-7483b0858719/MyEye%203%20Instruction%20Brochure.pdf?ver=1762352115649","https://www.visionaid.co.uk/orcam-myeye-3-pro"],"ph":"76 x 21 x 14.9 mm (3 x 0.8 x 0.6 in); 22.5 g (0.79 oz); 13 MP camera; 320 mAh battery.","desc":["The OrCam MyEye 3 Pro is a single slim bar about the size of a finger: 3 inches long, about 0.8 inch high and 0.6 inch thick, weighing 22.5 grams (under an ounce). It clips magnetically to the side of a pair of glasses, with no cable or separate box. The camera, speaker, battery and controls are all inside the bar.","The 13-megapixel camera is at the front end, facing forward, with built-in lights to illuminate text. A small built-in speaker reads aloud near your ear; OrCam Bluetooth earphones are an option for privacy.","The outer long side carries a raised touch bar. Tap it to start or stop reading, double-tap to pause or resume (or, when idle, to open the setup menu), and swipe forward or back to change the volume or skip through text. Holding a finger on the bar while facing a person about 3 feet away teaches it a face; it can store up to 100. You can also point a finger at text, or say \"Hey OrCam\" followed by a command.","The inner long side, against the glasses, has two magnets you can feel with a fingertip, and the power button next to them. Hold power for 2 seconds to turn it on; press it until you hear \"Suspended, press again to shut down\" to turn it off. It charges from a standard 5-volt phone charger through USB-C.","In the box (from UK dealer VisionAid): the MyEye 3 Pro, a stand, a speaker, a neck lanyard, unisex glasses, three magnetic mounts, a USB power adapter and cable, and a case. Placed on the stand and connected by USB-C or Wi-Fi to a computer browser at cast.orcam.com, it works as a desktop magnifier with an AI assistant that answers questions about a scanned page."]},{"id":"aira","n":"Aira Horizon glasses","co":"aira","cat":"Vision Wearables","yr":2018,"y":"2018","o":"Aira's smart glasses for live visual-interpreter sessions, with a 120-degree camera.","src":["https://aira.io"]},{"id":"envgl","n":"Envision Glasses","co":"envision","cat":"Vision Wearables","yr":2020,"y":"November 2020","o":"AI reading and scene-description glasses built on Google Glass Enterprise Edition 2.","s":{"ram":"3 GB LPDDR4","sto":"32 GB","disp":"640x360; 8 MP camera","bat":"5 to 6 hours","cpu":"Qualcomm Snapdragon XR1","os":"Android 8.1 (Google Glass Enterprise Edition 2 hardware)","price":"Professional Edition $3,499","syns":"Speech through the glasses' speaker, generated by Envision's software; Envision's spec sheet does not name the TTS engine","wt":"46 g"},"src":["https://support.letsenvision.com","https://shop.letsenvision.com/products/glasses-professional","https://support.google.com/glass-enterprise/customer/answer/9220200?hl=en","https://support.letsenvision.com/hc/en-us/articles/7604953925777-Hardware-Form-and-Design","https://support.letsenvision.com/hc/en-us/articles/7604910350609-Technical-Specifications"],"desc":["Envision Glasses look like a band across your face: a thin titanium frame on the left and a wider black Glass body on the right. They come assembled in a protective carrying case.","The Glass body forms the right arm and holds all the electronics, about 45 g. At its back end are the USB-C port, the power button and the speaker.","Along the outside of the right arm, against your temple, is the touchpad for taps and swipes.","The body folds forward in front of your right eye. That front part holds a small display that can be switched off and the camera. Moving your finger along the body, you feel an indent at the hinge, which you press for voice commands.","The titanium frame makes up the bridge and left arm and attaches with round metal hinges. Smith Optics frames with swappable lenses can be ordered."]},{"id":"irisv","n":"IrisVision","co":"iris","cat":"Vision Wearables","yr":2017,"y":"2017","o":"A low-vision magnifier made from a Samsung Galaxy S7 and Gear VR headset.","s":{"disp":"70 degree field of view; up to 12x","price":"About $2,500"},"src":["https://irisvision.com"]},{"id":"nueasy","n":"NuEyes Easy","co":"nueyes","cat":"Vision Wearables","yr":2016,"y":"2016","o":"NuEyes' first head-worn magnifier.","s":{"price":"$5,995","wt":"About 125 g"},"suc":["nuepro4"],"src":["https://www.nueyes.com","https://www.newswire.ca/news-releases/nueyes-visual-prosthetic-device-arrives-in-canada-579873661.html"],"desc":["The NuEyes Easy (2016) was developed with Osterhout Design Group (ODG), which made glasses for military uses. It weighs about 125 g, slightly less than an iPhone 6, with no wired controller or battery pack.","It is worn like glasses. Two digital microphones and stereo earphones that attach with magnets are built in, along with haptic vibration in the temples.","An autofocus high-definition camera and an LED light for dark places are at the front. It magnifies up to 12× and boosts contrast.","It is controlled by voice, by manual controls on the glasses, or by a wireless Bluetooth controller worn on a finger.","It has Bluetooth, Wi-Fi, GPS, and other sensors. Its listed price is $5,995."]},{"id":"nuepro4","n":"NuEyes Pro (Pro, Pro 3, Pro 4)","co":"nueyes","cat":"Vision Wearables","yr":0,"y":"By October 2024, when the Pro 4 LV brochure was published. Its predecessor, the Pro 3, was announced on December 15, 2020.","o":"NuEyes' smart-glasses line, up to 12x magnification on the Pro 4.","pre":["nueasy"],"src":["https://www.nueyes.com","https://www.nueyes.com/pro4","https://nelowvision.com/product/nueyes-pro4-lv-low-vision-glasses/","https://nelowvision.com/wp-content/uploads/2024/10/NuEyes-Pro-4-Brochure.pdf"],"h":"NuEyes announced the Pro 3 on December 15
