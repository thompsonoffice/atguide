<style>:root{--bg:#fff;--fg:#111;--muted:#444;--card:#f4f6f9;--bd:#6b7280;--acc:#0b4fb3;--on:#0b4fb3;--onfg:#fff;--focus:#c2410c;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--fg:#f3f4f6;--muted:#c9ced6;--card:#1d222a;--bd:#8b93a1;--acc:#8ab4ff;--on:#8ab4ff;--onfg:#0b0f14;--focus:#ffb35c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0 auto;max-width:720px;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
h1{font-size:1.6rem;margin:4px 0}h2{font-size:1.35rem;margin:24px 0 8px}h3{font-size:1.15rem;margin:18px 0 6px}h4{font-size:1rem;margin:14px 0 4px}
p{margin:6px 0}header p,footer p{color:var(--muted);font-size:.95rem}
nav ul,.list{list-style:none;padding:0;margin:8px 0 16px}
nav ul{display:flex;flex-wrap:wrap;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
button,select,input{font:inherit;color:inherit}
.item,.btn,.nav{min-height:48px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer;touch-action:manipulation}
.item{display:block;width:100%;text-align:left;padding:12px 14px}
.item .t{display:block}.item .sub{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.btn,.nav{padding:10px 16px;min-width:48px}
.nav.on{background:var(--on);color:var(--onfg);font-weight:700;text-decoration:underline;border-width:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{display:block;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:17px}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{text-align:left;vertical-align:top;padding:8px 0;border-bottom:1px solid var(--bd)}
th{width:40%;padding-right:10px;font-weight:600}
a{color:var(--acc);text-decoration:underline;word-break:break-word}
.src li,.bul li{margin:8px 0}.src,.bul{padding-left:20px}
.src a{display:inline-block;min-height:44px;padding:10px 0}
.triv li{border-bottom:1px solid var(--bd);padding-bottom:8px}
:focus-visible,h2:focus{outline:3px solid var(--focus);outline-offset:2px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:14px;background:var(--card);padding:12px;z-index:9}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

a.btn.dl{display:inline-flex;align-items:center;text-decoration:none;color:inherit;font:inherit;box-sizing:border-box}
</style>

<script>window.ATG={"CO":[{"id":"fs","n":"Freedom Scientific","f":"2000","h":"Formed in 2000 from Henter-Joyce (JAWS), Arkenstone's reading-machine line (OpenBook) and Blazie Engineering (Braille 'n Speak). Makes JAWS, the Focus braille displays, PAC Mate and the TOPAZ and RUBY magnifiers. In late 2015 Vector Capital merged it with Optelec to form VFO, which was renamed Vispero in 2018. Freedom Scientific remains a Vispero brand.","src":["https://en.wikipedia.org/wiki/Freedom_Scientific"]},{"id":"hj","n":"Henter-Joyce","f":"1985","h":"Founded in 1987. Released JAWS for DOS in 1989 and JAWS for Windows 1.0 in January 1995. Merged into Freedom Scientific in 2000.","src":["https://en.wikipedia.org/wiki/Freedom_Scientific","https://en.wikipedia.org/wiki/JAWS_(screen_reader)"]},{"id":"blazie","n":"Blazie Engineering","f":"1986 (Deane Blazie, Forest Hill, Maryland)","h":"Deane Blazie's company. It introduced the Braille 'n Speak at the 1987 NFB convention, followed by the Type 'n Speak and the Braille Lite line. AFB reported about 70,000 of its notetakers in use. Merged into Freedom Scientific in 2000.","src":["https://afb.org/aw/11/1/16078","https://www.duxburysystems.org/downloads/library/news/new62.htm","https://nfb.org/images/nfb/publications/bm/bm00/bm0005/bm000502.htm"]},{"id":"blazietech","n":"Blazie Technologies","f":"2022 (Florida LLC registered September 22, 2022)","h":"A newer company from Deane Blazie. It released the BT Speak ($795) and BT Speak Pro ($1,195) in 2024 and demonstrated a BT Braille in March 2026.","src":["https://blazietech.com/btspeak-hardware","https://blazietech.com","https://bisprofiles.com/fl/blazie-technologies-l22000414170","https://www.blazietech.com/press-release"]},{"id":"ark","n":"Arkenstone","f":"1989","h":"Founded in 1989 by Jim Fruchterman to build affordable reading machines, including OpenBook. Its reading-machine line merged into Freedom Scientific in 2000.","src":["https://en.wikipedia.org/wiki/Freedom_Scientific"]},{"id":"gw","n":"GW Micro","f":"February 15, 1990","h":"Founded in Fort Wayne, Indiana by Doug Geoffray and Dan Weirich. Products: the Vocal-Eyes DOS screen reader (1990), the Sounding Board speech card and Window-Eyes (1.0 in October 1995). It was the US distributor of HIMS BrailleSense products from about 2006 to late 2010. Merged with Ai Squared in May 2014. Window-Eyes development ended in 2017 under VFO.","src":["https://afb.org/aw/3/1/14962","https://afb.org/aw/18/6/15200"]},{"id":"ai","n":"Ai Squared","f":"1987 (Manchester Center, Vermont)","h":"Maker of ZoomText, which appeared for DOS in 1988 and Windows in 1991. Merged with GW Micro in 2014 and joined VFO in June 2016. ZoomText is now sold by Freedom Scientific.","src":["https://afb.org/aw/18/6/15200","https://web.archive.org/web/20100407084612/http:/www.aisquared.com/about_us"]},{"id":"vfo","n":"VFO / Vispero","f":"2015","h":"Formed in late 2015 when Vector Capital merged Freedom Scientific and Optelec. Ai Squared joined in June 2016, The Paciello Group in 2017 and Enhanced Vision in January 2018. Renamed Vispero on September 24, 2018.","src":["https://en.wikipedia.org/wiki/Freedom_Scientific","https://vispero.com"]},{"id":"aph","n":"American Printing House for the Blind (APH)","f":"1858","h":"A Louisville, Kentucky nonprofit that publishes accessible materials and products. Its electronics include the Book Port, the Braille+ Mobile Manager (with LevelStar), the Refreshabraille 18 and the Orbit Reader 20. With HumanWare it makes the Mantis Q40, the Chameleon 20 and the Monarch.","src":["https://www.aph.org","https://sites.aph.org/news/may-2007/"]},{"id":"pulse","n":"Pulse Data International","f":"1988","h":"Roots in the Wormald Sensory Aids Division led by Russell Smith: the Viewscan video magnifier (1980), the Viewscan Text System (1983) and the Keynote talking word processor (1986). Pulse Data was formed in Christchurch, New Zealand by a management buyout in 1988. It built the BrailleNote (2000) and Keynote Gold synthesizer, bought its US distributor HumanWare in 2001, and merged with VisuAide in January 2005 to form the HumanWare Group.","src":["https://afb.org/aw/6/6/14572","https://en.wikipedia.org/wiki/BrailleNote"]},{"id":"visuaide","n":"VisuAide","f":"1988 (Quebec)","h":"A Canadian maker of the Victor Reader DAISY players (Victor Reader Classic, about 2002) and the Trekker GPS (2003). Merged with Pulse Data in January 2005 to form HumanWare.","src":["https://afb.org/aw/6/6/14572","https://www.biospace.com/b-pulse-data-international-b-and-b-visuaide-b-merge"]},{"id":"hw","n":"HumanWare","f":"2005 (as HumanWare Group)","h":"Originally the US distributor for Pulse Data. Pulse Data bought it in 2001, and the 2005 merger with VisuAide created the HumanWare Group (Longueuil, Quebec, and Christchurch). Product lines: BrailleNote, Victor Reader, Brailliant, explorē and Connect magnifiers, the DeafBlind Communicator and, with APH, the Mantis, Chameleon and Monarch.","src":["https://afb.org/aw/6/6/14572","https://store.humanware.com"]},{"id":"orbit","n":"Orbit Research","f":"1998","h":"Founded by Venkatesh Chari. Makes low-cost braille: the Orbit Reader 20 (for APH, 2017), Orbit Reader 40, the Graphiti tactile graphics display (2016), the Orbit Speak (2022), the Slate multiline displays (2022) and the Orbit Reader Q40 (2025).","src":["https://www.orbitresearch.com"]},{"id":"esight","n":"eSight","f":"2006","h":"Founded by Conrad Lewis to build electronic glasses for people with low vision. Models: eSight 1 (2013), eSight 2 (2015), eSight 3 (2017), eSight 4 (2020) and eSight Go (2024). Gentex announced its acquisition in January 2024.","src":["https://en.wikipedia.org/wiki/ESight","https://esighteyewear.com"]},{"id":"nueyes","n":"NuEyes","f":"January 2016","h":"You wrote this as New Eyes; the company is NuEyes. It makes head-worn low-vision magnifiers: the NuEyes Easy (2016, $5,995) and the Pro, Pro 3 and Pro 4 (up to 12x). It won a CES 2016 award. A veteran-owned company in Orange County, California.","src":["https://www.nueyes.com","https://www.nueyes.com/nueyes-technologies-joins-vr-ar-association","https://www.nueyes.com/nueyes-announces-new-pro-3-augmented-reality-smart-glass-solution"]},{"id":"vf","n":"Vision Forward Association","f":"1919, as the Badger Association of the Blind","h":"A Wisconsin nonprofit based in West Allis. It sells and trains on assistive technology through its store but does not manufacture devices, so no products are listed under it.","src":["https://www.vision-forward.org","https://vision-forward.org/about-us/mission-history/"]},{"id":"tsi","n":"Telesensory Systems (TSI)","f":"1970","h":"Founded in Mountain View, California. It made the Optacon (1971), the Speech+ talking calculator (1976), the VersaBraille (1979) and the Navigator braille displays (1989). It bought Apollo (1984) and Visualtek (1989) and closed in March 2005.","src":["https://afb.org/aw/6/4/14611"]},{"id":"kurz","n":"Kurzweil Computer Products","f":"1974 (Ray Kurzweil)","h":"Ray Kurzweil's company. It unveiled the Kurzweil Reading Machine on January 13, 1976.","src":["https://www.computerhistory.org/collections/catalog/X236.83","https://www.kurzweiltech.com/kcp.html"]},{"id":"knfb","n":"K-NFB Reading Technology","f":"2005","h":"A Kurzweil and National Federation of the Blind venture. It made the K-NFB Reader (2005) and KNFB Reader Mobile (2008, on the Nokia N82).","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://cage.report/DUNS/781821660"]},{"id":"hims","n":"HIMS / Selvas BLV","f":"1999 (Korea; after a teacher at a Korean school for the blind asked for a notetaker). North American arm renamed Selvas North America in May 2024.","h":"A Korean maker of the Braille Hansone (2002), BrailleSense (2004), VoiceSense (2007), Braille EDGE, SmartBeetle, BookSense, Polaris, QBraille XL, BrailleSense 6 (2021), Braille eMotion (2024) and BrailleSense 7 (2026). GW Micro distributed its products in the US from about 2006 to 2010. In September 2014 Diotek (later Selvas AI) agreed to buy 87.8% of HIMS International. in the sources found. HIMS was founded in 1999 after a teacher at a Korean school for the blind asked it to build a notetaker for blind students.","src":["https://www.himsintl.com/en/company/prd_history.php","https://www.asiae.co.kr/article/2014092515034407342","http://selvashealthcare.com/en/business/","https://at-newswire.com/press_release/hims-inc-announces-rebranding-to-selvas-north-america-amid-trademark-confusion/"]},{"id":"pap","n":"F.H. Papenmeier","f":"1956 (engineering office of Friedrich Horst Papenmeier, Schwerte); BRAILLEX completed 1975","h":"German maker of the BRAILLEX displays (from 1975) and the ELBA Linux notetaker (2001).","src":["https://nfb.org/sites/default/files/images/nfb/publications/fr/fr28/fr280109.htm","https://www.papenmeier.de/en/about-us/history/"]},{"id":"baum","n":"BAUM Retec","f":"1980","h":"German maker of the VarioUltra and Pronto! notetakers and the COBRA and Blindows screen readers. Its hardware platform was the basis for the BrailleNote PK. It went bankrupt in 2017, and VisioBraille took over the line.","src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://en.wikipedia.org/wiki/BrailleNote"]},{"id":"ht","n":"Handy Tech / Help Tech","f":"1994","h":"Founded by Sigi Kipke in Germany and renamed Help Tech in 2017. Products: Braille Wave (1999), Braille Star (2002), Active Braille (2011) and Active Star (2015).","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"alva","n":"ALVA BV","f":"February 1984 (Netherlands)","h":"A Dutch braille display maker that held a cursor-routing patent. Products include the ABT-3, Satellite 544, BC640/680 and the MPO 5500 phone/PDA (2003). Optelec acquired it in September 2005.","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://nfb.org/patent-dispute"]},{"id":"optelec","n":"Optelec","f":"1975","h":"A Dutch low-vision company founded by Frans Tieman. Products: ClearView desktop magnifiers, Compact handhelds and the Traveller HD. It merged with Freedom Scientific into VFO in 2015.","src":["https://en.wikipedia.org/wiki/Freedom_Scientific"]},{"id":"ev","n":"Enhanced Vision","f":"1996","h":"A US video-magnifier maker (Merlin, Acrobat, Amigo). Joined VFO in January 2018.","src":["https://vispero.com"]},{"id":"et","n":"Enabling Technologies (formerly Triformation Systems)","f":"Triformation Systems incorporated in Florida on January 14, 1974","h":"A US embosser maker. Under the Triformation name it built the BD-3 (1971) and LED-120 (1974). Later embossers include the Juliet (1992), the Romeo Attaché (2004) and the Juliet 120.","src":["https://sites.aph.org/museum-virtual-exhibit/vex1/7D6044E7-F4E9-4189-A3F0-428547426285.htm","https://www.freelists.org/post/duxuser/DBT-105,19","https://www.commerceflorida.com/company/831608/triformation-systems-inc"]},{"id":"dolphin","n":"Dolphin Computer Access","f":"1986 (incorporated October 21, 1986, Worcester, UK)","h":"A UK maker of the Hal screen reader (DOS, then Windows), Supernova, Pocket Hal and Smart Hal, the Apollo hardware synthesizer and the Orpheus speech engine.","src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://nfbcal.org/nfb-rd/1332.html","https://find-and-update.company-information.service.gov.uk/company/02065974","https://yourdolphin.com/About-Dolphin"]},{"id":"artic","n":"Artic Technologies","f":"1984","h":"A US maker of the SynPhonix speech cards (1985 and 1987), the TransPort synthesizer and the Business Vision DOS screen reader.","src":["https://web.archive.org/web/20060327064418/http://www.artictech.com/history.htm","https://web.archive.org/web/20110728031437/http://www.articannex.ws/artictec.htm"]},{"id":"street","n":"Street Electronics","f":"1978 (Milo Street, Carpinteria, California)","h":"Maker of the Echo II speech card for the Apple II (1982), which used the TMS5220 chip and Textalker software.","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://audioxpress.com/article/echo-test-measurement-specifically-made-for-audio-testing"]},{"id":"dec","n":"Digital Equipment Corporation (DEC)","f":"1957","h":"Commercialized Dennis Klatt's MITalk/Klattalk research as DECtalk in 1984. The DECtalk intellectual property later passed to Fonix.","src":["https://en.wikipedia.org/wiki/DECtalk","https://tcscasa.org/klatts-history-of-speech-synthesis/","https://en.wikipedia.org/wiki/Digital_Equipment_Corporation"]},{"id":"votrax","n":"Votrax","f":"1971","h":"A Federal Screw Works division that made the Votrax phoneme synthesizers, the SC-01 chip, the Type 'N Talk (1980) and the Personal Speech System (1982). A Votrax synthesizer voiced the first Kurzweil Reading Machine.","src":["https://en.wikipedia.org/wiki/Votrax"]},{"id":"aicom","n":"Aicom Corporation","f":"Founding year not found (searched NFB timeline and archived Accent material)","h":"Maker of the Accent SA serial speech synthesizer.","src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm"]},{"id":"rcs","n":"RC Systems","f":"Incorporated July 26, 1983 (Everett, Washington)","h":"Maker of the DoubleTalk PC (an 8-bit ISA card) and the DoubleTalk LT (RS-232, using the RC8650 chipset). DoubleTalk was the first synthesizer supported by the Speakup Linux screen reader in 1998.","src":["https://lkml.iu.edu/9810.3/0735.html","https://opengovwa.com/corporation/600495622"]},{"id":"aira","n":"Aira","f":"2015","h":"Founded by Suman Kanuganti and Yuja Chang. It offers live visual interpreting, first through smart glasses and then the Horizon glasses (2018).","src":["https://aira.io"]},{"id":"orcam","n":"OrCam Technologies","f":"2010 (Amnon Shashua and Ziv Aviram)","h":"An Israeli maker of the MyEye wearable readers: MyEye 1 (2015), MyEye 2 (2017) and MyEye 3 Pro (2024).","src":["https://www.orcam.com","https://en.wikipedia.org/wiki/OrCam_device"]},{"id":"envision","n":"Envision","f":"2017 (secondary source)","h":"A Dutch maker of the Envision app and the Envision Glasses, built on Google Glass Enterprise Edition 2 and launched in November 2020.","src":["https://support.letsenvision.com","https://economy.ac/wiki/company/envision"]},{"id":"iris","n":"IrisVision","f":"2016","h":"Its first wearable low-vision magnifier (2017) paired a Samsung Galaxy S7 with a Gear VR headset.","src":["https://irisvision.com","https://www.forbes.com/sites/berenicemagistretti/2019/12/12/irisvision-wants-to-be-more-than-an-assistive-device-for-the-visually-impaired-it-wants-to-diagnose-and-treat-patients-too/"]},{"id":"eyed","n":"Eyedaptic","f":"2016 (Jay Cormier and three co-founders)","h":"Maker of the augmented-reality low-vision glasses EYE1 through EYE6 (2019 to 2024).","src":["https://eyedaptic.com","https://eyedaptic.com/active-angels-invest-in-bevy-of-startups-tech-coast-angels-members-investments-reflect-diversity-of-startups-in-socal-region/"]},{"id":"dot","n":"Dot Inc.","f":"2015","h":"A Korean company that makes the Dot Watch (2017), a braille smartwatch, and the Dot Pad (2021), a tactile graphics display. Its cells are used in the APH/HumanWare Monarch.","src":["https://www.dotincorp.com"]},{"id":"bbt","n":"Bristol Braille Technology","f":"2011","h":"A UK community interest company founded by Ed Rogers. It makes the Canute 360 multiline braille e-reader (2020).","src":["https://bristolbraille.org"]},{"id":"perkins","n":"Perkins School for the Blind / Perkins Products","f":"1829 (Perkins School for the Blind)","h":"Perkins introduced David Abraham's Perkins Brailler in 1951 and the SMART Brailler in 2012. Around 2010 Perkins Products also sold a Seika-made 80-cell display.","src":["https://www.perkins.org","https://afb.org/aw/11/4/16038","https://en.wikipedia.org/wiki/Perkins_School_for_the_Blind"]},{"id":"levelstar","n":"LevelStar","f":"About 2004","h":"Founded by brothers Marc and Matt Mulcahy; Marc is blind and previously worked at Sun Microsystems on a Linux desktop. Its Linux-based Icon PDA reached market in December 2006, and APH sold a variant as the Braille+.","src":["http://visually-impaired.blogspot.com/2006/09/pda-for-visually-impaired.html","https://linuxdevices.org/device-profile-levelstar-icon-pda-for-visually-impaired-users/index.html"]},{"id":"index","n":"Index Braille","f":"1982","h":"It began as a 1979 university project to build a braille typewriter with a copy function. Björn Löfstedt and Torvald Lundqvist founded it in Luleå, Sweden as Polar Print Production, and the first embossers were built in Björn's garage in 1984. Product platforms followed in 1992 (Everest), 1995 (V2), 1998 (4X4 Pro), 2002 to 2004 (V3), 2005 (4Waves Pro), 2011 (V4) and 2016 (V5).","src":["https://indexbraille.com/about-us/","https://www.braillecast.com/podcast/e020/"]},{"id":"braillo","n":"Braillo","f":"1980","h":"A Norwegian company. In January 1980, working with SINTEF, it introduced the Braillo 270, the first double-sided (interpoint) embosser. American Thermoform acquired it in 2016.","src":["https://braillo.com/about-us/"]},{"id":"viewplus","n":"ViewPlus Technologies","f":"1996 (John Gardner, Corvallis, Oregon)","h":"Physicist John Gardner went blind in 1988. By 1996 his Oregon State University team had developed TIGER multi-height tactile graphics, and John and Carolyn Gardner started ViewPlus to sell it. Products include the Tiger Advantage (2000), Emprint (2006), VP Max (2009 to 2021) and the later Columbia, SpotDot, Premier and Elite embossers.","src":["https://viewplus.com/about/","https://viewplus.com/viewplus-introduces-emprint-new-braille-printer-with-color-hp-inkjet/"]},{"id":"thiel","n":"Thiel","f":"Founding year not found; active in the US through VTEK by about 1986","h":"A German maker of high-speed embossers such as the Beta-X3, distributed in the US by VTEK around 1986.","src":["https://nfb.org/sites/default/files/images/nfb/publications/fr/fr28/fr280109.htm"]},{"id":"nv","n":"NV Access","f":"2007","h":"An Australian nonprofit founded by Michael Curran and James Teh, who met at a music camp for blind children. It develops the free NVDA screen reader.","src":["https://www.nvaccess.org/about-nv-access/"]},{"id":"apple","n":"Apple","f":"1976","h":"Accessibility milestones: MacinTalk speech (1984), VoiceOver on Mac OS X 10.4 (2005) and on the iPhone 3GS (2009), braille display support in iOS 4 (2010), Braille Screen Input in iOS 8 (2014) and Braille Access (2025).","src":["https://en.wikipedia.org/wiki/VoiceOver","https://www.wap.org/journal/lionspeak/"]},{"id":"google","n":"Google","f":"1998","h":"Makes TalkBack for Android (about 2009), BrailleBack (2012), built-in TalkBack braille in Android 13 (2022) and ChromeVox for Chrome OS (2011).","src":["https://blog.chromium.org/2011/05/chromevox-built-in-spoken-feedback-for.html"]},{"id":"ms","n":"Microsoft","f":"1975","h":"Narrator shipped with Windows 2000 on February 17, 2000. Default voices: Microsoft Sam (Windows 2000 and XP), Anna (Vista and 7), and David, Zira and Hazel (Windows 8). Narrator gained braille support in 2017.","src":["https://abilitynet.org.uk/news-blogs/microsoft-narrator-turns-21-we-celebrate-coming-age","https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices"]},{"id":"ibm","n":"IBM","f":"1911","h":"IBM researcher Jim Thatcher created IBM Screen Reader for DOS in 1986. Screen Reader/2 for OS/2 followed around 1992.","src":["https://www.sigaccess.org/wp-content/uploads/2012/05/jim_thatcher.pdf"]},{"id":"berkeley","n":"Berkeley Systems","f":"1987 (Wes Boyd and Joan Blades)","h":"Maker of outSPOKEN, among the first GUI screen readers: Macintosh in 1989, Windows 3.1 in 1994.","src":["https://en.wikipedia.org/wiki/OutSPOKEN","https://en.wikipedia.org/wiki/Berkeley_Systems"]},{"id":"serotek","n":"Serotek (now Pneuma Solutions)","f":"2001","h":"Founded by Mike Calvo. Its FreedomBox evolved into the System Access screen reader (December 2005). Mike Calvo and Matt Campbell co-founded Pneuma Solutions in 2020.","src":["https://pneumasolutions.com/about/","https://afb.org/aw/7/3/14499"]},{"id":"plex","n":"Shinano Kenshi (Plextalk)","f":"1918 (as Shinano Spun Silk Spinning Co.); PLEXTALK brand from 1998","h":"A Japanese maker of the Plextalk DAISY players, including the Plextalk Pocket PTP1.","src":["https://www.plextalk.com","https://www.aspina-group.com/en/about-us/history/","https://www.plextalk.com/jp/plextalk/"]},{"id":"nls","n":"National Library Service for the Blind and Print Disabled (NLS)","f":"1931","h":"The Library of Congress talking-book program. It issued the cartridge-based DS1/DA1 digital talking-book players in 2009 and an NLS eReader braille display in 2020.","src":["https://www.loc.gov/nls/"]},{"id":"eurob","n":"Eurobraille","f":"Predecessor MIW founded November 1980 (Ioan Montane); Eurobraille SA created July 2, 1990","h":"A French maker of braille displays, the b.note (2021) and the DRACULA screen readers.","src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://www.eurobraille.fr/notre-histoire/"]},{"id":"samsung","n":"Samsung","f":"1969","h":"Samsung's own Android screen reader, Voice Assistant, was discontinued with One UI 3.0 (Android 11). Samsung then switched to its own build of Google TalkBack, distributed through the Galaxy Store.","src":["https://accessibleandroid.com/opinion-why-samsung-google-talkback-separation-is-nothing-but-a-headache/"]},{"id":"codefactory","n":"Code Factory","f":"October 29, 1998 (Terrassa, Barcelona)","h":"A Spanish company. It released games for blind players from 1999, Mobile Accessibility for Symbian in 2003, Mobile Speak for Symbian in 2004, Mobile Speak for Windows Mobile Pocket PCs in 2005 and for smartphones in 2006. Nokia partnered with it in 2007. It now sells the Eloquence TTS app for Android.","src":["https://codefactoryglobal.com/company/","https://www.iberinform.es/empresa/1068973/code-factory"]},{"id":"nuance","n":"Nuance Communications","f":"1992 (as Visioneer; renamed ScanSoft 1999; merged with Nuance and renamed Nuance Communications in October 2005)","h":"Through acquisitions, including SpeechWorks (which bought Eloquent Technology in January 2001), Rhetorical (2004) and SVOX (2011), it owned the Eloquence, RealSpeak and Vocalizer speech engines. It also made the TALKS and ZOOMS software for Symbian phones.","src":["https://www.synfonicaspeech.com/about","http://truegryc.blogspot.com/2011/06/nuance-corporate-acquisition-history.html","https://afb.org/aw/8/1/14407","https://en.wikipedia.org/wiki/Nuance_Communications","https://www.sec.gov/Archives/edgar/data/1002517/000095013505005439/b56788a1exv99w1.htm"]},{"id":"eti","n":"Eloquent Technology, Inc. (ETI)","f":"1983","h":"Founded in Ithaca, New York by Dr. Susan R. Hertz, who also taught linguistics at Cornell. It built the ETI-Eloquence formant synthesizer on her Delta system and was sold to SpeechWorks in January 2001.","src":["https://www.synfonicaspeech.com/about"]},{"id":"acapela","n":"Acapela Group","f":"2004 (merger of Babel Technologies, Elan Speech and Babel Infovox)","h":"A European TTS company. Its voices are the default in the Victor Reader Stream 2 and 3 and the Victor Reader Trek.","src":["https://www.humanware.com/microsite/stream/index.html","https://www.acapela-group.com/voiceai-people-behind-technology-at-acapela-group/company-timeline/","https://www.speechtechmag.com/Articles/ReadArticle.aspx?ArticleID=32697"]},{"id":"ivona","n":"IVONA Software","f":"Gdańsk, Poland (as IVO Software); acquired by Amazon in 2013","h":"A Polish TTS company whose voices powered Kindle Fire accessibility features. Amazon acquired it on January 24, 2013.","src":["https://press.aboutamazon.com/2013/1/amazon-com-announces-acquisition-of-ivona-software","https://technews.tmcnet.com/ivr/topics/ivr/articles/324494-amazon-ivona-kindle-perhaps-mute-no-more.htm","https://www.isca-archive.org/blizzard_2009/kaszczuk09_blizzard.pdf"]},{"id":"neospeech","n":"NeoSpeech","f":"February 2002, as Voiceware's US subsidiary in San Jose","h":"A TTS vendor whose US English voices included Paul, Julie and Kate. It later moved its hosting to Amazon. Its Kate voice was released in September 2001 and Paul in May 2002. Voiceware and NeoSpeech joined the ReadSpeaker brand in 2019.","src":["https://www.speechtechmag.com/Articles/News/News-Feature/NeoSpeech-Turns-TTS-Over-to-Amazon-Hosting--89128.aspx","https://en.wikipedia.org/wiki/NeoSpeech","https://www.prnewswire.com/news-releases/now-gathering-voiceware-neospeech-voicetext-and-rspeak-under-a-unified-umbrella-brand-readspeaker-consolidates-its-position-as-a-leading-text-to-speech-player-300803505.html"]},{"id":"att","n":"AT&T Labs (Natural Voices)","f":"AT&T Labs was formed in 1996; Natural Voices launched in 2001","h":"AT&T Natural Voices were concatenative voices, including Crystal and Mike.","src":["https://jctnpedia.fandom.com/wiki/Text-to-Speech_Downloadables_List"]},{"id":"cepstral","n":"Cepstral","f":"June 2000 (Pittsburgh)","h":"A US TTS company. In 2007 Macworld called its David and Diane voices ($30 each) the finest available for the Mac.","src":["https://www.macworld.com/article/185797/voicemac.html","https://en.wikipedia.org/wiki/Cepstral_(company)"]},{"id":"cstr","n":"University of Edinburgh CSTR","f":"1980s","h":"The Centre for Speech Technology Research built the Festival toolkit (first version 1996) and HTS. Spin-offs include Rhetorical Systems and CereProc.","src":["https://ppls.ed.ac.uk/linguistics-and-english-language/research/impact/speech-synthesis-technology"]},{"id":"cmu","n":"Carnegie Mellon University","f":"1900","h":"Alan W Black's group built Flite (Festival-lite), a small-footprint synthesizer, in 2001.","src":["https://www.cs.cmu.edu/~awb/papers/ISCA01/flite/node1.html"]},{"id":"espeakproj","n":"eSpeak / eSpeak NG project","f":"1995","h":"Jonathan Duddington wrote 'speak' for Acorn RISC OS starting in 1995 and rewrote it as eSpeak in 2007. Reece H. Dunn maintained a fork from 2010, which officially became eSpeak NG in late 2015.","src":["https://github.com/espeak-ng/espeak-ng"]},{"id":"gnome","n":"GNOME Project","f":"1997","h":"The GNOME desktop's screen reader is Orca (2006, originally from Sun Microsystems), which replaced Gnopernicus in GNOME 2.16. IBM's Linux Screen Reader (LSR) ran from 2006 to 2007.","src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://ashton.codes/dai11y-19-01-2021/"]},{"id":"linuxcommunity","n":"Linux accessibility community","f":"Not a company; projects date from 1995 (BRLTTY) and 1998 (Speakup)","h":"Independent open-source projects: Speakup (Kirk Reiser, 1998), BRLTTY (Nikhil Nair and James Bowden, 1995), Emacspeak (T. V. Raman, 1994), Fenrir (2016–2017) and the Jenux distribution (Daniel Nash).","src":["https://lkml.iu.edu/9810.3/0735.html","https://brltty.app/pipermail/brltty/2015-December/013007.html"]},{"id":"zendalona","n":"Zendalona","f":"2020 (named; registered as a nonprofit in 2022, Kerala)","h":"A community project that develops Accessible-Coconut, an Ubuntu MATE-based distribution for blind users.","src":["https://github.com/zendalona/accessible-coconut","https://zendalona.com/about-us/"]},{"id":"jieshuodev","n":"Weiliang Li (Jieshuo developer)","f":"Individual developer; start date not found","h":"A Chinese developer who makes the Jieshuo (Commentary, also called TalkMan) Android screen reader.","src":["https://accessibleandroid.com/glossary/jieshuo-2/"]},{"id":"prudence","n":"Prudence Interactive","f":"Founding year not found on Google Play or AudibleGame","h":"Maker of Prudence Screen Reader for Android, which supports more than 40 languages and adds OCR and translation.","src":["https://www.audiblegame.com/prudence-screen-reader"]},{"id":"microtalk","n":"MicroTalk","f":"Founding year not found; latest ASAP version dated January 2002","h":"Maker of the ASAP (DOS) and ASAW (Windows) screen readers. The latest ASAP version found is from January 2002.","src":["https://allinaccess.com/happ/"]},{"id":"darilek","n":"Nolan Darilek","f":"Individual developer; Spiel first released in 2010","h":"Developer of Spiel, an open-source, scriptable Android screen reader first released in 2010.","src":["https://accessibleandroid.com/history-of-android-8-a-brief-overview-of-spiel-screen-reader/"]},{"id":"dontask","n":"Don't Ask Software","f":"Incorporated September 1982","h":"Sold Mark Barton's S.A.M. speech program (1982) and the speaking poker game PokerSAM.","src":["https://en.wikipedia.org/wiki/Software_Automatic_Mouth","https://computeradsfromthepast.substack.com/p/dont-ask-computer-softwares-software"]},{"id":"svox","n":"SVOX","f":"2000 (Zurich)","h":"Maker of the Pico text-to-speech engine that Google built into Android 1.6 Donut (2009).","src":["https://android-developers.googleblog.com/2009/09/introduction-to-text-to-speech-in.html","https://en.wikipedia.org/wiki/SVOX"]},{"id":"agiga","n":"AGIGA","f":"Founding year not found on AGIGA's EchoVision pages","h":"Maker of the EchoVision smart glasses, co-designed with the blind and low-vision community. CEO Huasong Cao.","src":["https://agiga.ai/","https://nfb.org/index.php/resources/publications-and-media/access-podcast/echo-vision-smart-glasses-accessible-televisions"]},{"id":"meta","n":"Meta (Ray-Ban Meta)","f":"2004 (as Facebook)","h":"Meta's Ray-Ban Meta smart glasses gained Be My Eyes volunteer calling on November 13, 2024.","src":["https://en.wikipedia.org/wiki/Meta_Platforms","https://www.bemyeyes.com/news/be-my-eyes-is-rolling-out-on-ray-ban-meta-glasses-starting-today/"]},{"id":"axsol","n":"Access Solutions","f":"Founding year not found; active by 2005 (new DECtalk model)","h":"Maker of the TripleTalk speech synthesizers (USB, PCI and serial) and, by 2005, a new DECtalk model.","src":["https://inbox.the-brannons.com/blinux/20050331164331.GC11527@rednote.net/T/","https://www.freelists.org/post/jfw/Finding-the-double-and-triple-talk-synths,9"]},{"id":"lh","n":"Lernout & Hauspie","f":"1987, by Jo Lernout and Pol Hauspie (Wikipedia); bankrupt in 2001","h":"Belgian speech-technology company whose TruVoice and TTS3000 engines were the default speech output for Microsoft Agent characters in the SAPI 4 era.","src":["https://learn.microsoft.com/en-us/windows/win32/lwef/accessing-a-speech-engine-in-your-code"]},{"id":"yakovleva","n":"Olga Yakovleva (RHVoice)","f":"2010 (earliest RHVoice source copyright)","h":"Developer of RHVoice, a free and open-source speech synthesizer.","src":["https://github.com/Olga-Yakovleva/RHVoice/blob/master/CMakeLists.txt"]},{"id":"amazon","n":"Amazon","f":"1994","h":"Makes Fire tablets and Fire OS, which include the VoiceView screen reader (launched in late 2015).","src":["https://www.aboutamazon.com/news/devices/improving-device-accessibility-for-customers-with-disabilities"]},{"id":"caretec","n":"Caretec","f":"Not stated on its product pages (Austrian maker based in Graz)","h":"An Austrian maker of daily-living aids for blind people, including the Colorino talking color and light detector and the Color Star color identifiers.","src":["https://www.caretec.at/product/colorino-color-and-light-detector/"]},{"id":"prodigy","n":"Prodigy Diabetes Care","f":"Not stated in the sources used; Charlotte, North Carolina","h":"Maker of the Prodigy Voice talking blood glucose meter, first sold in 2007, which AFB Tech rated the most accessible of four fully talking meters in 2012.","src":["https://afb.org/aw/13/2/15850","https://prodigymeter.com/prodigy-voice/"]},{"id":"fora","n":"Fora Care","f":"Not stated in the sources used; Newbury Park, California (US office)","h":"Maker of the Fora V20 and V22 talking blood glucose meters, both reviewed by AccessWorld as having comprehensive speech output.","src":["https://afb.org/aw/13/2/15850"]},{"id":"biosense","n":"BioSense Medical Devices","f":"Not stated in the sources used; Duluth, Georgia","h":"Maker of the Solo V2 talking blood glucose meter ($17 in AccessWorld's 2012 review).","src":["https://afb.org/aw/13/2/15850"]},{"id":"eone","n":"Eone","f":"2013 (Kickstarter launch of its first watch)","h":"Eone ('designed for everyone') was founded by Hyungsoo Kim to make the Bradley tactile watch, named for Paralympic swimmer Bradley Snyder. Kim had put in $150,000 of his own money before the 2013 Kickstarter.","src":["https://www.bostonglobe.com/business/2013/07/11/watch-for-blind-kickstarter/0dt8VUnqc0hZ3z3gxUXROP/story.html","https://watchesbysjx.com/2014/04/introducing-the-eone-bradley-a-tactile-way-to-tell-the-time.html"]},{"id":"rnib","n":"RNIB (Royal National Institute of Blind People)","f":"1868","h":"The UK's leading sight-loss charity. It sells daily-living products, including the PENfriend audio labeller, which RNIB says is exclusively available from it in the UK.","src":["https://www.rnib.org.uk/living-with-sight-loss/independent-living/labelling/","https://shop.rnib.org.uk/products/rnib-penfriend-3-audio-labeller"]},{"id":"myweigh","n":"My Weigh","f":"Founding year not found on the Maxi-Aids listing used","h":"Maker of digital scales, including the Vox talking kitchen scales that AccessWorld has recommended in its gift guides since 2018.","src":["https://www.maxiaids.com/product/vox-2-talking-kitchen-scale2","https://afb.org/aw/18/11/15267"]},{"id":"thermoworks","n":"ThermoWorks","f":"Founding year not given in the sources used","h":"A US maker of cooking and food-safety thermometers. Its RT8400 talking thermometer was reviewed by AccessWorld in 2012, and blind cooks still recommend it in 2026 (The Blind Bridge).","src":["https://afb.org/aw/13/5/15813","https://theblindbridge.com/shopping/talking-thermometer/"]},{"id":"ultmost","n":"Ultmost","f":"Founding year not found","h":"Maker of the HE-113-EN talking digital body thermometer, sold as the TALKiNG Fast Reading Thermometer. AccessWorld noted that the packaging did not name the maker; it identified Ultmost through a search.","src":["https://afb.org/aw/13/5/15813"]},{"id":"grahamfield","n":"Graham-Field (Lumiscope)","f":"Founding year not given in the sources used","h":"A medical-supply company whose Lumiscope brand made the Talking Digital Ear Thermometer reviewed by AccessWorld in 2012.","src":["https://afb.org/aw/13/5/15813"]},{"id":"reizen","n":"Reizen","f":"Founding year not found","h":"A brand of low-vision daily-living aids sold through Maxi-Aids, LS&S and others, including talking clocks, watches and magnifiers.","src":["https://www.maxiaids.com/product/reizen-talking-atomic-alarm-clock","https://lssproducts.com/clocks-watches/talking-clocks/"]},{"id":"brytech","n":"BRYTECH","f":"Founding year not found in the AccessWorld article used","h":"Ottawa, Canada maker of the Note Teller money identifier (600 Peter Morand Crescent, per AccessWorld 2007). AccessWorld reported that as of January 1, 2007 the Note Teller 2 was the only portable device it knew of made for identifying U.S. paper money.","src":["https://www.afb.org/aw/8/3/14354"]},{"id":"verbalise","n":"Verbalise (The Talking Watch Shop)","f":"Founding year not found; the 2016 Disability Now review describes the range as new","h":"Brand set up by blind entrepreneur Martin Begg to make stylish talking watches, sold through his Talking Watch Shop (Disability Now, November 2016).","src":["https://disabilitynow.wordpress.com/2016/11/21/product-review-verbalise-talking-watches-talking-the-talk-looking-the-look/"]},{"id":"bep","n":"U.S. Bureau of Engraving and Printing (BEP)","f":"Founding year not covered by the pages used here","h":"The U.S. Treasury bureau that prints Federal Reserve notes. Until redesigned currency with tactile features arrives, it gives eligible blind and visually impaired people a free iBill reader (AccessWorld, June 2015), and it publishes the free EyeNote app.","src":["https://www.bep.gov/services/currency-accessibility/mobile-applications/","https://afb.org/aw/16/6/15449"]},{"id":"cashreader","n":"Cash Reader s.r.o.","f":"2018, Brno, Czech Republic","h":"A Czech assistive-technology team led by founder and CEO Tomas Jelinek (iOS), with co-founder Martin Doudera (Android). It began in 2018 because no app could recognize the Czech koruna. Its recognition technology is also licensed to smart glasses, specialized phones and digital magnifiers. Awards include the Zero Project Award 2022.","src":["https://cashreader.app/about/"]},{"id":"ipplex","n":"IPPLEX (LookTel)","f":"Founding year not covered by the pages used here","h":"Maker of the LookTel recognition apps for people with low vision or blindness, including LookTel Money Reader (March 2011). According to AccessWorld (2020), NantMobile Health bought Money Reader in 2016 and moved it to a subscription.","src":["https://www.freelists.org/post/real-eyes/Ipplex-Releases-LookTel-Money-Reader-for-iOS-Devices","https://afb.org/aw/21/7/17116"]},{"id":"franklin","n":"Franklin Electronic Publishers","f":"Founding year not covered by the page used here","h":"In 2010 it marketed the Franklin Bill Reader, a talking currency identifier (New York Times, February 2010).","src":["https://archive.nytimes.com/gadgetwise.blogs.nytimes.com/2010/02/19/for-the-visually-impaired-money-talks/"]}],"DEV":[{"id":"bns","n":"Braille 'n Speak (original)","co":"blazie","cat":"Notetakers","yr":1987,"y":"1987 to 1990s","o":"A pocket notetaker with a six-key Perkins-style braille keyboard and speech output, introduced at the 1987 NFB convention for $895.","h":"Deane Blazie built it after leaving Maryland Computer Services. He based it on the Kentucky PocketBraille that his friend Fred Gissoni was developing at the Kentucky Department for the Blind: Gissoni showed him the keyboard-and-processor board and said it could take notes on its own. Blazie's first prototype was wedge-shaped. Gissoni and Tim Cranmer told him to make it flat, because braille is written with flat hands. Blazie put $10,000 into building 10 units and took them to the NFB convention in July 1987, where he sold all but his prototype. Blazie Engineering was then a family business in Churchville, Maryland: his wife Marty took orders, and his sons Bryan and Chris built and assembled units. A calculator and stopwatch with countdown timer came in early 1988 as a $99 option. Updates came once or twice a year on EPROM chips; by the mid-1990s flash ROM let owners install updates from a 3.5-inch floppy. By 1999 Blazie estimated 70,000 of its notetakers were in use.","ph":"A 1988 review gives about 8 x 4 x 1 inches and under 1 lb. AFB describes the device as 2 lb. Braille keys plus space bar.","f":["Braille input, speech output","Talking calculator, clock and calendar","File storage in nonvolatile memory"],"io":"Serial port for a computer or printer","s":{"ram":"200K nonvolatile memory (1988 review)","price":"$895 (1987); calculator and stopwatch option $99","tts":"Votrax SSI-263 speech chip in original units (later Blazie models moved to a DoubleTalk chip)","cpu":"Processor model not named. The Braille 'n Speak 2000 manual and the ERIC teachers' guide give only memory figures (768 KB RAM, 2 MB flash on the 2000). Deane Blazie told AccessWorld the unit used surface-mount chips.","syns":"Built-in Blazie speech only (Votrax SSI-263 chip in early units); no other synthesizers. It could also act as a speech synthesizer for a PC screen reader.","bat":"Internal rechargeable; about 10 hours per charge (Blazie, 1988)","used":"No current eBay listings or eBay sold prices for complete units were found. Blind Bargains has posted eBay finds of a likely-working Braille 'n Speak for $59.97 and units starting at $50 (dates not given)."},"suc":["bnsc","bns2000","blite18","bns640"],"src":["https://www.duxburysystems.org/downloads/library/news/new62.htm","https://afb.org/aw/11/1/16078","https://www.vogons.org/viewtopic.php?t=46333","http://linux-speakup.org/pipermail/speakup/2002-May/014709.html","https://www.afb.org/aw/1/1/16189","https://nfb.org/images/nfb/publications/bm/bm88/brlm8804.htm","https://www.blazietech.com/post/from-braille-n-speak-to-bt-speak-a-personal-reflection","https://www.blindbargains.com/ebay.php?num=6","https://support.freedomscientific.com/Content/Documents/Manuals/Legacy/Braille_N_SpeakDocs/Braille_N_Speak_UserMan.txt","https://archive.org/details/ERIC_ED422682","https://www.afb.org/aw/11/1/16078"],"desc":["The Braille 'n Speak is a pocket notetaker with a braille keyboard and speech output, and no braille display. You type in braille on six keys and a space bar, and it speaks what you typed and reads files back aloud. Deane Blazie introduced it at the July 1987 NFB convention for $895, when other blindness computers cost thousands. Its built-in Grade 2 translator turned braille into print for a printer or computer.","It is a flat, low rectangular box about the size of a videocassette. AccessWorld described it as looking like little more than a box with seven keys. Blazie's 1988 article says it fit in a coat pocket and weighed one pound; AccessWorld's 1999 interview gives 2 lb for the classic model. A 1988 review gives about 8 x 4 x 1 in. It is flat because Blazie's first wedge-shaped prototype was rejected by blind testers.","The keyboard follows a Perkins braillewriter: six dot keys in a row across the top surface, three for each hand, with a space bar nearest you; the space bar is the seventh key. Commands are chords, meaning a letter typed while holding the space bar. For example, O-chord then C opens the calculator, and E-chord executes a calculation.","The original had 200K of memory, which Blazie described as 200 to 300 braille pages. It was later described as 180K in 45 pages of 4,096 characters each. Along with notes and word processing it had a talking clock and calendar, a phone directory, a terminal mode, and a mode as a battery-powered speech synthesizer for a computer. Files stayed in memory when it was turned off, which earlier experimental notetakers could not do.","Blazie's Braille 'n Speak user manual (Freedom Scientific legacy edition, which refers to the 12-volt charger of later units) describes the layout this way. With the space bar toward you, the on/off rocker switch is about halfway back on the right side; rock it away from you for on. Just behind it is an earphone jack that can also feed an external speaker or a tape recorder. On the left side is an indented rectangular opening holding two identical round DIN serial ports, with the AC power and charger jack behind it. Whether the 1987 units matched this exactly is not stated. None of the sources checked for this entry mention its color."]},{"id":"bnsc","n":"Braille 'n Speak Classic","co":"blazie","cat":"Notetakers","yr":1987,"y":"Name later given to the original line","o":"Blazie later called the original Braille 'n Speak configuration the Braille 'n Speak Classic.","h":"Blazie Technologies' history says the Classic stored 180K, organized as 45 pages of 4,096 characters.","f":["Braille keyboard","Speech output"],"s":{"sto":"180K (45 pages of 4,096 characters)","tts":"Built-in Blazie speech (Votrax SSI-263 in early units, DoubleTalk chip later)","ram":"180K (APH)","price":"$895 (1987 original)","syns":"Built-in Blazie speech only","used":"No current eBay listings or eBay sold prices for complete units were found. Blind Bargains has posted eBay finds of a likely-working Braille 'n Speak for $59.97 and units starting at $50 (dates not given)."},"pre":["bns"],"suc":["bns2000"],"src":["https://blazietech.com","https://www.vogons.org/viewtopic.php?t=46333","http://linux-speakup.org/pipermail/speakup/2002-May/014709.html","https://sites.aph.org/museum-virtual-exhibit/vex2/2AEEBF8E-D463-4207-AA5A-417408112058.htm","https://www.blazietech.com/post/from-braille-n-speak-to-bt-speak-a-personal-reflection","https://www.blindbargains.com/ebay.php?num=6"],"desc":["'Braille 'n Speak Classic' is the name later given to the original 1987 Braille 'n Speak after larger-memory models arrived. Blazie Technologies' 2025 retrospective says it had 180K of storage in 45 pages of 4,096 characters each, plus a help file of no more than one page.","Physically it is the original Braille 'n Speak: a flat box about the size of a videocassette, with six braille dot keys and a space bar laid out like a Perkins braillewriter, and speech output instead of a braille display. See the Braille 'n Speak entry for its full description.","The APH Museum's Braille 'n Speak describes a sand-colored rigid plastic case with black braille keys and a space key, and black rubber rests on the bottom. The earphone jack and a switch are on the right side; the power jack and serial and disk-drive ports are on the left; the speaker is on top at the right.","In 1996 APH made the original 180K model available on quota funds and began calling it the Braille 'n Speak Classic, to tell it apart from the more powerful 640.","It has no braille display. Everything is spoken, and files can be sent to a printer, embosser or computer through the serial port."]},{"id":"bns2000","n":"Braille 'n Speak 2000","co":"blazie","cat":"Notetakers","yr":1999,"y":"1999 (APH catalog entry)","o":"A later Braille 'n Speak with much more memory and flash storage.","ph":"Under 1 lb (Freedom Scientific manual).","s":{"ram":"768 KB","sto":"2 MB flash","tts":"DoubleTalk chip (later Blazie models)","syns":"Built-in DoubleTalk-based Blazie speech; it can also serve as an external speech synthesizer for a PC screen reader","bat":"Internal rechargeable; 20 to 24 hours of use, 2 to 4 hours to fully charge (manual)","price":"$1,395 one language; $1,595 dual language (Freedom Scientific list price)","used":"No current eBay listings or eBay sold prices for complete units were found. Blind Bargains has posted eBay finds of a likely-working Braille 'n Speak for $59.97 and units starting at $50 (dates not given)."},"pre":["bnsc"],"src":["https://www.freedomscientific.com","https://nfb.org/sites/nfb.org/files/images/nfb/publications/bm/bm97/bm970415.htm","https://sites.aph.org/museum-virtual-exhibit/vex2/2AEEBF8E-D463-4207-AA5A-417408112058.htm","http://linux-speakup.org/pipermail/speakup/2002-May/014709.html","https://support.freedomscientific.com/Content/Documents/Manuals/Legacy/Braille_N_SpeakDocs/Braille_N_Speak_UserMan.txt","https://thejournal.com/articles/1997/03/01/word-processing-unit-aids-visually-impaired.aspx","https://www.blindbargains.com/ebay.php?num=6","https://www.eyeway.org.in/?q=braille-n-speak-2000","https://www.slideserve.com/kiral/braille-n-speak-2000","https://www.acb.org/high-tech-swap-shop-june-2000"],"h":"THE Journal (March 1997) described the Braille 'n Speak 2000 as a stand-alone word processor with voice output, a speech synthesizer and a braille-to-print translator. It had 20% more RAM than the previous model, enough for over 2,700 braille pages or 780 typed pages. It came in 15 languages, could hold two at once and switch between them with one command, and could read IBM-compatible disks. Other improvements were new connectors, longer-lasting batteries and owner-installable software upgrades. In June 2000 ACB's High Tech Swap Shop had a like-new Braille 'n Speak 2000 offered used for $850.","io":"Two identical round DIN serial ports in a recessed rectangular opening on the left side, with the AC adapter and charger jack behind them; earphone jack on the right side behind the power switch (also usable for an external speaker or tape recorder). An optional portable disk drive connects by serial.","desc":["The Braille 'n Speak 2000 is the late-1990s Braille 'n Speak: a pocket talking notetaker with a braille keyboard and no braille display. It holds 768 KB of RAM (over 2,700 braille pages, per THE Journal) plus 2 MB of flash memory. It works as a word processor, Grade 2 braille-to-print translator, clock, calendar, address book and calculator, and as a speech synthesizer for a computer.","According to its manual it is about the size of a videocassette, a flat rectangle under one pound; THE Journal described it as a two-pound product. Rubber feet on the bottom keep it from sliding while you type. You use it with the space bar nearest you, the same way you would sit at a braillewriter.","The keyboard is the standard seven-key Perkins layout: dots 1, 2 and 3 under the left hand, dots 4, 5 and 6 under the right, and a space bar in the middle front. Commands are chords typed while holding the space bar.","From the front right corner, slide your finger toward the back: about halfway along the right side is a rocker on/off switch (rock it away from you to turn on, toward you to turn off), with an earphone jack just behind it. On the left side is an indented rectangular opening with two identical round DIN serial ports separated by two small vertical bars, and the AC adapter jack is just behind that opening. The serial ports connect to a computer, modem, printer, another Braille 'n Speak, a Braille Lite or a portable disk drive.","It runs 20 to 24 hours on its built-in battery and recharges fully in 2 to 4 hours. It warns you when the battery is low and has a Battery Use Timer. It supported 15 languages, two at a time, and owners could install their own software upgrades. None of the sources checked for this entry mention its color."]},{"id":"tns","n":"Type 'n Speak","co":"blazie","cat":"Notetakers","yr":1992,"y":"Late 1992","o":"A QWERTY-keyboard sibling of the Braille 'n Speak.","ph":"About 2 lb.","s":{"ram":"758 KB (Type 'n Speak manual; earlier record said 768 KB)","sto":"2 MB flash","wt":"About 2 lb (manual)","dim":"About 12 × 7 × 1 in (manual)"},"src":["https://www.freedomscientific.com","http://nfbnet.org/pipermail/trainer-talk_nfbnet.org/2012-October/001686.html","https://support.freedomscientific.com/Content/Documents/Manuals/Legacy/Type_N_SpeakDoc/Type_N_Speak_UserMan.txt","https://afb.org/aw/1/1/16189"],"desc":["The Type 'n Speak is Blazie Engineering's typewriter-keyboard sibling of the Braille 'n Speak. Deane Blazie said it was built for people who liked the Braille 'n Speak but did not know braille. The manual calls it a laptop-style computer with a built-in speech synthesizer that speaks every prompt and everything you type.","Physically it is a flat box about a foot wide, seven inches from front to back and one inch high, weighing about two pounds with its internal rechargeable battery. It has no display screen at all. The whole top surface is a laptop-style QWERTY keyboard.","Set it down with the spacebar nearest you. About halfway back along the right edge is the on/off rocker switch. Rock it away from you to turn the unit on and toward you to turn it off.","Many keys are renamed for the Type 'n Speak. The top-right key (Break on a PC) is Help, and Shift+Help enters Learn mode, which names each key without acting on it. Down the right side, Home becomes Top, PgUp and PgDn jump by paragraph, and End becomes Bottom. The arrow keys sit in the bottom-right corner.","The manual says it stores about 300 print pages in RAM (758 KB) and about 800 more in 2 MB of flash memory. It serves as a notebook, address book, calendar, calculator, stopwatch and timer."]},{"id":"typelite","n":"Type Lite","co":"blazie","cat":"Notetakers","yr":0,"y":"By March 2001 (date of user guide)","o":"A notetaker from the Braille Lite family with a laptop-style Windows keyboard, a 40-cell braille display and an internal speech synthesizer.","src":["https://afb.org/aw/11/1/16078","https://www.yumpu.com/en/document/view/21055960/the-type-lite-user-guide-freedom-scientific/10","https://www.yumpu.com/en/document/view/21055960/the-type-lite-user-guide-freedom-scientific","https://afb.org/aw/3/1/14967","https://www.yumpu.com/en/document/view/21055960/the-type-lite-user-guide-freedom-scientific/11","https://portale.siva.it/en-GB/databases/products/detail/id-9061"],"ph":"Laptop-style Windows keyboard behind a 40-cell braille display, with cursor-routing buttons and two advance bars.","f":["Laptop-style QWERTY keyboard","40-cell display with routing buttons","Two advance bars","Internal speech synthesizer","Date book, phone book and calculator"],"io":"Round 8-pin serial port on the back; CompactFlash slot","s":{"ram":"2 MB (16 MB memory in a 2003 Italian listing)","sto":"12 MB flash, CompactFlash slot","disp":"40 cells","tts":"Internal speech synthesizer; the Type Lite user guide does not name the model. Sibling Blazie units of the same era (Braille Lite Millennium) used DoubleTalk-style speech.","cells":"40","kbd":"Laptop-style Windows keyboard","bat":"30 hours (SIVA listing)"},"h":"Documented in a Freedom Scientific user guide (part 440001-001) dated March 2001. One of the Braille 'n Speak's spin-off siblings from Blazie Engineering, alongside the Braille Lite and Type 'n Speak (AccessWorld). Deane Blazie said the company added typewriter keyboards because many interested people didn't know braille. Its user guide describes a note-taker and personal organiser with a built-in speech synthesizer, a date book, phone book, calculator and macros. Its keyboard could stand in for a PC keyboard when linked to a computer. Italy's SIVA database listed a Type Lite 40 with bilingual Italian/English speech and 30 hours of battery.","desc":["The Type Lite is a notetaker from Blazie Engineering with a laptop-style typewriter keyboard and a 40-cell braille display, plus built-in speech.","The keyboard is a standard portable PC layout. Its top row runs Escape, F1 to F12, then Num Lock, Insert, Delete and Break. Raised locator dots mark F1, F5, F10 and Delete.","The bottom row runs, left to right: Fn, Ctrl, Windows logo key, Alt, the spacebar, Alt, Windows logo key, Application key, Ctrl, then Left Arrow, Down Arrow and Right Arrow, with Up Arrow directly above Down Arrow.","The 40-cell display is below the keyboard. Between the display and the keyboard are two advance bars, and there is a rocker at each end of the display. Each cell has a cursor routing button above it, with raised locator dots to help find your place.","It takes standard CompactFlash memory cards."]},{"id":"blite18","n":"Braille Lite 18","co":"blazie","cat":"Notetakers","yr":1993,"y":"Summer 1993","o":"A Braille 'n Speak with an 18-cell refreshable braille display.","s":{"disp":"18 braille cells","price":"Japan: ¥600,000 (optional external disk drive ¥75,000); US: Braille Lite 2000 18-cell $3,395 (2000)","tts":"DoubleTalk chip","cpu":"Processor model not named. Blazie documentation gives memory only (640 KB on this model); the Braille Lite shares the Braille 'n Speak's electronics with a braille display added (AccessWorld).","ram":"640 KB","syns":"Built-in English speech synthesizer (the same speech as the Braille 'n Speak)","wt":"900 g including battery","dim":"21.5 × 13 × 4.5 cm (APH: 5 × 8.25 × 2 inches)","bat":"2-hour charge, about 30 hours of use","io":"RS-232C serial (two 8-pin mini-DIN jacks), 25-pin parallel printer port, headphone jack","used":"No eBay listings for the Braille Lite 18 were found."},"pre":["bns"],"suc":["blite40","bliteM"],"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://afb.org/aw/1/6/16145","http://linux-speakup.org/pipermail/speakup/2002-May/014709.html","https://www.cis.twcu.ac.jp/~k-oda/AccessBlind/Notetaker/BrailleLite18.html","https://sites.aph.org/museum-virtual-exhibit/vex2/179F821D-F5AB-42AF-9065-355222231963.htm","https://afb.org/aw/3/1/14967"],"h":" Blazie Engineering of Forest Hill, Maryland introduced the Braille Lite 18 (model BLT-18) in summer 1993. The APH Museum calls it basically an updated Braille 'n Speak 640 with an added 18-cell refreshable braille display. It worked as a notetaker with a clock, stopwatch, timer, calculator and notes, and could connect to a PC as a braille display. In Japan, Access Technology Inc. sold it with Japanese braille and English manuals.","desc":["The Braille Lite 18 is a small, flat, rectangular box of tan plastic, about 21.5 cm wide, 13 cm deep and 4.5 cm thick (roughly 8¼ by 5 by 2 inches). It weighs about 900 g with its battery, a bit heavier than a hardcover book. Four rubber feet on the bottom keep it from sliding on a desk.","On top is a seven-button braille keyboard in brown plastic, laid out like a Perkins brailler: six dot keys plus a space bar. The raised letters 'Braille Lite' and 'BLAZIE ENGINEERING' are molded into the top surface.","In a slightly recessed area below the keyboard, toward the front edge, is the 18-cell refreshable braille display, with eight-dot cells whose pins rise and fall. Just above the display runs an 'advance bar' that you press to move on to the next 18 characters.","The right side has the power toggle switch and a small headphone jack for private listening to the built-in speech. The left side has a 25-pin female parallel port for a printer and two round 8-pin mini-DIN jacks for serial connections to a computer or disk drive. A label on the bottom reads 'MADE IN USA, MODEL BLT-18, BLAZIE ENGINEERING' with a serial number.","It came in a black vinyl and nylon carrying case with a Velcro flap, a zippered pocket inside the flap, and a nylon shoulder strap clipped to plastic D-rings. In Japan it also came with a charging adapter, a serial cable, an earphone and manuals. A charge took about two hours and lasted about 30 hours of use."]},{"id":"blite40","n":"Braille Lite 40","co":"blazie","cat":"Notetakers","yr":1996,"y":"Summer 1996","o":"A 40-cell version of the Braille Lite.","s":{"disp":"40 braille cells","price":"Braille Lite 40 2000: $5,495 (2000)","tts":"DoubleTalk chip","syns":"Internal synthesizer, model not named for the original Braille Lite 40. The successor Millennium uses a synthesizer that AccessWorld says sounds like DoubleTalk.","ram":"Not given for the original Braille Lite 40. The Japanese catalog lists the BLT40 at 1.5 kg; the successor Braille Lite Millennium M40 has 14 MB of internal memory (related model).","used":"No used or eBay listing surfaced in this research pass (eBay blocks direct page checks)."},"pre":["blite18"],"src":["https://nfb.org/images/nfb/publications/fr/fr45/2/fr450210.htm","https://afb.org/aw/1/6/16145","http://nfbnet.org/pipermail/trainer-talk_nfbnet.org/2012-October/001686.html","http://linux-speakup.org/pipermail/speakup/2002-May/014709.html","https://afb.org/aw/3/1/14967","http://leb.net/blinux/list-archive/blinux-list/1996/msg00254.html","https://sites.aph.org/museum-virtual-exhibit/vex2/179F821D-F5AB-42AF-9065-355222231963.htm","https://www.cis.twcu.ac.jp/~k-oda/AccessBlind/Notetaker/BrailleLite40.html","https://veterans.networkofcare.org/Washington-DC/AssistiveDevices/ProductDetail?productId=75445"],"h":" The Braille Lite 40 (1996) added a 40-cell refreshable braille display to the Braille 'n Speak design.","desc":["AccessWorld described Blazie's Braille Lite as identical to the Braille 'n Speak with a braille display added. The Braille Lite 40 (1996) has a 40-cell display. No source checked gives its own size and weight. For comparison, the smaller Braille Lite 18 measured 5 × 8.25 × 2 inches.","Like the Braille 'n Speak, it has a Perkins-style braille keyboard with a space bar, and commands are chords of the space bar plus dot keys.","Its 40-cell refreshable braille display has a cursor routing button above each cell, and it uses advance bars to move through text a display-length at a time.","Speech comes from a built-in DoubleTalk synthesizer through a speaker or earphones.","Its software includes a word processor, calendar, clock and calculator, with optional 8-dot and two-language braille support. It could also serve as a braille display for a computer."]},{"id":"bliteM","n":"Braille Lite M20 / M40","co":"fs","cat":"Notetakers","yr":2002,"y":"2002","o":"The Millennium update of the Braille Lite, sold by Freedom Scientific.","f":["Programmable Whiz Wheels","Built-in modem","CompactFlash slot","Locator dots on the M40"],"io":"CompactFlash slot, modem, serial","s":{"ram":"About 2 MB","sto":"12 MB flash plus a CompactFlash port","disp":"20 or 40 cells","bat":"Lithium-ion; about 4-hour charge, about 30 hours of use","tts":"DoubleTalk chip","syns":"A new synthesizer that 'should sound familiar to anyone who has ever used the Double Talk synthesizer', played through two built-in speakers (AccessWorld)","io":"CompactFlash, built-in modem, serial, parallel","used":"No used or eBay listing surfaced in this research pass (eBay blocks direct page checks)."},"pre":["blite40"],"src":["https://www.freedomscientific.com","https://www.freedomscientific.com/Content/Documents/Manuals/Legacy/Braille_Lite_MDocs/Braille_Lite_Part_440013-001_Rev_E.pdf","http://linux-speakup.org/pipermail/speakup/2002-May/014709.html","https://portale.siva.it/en-GB/databases/products/detail/id-14670","https://afb.org/aw/3/1/14967"],"h":" The Braille Lite M Series ('Millennium') was the last generation of Braille Lite notetakers. Freedom Scientific's manual describes a redesign with about 2 MB RAM, 12 MB flash, a CompactFlash port, a modem and programmable Whiz Wheels. The M20 has 20 cells and the M40 has 40. It supports Grade 1, Grade 2, Computer Braille and all 256 ASCII characters.","desc":["The Braille Lite M20 and M40 are flat, rectangular notetakers. The M20 is the shorter model with a 20-cell display, and the M40 is wider to hold a 40-cell display. The sources checked give no exact measurements or weight for either model.","The top surface has an eight-dot Perkins-style braille keyboard: six main dot keys plus dots 7 and 8, with a space bar between the hands. Almost every command is a 'chord', meaning the space bar pressed together with dot keys.","Below the keyboard is the refreshable braille display. Above each braille cell is a small cursor routing button that puts the cursor at that cell when pressed. The M40 also has raised locator dots above every fifth cell to help you find your place.","Advance bars let you move through a file one display-length at a time: press the right end to go forward and the left end to go back. The M20 has one advance bar; the M40 has two, one at each end, so you never have to lift your reading hands far. A Reverse Advance setting swaps the bar directions.","The Millennium models added programmable Whiz Wheels, a CompactFlash card slot and a built-in modem. An Italian product database notes the 56K modem for e-mail and the side-mounted wheels for moving through documents. Speech comes from an internal synthesizer through a built-in speaker or headphones."]},{"id":"btspeak","n":"BT Speak / BT Speak Pro","co":"blazietech","cat":"Notetakers","yr":2024,"y":"2024 to present","o":"Deane Blazie's modern speech-only braille-keyboard notetaker, built on a Raspberry Pi compute module.","h":"Blazie Technologies released it in 2024 as a spiritual successor to the Braille 'n Speak.","ph":"Pro: 6.1 x 2.8 x 0.75 in, 240.9 g, 9-key Perkins-style keyboard.","f":["Perkins-style braille keyboard","Speech output","Wi-Fi and Bluetooth 5.0"],"io":"USB-C, mini-HDMI, Wi-Fi, Bluetooth 5.0","s":{"cpu":"Raspberry Pi CM4, Broadcom BCM2711 at 1.5 GHz (Pro)","ram":"8 GB (Pro)","sto":"32 GB (Pro)","bat":"8,200 mAh, about 10 hours","price":"$795 (BT Speak), $1,195 (Pro)","os":"Linux on Raspberry Pi CM4; custom Traditional mode plus a MATE desktop with the Orca screen reader"},"pre":["bns"],"src":["https://blazietech.com/btspeak-hardware","https://www.blazietech.com/btspeak-features","https://www.blazietech.com/btspeak-product-page","https://www.blazietech.com/btspeak-hardware"],"desc":["BT Speak Pro is a flat, pocket-sized slab about 6.1 inches wide, 2.8 inches deep and 0.75 inch thick (15.5 x 7.1 x 1.9 cm), weighing 8.5 ounces (241 grams). It has no screen and no QWERTY keys. Everything is done from a braille keyboard and heard through speech.","The top surface is mostly a nine-key Perkins-style braille keyboard, set on a slight curve for comfortable typing. There are six dot keys (three for each hand), a space bar between them, and the dot 7 and dot 8 keys on either side of the space bar, which work as modifiers. Commands are chords: for example, h-chord (h with space) brings up help for wherever you are, and v-chord opens voice commands.","Two internal speakers sit at the left and right sides of the top. A built-in vibration motor gives haptic feedback. When it's turned on, BT Speak opens straight into the editor, back in the last document you were working on.","For connections, there's one USB-C port, used to charge and also to connect headphones, a USB drive, a braille display or a wireless QWERTY keyboard receiver; a mini HDMI port for a monitor; and a microSD card slot. Inside are Wi-Fi, Bluetooth 5.0, a Raspberry Pi Compute Module 4 with 8 GB of RAM and 32 GB of flash storage, and an 8,200 mAh battery that lasts about 10 hours. It can be used while charging.","It has two modes, switched with one keystroke. Traditional mode is a menu system modeled on the Braille 'n Speak, with an editor, calendar, phonebook, calculator, radio tuner, media player and AI chat. Desktop mode runs the Linux MATE desktop with the Orca screen reader, LibreOffice, Thunderbird, Firefox and Chromium. Voices include Vocalizer, RHVoice, Pico, Festival Lite, eSpeak and DECtalk."]},{"id":"btbraille","n":"BT Braille","co":"blazietech","cat":"Notetakers","yr":2026,"y":"Demonstrated March 2026","o":"A braille-display companion to the BT Speak, demonstrated in March 2026. Specifications are not yet documented.","pre":["btspeak"],"src":["https://blazietech.com"]},{"id":"keynote","n":"Keynote talking word processor","co":"pulse","cat":"Notetakers","yr":1986,"y":"1986","o":"A portable talking word processor from the Wormald Sensory Aids team, Pulse Data's predecessor.","h":"Built on the Epson HX-20 portable computer with Keyword software, under Russell Smith.","s":{"cpu":"Epson HX-20 platform"},"suc":["bnclassic"],"src":["https://afb.org/aw/6/6/14572"]},{"id":"bnclassic","n":"BrailleNote Classic (BT/QT)","co":"pulse","cat":"Notetakers","yr":2000,"y":"April 2000 (shipping from June 2000)","o":"The first BrailleNote, a Windows CE-based notetaker running KeySoft, made by Pulse Data.","h":"Released in April 2000 and shipping by June 2000 (AccessWorld review). It competed with the Braille Lite 2000 (18 cells, $3,395) and Braille Lite 40 2000 ($5,495). Sendero GPS launched on it in 2001. KeySoft 7.5 was its last software release; KeySoft 8.0 did not support it.","f":["KeySoft suite: KeyWord, KeyPlan, KeyList, KeyMail","Braille (BT) or QWERTY (QT) keyboard","Touch cursors above each cell","Four thumb keys","Internal soft modem","Speaker about 2 inches across","Can work as a braille display and synthesizer with Window-Eyes","ActiveSync with a PC","English only at launch"],"s":{"cpu":"MIPS R4000 at 100 MHz","os":"Windows CE 2.12, later up to CE.NET 4.2, running KeySoft","tts":"Keynote Gold Multimedia, running under Windows CE","ram":"4 MB, expandable to 16 MB (flash for OS and data, plus RAM)","disp":"18 or 32 cells with touch cursors","bat":"Rechargeable NiMH","price":"BrailleNote 18 $3,799; BrailleNote 32 $5,499 (2001, plus $45 shipping)","dim":"9.5 × 5 × 1 in","wt":"2 lb 9 oz (32-cell)"},"pre":["keynote"],"suc":["bnpk","bnmp"],"vo":["kngold"],"src":["https://en.wikipedia.org/wiki/BrailleNote","http://www.nfbnet.org/pipermail/nfbwatlk_nfbnet.org/2009-January/000811.html","http://nfbnet.org/pipermail/nabs-l_nfbnet.org/2014-March/033135.html","https://afb.org/aw/1/6/16145","http://leb.net/blinux/list-archive/blinux-list/2000/msg00513.html","https://www.mail-archive.com/braillenote@list.pulsedata.com/msg23785.html","https://afb.org/aw/3/1/14967"],"ph":"9.5 x 5 x 1 in. The 32-cell model weighs 2 lb 9 oz. Gray case with green keys; the 18- and 32-cell models share one case, and an 18-cell unit can be upgraded to 32 cells.","io":"PCMCIA slot, serial, parallel, modem, infrared, earphone jack, AC adapter","desc":["The original BrailleNote (BT with a braille keyboard, QT with a QWERTY keyboard) is a flat, rectangular notetaker about 9½ inches wide, 5 inches deep and 1 inch thick. AccessWorld weighed the 32-cell model at 2 pounds 9 ounces. The case is gray and the braille keys are green.","On the top surface, nine keys sit on a gentle curve for comfort: an eight-dot braille keyboard plus a space bar. The two outer keys, for the little fingers, act as Backspace (dot 7) and Enter (dot 8).","At the front of the top surface is an 18- or 32-cell refreshable braille display. Both sizes use the same case, and an 18-cell unit could be upgraded to 32 cells. Above each braille cell is a small touch cursor (routing button) that jumps the cursor to that spot.","On the narrow front edge facing you are four thumb keys, used to move back and forward through documents and menus without lifting your fingers from the braille. The thumb-key layout became a BrailleNote signature.","Around the edges are a PCMCIA card slot (for the optional disk drive and other accessories), serial and parallel ports, a modem phone jack, an infrared port, an earphone jack and the AC adapter socket. Power comes from a rechargeable nickel-metal-hydride battery."]},{"id":"bnpk","n":"BrailleNote PK","co":"pulse","cat":"Notetakers","yr":2004,"y":"Announced July 2004","o":"A compact 18-cell BrailleNote based on BAUM's Pronto hardware.","f":["Bluetooth","CompactFlash (Wi-Fi through a CF card)","Joystick navigation"],"io":"USB, Bluetooth, CompactFlash, serial; no modem, infrared or parallel port","s":{"cpu":"ARM-based Windows CE platform; AccessWorld and HumanWare materials do not name the exact chip","ram":"40 MB","sto":"16 MB flash","disp":"18 cells","os":"Windows CE with KeySoft","price":"$4,995 (2005)","tts":"Keynote Gold","dim":"About 7 × 4 × 2 in","wt":"About 1 lb"},"pre":["bnclassic"],"src":["https://en.wikipedia.org/wiki/BrailleNote","https://afb.org/aw/6/1/14662","https://www.mail-archive.com/braillenote@list.pulsedata.com/msg23785.html"],"ph":"About 7 x 4 x 2 in, about 1 lb.","h":"","desc":["The BrailleNote PK, announced in July 2004, was the smallest Windows-based accessible PDA of its day. It weighs about a pound and measures roughly 7 inches wide, 4 inches deep and 2 inches thick, small enough to hold in one hand.","Unlike larger BrailleNotes, the eight square braille input keys sit behind the braille display, at the back of the top surface. The outer keys are set farther back than the inner keys to fit the shape of your hand. AccessWorld found these keys and the display among the quietest it had tested.","In front of the display are two smooth keys that both act as space bars. On either side of them are two small, slightly recessed control keys; you hold one down to turn the unit on or off, since there is no power switch.","The 18-cell braille display has a cursor routing key above each cell. On each side of the display are three small buttons stacked vertically for scrolling, and the top button on each side starts and adjusts automatic scrolling. On the front edge is a small four-way joystick that you can also press to select.","All connectors are on the back panel: power, headphone, USB, a CompactFlash slot and a non-standard serial port that uses supplied cables. A small Bluetooth antenna sticks out about half an inch from the back. There is no parallel port, infrared port or built-in modem. It comes in a fitted carrying case with a shoulder strap."]},{"id":"bnmp","n":"BrailleNote mPower BT","co":"hw","cat":"Notetakers","yr":2005,"y":"June 2005","o":"The second-generation full-size BrailleNote, with braille keyboard.","h":"Launched alongside the VoiceNote mPower. It ran KeySoft 6.2 at launch; KeySoft 7.5 Build 29 (May 2008) added 802.11g Wi-Fi card support, and KeySoft 8.0 followed in 2009.","f":["SD, CompactFlash and PCMCIA slots","Bluetooth"],"io":"2 USB host ports plus mini-USB client; SD, CF and PCMCIA slots; Bluetooth","s":{"cpu":"Intel XScale PXA272 at 416 MHz","sto":"128 MB flash (DiskOnChip)","os":"Windows CE with KeySoft 6.2 at launch","disp":"18 or 32 cells","tts":"Keynote Gold (Eloquence was not offered on mPower)","ram":"64 MB RAM; 128 MB flash disk (DiskOnChip)","syns":"Eloquence (software, with English, Spanish and French voices on the Apex; five selectable Eloquence voices) plus optional KeyNote Gold; chosen in Options > Review Voice","price":"mPower BT32 or QT32 $6,195; BT18 or QT18 $4,395; VoiceNote mPower $1,995 (2005, plus $45 shipping)"},"pre":["bnclassic"],"suc":["bnapex"],"src":["https://afb.org/aw/7/1/14531","http://therangerstation.blogspot.com/2008/05/press-release-humanware-releases.html","https://www.freelists.org/post/braillenote/keynote-gold-speech-thoughts,10","https://web.archive.org/web/20110713025651/www.indigo-logix.com/web/index.php?id=24&option=com_content&task=view","https://www.freelists.org/post/braillenote/notetakers-and-Eloquence-speech,11","https://www.mail-archive.com/braillenote@list.pulsedata.com/msg24751.html","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/bloc-notes-braille-apex-bt-32-version-930","https://www.afb.org/aw/7/1/14531"],"desc":["The BrailleNote mPower, introduced June 28, 2005, has the same size and keyboard as earlier BrailleNotes (about 9½ × 5 × 1 inches). It looks sleeker, with a silver case instead of gray and forest-green keys instead of teal.","The top has the curved eight-dot braille keyboard with space bar and an 18- or 32-cell braille display with a routing button above each cell. The four thumb keys stay on the front edge facing you.","The back panel has the power socket, a telephone jack for the built-in 56K modem, a serial port, a CompactFlash slot, an SD card slot, two USB host ports, one USB client port and built-in Bluetooth. There is no parallel port.","The PCMCIA slot is on the right side. On the left side are the earphone jack and power switch, plus a new external microphone jack and a small recessed Record button that starts a voice recording from any application. An internal microphone is built in.","Inside is a 128 MB flash drive. AccessWorld noted excellent stereo sound through headphones, while the built-in speaker is the same modest one as earlier models."]},{"id":"bnmpqt","n":"BrailleNote mPower QT","co":"hw","cat":"Notetakers","yr":2005,"y":"2005","o":"The QWERTY-keyboard version of the mPower, with the same internals.","s":{"cpu":"Intel XScale 416 MHz","sto":"128 MB flash","os":"Windows CE with KeySoft","tts":"Keynote Gold","syns":"Eloquence (software, with English, Spanish and French voices on the Apex; five selectable Eloquence voices) plus optional KeyNote Gold; chosen in Options > Review Voice","price":"QT32 $6,195; QT18 $4,395 (2005)"},"pre":["bnclassic"],"suc":["bnapex"],"src":["https://afb.org/aw/7/1/14531","https://www.freelists.org/post/braillenote/keynote-gold-speech-thoughts,10","https://www.freelists.org/post/braillenote/notetakers-and-Eloquence-speech,11","https://www.mail-archive.com/braillenote@list.pulsedata.com/msg24751.html","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/bloc-notes-braille-apex-bt-32-version-930","https://www.afb.org/aw/7/1/14531"],"desc":["The BrailleNote mPower QT is the QWERTY-keyboard version of the mPower, introduced in 2005. AccessWorld says the mPower came with either a braille or a QWERTY keyboard, in the same case size as earlier BrailleNotes (about 9½ × 5 × 1 inches).","Instead of the eight braille keys, its top surface carries a typewriter-style QWERTY keyboard. The sources checked don't give a key-by-key layout.","In front of the keyboard is an 18- or 32-cell refreshable braille display with a cursor routing button above each cell, and four thumb keys on the front edge for moving through text.","The ports match the braille-keyboard mPower: power, phone line, serial, CompactFlash and SD slots, two USB host ports and one USB client port on the back; PCMCIA on the right; earphone, power switch, microphone jack and recessed Record button on the left.","The case is silver, and it has the same 128 MB flash storage and Bluetooth as the BT model. A VoiceNote mPower QT version had speech only, with no braille display."]},{"id":"bnapex","n":"BrailleNote Apex BT32","co":"hw","cat":"Notetakers","yr":2009,"y":"
