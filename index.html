November 2009","o":"A thinner, lighter BrailleNote running Windows CE 6.","h":"Released in November 2009. It received KeySoft 9.x updates, including 9.3 (2012) and 9.4.1 (2014, with KeyMaps).","f":["Wi-Fi","Removable battery","VGA output"],"io":"3 USB host ports plus 1 client, VGA, Ethernet, Wi-Fi, Bluetooth 2.1","s":{"cpu":"Freescale i.MX31","ram":"256 MB SDRAM","sto":"8 GB flash","os":"Windows CE 6 with KeySoft","disp":"32 cells","price":"€6,900 incl. VAT (France, KeySoft 9.3, 2013)","tts":"Eloquence (default), Keynote Gold optional","syns":"Eloquence (software, with English, Spanish and French voices on the Apex; five selectable Eloquence voices) plus optional KeyNote Gold; chosen in Options > Review Voice","dim":"9.61 × 5.63 × 0.78 in (244 × 143 × 19 mm) per dealer","wt":"About 1.8 lb (812 g) per dealer"},"pre":["bnmp"],"suc":["bntouch"],"src":["https://en.wikipedia.org/wiki/BrailleNote","https://nfb.org/images/nfb/publications/bm/bm12/bm120604.htm","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/bloc-notes-braille-apex-bt-32-version-930","https://www.mail-archive.com/braillenote@list.humanware.com/msg80955.html","https://www.freelists.org/post/braillenote/notetakers-and-Eloquence-speech,11","https://www.mail-archive.com/braillenote@list.pulsedata.com/msg24751.html","https://www.afb.org/aw/13/4/15822","https://www.edvisionservices.org/manuals/braillenote%20apex%20bt%20user%20guide.pdf","https://boundlessat.weebly.com/store/p3/BrailleNote_Apex.html"],"desc":["The BrailleNote Apex BT32 is a thin, light notetaker that HumanWare called the thinnest and lightest braille notetaker anywhere. A dealer lists it at about 9.6 × 5.6 × 0.78 inches and 1.8 pounds (812 g). It ships in a slim wraparound leather case with a carrying strap, and you can use it without taking it out of the case.","On top is an eight-key braille keyboard like a braillewriter: six dot keys, plus Backspace (dot 7) under the left little finger and Enter (dot 8) under the right. A small scroll wheel sits in the middle between the dot 1 and dot 4 keys, with the space bar just below it.","Nearest you is a 32-cell display of eight-dot braille cells, with a cursor routing button above each cell.","On the front edge facing you are four thumb keys, named Previous, Back, Advance and Next from left to right. They can be set for right- or left-handed use, so you can move through text without lifting your fingers from the braille.","Around the edges are three USB ports, an SD card slot, earphone and microphone jacks, an Ethernet port and a VGA port for a sighted person's monitor. The battery is user-replaceable."]},{"id":"bnapex18","n":"BrailleNote Apex BT18","co":"hw","cat":"Notetakers","yr":2010,"y":"May 2010","o":"An 18-cell Apex, launched for the BrailleNote's 10th anniversary. HumanWare called it the tenth notetaker in the line.","ph":"2 cm (0.78 in) thick, 734 g (1.8 lb). Another listing gives 0.78 x 9.61 x 5.63 in and 1.6 lb.","io":"Four high-speed USB 2.0 ports (3 host, 1 client), Ethernet, Wi-Fi, Bluetooth 2.1, SDHC","s":{"cpu":"Freescale i.MX31","ram":"256 MB SDRAM","sto":"8 GB","os":"Windows CE 6 with KeySoft","disp":"18 cells","bat":"Rechargeable, user-replaceable lithium-ion","tts":"Eloquence or Keynote Gold","syns":"Eloquence (software, with English, Spanish and French voices on the Apex; five selectable Eloquence voices) plus optional KeyNote Gold; chosen in Options > Review Voice"},"pre":["bnmp"],"src":["http://www.nfbnet.org/pipermail/nfbcs_nfbnet.org/2010-May/002031.html","https://veterans.networkofcare.org/philadelphia-pa/AssistiveDevices/ProductDetail?productId=114282","https://www.mail-archive.com/braillenote@list.humanware.com/msg80955.html","https://www.freelists.org/post/braillenote/notetakers-and-Eloquence-speech,11","https://www.mail-archive.com/braillenote@list.pulsedata.com/msg24751.html","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/bloc-notes-braille-apex-bt-32-version-930","https://www.afb.org/aw/13/4/15822","https://www.edvisionservices.org/manuals/braillenote%20apex%20bt%20user%20guide.pdf"],"desc":["The BrailleNote Apex BT18 is the 18-cell version of the Apex, launched in May 2010. It shares the Apex design: a thin case in a wraparound leather carrying case.","The top has the eight-key braille keyboard (six dot keys plus Backspace and Enter), with a scroll wheel between the dot 1 and dot 4 keys and the space bar below it.","Nearest you is an 18-cell eight-dot braille display with a cursor routing button above each cell.","Four thumb keys (Previous, Back, Advance and Next) are on the front edge, set right-handed at the factory and switchable to left-handed.","Its ports and user-replaceable battery follow the Apex design. The sources checked give measurements only for the 32-cell Apex, not the 18-cell model."]},{"id":"bntouch","n":"BrailleNote Touch","co":"hw","cat":"Notetakers","yr":2016,"y":"2016","o":"The first Google-certified braille tablet with Play Store access, running KeySoft on Android.","ph":"24.4 x 16.2 x 2.06 cm, 900 g (2 lb).","f":["7-inch 1024x600 touchscreen","8 MP camera","KNFB Reader included","GPS, accelerometer, gyroscope, compass"],"io":"USB 2.0 host and client, HDMI output, headphone and mic jacks, Wi-Fi b/g/n, Bluetooth 4.0","s":{"cpu":"TI OMAP4460 dual-core Cortex-A9 at 1.2 GHz","ram":"2 GB","sto":"32 GB internal SD (spec page); SD card up to 32 GB","os":"Android 4.4 with KeySoft","disp":"18 or 32 cells","bat":"5,100 mAh, user-replaceable","tts":"Acapela (default); Android TTS engines such as Vocalizer and CereProc can be added","price":"18 cells $3,995; 32 cells $5,495 (2016)","syns":"Android text-to-speech engines (KeySoft on Android)","dim":"9.5 × 6.3 × 0.8 in (tablet); 10.2 × 6.9 × 1.6 in in case","wt":"2 lb (900 g); 3 lb (1,420 g) in case"},"pre":["bnapex"],"suc":["bntp"],"src":["https://www.humanware.com/microsite/bntouch/specs.php","https://www.humanware.com/wp-content/uploads/2024/10/EN-UG-BNTouch-Update-4.html","https://groups.io/g/braillenote/topic/cereproc_voices_and_other_tts/80723268","https://blindbargains.com/bargains.php?m=14995","https://www.second-sense.org/2018/10/braille-notetakers/","https://afb.org/aw/17/8/15305","https://www.humanware.com/microsite/bntouch/faq.php","https://www.braillists.org/wp-content/uploads/bod24.pdf"],"desc":["The BrailleNote Touch is an Android braille tablet launched at CSUN in 2016. The tablet itself is 9½ inches wide, 6.3 inches deep and 0.8 inch high and weighs 2 pounds (900 g). In its case with the keyboard it is about 10.2 × 6.9 × 1.6 inches and 3 pounds.","Most of the top is a glass touch screen with a 7-inch visual display that can be turned off. You can type braille right on the glass with TouchBraille: rest all ten fingers on the screen, feel a short vibration, and the virtual keys find your fingers.","The carrying case has a physical Perkins-style braille keyboard built in. It folds over the glass, held in place by magnets, and plugs into a port on the back of the tablet; fold it back to use the touch screen.","Nearest you is an 18- or 32-cell braille display with a routing button over each cell and a stereo speaker at each end. On the front edge are four thumb keys, two short and two long, with three small keys between them: a triangular Back key, a round Home key and a square key for the context menu or app switcher.","On the left side are a micro USB port, an oval power button and volume buttons. The back has a full-size USB port, an SD card slot and an HDMI port (video only). The right side has microphone and headphone jacks and a camera button. Under the tablet, two latches release the replaceable battery and there is a camera window."]},{"id":"bntp","n":"BrailleNote Touch Plus","co":"hw","cat":"Notetakers","yr":2019,"y":"2019","o":"An updated Touch with a much faster processor and newer Android.","f":["21 MP camera","TalkBack-based accessibility"],"io":"USB-C (USB 3.0 speed), HDMI with audio, Wi-Fi a/b/g/n/ac 2x2, Bluetooth 4.2","s":{"cpu":"Qualcomm Snapdragon 820, quad-core Kryo 2.2 GHz, 64-bit","ram":"4 GB LPDDR4","sto":"64 GB","os":"Android 8.1 Oreo","disp":"18 or 32 cells","tts":"Acapela (default, up to four voices); Android TTS engines such as Vocalizer and CereProc can be added","price":"32 cells $5,695; 18 cells $4,195","syns":"Android text-to-speech engines","dim":"9.5 × 6.3 × 0.8 in","wt":"About 2 lb"},"pre":["bntouch"],"suc":["evolve"],"src":["https://www.humanware.com/wp-content/uploads/2024/10/BrailleNote-Touch-Plus-Frequently-Asked-Questions.html","https://www.perkins.org/resource/braillenote-touch-plus-update/","https://www.applevis.com/forum/assistive-technology/braille-note-touch-plus-finally-get-update-after-three-whole-years-what","https://www.humanware.com/wp-content/uploads/2024/10/EN-UG-BNTouch-Update-4.html","https://groups.io/g/braillenote/topic/cereproc_voices_and_other_tts/80723268","https://www.visionaid.co.uk/braillenote-touch-32-plus","https://afb.org/aw/20/7/16711"],"h":" It launched in February 2019 with Android 8.1. A September 2025 update (after about three years without one) renamed KeyMath to KeyGraph and added KeyRecorder, according to user reports; the device stayed on Android 8.1.","desc":["The BrailleNote Touch Plus (2018–2019) is the faster refresh of the BrailleNote Touch, in the same body: 0.8 inch high, 9½ inches wide, 6.3 inches deep and about 2 pounds. AccessWorld called it 'a bit on the hefty side'.","Like the original, it has a glass touch screen for TouchBraille typing and a case with a built-in Perkins-style braille keyboard that folds over the screen.","Nearest you is the braille display, 18 or 32 cells in the same size case, with routing buttons and four thumb keys on the front edge.","The power button is more recessed than on the original Touch, to stop it switching on in a bag. It charges and connects through USB-C instead of micro USB.","Its accessibility software is built into the device instead of a removable internal SD card. It ships with the Acapela Sharon voice, and other voices can be added."]},{"id":"evolve","n":"BrailleNote Evolve","co":"hw","cat":"Notetakers","yr":2026,"y":"Previewed late 2025; launched 2026","o":"A braille-first Windows 11 notetaker running KeySoft alongside a customized NVDA.","ph":"243 x 175 x 20 mm; 990 g (1.4 kg with case).","io":"Two Thunderbolt 4 USB-C (charging and video), USB 3.2 Type-A, HDMI 1.4, 3.5 mm audio jack, Wi-Fi 6, Bluetooth 5 (x2), programmable RFID tag.","s":{"cpu":"Intel Core Ultra 5 125U","ram":"32 GB LPDDR5x","sto":"512 GB NVMe","os":"Windows 11 Pro with KeySoft","disp":"20 or 32 braille cells with cursor routing","bat":"Three 5,000 mAh Li-polymer cells; about 5.5 hours","price":"32-cell: $6,199 (HumanWare US store)","tts":"Windows/NVDA speech (customised NVDA)","dim":"243 × 175 × 20 mm","wt":"990 g (1.4 kg with case)"},"pre":["bntp"],"src":["https://store.humanware.com/hus/braillenote-evolve-32.html","https://www.humanware.com/braillenote-evolve/","https://www.humanware.com/wp-content/uploads/2026/06/Technical-Specs-BrailleNote-evolve.pdf","https://doubletaponair.com/humanware-previews-braillenote-evolve-a-windows-powered-note-taker-for-2026/"],"desc":["The BrailleNote Evolve is HumanWare's 2026 braille computer, running KeySoft on Windows 11. HumanWare's specification sheet gives 243 mm wide, 175 mm deep and 20 mm thick (9.57 × 6.89 × 0.79 in), or 25 mm (1 in) on its feet, and 990 g (2.18 lb), or about 1.4 kg (3 lb) in its case.","It comes in 20- and 32-cell braille configurations. HumanWare's labeled drawings show the top surface with the braille keyboard and display; the full key layout is described in that sheet's figures, which are image-only.","On the left side edge are ports and buttons: a 3.5 mm audio jack that works with a microphone, an HDMI 1.4 port and two USB-C Thunderbolt 4 ports, both of which can charge it. There is also a USB 3.2 Type-A port.","Inside are an Intel Core Ultra 5 125U processor, 32 GB of LPDDR5x memory and a 512 GB NVMe drive. It has vibration haptics, stereo speakers, Wi-Fi 6, Bluetooth 5 and a programmable RFID tag for future use.","In the box are the Evolve, a carrying case, a nylon strap with shoulder pad, headphones, a power adapter, a print and braille Getting Started guide and command summary, and a modifier sticker."]},{"id":"vnclassic","n":"VoiceNote BT / QT (Classic)","co":"pulse","cat":"VoiceNotes","yr":2000,"y":"Introduced at Closing the Gap 2000; replaced in 2005","o":"A speech-only BrailleNote with no braille display, with a braille (BT) or QWERTY (QT) keyboard.","h":"Replaced by the VoiceNote mPower in 2005. KeySoft 7.5 was the last release for Classic VoiceNotes.","s":{"os":"Windows CE with KeySoft","tts":"Keynote Gold Multimedia","price":"$2,295 (AccessWorld 2003)","wt":"1 lb 10 oz","dim":"9.5 × 5 × 1 in","io":"PC Card slot, serial, parallel, modem, earphone jack, CompactFlash, infrared","bat":"Rechargeable NiMH"},"suc":["vnmp"],"src":["https://afb.org/aw/7/1/14531","http://www.nfbnet.org/pipermail/nfbwatlk_nfbnet.org/2009-January/000811.html","https://afb.org/aw/1/6/16145","https://www.mail-archive.com/braillenote@list.pulsedata.com/msg23785.html","https://afb.org/aw/4/3/14847","https://www.mail-archive.com/braillenote@list.pulsedata.com/msg24873.html"],"desc":["The VoiceNote is a BrailleNote without the braille display. Pulse Data and HumanWare introduced it at Closing the Gap 2000, with either an eight-dot braille keyboard (BT) or a QWERTY keyboard (QT). It runs the same Windows CE-based KeySoft suite as the BrailleNote, but output is speech only.","AccessWorld measured it at 9.5 × 5 × 1 inches and 1 pound 10 ounces, the same footprint as the BrailleNote. The case is gray. On the BT model the nine keys (eight braille dots plus a space bar) are green and arranged on a gentle curve for comfort.","Around the case are a PC Card slot, serial and parallel ports, a modem jack, an AC adapter jack, an earphone jack, a CompactFlash slot and an infrared port. Power comes from a rechargeable nickel-metal-hydride battery.","User reports on the BrailleNote list say early BT keys were fairly noisy and clacky and later units were quieter. QT owners described their keyboards as very quiet.","AccessWorld priced it at $2,295. Its strengths were the KeyWord word processor and KeyPlan calendar. You cannot install ordinary Windows programs on it, and AccessWorld found the e-mail and GPS (Atlas Speaks-based) features needed improvement."]},{"id":"vnmp","n":"VoiceNote mPower BT / QT","co":"hw","cat":"VoiceNotes","yr":2005,"y":"2005","o":"The speech-only version of the BrailleNote mPower.","s":{"cpu":"Intel XScale 416 MHz","sto":"128 MB flash","os":"Windows CE with KeySoft","tts":"Keynote Gold","price":"$1,995 plus $45 shipping (2005)","io":"2 USB host, 1 USB client, SD, CompactFlash, PC Card, serial, modem, earphone and microphone jacks, Bluetooth"},"pre":["vnclassic"],"suc":["vnapex"],"src":["https://afb.org/aw/7/1/14531","https://www.freelists.org/post/braillenote/keynote-gold-speech-thoughts,10"],"desc":["The VoiceNote mPower is the speech-only member of HumanWare's BrailleNote mPower family, announced June 28, 2005. It has a braille (BT) or QWERTY (QT) keyboard and no braille display.","AccessWorld says the mPower family is the same size as earlier BrailleNotes and VoiceNotes, with the same keyboard and thumb keys. The gray case gave way to a silver one, and the teal keys to forest green.","Along the back panel are the power jack, phone line jack and serial port, a CompactFlash slot, an SD slot, two USB host ports and one USB client port. The PC Card slot stays on the right side. On the left are the earphone jack, power switch, an external-microphone jack and a recessed Record button, and there is also an internal microphone. The parallel port was dropped.","Inside are 128 MB of flash storage, Bluetooth and an internal 56K modem. Headphones give good stereo sound, but the built-in speaker is the same modest one as before. AccessWorld noted shorter battery life than earlier units and no DAISY or Audible playback at launch.","The VoiceNote mPower BT or QT cost $1,995 plus $45 shipping. Owners of older units could have their hardware moved into a new mPower case through HumanWare's 'transplant' option."]},{"id":"vnapex","n":"VoiceNote Apex BT / QT","co":"hw","cat":"VoiceNotes","yr":2010,"y":"July 2010","o":"The voice-only Apex, introduced the Friday before the 2010 NFB convention. It is physically identical to the Apex, and HumanWare said a braille display could be added later.","s":{"cpu":"Freescale i.MX31","ram":"256 MB","sto":"8 GB","os":"Windows CE 6 with KeySoft","tts":"Eloquence or Keynote Gold","wt":"612 g (1.35 lb)","dim":"244 × 143 × 19 mm (9.61 × 5.63 × 0.78 in)","io":"SD/SDHC, Ethernet, USB client, 3 USB host, Wi-Fi b/g, Bluetooth 2.1","bat":"User-replaceable lithium-ion"},"pre":["vnmp"],"src":["https://afb.org/aw/11/4/16038","https://www.mail-archive.com/braillenote@list.humanware.com/msg80955.html","https://editmicro.co.za/product/voicenote-apex-bt/"],"desc":["The VoiceNote Apex is the speech-only Apex, introduced in July 2010. It is physically the same as the BrailleNote Apex but has no braille display, with an eight-dot braille keyboard (BT) or a QWERTY keyboard (QT).","A dealer spec sheet gives 612 g (1.35 lb) and 244 × 143 × 19 mm (9.61 × 5.63 × 0.78 in), a thinner case than the older VoiceNotes.","It has stereo speakers, an omnidirectional internal microphone, a user-replaceable lithium-ion battery and jacks for an external speaker or headphones and a microphone. A real-time clock keeps time for 30 days on backup power.","Ports include one SD/SDHC slot, a 10/100 Ethernet port, a USB 2.0 client port for ActiveSync and three USB 2.0 host ports. Wi-Fi (802.11b/g) and Bluetooth 2.1 are built in. A USB voice modem and a Bluetooth GPS receiver were optional.","Inside are a Freescale i.MX31 processor, 256 MB of SDRAM and 8 GB of storage, running Windows CE 6 with KeySoft. A braille terminal mode lets it work with a computer's screen reader."]},{"id":"dbc","n":"DeafBlind Communicator (DBC)","co":"hw","cat":"Other","yr":2008,"y":"December 2008","o":"A two-part communication system for deafblind people: a BrailleNote mPower running DeafBlind software, linked by Bluetooth to a DB-Phone, a Windows Mobile 6 cell phone with a screen and QWERTY keyboard. It supports face-to-face conversation with sighted people, TTY calls over a landline, and SMS text messages.","h":"HumanWare developed it with the Washington State Office of the Deaf and Hard of Hearing and began shipping it in December 2008. It filled a gap left when the TeleBraille went out of production in 1993. At launch, current BrailleNote mPower owners running KeySoft 7.5 could upgrade for $2,495; HumanWare sent the software and an authorization key on an SD card. Engadget covered it in June 2009. Users on the access-uk list later reported that HumanWare discontinued it when component parts became unavailable.","f":["Face-to-face mode with the Companion phone","TTY with answering machine over a landline","SMS and IM with a SIM card"],"io":"BrailleNote mPower: Bluetooth, 2 USB host ports, mini-USB client, infrared, 9-pin serial, SD card, CompactFlash and PCMCIA slots, plus a landline connector for TTY. DB-Phone: Bluetooth and a SIM card slot for SMS.","s":{"price":"DBC BT32 or QT32: $7,995; DBC BT18 or QT18: $6,195; upgrade for existing mPower owners: $2,495 (December 2008)","disp":"18 or 32 braille cells (BrailleNote); the DB-Phone has a visual screen","os":"Windows CE with a condensed KeySoft (BrailleNote); Windows Mobile 6 (DB-Phone)","cpu":"Intel XScale PXA272 at 416 MHz (BrailleNote mPower base unit)","ram":"64 MB RAM; 128 MB internal flash disk (BrailleNote mPower base unit)","tts":"Keynote Gold (BrailleNote mPower)","syns":"Keynote Gold on the BrailleNote mPower. The DB-Phone also speaks its greeting; no source names that voice.","used":"No eBay listings for the DeafBlind Communicator were found."},"src":["http://www.nfbnet.org/pipermail/nfbcs_nfbnet.org/2008-December/000128.html","https://nfb.org/deaf-blind-communication-technology","https://veterans.networkofcare.org/Columbia-pa/AssistiveDevices/ProductDetail?productId=113009","https://www.engadget.com/2009-06-08-deafblind-communicator-helps-deaf-blind-individuals-communicat.html","https://www.freelists.org/post/access-uk/DBC-DEAFBLIND-COMMUNICATION,4","https://web.archive.org/web/20110713025651/www.indigo-logix.com/web/index.php?id=24&option=com_content&task=view"],"desc":["The DeafBlind Communicator (DBC) lets a person who is both deaf and blind hold conversations in braille. It is two devices that talk to each other over Bluetooth: a braille notetaker the deafblind person keeps, and a small cell phone they hand to a sighted, hearing person. Everything is controlled from the notetaker.","The main unit is a BrailleNote mPower running DeafBlind software. It is a flat rectangular notetaker with either an eight-key Perkins-style braille keyboard (BT) or a typewriter QWERTY keyboard (QT), and an 18- or 32-cell refreshable braille display with touch cursors along the front edge. Inside are a 416 MHz Intel XScale processor, 64 MB of RAM and a 128 MB flash disk. Ports include USB, serial, infrared and SD and CompactFlash card slots.","The companion is the DB-Phone, an off-the-shelf Windows Mobile 6 phone with a color screen and a full QWERTY thumb keyboard. It has a retractable security tether so the sighted person cannot walk away with it. When it is turned on it boots straight into the DBC software. It shows and speaks a greeting: 'Hi, I'm blind and I can't hear. To communicate with me, type a message on this keyboard and press (the return arrow).'","In a face-to-face conversation, whatever the sighted person types on the phone appears in braille on the BrailleNote, and what the deafblind user types on the BrailleNote appears on the phone's screen. Plugged into a landline, the BrailleNote works as a TTY with an answering machine, directly or through a relay service. With a SIM card from a carrier in the DB-Phone, the user can send and receive SMS texts in braille. It can also chat with other DBC users and BrailleNote mPower users.","The notetaker can stay in a simplified DeafBlind Communicator mode, or switch to the full BrailleNote software: word processor with spell checker, planner, email, web browser and book reader. Prices were $6,195 for 18 cells and $7,995 for 32 cells, with either keyboard and with the face-to-face phone included. Its size and weight are those of the BrailleNote mPower and the phone it is built from; the sources give no separate figures for the combined package."]},{"id":"hwcomp","n":"HumanWare Companion (software)","co":"hw","cat":"Other","yr":0,"y":"Current version 4.2.9","o":"Free Windows software for HumanWare's Victor Reader Stream and Stratus players. It copies DAISY and NISO books, music, podcasts, text files and zipped books into the right SD-card folders, removes files, builds playlists, labels SD cards and checks for player updates.","src":["https://www.humanware.com/support/humanware_companion/","https://www.humanware.com/en-usa/support/victor_reader_stream_2/victor_reader_stream_2_faq","https://www.humanware.com/support-training/victor-reader-stream-3-faq/"],"f":["Book and music transfer to the right SD-card folders","Playlists","SD-card labeling","Player update checks"],"s":{"os":"Windows"},"h":""},{"id":"classmate","n":"ClassMate Reader","co":"hw","cat":"Book Readers","yr":2008,"y":"About 2008","o":"A portable reader for people with reading difficulties. It highlights text on a color screen while reading it aloud.","ph":"157 x 91 x 30 mm (6.2 x 3.6 x 1.2 in), 250 g (8.8 oz) with battery.","f":["Plays DAISY, NISO Z39.86, NIMAS, Bookshare, text, WAV and MP3","Text and voice notes, highlighting, dictionary","Color touchscreen with stylus"],"io":"USB 2.0 (PC connection and USB drives), SD card, 3.5 mm headphone jack, built-in microphone and speaker","s":{"tts":"Nuance Vocalizer","bat":"Lithium-ion 3.7 V, 2 Ah; 7 hours of DAISY playback","disp":"2 x 3 inch color LCD touchscreen"},"vo":["vocalizer"],"src":["https://manualzz.com/doc/29275645/humanware-classmate-user-manual","https://www.specialedtechcenter.org/setc/docs/E-reader_comparison.pdf"]},{"id":"vrclassic","n":"Victor Reader Classic","co":"visuaide","cat":"Book Readers","yr":2002,"y":"About 2002","o":"VisuAide's desktop DAISY talking-book player.","suc":["vrs1"],"src":["https://afb.org/aw/6/6/14572","https://afb.org/aw/5/1/14793","https://www.mkprosopsis.com/Hardware/VictorReaderClassicX.htm"],"s":{"dim":"9.3 × 8.2 × 2.1 in (Classic Plus)","wt":"2.42 lb (Classic Plus)","price":"Classic Plus $375 (2003)"},"desc":["AccessWorld described the Victor Reader Classic Plus, the fuller-featured model of the Classic family, in 2003. It is a CD player for DAISY books measuring 9.3 × 8.2 × 2.1 inches and weighing 2.42 pounds. The top slopes upward from front to back.","The built-in speaker is at the top left, with a carrying handle below it. On the right side, from back to front, are the AC socket, a line jack, a remote jack and an earphone jack.","It has 25 keys. Across the top, right of the speaker, are three pairs of keys stacked vertically for tone, volume and speed. Below them is a 12-key telephone-style keypad: 5 has a raised dot, 4 and 6 have raised left and right arrows, and 2 and 8 have fainter up and down arrows.","Below the keypad are Rewind, Play/Stop (square) and Fast Forward (arrow-shaped). The CD Eject key is to the right of Fast Forward, with the Power key above it.","With no CD inside, it enters a Key Describer mode that announces what any key does. The 1 key opens the Bookshelf, 3 the History list, 5 says where you are, 9 sets the sleep timer and 0 gives elapsed and remaining time."]},{"id":"vrs1","n":"Victor Reader Stream (1st generation)","co":"hw","cat":"Book Readers","yr":2007,"y":"2007 to 2014","o":"A handheld DAISY, MP3 and text player that became a standard portable for blind readers.","h":"Firmware version 3 was shown at CSUN 2009.","ph":"117 x 66 x 22 mm, 180 g.","f":["DAISY and NLS books","Text-to-speech for text files","Voice recorder"],"io":"SD/SDHC, USB 2.0, headphone jack","s":{"tts":"Nuance Vocalizer","bat":"About 15 hours of playback","syns":"Nuance Vocalizer text-to-speech","price":"$329 (2007)","dim":"4.6 × 2.6 × 0.9 in","wt":"About 6 oz"},"pre":["vrclassic"],"suc":["vrs2"],"vo":["vocalizer"],"src":["https://www.humanware.com/microsite/stream/index.html","http://nfbnet.org/pipermail/nfbcs_nfbnet.org/2009-March/000628.html","https://afb.org/aw/9/1/14279","https://afb.org/aw/9/5/14232"],"desc":["The first Victor Reader Stream (2007) is a handheld player about the size of a deck of cards, measuring 4.6 × 2.6 × 0.9 inches and weighing about 6 ounces with its rechargeable battery. Its only visual indicator is a small LED for off, on or charging.","The front has a 12-button telephone-style keypad. The 5 key has a small nib, which AccessWorld found too faint. Above the 1 key is a square Go To key, above the 3 key a diamond-shaped Bookmark key, and at the top a small speaker grill and internal microphone.","Below the keypad is a raised separator line. Under it, centered, is the Sleep key, and below that are Rewind, Play/Stop and Fast Forward.","On the left edge are the round Power button and two arrow-shaped buttons for volume, speed and tone. On the right edge are the headphone and external microphone jacks and the Record button.","Across the top are a small USB port, the AC socket and, in the center, the SD card slot where all content is stored. The keys are high-contrast for low-vision users. The built-in speaker is quiet and mainly for status messages."]},{"id":"vrs2","n":"Victor Reader Stream (2nd generation)","co":"hw","cat":"Book Readers","yr":2014,"y":"2014","o":"A smaller Stream with Wi-Fi for online services.","ph":"114 x 62 x 18 mm, 110 g (3.9 oz) with battery.","f":["Wi-Fi b/g/n","Reads BRF, TXT, HTML, XML, DOCX and EPUB"],"io":"Wi-Fi, USB, SD card, headphone jack","s":{"tts":"Acapela (two voices)","bat":"Up to 15 hours with headphones","dim":"4.5 × 2.4 × 0.7 in (114 × 62 × 18 mm)","wt":"3.9 oz (110 g)"},"pre":["vrs1"],"suc":["vrs3","trek"],"vo":["acapela"],"src":["https://www.devineexpress.com/products/ls-s-victor-reader-stream-2nd-generation-114-x-62-x-18mm","https://afb.org/aw/14/4/15708"],"desc":["The second-generation Victor Reader Stream (2014) is about 28% smaller than the first. It measures 4.5 × 2.4 × 0.7 inches and weighs 3.9 ounces with the battery, keeping the same keypad spacing.","The top edge has the SD card slot in the center and a protruding headphone jack on the right. The right side has a recessed microphone jack and, below it, a Record key with a barely detectable dot.","Across the top of the front are three keys: a square Go To key with a raised center (with the internal microphone hole above it), a round smooth Wireless key with an LED beside it, and a diamond-shaped Bookmark key.","Below them is a phone-style keypad; the 5 key has two raised dots. A raised line separates the keypad from an oval Sleep key and a bottom row of a left-arrow Rewind, a square Play/Stop and a right-arrow Fast Forward.","AccessWorld puts the round Power key and the up and down arrow keys near the top of the right edge, though the same review elsewhere says left; check the unit. Most of the back is a battery cover with a release near the top."]},{"id":"vrs3","n":"Victor Reader Stream (3rd generation)","co":"hw","cat":"Book Readers","yr":2023,"y":"2023 to present","o":"The current Stream, with USB-C, Bluetooth audio and support for SD cards up to 1 TB.","h":"Firmware 1.5 (June 2025), 1.6 (February 2026, experimental eBraille) and 1.7 (September 2026, eSpeak NG voices and NLS BARD 2). See OS History.","ph":"114 x 62 x 18 mm, 110 g.","io":"USB-C, Bluetooth 4.2, Wi-Fi, SD up to 1 TB, headphone jack","s":{"tts":"Acapela; eSpeak NG added in firmware 1.7","bat":"About 15 hours","syns":"Acapela text-to-speech (two voices)","price":"$499 (current list)","dim":"114 × 62 × 18 mm","wt":"110 g"},"pre":["vrs2"],"vo":["acapela","espeakng"],"src":["https://www.humanware.com/microsite/stream/index.html","https://www.humanware.com/news/stream-3-evolves/","https://store.humanware.com/hus/victor-reader-stream-handheld-media-player.html","https://shop.rnib.org.uk/products/victor-stream-3","https://www.humanware.com/wp-content/uploads/2024/11/Victor-Reader-Stream-User-Guide.html"],"desc":["The third-generation Victor Reader Stream (2023) measures 114 × 62 × 18 mm (4.5 × 2.4 × 0.7 in) and weighs 110 g, with a fully tactile interface.","Across the top of the front are the Go To, Online (Wi-Fi) and Bookmark keys.","Below them is the 12-key number pad, then Sleep, Rewind, Play/Stop and Fast Forward.","The left side has Power/Toggle, an LED, the Up and Down keys and the microphone jack. The right side has a red Record key.","The SD slot is on the top edge. The bottom edge has a USB-C port, the headphone jack and the speaker. It reads text with two Acapela voices."]},{"id":"trek","n":"Victor Reader Trek","co":"hw","cat":"Book Readers","yr":2017,"y":"2017","o":"A Stream 2 combined with a Trekker Breeze-style GPS.","f":["GPS with HERE maps","All Stream 2 book functions"],"io":"Wi-Fi b/g/n, Bluetooth 4.0, SD up to 32 GB","s":{"tts":"Acapela","bat":"12 to 15 hours","dim":"114 × 62 × 24 mm","wt":"5 oz","price":"$699 USD / $895 CAD (2018)"},"pre":["vrs2","breeze"],"vo":["acapela"],"src":["https://afb.org/aw/19/5/15095"],"desc":["The Victor Reader Trek (2017) combines the second-generation Stream with the Trekker Breeze GPS. It weighs 5 ounces and measures 114 × 62 × 24 mm, resting easily in one hand. It comes in a fitted silicone case.","The face has three distinctly shaped, widely spaced keys across the top. The middle one is the round Online key that also starts GPS.","Below them is a 12-key telephone keypad: the 5 has two dots, and the 2, 4, 6 and 8 keys have raised semicircles on their edges. A boldly raised line separates the keypad from the bottom keys.","Below the line is an oval key for time, date and sleep timer, then an arrow-shaped Rewind, a rectangular Play/Stop and an arrow-shaped Fast Forward.","The top edge has the SD slot and a 3.5 mm jack; the bottom edge a micro USB port. The left edge has the power button and up and down keys for volume, speed and tone; the right edge has the Record button. The lithium-ion battery is user-replaceable."]},{"id":"bookport","n":"Book Port","co":"aph","cat":"Book Readers","yr":2003,"y":"May 2003","o":"APH's handheld DAISY and text reader with 18 keys, running on 2 AA batteries.","io":"USB, headphone jack, flash memory card slot","s":{"bat":"2 AA batteries","tts":"DoubleTalk","dim":"4 × 2.25 × 1 in (AccessWorld); 2.75 × 4.75 × 1 in (APH manual)","wt":"6 oz with batteries"},"suc":["bookportplus"],"src":["https://afb.org/aw/4/4/14825","https://www.afb.org/aw/5/4/14712","https://tech.aph.org/bp_new.htm","https://afb.org/aw/5/4/14711","https://tech.aph.org/bp_doc.htm","https://afb.org/aw/9/5/14232"],"ph":"4 x 2.25 x 1 in, 6 oz with batteries. An 18-key keypad: a telephone keypad with a nib on 5, plus keys A to F. Headphone jack and USB port on top, card slot on the right, battery compartment and belt clip on the back.","f":["DAISY, text, Word, HTML, BRF and MP3","DoubleTalk synthesizer","Voice memo recorder","Remembers the reading position"],"h":"Debuted in May 2003. Firmware 1.2 shipped in September 2004 (APH revision history).","desc":["The Book Port is the American Printing House for the Blind's first handheld e-book and audio reader, released in 2003. It reads text, HTML, BRF, Word, RTF and DAISY 2 and 3 books aloud with a DoubleTalk synthesizer, plays MP3 and WAV files and records voice memos.","AccessWorld measured it at 4 × 2.25 × 1 inches and 6 ounces with batteries. APH's own manual gives 2.75 × 4.75 × 1 inches. The case is black and the keys are labeled in yellow for high contrast.","The face holds 18 round keys, evenly spaced. The top 12 are a telephone keypad with a nib on 5. Below them are two rows of three, A, B, C and D, E, F, which set speed and volume and control recording.","On the top edge are the headphone jack and USB port. The memory-card slot is on the right side, and the battery compartment (two AA batteries) and a belt clip are on the back. There is no power switch and no built-in speaker: press 2 to read, press it again to stop, and the unit turns itself off. You must use headphones or an external speaker.","The number keys navigate. 1 and 3 move by sentence, 4 and 6 by paragraph, 7 and 9 by page, 8 gives file statistics and 0 switches to the settings keypad. APH later discontinued it. One reviewer still preferred it to the Victor Reader Stream for its braille-style text input and markup of Audible books."]},{"id":"bookportplus","n":"Book Port Plus","co":"aph","cat":"Book Readers","yr":2010,"y":"March 10, 2010 (APH availability announcement)","o":"The Wi-Fi successor to the Book Port.","io":"Wi-Fi, SD up to 32 GB","pre":["bookport"],"src":["https://www.aph.org","http://nfbnet.org/pipermail/dtb-talk_nfbnet.org/2010-March/000771.html","https://tech.aph.org/bt_doc.htm","https://www.assistive-tech.net/products/116138"],"s":{"wt":"3.9 oz","dim":"4.4 × 2.2 in (listed depth is a typo)","bat":"Rechargeable lithium-polymer (AC or USB)","io":"Wi-Fi, SD/SDHC up to 32 GB, USB, earphone and microphone jacks"},"desc":["The Book Port Plus is APH's 2010 successor to the Book Port: a pocket DAISY player, text reader, MP3 player and recorder with Wi-Fi for internet radio, podcast downloads and wireless file transfer.","A product listing gives 4.4 by 2.2 inches and 3.9 ounces, smaller and lighter than the original Book Port. It runs on a rechargeable lithium-polymer battery, charged by AC adapter or USB.","In the normal position the speaker grille is farthest from you, and the telephone keypad, with a very pronounced dot on 5, is closest. Above the keypad are arrow keys, a Menu key, a Bookmark key, a Go To key, a Title key, a Play/Stop key and a Record key.","The top edge holds the microphone and earphone jacks, the right edge the volume control and key lock, the bottom edge the AC jack and USB port, and the left edge the SD card slot (SDHC up to 32 GB). The battery door is at the bottom of the back. It has a built-in speaker and microphone.","It plays NLS, RFB&D, Bookshare and Audible books (once the unit is authorized) and reads Word, text and HTML files with built-in text-to-speech. Earbuds, two USB cables and a carrying pouch came in the box."]},{"id":"bksense","n":"BookSense","co":"hims","cat":"Book Readers","yr":2009,"y":"2009","o":"A pocket DAISY and MP3 player from HIMS.","ph":"47 x 108 x 18.5 mm, 115 g.","suc":["bksxt","bksds"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/10/6/16088","https://www.nfbnet.org/pipermail/nfbcs_nfbnet.org/2011-November/003628.html","https://www.loc.gov/nls/services-and-resources/equipment-for-nls-materials/commercial-players-compatible-with-nls-materials-and-additional-products/"],"s":{"price":"$349 (standard)","wt":"4 oz","dim":"4.25 × 1.85 × 0.73 in","tts":"NeoSpeech Paul and Kate"},"desc":["The BookSense is HIMS's pocket book and audio player, sold in the US by GW Micro from 2009. It reads DAISY books (NLS, Bookshare, Audible), text and Word files, plays music and records. The standard model cost $349.","AccessWorld compares it to a candy-bar cell phone, 4.25 × 1.85 × 0.73 inches and 4 ounces, the smallest of the players it tested. A lanyard attaches at the top center.","The front, from the top: stereo speakers, a raised date-and-time button, a five-way control with nibs on the four arrows and a small square Menu button in the center, then a 3-by-4 phone keypad. The keypad has a nib on 5, and alternate keys are slightly concave or convex.","On the right side are the Play/Pause button (hold it for power), a Record button and a key-lock switch. On the left side are the Mode button, volume up and down and the SD card slot. The top edge has the microphone and 3.5 mm headphone jacks, the bottom the AC jack and USB port, and the back the battery compartment.","It reads with NeoSpeech Paul and Kate voices. A user report gives about 12 hours per charge and 2.5 hours to recharge. Holding the clock button turns on voice commands."]},{"id":"bksxt","n":"BookSense XT","co":"hims","cat":"Book Readers","yr":2009,"y":"2009","o":"A BookSense with 4 GB of internal memory, Bluetooth and an FM radio.","s":{"sto":"4 GB","price":"$499","wt":"4 oz","dim":"4.25 × 1.85 × 0.73 in"},"pre":["bksense"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/10/6/16088","https://www.nfbnet.org/pipermail/nfbcs_nfbnet.org/2011-November/003628.html"],"desc":["The BookSense XT is physically identical to the standard BookSense but adds an FM radio, 4 GB of built-in memory and Bluetooth headset support. GW Micro priced it at $499.","It is a candy-bar-shaped player, 4.25 × 1.85 × 0.73 inches and 4 ounces. Stereo speakers are at the top of the face, above a date-and-time button, a five-way control and a phone-style keypad with alternating raised and recessed keys.","The right side has Play/Pause (also power), Record and a lock switch. The left side has the Mode button, which on the XT also switches to the FM radio, plus volume keys and an SD slot. Microphone and headphone jacks are on top, and power and USB on the bottom.","AccessWorld tested an XT with software 1.1. It recommended the XT for anyone wanting a built-in FM radio, 4 GB of memory, Word document reading and the smallest size.","Users report MP3 or WAV recording, a 12-hour battery and voice-command control of playback."]},{"id":"bksds","n":"BookSense DS","co":"hims","cat":"Book Readers","yr":2010,"y":"2010","o":"A BookSense variant that GW Micro sold for $499.","s":{"price":"$499"},"pre":["bksense"],"src":["https://afb.org/aw/11/4/16038"]},{"id":"ptp1","n":"Plextalk Pocket PTP1","co":"plex","cat":"Book Readers","yr":2008,"y":"December 16, 2008 (Japan sales start)","o":"A pocket DAISY player and recorder.","ph":"55 x 112 x 16 mm, 110 g.","src":["https://www.plextalk.com","http://www3.kcn.ne.jp/~global-i/ptp1.html","https://afb.org/aw/10/6/16088","https://afb.org/aw/13/5/15814","https://www.plextalk.com/jp/support/ptp1/specifications/","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/lecteur-enregistreur-plextalk-pocket-ptp1"],"desc":["The PLEXTALK Pocket PTP1 is a DAISY book player and recorder from Shinano Kenshi. AccessWorld described it as shaped like a deck of cards with a quarter of the cards missing. It measures 112 by 55 by 16 millimeters (4.4 by 2.2 by 0.6 inches) and weighs about 110 grams with its battery. It was made in white and black; white ended in 2013.","The face is exceptionally smooth. On the lower part is a standard 12-key phone-style keypad, with 11 more keys above it. Every key has its own shape and texture, so AccessWorld found them effortless to locate by touch. Most prominent is a ring of four arrow keys around a concave Enter button, with Go To, Bookmark, Menu and Title keys at its four corners. Above the keys is a speaker that AccessWorld's reviewer called the best she had heard on a handheld player.","On the top edge are jacks for headphones and an external microphone. The bottom edge has the USB port and the AC adapter jack. The SD card slot is on the left edge. On the right edge are an up-and-down volume switch and a key-lock switch. A built-in microphone lets you record without accessories.","It plays DAISY books from NLS BARD, Bookshare, Learning Ally and Audible, as well as MP3, WAV and AMR-WB+ music, and reads text, HTML and Word files with TTS. It records in DAISY format with headings you can insert during or after recording. Holding Record captures a one-minute voice memo. A removable 1,430 mAh lithium-ion battery gives about 10 hours of playback and charges in about 4 hours. Melodic sounds confirm commands, and pressing 0 opens the full user manual.","In the box were a 2 GB SD card, stereo earbuds, an AC adapter, a USB cable, a short USB adapter for memory sticks or a CD drive, the manual on CD, and a zippered padded pouch. It cost $349 in 2010."],"h":" AccessWorld first evaluated it in 2010 at $349; its TTS used the Nuance Tom and Samantha voices. Deborah Kendrick's 2012 evaluation praised its stability and DAISY recording. Shinano Kenshi's Japanese specification page notes that the white model ended production in November 2013, after which it was sold in black only.","s":{"price":"$349 (AccessWorld, 2010); $275 promotional price until May 31, 2012; €350 in France (2013); ¥41,040 tax-exempt in Japan","dim":"112 × 55 × 16 mm (4.4 × 2.2 × 0.6 in)","wt":"About 110 g (3.9 oz) with battery; carrying case 51 g","bat":"Removable lithium-ion, 1,430 mAh; about 10 h DAISY/MP3 playback, about 8 h recording; about 4 h to charge","sto":"SD/SDHC up to 32 GB (2 GB card included); USB OTG for memory sticks and external CD drives"}},{"id":"nlsds1","n":"NLS DS1 / DA1 digital talking-book player","co":"nls","cat":"Book Readers","yr":2009,"y":"2009","o":"The free cartridge-based player issued by the Library of Congress talking-book program.","ph":"6.2 x 8.8 x 1.7 in, 2.52 lb.","io":"Book cartridge slot, USB, headphone jack","src":["https://www.loc.gov/nls/"]},{"id":"hansone","n":"Braille Hansone","co":"hims","cat":"BrailleSense","yr":2002,"y":"2002","o":"HIMS's first braille notetaker. Hansone means 'to see the world through one fingertip'; HIMS later renamed the product Braille Sense.","suc":["bsense"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/6/1/14662","https://afb.org/aw/6/1/14661","https://afb.org/aw/6/1/14658","https://afb.org/aw/6/3/14624"],"h":" AccessWorld (January 2005) explained that 'Hansone' means 'to see the world through one fingertip' in Korean. Because the meaning did not carry over to English speakers, HIMS renamed it Braille SENSE, and GW Micro distributed it in the United States. AFB rated it 2.5 of 5 for documentation, 3.5 for word processing, 3.0 for the web browser, calendar and address list, and 4.0 for speech and braille quality. Reviewers reported a confusing, poorly written manual, occasional freezes and unreliable web connections. AFB noted that the rating applied to the unit tested and that the product was updated afterwards.","s":{"os":"Windows CE .NET","ram":"64 MB RAM","sto":"64 MB flash; two CompactFlash slots","disp":"32 cells with 32 cursor-routing buttons","dim":"9 × 5 × 1.5 in","wt":"2.7 lb","bat":"Detachable lithium-ion","io":"Infrared, 2 USB, LAN, parallel, video out, serial, mic and stereo headphone jacks"},"desc":["The Braille Hansone is a HIMS braille notetaker with both speech and refreshable braille, later sold as the Braille Sense. AccessWorld measured it at 9 by 5 by 1.5 inches and 2.7 pounds. It runs Windows CE .NET with 64 MB of RAM and 64 MB of flash.","Across the top is an 8-key braille keyboard; dot 7 is Backspace and dot 8 is Enter. There are four oval function keys: F1 and F2 to the left of the space bar, and F3 and F4 to the right. F1 opens the Program menu, F2 the current program's menu, F3 is Tab and F4 is Escape. A small LCD sits in the middle above the keyboard. Above the Enter and Backspace keys, at the two outer edges, are stereo speakers.","Nearest you is a 32-cell braille display, with a row of 32 cursor-routing buttons directly above it. At the right end of that row is an Advance key for scrolling forward, and at the left end a Scroll Back key.","On the front panel, from left to right, are the microphone jack, the stereo headphone jack, and five recorder buttons: Previous, Record, Stop, Play/Pause and Next. On the right side, from front to back, are the on/off switch, the AC adapter jack and the compartment for the detachable lithium-ion battery. The left side has two CompactFlash slots.","The back panel, from left to right, holds an infrared port, two USB ports, a LAN network jack, a parallel port, a video output and a serial port. There is no modem. It can also serve as a braille display or speech synthesizer for a computer, and it plays MP3 files."]},{"id":"bsense","n":"BrailleSense (Classic)","co":"hims","cat":"BrailleSense","yr":2004,"y":"2004","o":"The first BrailleSense (the renamed Braille Hansone), a 32-cell notetaker running Windows CE.NET.","s":{"cpu":"Intel PXA255","ram":"64 MB","sto":"64 MB flash","os":"Windows CE.NET","disp":"32 cells with 32 routing buttons; LCD","bat":"Detachable lithium-ion","price":"$4,950 (Braille Hansone, early 2005)","tts":"An onboard speech engine. ACB's review notes it was the only engine available at the time; the engine is not named.","dim":"9 × 5 × 1.5 in","wt":"2.7 lb"},"pre":["hansone"],"suc":["bsplus","bslx"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/6/1/14662","https://www.acb.org/brief-look-braille-sense"],"ph":"9 x 5 x 1.5 in, 2.7 lb. Eight-key braille keyboard (dot 7 is Backspace, dot 8 is Enter) with F1 to F4. The front edge has microphone and headphone jacks and Previous, Record, Stop, Play and Next buttons.","f":["32-cell display with 32 routing buttons","LCD screen","Two stereo speakers","Voice recorder and DAISY player controls on the front edge","Up to seven open applications","Detachable lithium-ion battery","HBL braille document format; no spell checker at review time"],"io":"2 CompactFlash slots, infrared, 2 USB, LAN, parallel, VGA video out, serial, microphone and headphone jacks","h":"GW Micro distributed it in the US. AccessWorld (January 2005) found it lighter than the BrailleNote and PAC Mate.","desc":["The first BrailleSense was sold at first as the Braille Hansone, a Korean name meaning 'to see the world through one fingertip'. HIMS renamed it BrailleSense for English speakers. AccessWorld measured it at 9 × 5 × 1.5 inches and 2.7 pounds.","On top is an eight-key braille keyboard: dot 7 is Backspace and dot 8 is Enter. Four oval function keys sit beside the space bar, F1 and F2 on the left and F3 and F4 on the right. F1 opens the program menu, F2 the menu of the current program, F3 is Tab and F4 is Escape.","In the middle, above the keyboard, is a small LCD screen so sighted people can follow along, with a stereo speaker at each edge above Backspace and Enter.","Below the keyboard is a 32-cell braille display with 32 routing buttons. At the right end of the routing row is an Advance key and at the left end a Scroll Back key.","The front panel, from left to right, has a microphone jack, a stereo headphone jack and five audio buttons: Previous, Record, Stop, Play/Pause and Next. The right side has the power switch, AC socket and detachable lithium-ion battery; the left side has two CompactFlash slots. The back has infrared, two USB, LAN, parallel, video-out and serial ports."]},{"id":"bslx","n":"BrailleSense LX","co":"hims","cat":"BrailleSense","yr":2008,"y":"2008","o":"A 2008 BrailleSense variant. HIMS lists it as its 2007 to 2008 notetaker, between the original BrailleSense (2004) and the BrailleSense OnHand (2010). Neither HIMS nor Selvas BLV publishes a spec sheet for it.","pre":["bsense"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://selvasblv.com/product-history-grid/"],"h":" HIMS (now Selvas BLV) lists the BrailleSense LX as a 2008 notetaker in its official product history, after the original BrailleSense (2004) and before the BrailleSense OnHand (2010). No spec sheet, manual or review of the LX turned up in this research, so its specifications stay undocumented."},{"id":"bsplus","n":"BrailleSense Plus","co":"hims","cat":"BrailleSense","yr":2008,"y":"2008","o":"A 32-cell BrailleSense with an LCD and 8 GB of flash.","io":"Ethernet, CompactFlash, USB host","s":{"cpu":"Intel PXA270","ram":"128 MB","sto":"8 GB flash","os":"Windows CE 5.0","disp":"32 cells plus LCD","dim":"9.8 × 5 × 1.5 in","wt":"2 lb","price":"$5,995 (2009)"},"pre":["bsense"],"suc":["u2"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://nfb.org/images/nfb/publications/bm/bm09/bm0902/bm090211.htm"],"desc":["The BrailleSense Plus (2008) was made by HIMS of Korea and sold in the US by GW Micro. The NFB measured it at 9.8 inches wide, 5 inches deep and 1.5 inches high, weighing 2 pounds.","On top is a six-dot braille keyboard with Backspace on the left, Enter on the right and the space bar centered below. Beside the space bar are F1 and F2 on the left and F3 and F4 on the right. Behind the keyboard, in the center, is an LCD screen that can be flipped so a person sitting across from you reads it right side up, with a stereo speaker on each side.","Nearest you is the 32-cell braille display with a routing key above each cell and scroll keys at both ends.","The front panel has a three-position Lock switch (all keys, top keys only, or none), microphone and headphone jacks, a three-position media switch (FM radio, DAISY or media), five media buttons, and a spring-loaded power slider: slide right to turn on, left to turn off.","The left side has CompactFlash and SD slots. The back has a reset button, an Ethernet jack, a serial port and a VGA output. The right side has two USB ports (one to connect to a computer, one for flash drives) and the AC socket. Inside are 128 MB of RAM, 8 GB of flash, an FM tuner, Bluetooth and Wi-Fi."]},{"id":"onhand","n":"BrailleSense OnHand","co":"hims","cat":"BrailleSense","yr":2010,"y":"2010","o":"A compact 18-cell BrailleSense. GW Micro showed a prototype at the 2010 conventions.","ph":"4 x 7 x 1.5 in.","io":"WLAN b/g, Bluetooth, USB OTG, SD","s":{"cpu":"Intel PXA270","ram":"128 MB","sto":"4 GB flash","os":"Windows CE 5.0","disp":"18 cells","dim":"4 × 7 × 1.5 in (AccessWorld)","price":"$4,995 (2010)"},"suc":["u2mini"],"src":["https://afb.org/aw/11/4/16038","https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/12/10/15988","https://www.extra.co.jp/product/bsonhand/"],"desc":["The BrailleSense OnHand (2010) is a small 18-cell notetaker. AccessWorld measured it at 4 × 7 × 1.5 inches; the Japanese distributor Extra lists it at 17.2 × 9.0 × 2.7 cm and 425 g (about 15 oz). It has a white top panel on a black body and comes in a sturdy case with a shoulder strap that leaves every button reachable.","On top is an eight-key Perkins-style keyboard, with a row of four evenly spaced function keys below it. The small speaker is on the top panel between and above the dot 1 and dot 7 keys.","Below the function keys are 18 routing buttons over the 18 eight-dot braille cells, with two scroll keys on each side of the display.","The front edge has a three-position audio mode switch and five audio buttons. The left side has the AC socket, a USB port and a lock switch; the right side has the SD card slot and external microphone and headset jacks.","The battery door is on the bottom back edge. The battery has clear tactile guides for removing and replacing it, and a spare battery and a charger that beeps when charging is done come in the box."]},{"id":"u2","n":"BrailleSense U2 (Perkins-keyboard edition)","co":"hims","cat":"BrailleSense","yr":2012,"y":"July 2012","o":"The flagship Windows CE BrailleSense, with an 8-dot Perkins-style keyboard. French distributors sold it as the BrailleSense U2 Perkins.","h":"Its final firmware, 9.0, added device status checks, better file management, PDF conversion, VNC viewing and a startup wizard.","ph":"25 x 13 x 3.9 cm, 924 g.","f":["GPS and compass (GPS navigation optional)","DAISY, EPUB, MP3 recorder, FM radio, YouTube","Screen-reader terminal for Windows, Mac, Linux, iOS and Android"],"io":"4 USB OTG ports, SD slot, Wi-Fi b/g/n, Bluetooth, Ethernet, audio in and out","s":{"cpu":"1 GHz mobile CPU","sto":"32 GB flash","os":"Windows CE 6.0","tts":"Eloquence","disp":"32 cells plus LCD","bat":"Removable lithium, about 17 hours","price":"€6,890 incl. VAT in France (January 2014)","dim":"250 × 128–130 × 39 mm (9.8 × 5 × 1.5 in); manual: 10 × 6.1 × 1.9 in","wt":"924 g (about 2 lb)","syns":"Eloquence (French product sheet)"},"pre":["bsplus"],"suc":["polaris"],"vo":["eti"],"src":["http://insidevision.fr/pdf/Fiche_Produit_Braille_Bloc_Notes_Braille_Sense_U2_Perkins_01.pdf","https://sastltd.zohodesk.eu/portal/en/kb/articles/firmware-version-9-0-release-notes","https://wyominginstructionalnetwork.com/wp-content/uploads/2020/04/Braille-Sense-U2-User-Manual-Ver-8.6-1.pdf","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/le-bloc-notes-braille-braillesense-u2","https://docsbay.net/doc/635567/a-physical-description-of-a-braille-sense-u2-with-a-braille-type-keyboard"],"desc":["The BrailleSense U2 (Perkins-keyboard edition) has the shape of a small, thin rectangular box with rubber feet underneath. HIMS's manual gives 10 × 6.1 × 1.9 inches; a product sheet lists 250 × 130 × 39 mm and 924 g (about 2 pounds).","On top is a nine-key Perkins-style keyboard: dots 1 to 6, Backspace under the left little finger, Enter under the right little finger, and a long space bar under the thumbs. On the same row as the space bar are four rectangular function keys, F1 and F2 on the left, F3 and F4 on the right.","Below the keyboard is a 32-cell braille display, with 32 small oval routing buttons above it. Two capsule-shaped Up and Down scroll keys sit on each side of the display. Near the top center is an LCD with four status lights (Wi-Fi, Bluetooth, GPS and charging), and stereo speakers are in the top left and right corners.","The front edge has a microphone or line-in jack, a headphone jack, a three-position media switch (FM radio, DAISY or MP3), five media buttons and the power button. The left side has two USB ports and an SD slot; the right side has a mini USB port, the AC socket and a three-position lock switch.","The back has a reset button, an Ethernet jack, a third USB port and a 15-pin VGA output. Inside are a 1 GHz processor, 32 GB of flash and a removable lithium battery rated at about 17 hours."]},{"id":"u2qt","n":"BrailleSense U2 QWERTY (QT)","co":"hims","cat":"BrailleSense","yr":2012,"y":"2012","o":"The QWERTY-keyboard U2.","ph":"250 x 160 x 20 mm, 838 g (1.84 lb).","s":{"cpu":"1 GHz","ram":"256 MB","sto":"32 GB flash","os":"Windows CE 6.0","disp":"32 cells","bat":"Detachable lithium-ion, about 17 hours","dim":"250 × 160 × 20 mm (9.84 × 6.3 × 0.78 in)","wt":"838 g (1.84 lb)"},"pre":["bsplus"],"src":["https://selvasblv.com/brochure/braille/HIMS-Braille-Sense-U2-and-U2-QWERTY-Data-Sheet.pdf","https://www.ergoguys.com/bru2qwke.html"],"desc":["The BrailleSense U2 QWERTY (model H432Q) is the typewriter-keyboard version of the U2. Dealer and HIMS data give 250 × 160 × 20 mm (9.84 × 6.3 × 0.78 in) and 838 g (1.84 lb).","Instead of the Perkins braille keys, its top carries a standard QWERTY keyboard for typing as on a computer.","Nearest you is a 32-cell braille display with 32 routing keys and four scroll keys, two at each end.","The front has five audio buttons for the media player. It has USB and SD connections, GPS and a vibration motor.","It runs Windows CE 6.0 with 32 GB of storage and a detachable battery. It is discontinued; HIMS points buyers to the BrailleSense 6."]},{"id":"u2mini","n":"BrailleSense U2 Mini","co":"hims","cat":"BrailleSense","yr":2013,"y":"2013","o":"A compact U2.","pre":["onhand"],"suc":["polmini"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/15/5/15576","https://www.visiole.fr/basse-vision/anciens-produits/bloc-note-braille-sense-u2-mini/"],"s":{"dim":"6.7 × 3.5 × 1 in","wt":"Under 1 lb (about 427 g)","price":"$3,995 (2015)"},"desc":["The BrailleSense U2 Mini (2013) fits in a purse, backpack or roomy jacket pocket. It measures 6.7 × 3.5 × 1 inches (172 × 90 × 27 mm) and weighs under a pound (about 427 g).","On top is a nine-key Perkins-style keyboard with four function keys.","It has 18 eight-dot braille cells with 18 routing buttons, and four scroll keys.","A panel of media controls is on the front. The power socket is on the left side, marked with a braille 'dc'. There are an SD card slot, an OTG USB port, a stereo headphone jack and built-in speakers that AccessWorld found clear and loud for the size.","The battery compartment is at the back left edge. Two user-replaceable lithium batteries come with it, with a separate charger, so one can charge while the other is in use; each lasted about 8 hours in AccessWorld's test. It has a vibration motor for silent alerts."]},{"id":"polaris","n":"BrailleSense Polaris","co":"hims","cat":"BrailleSense","yr":2017,"y":"2017","o":"The first Android-based BrailleSense.","s":{"cpu":"Samsung Exynos 7420, 2.1 GHz","ram":"3 GB","sto":"64 GB","os":"Android 5.1.1","disp":"32 cells","dim":"9.64 × 5.66 × 0.74 in","wt":"1.65 lb","price":"$5,795","syns":"Samantha TTS voice (per AccessWorld review)"},"pre":["u2"],"suc":["bs6"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://www.perkins.org/resource/braillesense-polaris-april-2020-firmware-upgrade/","https://www.afb.org/aw/19/1/15168","https://afb.org/aw/20/7/16711"],"h":" Firmware 3.4 (April 2020) added Google Drive access from the File Manager.","desc":["The BrailleSense Polaris (June 2017) was HIMS's first Google-certified Android notetaker, named for the Polaris office suite. It measures about 9.64 × 5.66 × 0.74 inches and weighs 1.65 pounds. Its case has a magnetic front flap and a shoulder strap.","On top is a Perkins-style braille keyboard that AccessWorld found springy and quiet. Control and Alt keys sit just left and right of the space bar, with the four function keys farther out. The LCD screen takes up the top center, flanked by stereo speakers.","Nearest you is the 32-cell display with routing buttons. Between the cells and the routing buttons is a thin touch strip for flick and tap gestures, and capsule-shaped scroll keys are at each end.","The right side has a combined USB 3.0 and micro USB port, with the SD card slot behind it. The left side, from front to back, has volume buttons, stereo headphone and microphone jacks, and a USB host port. The back has the AC socket, an HDMI port and a Kensington lock slot.","The front panel has a three-position key-lock switch, a three-position mode switch (media, DAISY or app control), the media buttons (the Stop button has a raised dot), and the power button at the far right. Inside are a 2.1 GHz Samsung Exynos 7420, 3 GB of RAM and 64 GB of storage, with a 13-megapixel camera."]},{"id":"polmini","n":"BrailleSense Polaris Mini","co":"hims","cat":"BrailleSense","yr":2018,"y":"2018","o":"A compact Polaris.","s":{"os":"Android 5.1.1","dim":"7.28 × 4.05 × 0.90 in","wt":"0.91 lb","cpu":"Samsung Exynos 7420, 2.1 GHz octa-core","sto":"64 GB","price":"$4,195"},"pre":["u2mini"],"suc":["bs6mini"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/20/3/16315","https://afb.org/aw/20/7/16711"],"desc":["The BrailleSense Polaris Mini (2018) is the 20-cell version of the Polaris. It measures 7.28 × 4.05 × 0.90 inches (185 × 103 × 23 mm) and weighs 0.91 pound, small enough for a briefcase or large purse.","The top has the nine-key Perkins keyboard, Control and Alt keys and four function keys. AccessWorld found its keys a bit more clicky than the full Polaris.","Nearest you is a 20-cell braille display with routing buttons and scroll keys.","The right side has a USB-C port for charging, file transfer and braille-display use, with a micro HDMI port toward the back. The left side has volume controls and stereo headphone and microphone jacks. The front panel has the same lock switch, mode switch and media controls as the Polaris.","The speaker and the camera are on the underside. The micro SD slot is inside the battery compartment. Battery life is about 11 hours, and a charge takes about 3.5 hours."]},{"id":"bs6","n":"BrailleSense 6","co":"hims","cat":"BrailleSense","yr":2021,"y":"2021","o":"The Android 10 successor to the Polaris.","h":"Firmware 2.0 (December 2023) upgraded it from Android 10 to Android 12. Later firmware includes 2.1, 2.5 and 3.0.","io":"Bluetooth 5.1","s":{"ram":"6 GB LPDDR4X","sto":"128 GB","os":"Android 10, upgradable to Android 12","disp":"32 cells","cpu":"Octa-core: 4 × 2.0 GHz Cortex-A73 plus 4 × 2.0 GHz Cortex-A53","price":"$4,995 (current list)","syns":"BrailleSense Vocalizer Expressive voices plus any Android TTS engine from Google Play (for example Eloquence)","dim":"245 × 144 × 22 mm (9.64 × 5.66 × 0.86 in)","wt":"705 g (1.55 lb)"},"pre":["polaris"],"suc":["bs7"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://sastltd.zohodesk.eu/portal/en/kb/articles/braillesense-6-upgrade-android-from-10-0-to-12-0","https://selvasblv.com/download/bs6/BrailleSense_6_User_Manual_English_V1.0_210528.pdf","https://selvasblv.com/product/braillesense-6/","https://www.braillists.org/wp-content/uploads/bod24.pdf","https://selvasblv.com/wp-content/uploads/2024/10/BrailleSense-6-User-Manual-English_V2.5_240912-1.pdf","https://selvasblv.com/wp-content/uploads/2024/06/DIGITALBrailleSense-6-brochure.pdf"],"desc":["The BrailleSense 6 (2021) measures 9.64 × 5.66 × 0.86 inches (245 × 144 × 22 mm) and weighs 1.55 pounds (705 g).","Its top panel has a nine-key Perkins-style keyboard and four scroll keys.","Nearest you is the 32-cell braille display with 32 routing keys.","The top also has a small LCD, two status lights and stereo speakers.","The front panel has a key-lock switch, a media-mode switch, five media buttons and the power button."]},{"id":"bs6mini","n":"BrailleSense 6 Mini","co":"hims","cat":"BrailleSense","yr":2022,"y":"2022","o":"A compact BrailleSense 6.","s":{"os":"Android","dim":"185 × 103 × 23 mm","wt":"About 430 g"},"pre":["polmini"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://selvasblv.com/wp-content/uploads/2023/11/BrailleSense-6-MINI-User-Manual-V2.pdf","https://selvasblv.com/product/braillesense-6-mini/"],"desc":["The BrailleSense 6 Mini (2022) is the 20-cell version of the BrailleSense 6. It measures about 185 × 103 × 23 mm (7.1 × 4.1 × 0.9 in) and weighs about 430 g (0.95 lb).","The top panel has a nine-key Perkins-style keyboard, Control and Alt keys and four function keys.","Below the keyboard is the 20-cell braille display. A routing key is above each cell, with a raised dot on every fifth key, and there are four scroll keys.","The right side has two USB-C ports. The left side has volume controls and headphone and microphone jacks.","It shares the BrailleSense 6 software and Android platform."]},{"id":"bs7","n":"BrailleSense 7","co":"hims","cat":"BrailleSense","yr":2026,"y":"Unveiled at CSUN, March 2026; shipping from mid/late 2026","o":"The 2026 BrailleSense, on Android 15 with Gemini AI.","s":{"os":"Android 15","disp":"20, 32 or 40 braille cells; visual LCD","cpu":"Octa-core up to 3.35 GHz","ram":"8 GB LPDDR5X","sto":"256 GB UFS 4.0","bat":"4,600 mAh removable plus secondary battery","price":"20-cell $5,295; 32-cell $5,995; 40-cell $6,495","dim":"32-cell 9.84 × 5.53 × 0.89 in; 40-cell 11.86 × 5.53 × 0.89 in","wt":"32-cell under 1.54 lb; 40-cell under 1.80 lb"},"pre":["bs6"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://selvasblv.com/product/braillesense-7/","https://selvasblv.com/price-list/","https://www.braillists.org/uncategorised/introducing-the-new-smart-braille-tablet-series-braillesense-7/"],"ph":"40-cell: 11.86 x 5.53 x 0.89 in, under 1.80 lb. 32-cell: 9.84 x 5.53 x 0.89 in, under 1.54 lb.","io":"Dual USB-C, dual USB-A, HDMI, 4-pole 3.5 mm jack, microSD, Wi-Fi 5, Bluetooth 5.3, dual-band GPS, 20 MP camera.","desc":["The BrailleSense 7, unveiled at CSUN 2026, comes in 20-, 32- and 40-cell models. The 32-cell model measures 9.84 × 5.53 × 0.89 inches and weighs under 1.54 pounds; the 40-cell is 11.86 inches wide and under 1.80 pounds.","It keeps the Perkins braille keyboard and adds a detachable QWERTY keyboard that attaches magnetically at the top through a secondary battery module. It also has a physical dictation button and an analog scroll wheel.","Its braille display has no physical routing buttons. Active Responsive Touch tracks your finger and refreshes the line automatically when you reach the last cell. To route the cursor you double-tap the display or press a front end button while touching the spot.","It has a visual LCD, HDMI output, dual USB-C and dual USB-A ports, a micro SD slot, a 4-pole headphone jack, stereo speakers and microphones, a haptic motor, dual-band GPS and a 20-megapixel rear camera with flash.","Inside are an octa-core processor up to 3.35 GHz, 8 GB of LPDDR5X RAM and 256 GB of storage, running Android 15. A long press on Home summons Google Gemini. The 4,600 mAh battery is removable and charges at 18 W through a magnetic connector."]},{"id":"vsense","n":"VoiceSense","co":"hims","cat":"VoiceSense","yr":2007,"y":"2007","o":"A speech-only HIMS notetaker with a braille keyboard.","f":["FM radio","DAISY and MP3 playback"],"io":"CompactFlash, SD, USB, Wi-Fi b/g, Bluetooth","s":{"cpu":"Intel PXA270, 540 MHz","ram":"128 MB RAM plus 64 MB OS storage","sto":"1 GB user flash; SD and CF slots","os":"Windows CE .NET 5.0","dim":"18.8 × 7.7 × 2.5 cm (7.4 × 3.0 × 0.98 in)","wt":"266 g (0.58 lb)","bat":"Detachable, user-replaceable lithium-polymer, 12 hours","price":"About $1,800 (elektronika.lt, 2007); about $2,150 (PCNews.ru)"},"suc":["vsq"],"src":["https://www.himsintl.com/en/company/prd_history.php","https://www.freelists.org/post/gps-talkusers/Voicenote-or-Voice-Sense,31","https://www.elektronika.lt/naujienos/kompiuterija/8635/voicesense-kompiuteris-akliesiems/","https://pcnews.ru/news/gps-gw-micro-voicesense-windows-ce-net-540-pxa270-fm-wi-fi-802-11-bluetooth-usb-sd-cf-12-188-77-25-181367.html","https://afb.org/aw/12/1/15994"],"h":" HIMS's product history lists only two VoiceSense models: the original (2007) and the QWERTY (2010). GW Micro distributed it in the US. A user quoting GW Micro's spec page in October 2007 listed the hardware, and Sendero GPS was due for it within weeks. After HIMS and GW Micro split in 2011, HIMS sold it directly from Austin, Texas, alongside a QWERTY VoiceSense.","desc":["The VoiceSense is a speech-only notetaker from HIMS with a braille keyboard and no braille display. GW Micro's published specifications gave its size as 18.8 by 7.7 by 2.5 centimeters (about 7.4 by 3 by 1 inch) and its weight as 266 grams, just over half a pound.","The top carries a Perkins-style braille keyboard. The sources found do not describe the remaining controls in detail.","For sound it has stereo speakers and a headphone jack. For input it has a built-in condenser microphone and a microphone jack, used for recording, and there is an FM radio receiver. The sources checked don't say where on the case the jacks are.","Its ports are USB On-The-Go (USB 2.0 compatible), an SD card slot and a CompactFlash slot. Wireless is 802.11b/g Wi-Fi and Bluetooth 1.1. Inside is a 540 MHz Intel PXA270 processor with 128 MB of RAM, 64 MB of OS storage and 1 GB of user flash, running Windows CE .NET 5.0.","A detachable, user-replaceable lithium-polymer battery gives about 12 hours of continuous use. 2007 news reports put the price at about $1,800 to $2,150. The later VoiceSense QWERTY used the smooth white plastic shell of other HIMS products, and at CSUN 2010 GW Micro's Dan Weirich dropped one on the floor and kept using it."]},{"id":"vsq","n":"VoiceSense QWERTY","co":"hims","cat":"VoiceSense","yr":2010,"y":"2010","o":"A QWERTY VoiceSense, announced at CSUN 2010 for $1,995.","s":{"sto":"4 GB","price":"$1,995","dim":"8.6 × 4.9 × 0.7 in","os":"Windows CE 5.0","cpu":"Intel PXA270","ram":"128 MB","net":"10/100 Ethernet, Wi-Fi b/g, Bluetooth"},"pre":["vsense"],"src":["https://afb.org/aw/11/4/16038","https://manualzilla.com/doc/5723857/voice-sense-qwerty-user-manual--ver-6.0-_hims"],"desc":["The Voice Sense QWERTY is a speech-only notetaker from HIMS with a typewriter-style keyboard and no braille display. Set on a table it feels like a small, thin rectangular box, 8.6 inches long, 4.9 inches deep and 0.7 inch high, with rubber feet underneath to stop it sliding.","The keyboard takes up the front part of the top and has 77 keys in six rows. The top row runs F1 to F11, then left and right square brackets, Insert and Delete, with tactile points on the frame at F1, F5 and F9. R and U, F and J, and V and M carry dots for the index fingers. Fn is at the far left of the bottom row. The arrow keys form an inverted T, with Shift and slash on either side of Up Arrow. Braille stickers are supplied for marking keys.","Behind the keyboard, in the centre, is a small LCD so a sighted person can read what you type, with a speaker on each side of it.","The front edge holds, from left to right: the internal microphone, a three-position key lock switch, a microphone jack, a headphone jack, a three-position audio mode switch (radio, DAISY or media), five differently shaped media buttons (previous, record, stop, play/pause, next) and a sliding power switch, pushed right for on and left for off.","On the right edge, front to back, are a USB OTG port for a computer, a USB port for a memory stick and the AC adapter jack. The left edge has an SD card slot. On the back are an Ethernet port at the left and a recessed reset button at the far right. The removable battery fits a rectangular bay in the middle of the bottom, released by a latch to its left."],"h":" HIMS's April 2011 manual (software 6.0) lists a word processor that can write braille files by typing chords on F, D, S, J, K and L, email, a web browser, DAISY player, media player, FM radio with recording, Twitter, Google Talk and MSN Messenger. Up to seven programs can run at once."},{"id":"edge","n":"Braille EDGE 40","co":"hims","cat":"Braille Displays","yr":2012,"y":"2012","o":"A 40-cell braille display with notetaking functions.","ph":"About 2 lb.","s":{"os":"Windows CE 5","bat":"About 20 hours","disp":"40 cells","price":"$2,795 (AccessWorld, April 2017)","dim":"12.2 × 4 × 0.86 in","wt":"1.73 lb"},"src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/18/4/15220"],"desc":["The Braille EDGE 40 is a 40-cell refreshable braille display from HIMS, which AccessWorld classed as a 'smart display' with its own small applications. It measures 12.2 inches long, 4 inches deep and 0.86 inches thick, and weighs 1.73 pounds, a little wider and heavier than BAUM's VarioUltra 40.","Along the edge nearest you runs the 40-cell braille line with its cursor-routing buttons. Behind it is an eight-key Perkins-style keyboard, with keys for dots 1 to 8 in their usual positions. The keys sit close together, so people with large hands may find them crowded.","The space bar sits between dots 1 and 4. On each side of it are rectangular function keys, F1 to F4 among them, whose jobs change with context. In the internal programs F4 opens the menus, and with JAWS F2 acts as the Alt key. Sets of arrow keys sit on either side of the Perkins keyboard for navigation.","Around the edges are an SD card slot, a jack for the included AC adapter and a mini-USB port. The USB port gives slow charging and connects the EDGE to a PC or Mac as a screen-reader terminal. AccessWorld found it cannot read files from a thumb drive, and its SD card cannot be read from another device through the EDGE.","It comes in a zip-up carrying bag with a strap, shaped like a small laptop bag, which must be closed to secure the unit, so the display can't be used while inside. HIMS sold an Executive Products case for $98 that lets you use the display fully while it stays protected. In 2017 it sold for $2,795."],"h":" AccessWorld (April 2017, republished from Blind Bargains) compared it with BAUM's VarioUltra 40 ($3,995) as a 'smart display': more than a terminal, with notepad, scheduler and other internal applications, but less than a full notetaker. At that time HIMS offered no smaller EDGE."},{"id":"syncb","n":"SyncBraille","co":"hims","cat":"Braille Displays","yr":2008,"y":"2008","o":"A small HIMS braille display.","src":["https://www.himsintl.com/en/company/prd_history.php","https://www.boundlessat.com/site/images/SyncBraille_User_Manual.pdf"],"desc":["SyncBraille is a slim USB braille display from HIMS made in 20-cell and 32-cell sizes. The 32-cell model measures 26 by 8.5 by 2 centimeters and weighs 350 grams. The 20-cell model is 18.3 by 8.5 by 2 centimeters and 280 grams. Both are only 2 centimeters thick.","The top surface carries the row of braille cells. Just behind the cells is a row of cursor keys, used to move the cursor to that position when editing.","At each end of the display are two round scroll keys, one upper and one lower. With a PC screen reader, the right pair are the Right Up and Right Down scroll keys and the left pair the Left Up and Left Down arrow keys. Pressed together they give Home, End, Enter, Tab, Shift+Tab, Alt and Alt+F4. With a Voice Sense, the upper keys scroll back and the lower keys scroll forward.","A small USB port on the right side is the only connector, and it has no dust cap, so the manual warns against dust and moisture. The manual describes no battery or power switch; the unit connects to a PC or a Voice Sense by USB cable.","The package contains the display, a user manual, a USB cable, a driver CD and a carrying case. HIMS gave it a one-year warranty."],"h":" SyncBraille is the HIMS brand name for its small USB braille displays, models B20N (20 cells) and B32N (32 cells). The manual pairs it with the speech-only Voice Sense notetaker, which announces 'SyncBraille 32 is connected' in speech and braille, and with Windows screen readers through a driver on the included CD.","s":{"disp":"20 cells (B20N) or 32 cells (B32N)","dim":"32-cell: 26 × 8.5 × 2 cm; 20-cell: 18.3 × 8.5 × 2 cm","wt":"32-cell: 350 g; 20-cell: 280 g","io":"USB 2.0 (USB-powered)","warranty":"1 year"}},{"id":"sbeetle","n":"Smart Beetle","co":"hims","cat":"Braille Displays","yr":2015,"y":"2015","o":"A low-cost 14-cell display from HIMS.","src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/19/2/15123","https://www.applevis.com/reviews/smart-beetle-hims"],"desc":["The Smart Beetle is a 14-cell braille display from HIMS with no notetaking applications, only a menu and a terminal clipboard. AppleVis's reviewer found it about the size of an iPhone 6S but a little thicker and wider, almost exactly the size of a Focus 14. It is a rectangle with rounded edges.","With the braille line toward you, the 14 cells run along the front of the top surface, with a diamond-shaped panning button at each end. Directly behind the cells are 14 cursor-routing buttons.","Behind those, on a slightly raised level, is the space bar with two rectangular keys on each side: F1 and F2 on the left, F3 and F4 on the right. Behind them is the eight-key Perkins-style keyboard. At the very back of the top are a small speaker for audio alerts and a couple of indicator lights.","The back panel has a reset button at the far left and a micro-USB port on the right. The left side and front are bare. The power button is alone on the right side: a quick press opens the menu, which offers Bluetooth serial, USB or Bluetooth keyboard modes, and a three-second press turns it on or off. Pairing with iOS needs no PIN.","It connects to up to five Bluetooth devices plus one USB device at once, and battery life is about 18 hours. It comes with a thin, close-fitting case that closes magnetically, a micro-USB cable, print and braille guides, and a driver CD. It listed at $1,345 and was on sale for $995 in early 2018."],"h":" Scott Davert's AppleVis review (December 2015) gave it 4 stars. He noted that it was natively supported in iOS 9 and OS X El Capitan, while earlier iOS versions treated it as an 18-cell BrailleSense, so panning skipped text. AccessWorld (2018) found that it had not been updated in a long time, and that the manual's keyboard-emulation section was incomplete.","s":{"price":"$1,345 list; on sale for $995 in January 2018 (AccessWorld)","bat":"About 18 hours (AccessWorld)","conn":"5 Bluetooth plus 1 USB (micro-USB) connections; Bluetooth keyboard emulation"}},{"id":"qbxl","n":"QBraille XL","co":"hims","cat":"Braille Displays","yr":2018,"y":"2018","o":"A 40-cell display with a QWERTY-style layout and notepad.","ph":"1.8 lb.","io":"Bluetooth 2.1, USB","s":{"os":"Windows CE 6","ram":"256 MB","disp":"40 cells","price":"$3,195 (AccessWorld 2020)","bat":"16 to 18 hours (AccessWorld)","sto":"SD/SDHC up to 32 GB (2 GB card included)","io":"USB-C; up to 6 Bluetooth connections plus 1 USB","files":"Reads BRF, BRL, TXT, RTF, DOCX, PDF, DAISY text; saves TXT and BRL"},"src":["https://www.himsintl.com/en/company/prd_history.php","https://afb.org/aw/21/9/17172","https://afb.org/aw/22/1/17349"],"desc":["The QBraille XL is a 40-cell braille display from HIMS with a hybrid keyboard. It combines a Perkins-style braille keyboard with the function, modifier, navigation and arrow keys of a laptop, so screen reader commands can be typed as on a PC. It cost $3,195 in 2020.","With the braille display toward you, the 40 cells and their cursor-routing buttons run along the near edge, with two scroll buttons at each end. On the right side, the USB-C port is nearest you and an SD card slot is behind it. A recessed Hard Reset button on the back edge needs a paperclip. The Power/Sleep/Wake button is on the left side; a short press sleeps or wakes it, and holding it for five seconds turns it on or off.","The keys are not in neat rows. At the far left, nearest you, is the Mode key that toggles Hybrid Mode, with Pairing above it and Escape above that. To their right is a column of Shift, Caps Lock, Tab and F1, then F2 through F12 across the top. Every fourth function key has a tactile mark, with a gap between groups of four. Right of F12
