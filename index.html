 and graphics.","Paper is continuous tractor-feed paper with sprocket holes, pulled through by sprocket wheels. Unlike the Romeo 25, it also takes hand-fed single sheets.","Its connections and menus follow the Romeo 25: parallel and serial ports on the back and a front control panel.","Its launch price wasn't found; Enabling Technologies' price list effective July 1, 2012 shows it at $2,995, including ET Speaks and single-sheet tractors."]},{"id":"echovision","n":"EchoVision smart glasses","co":"agiga","cat":"Vision Wearables","yr":2025,"y":"Pioneer Edition shipped late October/November 2025","o":"AI smart glasses for blind and low-vision users: scene description, text reading, face recognition and calls to Aira and Be My Eyes.","s":{"disp":"No display; 13 MP centered wide-angle camera","bat":"6 h (Pioneer), 9 h (V1); 30 h with charging case","price":"$599","os":"Companion app: iPhone 8 or newer on iOS 16.6+, or Android 11+","cpu":"Not published by Agiga; the spec sheet lists the 13 MP camera, battery life and app requirements","wt":"No gram figure published; Agiga describes the glasses only as ultra-light","syns":"Built-in AI voice through the glasses' speakers; Agiga does not name the TTS engine"},"ph":"Round matte-black frame; 135 mm hinge to hinge, 52 mm lens width, 138 mm temples.","io":"Bluetooth 5.3 + BLE, dual-band Wi-Fi 5, USB-C; 4-mic array, open-ear stereo speakers, two buttons and a touchpad.","src":["https://agiga.ai/products/echovision-pioneer-edition","https://agiga.ai/pages/community","https://nfb.org/index.php/resources/publications-and-media/access-podcast/echo-vision-smart-glasses-accessible-televisions"],"desc":["EchoVision, by AGIGA, looks like everyday round-framed glasses in matte black. It measures 135 mm hinge to hinge, with lenses 52 mm wide and 39 mm tall, a 19 mm bridge and 138 mm temples. AGIGA calls it ultra-light but lists no weight.","It has a 13-megapixel camera for photos and video, a four-microphone array, and open-ear directional stereo speakers that sit near your ears without covering them.","There are two physical buttons, one on each side, and a touchpad on the left arm. It also answers voice commands.","The Pioneer Edition runs about 6 hours per charge and the V1 about 9, with up to 30 hours using the charging case. It connects by Bluetooth 5.3 and dual-band Wi-Fi 5 to a companion app for iPhone or Android.","The box includes a charging case, clip-on sunglasses and a getting-started guide in large print and braille. The price is $599."]},{"id":"allysolos","n":"Ally Solos Glasses","co":"envision","cat":"Vision Wearables","yr":2025,"y":"Pre-orders August 14, 2025; shipping from October 2025","o":"Lightweight Envision and Solos smart glasses running the Ally conversational AI assistant: read text, describe surroundings, recognize people and objects.","s":{"disp":"No display; HD cameras, max 2048x1944","bat":"About 10 h operation (up to 16 h claimed); quick-swap USB-C stems","price":"$699","os":"Ally app on iOS and Android","wt":"About 50 g","syns":"Speech from the Ally assistant app; Envision does not name the TTS engine"},"ph":"About 50 g; IP67; regular or large sizes.","io":"Bluetooth 5.2 + BLE; open-ear speakers and microphones.","pre":["envgl"],"src":["https://www.letsenvision.com/blog/ally-solos-glasses","https://shop.letsenvision.com/products/ally-solos-glasses","https://www.theverge.com/news/759160/ally-solos-smart-glasses-ai-envision-low-vision","https://support.letsenvision.com/hc/en-us/article_attachments/40477988619153"],"desc":["Ally Solos Glasses run Envision's Ally AI assistant. They have a classic rectangular frame and weigh about 50 g.","The S/M frame has lenses 51 mm wide and 37 mm tall, a front width of 138 to 149 mm and 163 mm arms.","The camera sits in a hinge (2K-class resolution), with an LED. Whisper open-ear directional speakers let you hear the AI without blocking surrounding sound.","The battery is in quick-swap USB-C charging stems. They run about 10 hours in use, and up to 16 hours claimed. They are IP67-rated.","They connect by Bluetooth 5.2 to the Ally app on iOS or Android and come in a foldable case. The price is $699."]},{"id":"raybanmeta","n":"Ray-Ban Meta glasses (Be My Eyes)","co":"meta","cat":"Vision Wearables","yr":2024,"y":"Be My Eyes integration November 13, 2024","o":"Mainstream smart glasses that became an assistive tool when Be My Eyes volunteer calls arrived by voice command (\"Hey Meta, Be My Eyes\").","s":{"disp":"No display; 12 MP camera","bat":"2nd generation: about 8 hours plus 48 from case","price":"From $379 (2nd generation)"},"src":["https://www.bemyeyes.com/news/be-my-eyes-is-rolling-out-on-ray-ban-meta-glasses-starting-today/","https://www.meta.com/blog/ray-ban-meta-glasses-collection-news-updates-connect-2024/","https://www.applevis.com/forum/assistive-technology/comparison-all-new-smart-glasses-blind","https://www.ray-ban.com/usa/c/frequently-asked-questions-ray-ban-meta-smart-glasses","https://www.specifications.global/us/glasses-xr/Meta-RayBan-Wayfarer-Gen1-Standard-Large-RW4006-RW4008/"],"desc":["The first-generation Ray-Ban Meta glasses look and feel like ordinary Ray-Ban frames, such as the square Wayfarer. The Wayfarer comes in Standard (48 grams, 131 mm hinge to hinge) and Large (50 grams, 137 mm) sizes. There's no screen; everything is heard through two small open-ear speakers in the arms, aimed at your ears, so you still hear the world around you. Five microphones are spread across the frame: two in each arm and one near the nose pad.","At the front corners of the frame are two small round openings. One is the 12-megapixel ultra-wide camera; the other (on the left, per Ray-Ban) is a capture light that glows to tell people nearby when you take a photo or video. Inside, near the right arm's hinge, is a notification light that only you see.","The right arm has two controls. Along its outer side is a touchpad: tap once to pause or play, double-tap to skip forward or answer a call, triple-tap to skip back, swipe forward or back for volume, and press and hold to talk to Meta AI or reject a call. On top of the frame is the capture button: press once for a photo, press and hold for video.","The power switch is a small slider on the inner side of the left arm, near the hinge; slide it toward the lens to turn on and back to turn off. The product name is printed inside the right arm, and the serial number inside the left arm. The glasses are IPX4 splash resistant, so light rain is fine but they shouldn't be submerged.","The glasses charge only in their hard case, through metal contacts at the nose bridge. The case has a USB-C port for charging, a light on the front (orange while charging, green when full) and a pairing button on the back. Glasses last up to about 4 hours of moderate use and charge fully in about 75 minutes; the case holds up to 32 hours more. The box includes the glasses, the case and a cleaning cloth."]},{"id":"tripletalk","n":"TripleTalk","co":"axsol","cat":"Speech Synthesizers","yr":2001,"y":"By April 2001 (TripleTalk PCI reported new); USB and serial models followed","o":"A hardware speech synthesizer from Access Solutions, sold in PCI, USB and serial versions and supported by JAWS and, through its serial port, by Speakup on Linux.","h":"A Linux user reported owning a brand-new TripleTalk PCI from Access Solutions on April 20, 2001; no Linux driver existed then, because the developer declined an open-source driver. By the mid-2000s list members described TripleTalk, with an occasional DECtalk Express, as the only standalone hardware synthesizers still being bought. Its USB model let JAWS speak at a separate volume from the computer's sound card. Some list posts attribute it to RC Systems, the DoubleTalk maker; other posts call it an Access Solutions (Axsol) product.","s":{"cpu":"Not stated. The TripleTalk USB Mini has an onboard 8 KB flashable EPROM for field firmware updates.","ram":"Not stated. The USB Mini lists 8 KB of flash EPROM, 11 voices, 10 speeds and 100 pitches, and measures 2.4 × 1.6 × 0.8 in (1.5 oz).","tts":"Built-in TripleTalk speech","syns":"Built-in TripleTalk voice only","price":"No launch price found for the PCI, USB or serial models. The TripleTalk USB Mini is still listed by Blind Mice Mega Mall.","used":"No eBay listings for the TripleTalk were found."},"io":"PCI card, USB or serial, depending on model","src":["http://leb.net/blinux/list-archive/blinux-list/2001/msg00426.html","https://www.freelists.org/post/jfw/Laptops-and-hardware-synthesizer-for-JFW,7","https://www.freelists.org/post/jfw/Finding-the-double-and-triple-talk-synths,9","https://inbox.the-brannons.com/blinux/20050331164331.GC11527@rednote.net/T/","https://www.blindmicemegamall.com/bmm/shop/Item_Detail?itemid=5323293"]},{"id":"lh_truvoice","n":"L&H TruVoice voices (Adult Male #1 to #8, Adult Female #1 and #2)","co":"lh","cat":"TTS Voices","yr":1998,"y":"1998 (SAPI 4 era)","o":"Lernout & Hauspie's American English TruVoice engine. It was the default speech output for every Microsoft Agent character, such as the Office-era animated characters, and was bundled with Microsoft's Speech API 4 releases.","h":"Microsoft's Agent documentation lists ten TruVoice voices: Adult Male #1 to #8 and Adult Female #1 and #2. All Agent characters were tuned for TruVoice, and other engines needed the SAPI 4.0a runtime. The tv_enua.exe package also included novelty voices: RoboSoft One to Six, Female Whisper and Male Whisper. L&H's separate TTS3000 engine supplied other languages, such as Carol and Peter (British English), Anna and Stefan (German), and Véronique and Pierre (French). Microsoft Agent was deprecated with Windows 7. The user's question about a 'Mark Lund' voice could not be verified in any source found.","s":{"syn":"Not stated by L&H. TruVoice was a separate, lighter SAPI 4 engine from L&H's diphone-concatenative TTS3000; no source describes its method.","plat":"Windows with SAPI 4 and Microsoft Agent","def":"Microsoft Agent characters (default engine)"},"src":["https://learn.microsoft.com/en-us/windows/win32/lwef/accessing-a-speech-engine-in-your-code","https://github.com/LouisGameDev/Microsoft-Sam-Mary-Mike-TruVoice-WSAPI4","https://patents.google.com/patent/US6665641B1/en"]},{"id":"lh_tts3000","n":"L&H TTS3000 voices (Michelle, Michael and the Centigram-style US voices)","co":"lh","cat":"TTS Voices","yr":0,"y":"Late 1990s (L&H versions 6.03 to 6.13)","o":"Lernout & Hauspie's multilingual SAPI 4 engine. Its US English voices were Adult Female #1 (Michelle) and Adult Male #1 (Michael), plus Peter, Sidney, Eager Eddie, Deep Douglas, Biff, Grandpa Amos, Melvin and Alex, which Genesys documentation says sound like Centigram's voices of the same names.","h":"Other languages included British English (Carol, Peter), Dutch (Linda, Alexander), French (Véronique, Pierre), German (Anna, Stefan), Italian (Barbara, Stefano), Japanese (Naoko, Kenji), Mexican Spanish (Pedro and others), Korean and Russian (Boris). It must predate 2001, when Lernout & Hauspie (founded in 1987) went bankrupt after a fraud scandal (Wikipedia). The exact release year was not found.","s":{"syn":"Concatenative diphone synthesis with pitch and duration adjustment (L&H patent US6665641B1 background); later L&H RealSpeak moved to unit selection","plat":"Windows SAPI 4","def":"US English Adult Female #1 (Michelle) is listed first; no explicit default is documented"},"src":["https://help.genesys.com/pureconnect/mergedprojects/wh_id/desktop/hid_tts_speech_modes.htm","https://learn.microsoft.com/en-us/windows/win32/lwef/accessing-a-speech-engine-in-your-code","https://patents.google.com/patent/US6665641B1/en","https://www.isca-archive.org/icslp_2000/coorman00_icslp.pdf","https://en.wikipedia.org/wiki/Lernout_%26_Hauspie"]},{"id":"rhvoice","n":"RHVoice","co":"yakovleva","cat":"TTS Voices","yr":2012,"y":"Source copyright from 2010; public NVDA driver 0.2.7 on April 29, 2012","o":"A free, open-source speech synthesizer by Olga Yakovleva. It started with Russian male and female voices and grew to other languages. It runs as an NVDA add-on, a Windows SAPI 5 engine, an Android app, a Linux speech-dispatcher module and a command-line tool.","h":"In February 2012 a patch added an RHVoice output module to speech-dispatcher on Linux. It described RHVoice as the only free high-quality Russian synthesizer and planned Ukrainian, Belarusian and Kazakh voices. The NVDA synth driver 0.2.7 was dated April 29, 2012. Python packages followed in 2015.","s":{"syn":"Statistical parametric (HMM-based, built on HTS)","plat":"NVDA (Windows), SAPI 5, Android, Linux (speech-dispatcher)","def":"Not default on any major platform"},"src":["https://lists.libreplanet.org/archive/html/speechd-discuss/2012-02/msg00000.html","https://rhvoice.software.informer.com/download/","https://github.com/Olga-Yakovleva/RHVoice/blob/master/CMakeLists.txt","https://libraries.io/pypi/RHVoice","https://github.com/RHVoice/RHVoice"]},{"id":"voiceview","n":"VoiceView (Amazon Fire tablets)","co":"amazon","cat":"Screen Readers","yr":2015,"y":"September 2015 (Fire OS 5 'Bellini')","o":"Amazon's own screen reader for Fire tablets, written from scratch to replace the Android TalkBack integration that earlier Fire tablets used.","h":"Amazon said blind customers had called its TalkBack integration among the best on a tablet, but with a long list of requested fixes. Amazon chose a complete rewrite, and VoiceView shipped with Fire OS 5 'Bellini' in September 2015 using IVONA voices. Its features included linear and touch navigation, a wide range of speech rates, new earcons, simplified gestures, a jog-wheel gesture and a built-in tutorial. By 2017 tens of thousands of customers used it, and braille input and output (BAUM, HumanWare, Orbit Reader 20) came to 4th to 7th generation tablets that September.","s":{"os":"Fire OS 5 and later (Fire tablets)","tts":"IVONA voices (Amazon)","price":"Free, built into Fire tablets"},"src":["https://blog.the-ebook-reader.com/2015/09/22/fire-os-5-adds-new-accessibility-features-to-fire-tablets/","https://www.aboutamazon.com/news/devices/improving-device-accessibility-for-customers-with-disabilities","https://www.aboutamazon.com/news/devices/introducing-new-accessibility-features-for-amazon-fire-tablets-and-fire-tv","https://www.lifewire.com/history-of-fire-os-4582380"]},{"id":"ms_natural","n":"Microsoft Narrator natural voices (Aria, Jenny, Guy)","co":"ms","cat":"TTS Voices","yr":2022,"y":"January 27, 2022 (Windows 11 Insider Preview Build 22543); general release in Windows 11 version 22H2","o":"Microsoft's neural ('natural') voices for Narrator. They are modern on-device text-to-speech voices that work offline once downloaded.","h":"Microsoft announced the voices in Windows 11 Insider Preview Build 22543 on January 27, 2022, starting with two US English female voices, Aria and Jenny. A male US English voice, Guy, was added later, and all three are available in Windows 11 version 22H2 and later. Each is installed separately from Narrator Settings > Add natural voices. They follow Microsoft's earlier voices: Sam, Mike and Mary (SAPI 4/5 era), Anna (Vista and 7), and David, Zira, Mark, Hazel and George (Windows 8 and 10).","s":{"syn":"Neural, on-device","plat":"Windows 11 version 22H2 and later (Narrator)","def":"Optional; downloaded from Narrator settings"},"src":["https://blogs.windows.com/windows-insider/2022/01/27/announcing-windows-11-insider-preview-build-22543/","https://support.microsoft.com/en-us/accessibility/windows/narrator/appendix-a-supported-languages-and-voices","https://blogs.windows.com/windowsexperience/2022/09/20/how-inclusion-drives-innovation-in-windows-11/"]},{"id":"ibill","n":"iBill Talking Banknote Identifier","co":"orbit","cat":"Miscellaneous","yr":2009,"y":"Announced December 19, 2009; second generation reviewed December 2012","o":"A key-fob-sized reader that names US banknotes by voice, tones or vibration.","h":"Orbit Research sells the iBill for $99. The BEP gives one free to any blind or visually impaired US citizen or legal resident through its U.S. Currency Reader Program. Large-print, braille and CD instructions are included. Orbit Research, of Wilmington, Delaware, launched it on December 19, 2009 at $99, about a third of the cost of existing readers, claiming better than 99.9 percent accuracy in under a second. AccessWorld reviewed the first model in May 2010. The second generation, reviewed in December 2012, kept the size but replaced the closed slot with an open guide, recessed the buttons, and added a key ring and a 2.5 mm headphone jack. In vibration mode, $1, $2 and $5 are one, two and three short pulses; $10, $20 and $50 are one, two and three long pulses; $100 is short-long-short-long. Tone mode uses low and high beeps in the same pattern.","s":{"price":"$99 at launch (December 2009); $119 for the second generation (AccessWorld 2012); free through the BEP","bat":"One AAA battery, typically lasting about a year","dim":"3.0 × 1.6 × 0.7 in","disp":"None; speech, tone or vibration output","used":"Rarely resold, since eligible US users get one free from the BEP","wt":"1.5 oz (Orbit Research, 2009)"},"f":["Identifies $1, $2, $5, $10, $20, $50 and $100 bills","Voice, tone or vibration modes","Reads bills in any orientation","Flags bills it cannot identify instead of guessing","Two buttons"],"src":["https://www.orbitresearch.com/wp-content/uploads/2017/04/Ibill-Txt.txt","https://www.bep.gov/services/currency-accessibility/us-currency-reader-program/us-currency-reader-program-faqs/","https://afb.org/aw/13/12/15862","https://afb.org/aw/16/6/15449","https://www.orbitresearch.com/orbit-research-introduces-ibill-talking-bank-note-reader/"],"desc":["The iBill is a small black talking money identifier from Orbit Research, about the size of a pack of chewing gum: 3 inches long, 1.6 inches wide and 0.7 inch thick, weighing about 1.5 ounces. It is made of rugged plastic.","On the second-generation model, one large face has an overlapping plastic guide fixed on top, offset slightly so it does not reach the right or top edges. This leaves an open platform where you slide in the narrow end of a bill.","There is a button at each end, either of which starts identification. Each is textured, marked by a raised box with a vertical bar, and slightly recessed so it is not pressed by accident in a pocket. Holding one and tapping the other cycles through vibration, tone and three speech volumes.","A tiny metal key ring is on one end. Almost at the corner beside it is a 2.5 mm headphone jack, which AccessWorld found very hard to find by touch until you know where it is.","The battery compartment for one AAA battery is on the bottom, marked by two raised ridges; the lid comes off by pressing down and pulling forward. The battery lasts about a year. When it runs low, two short beeps or three very short pulses follow each result."]},{"id":"colorino","n":"Colorino","co":"caretec","cat":"Miscellaneous","yr":0,"y":"Current product (Caretec SKU 14000)","o":"A talking color identifier and light detector that recognizes over 150 color shades.","h":"Caretec markets the Colorino as already in daily use by many people around the world. It sits below Caretec's Color Star and Color Star Pro, which name more than 1,700 shades.","s":{"bat":"2 × 1.5 V AAA batteries","wt":"84 g including batteries","dim":"110 × 52 × 25 mm","io":"3.5 mm headphone jack","disp":"None; speech output in natural language, 3 volume levels"},"src":["https://www.caretec.at/product/colorino-color-and-light-detector/","https://shop.rnib.org.uk/products/colorino-talking-colour-identifier-and-light-detector"],"desc":["The Colorino is a handheld talking color identifier from the Austrian company Caretec. You hold its tip against clothing, a wall or any surface and it speaks the color in plain language. It recognizes over 150 shades.","It is a small bar about 110 mm long, 52 mm wide and 25 mm thick, and weighs 84 grams with its batteries. The body is black, red and yellow.","It works with just two keys. A built-in loudspeaker has three volume levels, and a 3.5 mm headphone jack lets you hear results privately.","It also detects light, sounding an audio signal (0 to 2.5 kHz, per Caretec's spec table) that shows how bright a light source is, so you can tell whether a lamp is on or find a window. Caretec says it can tell natural from artificial light and measure contrast and brightness.","It runs on two 1.5 V AAA batteries. In the box are the device, batteries, a textile case and printed instructions."]},{"id":"prodigyvoice","n":"Prodigy Voice","co":"prodigy","cat":"Miscellaneous","yr":2007,"y":"2007 (since updated)","o":"A fully talking blood glucose meter, rated the most accessible of four talking meters by AFB Tech.","h":"AccessWorld says it first came on the market in 2007. AFB's 2012 update found 13 talking meters but only four that spoke every feature, and rated the Prodigy Voice best overall.","s":{"price":"$40 (AccessWorld, 2012)","wt":"2.4 oz","dim":"2.2 × 4.0 × 0.8 in","io":"3.5 mm headphone jack, mini-USB for downloading results","disp":"1.2 × 1.5 in monochrome display, 0.63 in characters, 83.6% contrast"},"src":["https://afb.org/aw/13/2/15850","https://prodigymeter.com/prodigy-voice/"],"desc":["The Prodigy Voice is a blood glucose meter that speaks every step: setup, testing, results, memory, settings, warnings and errors. AccessWorld measured it at 2.2 by 4.0 by 0.8 inches and 2.4 ounces.","On the front is a 1.2 by 1.5 inch black-on-gray display. Three control buttons sit below it and two direction buttons to its right. The largest is the round power button on the right, with a raised M; it also opens Memory Recall. The middle button is a triangle with a raised S for Settings. The left one has a raised left arrow and repeats the last spoken message. The up and down buttons have raised arrows.","The speaker is below the control buttons. A 3.5 mm headphone jack near the bottom of the right side gives private listening, and below it a mini-USB port sends results to Prodigy's software. A lanyard slot is on the bottom left.","Strips need no coding and use capillary action, so a 0.6 microliter sample is drawn in. A tactile notch shows where to insert the strip. The meter speaks results in 6 or 7 seconds and warns 'Not enough blood' to help avoid false lows.","It stores 450 readings with spoken 7-, 14-, 21-, 28-, 60- and 90-day averages, and in 2012 it cost about $40. AFB Tech found its buttons among the easiest to tell apart by touch and its display the highest-contrast of the meters tested."]},{"id":"forav20","n":"Fora V20","co":"fora","cat":"Miscellaneous","yr":0,"y":"On the US market by 2012 (AccessWorld review)","o":"A talking blood glucose meter with a strip-eject slider and full speech output.","s":{"price":"$70 (AccessWorld, 2012)","wt":"2.08 oz","dim":"3.69 × 2.25 × 0.78 in","io":"3.5 mm headphone jack, data port"},"src":["https://afb.org/aw/13/2/15850"],"desc":["The Fora V20 is a talking blood glucose meter from Fora Care. AccessWorld measured it at 3.69 by 2.25 by 0.78 inches and 2.08 ounces.","A 1.2 by 1.5 inch black-on-gray display sits above three buttons. The right-most is Power and Memory Recall, with a raised circle around an M. The middle is Settings, with a raised square around an S. The left repeats the last spoken message and has a raised left-pointing arrow. Up and down buttons with raised arrows are to the right of the display.","A strip-eject slider on the top right side pushes used strips out, so you never touch them. The speaker is below the Repeat and Settings buttons.","A 3.5 mm headphone jack is on the bottom left side, with a rubber-covered data port marked PC in raised letters below it. A lanyard slot is on the bottom right.","It stores 450 readings and speaks 7- to 90-day averages, with a language setting. AccessWorld found its buttons among the easiest to tell apart, but its PC software and electronic manual were not screen-reader accessible."]},{"id":"forav22","n":"Fora V22","co":"fora","cat":"Miscellaneous","yr":0,"y":"On the US market by 2012 (AccessWorld review)","o":"A slim talking glucose meter with a round screen and built-in rechargeable battery.","s":{"price":"$80 (AccessWorld, 2012)","wt":"1.76 oz","dim":"3.75 × 2.00 × 0.44 in","bat":"Built-in rechargeable (charges over mini-USB)","io":"3.5 mm headphone jack, mini-USB"},"src":["https://afb.org/aw/13/2/15850"],"desc":["The Fora V22 is the slimmest of the talking meters AccessWorld tested in 2012: 3.75 by 2.00 by 0.44 inches and 1.76 ounces.","Its 1.2 by 1.6 inch screen is circular. The buttons sit below it in a ring. The slightly recessed power button is in the center, Repeat and Settings are to its right, and the up and down buttons are to its left. The labels are printed, not raised.","A strip-eject slider with raised bumps is to the left of the display. The speaker is directly below the power button.","It has a built-in rechargeable battery. A recessed LED on the right of the front glows red while charging and green when full. On the bottom panel are a 3.5 mm headphone jack on the right and a mini-USB port under a rubber flap with raised lightning-bolt and USB symbols. A lanyard slot is in the corner.","AccessWorld found most buttons nearly flush and hard to feel, though usable with practice. It stores 450 readings with spoken averages."]},{"id":"solov2","n":"Solo V2","co":"biosense","cat":"Miscellaneous","yr":0,"y":"On the US market by 2012 (AccessWorld review)","o":"A low-cost talking blood glucose meter with very large display characters.","s":{"price":"$17 (AccessWorld, 2012)","wt":"2.2 oz","dim":"3.92 × 2.16 × 0.71 in","io":"Mini-USB data port; no headphone jack","disp":"1.5 × 1.9 in display with 1-inch characters"},"src":["https://afb.org/aw/13/2/15850"],"desc":["The Solo V2 from BioSense Medical Devices was the cheapest fully talking meter in AccessWorld's 2012 review, at $17. It measures 3.92 by 2.16 by 0.71 inches and weighs 2.2 ounces.","Below its 1.5 by 1.9 inch display are two joined buttons: Power and Memory on the left, Repeat on the right. Their icons are not tactile, and AccessWorld found them hard to tell apart. The speaker is beneath them.","On the top of the right side are up and down buttons with raised arrows and, below them, a small round Settings button. These need considerable force to press. A mini-USB data port is at the bottom of the right side. There is no headphone jack.","It holds 500 readings, more than the other meters tested, and has an alarm setting. It does not speak the time of past readings, though the screen shows it.","For people with low vision, its 1-inch characters were the largest of any meter tested, with a 73.9% contrast ratio."]},{"id":"bradley","n":"Bradley tactile watch","co":"eone","cat":"Miscellaneous","yr":2013,"y":"Kickstarter mid-2013; first batch planned for November 2013","o":"A titanium watch read by touch, with ball bearings for the hours and minutes.","h":"Named for Paralympic swimmer Bradley Snyder, who lost his sight to an IED in Afghanistan. Founder Hyungsoo Kim designed it so blind wearers would not wear something that called attention to their disability. By 2014 SJX reported that only 1 to 2% of buyers were blind.","s":{"dim":"40 mm diameter","price":"No verified launch price; the 2013 Kickstarter is cited in the Boston Globe and SJX","disp":"Tactile dial; no crystal","bat":"Quartz (Ronda movement)"},"src":["https://www.bostonglobe.com/business/2013/07/11/watch-for-blind-kickstarter/0dt8VUnqc0hZ3z3gxUXROP/story.html","https://watchesbysjx.com/2014/04/introducing-the-eone-bradley-a-tactile-way-to-tell-the-time.html"],"desc":["The Bradley is a wristwatch you read by touch. It looks like an ordinary modern watch: a 40 mm titanium case with a Ronda quartz movement inside.","There is no crystal over the dial, so your fingers can reach it. Raised markers around the face show the hours. The 12 o'clock marker is a triangle, and the 3, 6 and 9 markers are elongated so you can find the quarters.","Time is shown by two small ball bearings instead of hands. One rolls in a track on the face for the minutes, and the other runs around the outside edge of the case for the hours. The movement drives them with magnets.","If the bearings are knocked out of place you can nudge them freely, and a few shakes snap them back to the correct time. You set the time with the crown.","Eone designed it with blind testers, who did not want a watch that drew attention to their disability. It is named after Navy veteran and Paralympic gold medalist Bradley Snyder, and SJX reported that most buyers are sighted people who like checking the time discreetly."]},{"id":"penfriend3","n":"PENfriend 3 audio labeller","co":"rnib","cat":"Miscellaneous","yr":0,"y":"Current product (RNIB DL128)","o":"A pen-shaped recorder that plays your own voice labels when touched to a coded sticker.","h":"RNIB sells it exclusively in the UK. It is made with TouchSpot Audio Limited and also plays MP3 music and talking books.","s":{"price":"£114 inc. VAT (RNIB shop)","sto":"16 GB internal (about 250 hours), SD card up to 32 GB","wt":"54 g without lanyard","dim":"15 × 2.5 × 2 cm, 1 cm tip"},"src":["https://shop.rnib.org.uk/products/rnib-penfriend-3-audio-labeller","https://www.rnib.org.uk/living-with-sight-loss/independent-living/labelling/"],"desc":["The PENfriend 3 is a talking pen for labelling things around the home. You stick a coded label on an item, touch the pen tip to it and record a message. Touch the label again later and the pen plays your recording back.","It is a slim black pen, 15 cm long, 2.5 cm wide and 2 cm deep, with a 1 cm tip. It weighs 54 grams without its lanyard and has four tactile yellow buttons.","Each label holds up to an hour of audio, and labels can be re-recorded. The 16 GB internal memory holds about 250 hours of recordings, and an SD card adds up to 32 GB. Recordings can be backed up and restored with a computer.","In the box are 21 rectangular tactile labels, 84 small round orange and yellow labels, a key fob with four recording spots and a lanyard. RNIB suggests uses such as freezer food with use-by dates and cooking instructions, clothing colors and washing care, medicines, paperwork and seed packets.","It doubles as an MP3 music player and talking-book player. RNIB lists it at £114 including VAT, and eligible buyers can get VAT relief."]},{"id":"amzmicro","n":"AmazonBasics Microwave with Alexa (S9N29R)","co":"amazon","cat":"Miscellaneous","yr":2018,"y":"Announced September 20, 2018; shipped from November 14, 2018. Reported discontinued by 2025 (user reports on Reddit, September 2025).","o":"A $59.99 compact 700-watt microwave controlled by voice through any Echo device. It was Amazon's first kitchen appliance and the first device built on the Alexa Connect Kit.","h":"Amazon announced it at its September 20, 2018 devices event, alongside the second-generation Echo Show, Echo Wall Clock, Amazon Smart Plug and Echo Input. The Verge called it 'the e-commerce giant's first real kitchen appliance.' It was the first product built on the Alexa Connect Kit (ACK), a low-cost Wi-Fi and Bluetooth Low Energy module that lets ordinary appliances take commands from an existing Echo. The microwave itself has no microphone or speaker, and Amazon positioned it largely as a reference design for ACK. It also integrated Dash Replenishment, with an optional Auto Popcorn Replenishment feature that reorders popcorn. Tech press first treated a talking microwave as a gimmick. In January 2021 Forbes' Steven Aquino argued that the voice control made it genuinely accessible for people with visual or motor disabilities. AFB's AccessWorld reviewed it in December 2020, called it 'very accessible' when paired with an Alexa device and 'an excellent value,' and judged it a good choice of small accessible microwave. Users on NFB's Electronics-Talk list reported getting a braille keypad overlay for it in 2020. Its successor in the Alexa kitchen line was the 2019 Amazon Smart Oven (see that entry).","s":{"price":"$59.99 at launch (2018); still $59.99 in AccessWorld's December 2020 review","pwr":"700 W output, 1,050 W input, 120 V / 60 Hz","cap":"0.7 cu ft, 10 in turntable","dim":"17.3 × 14.1 × 10.1 in","wt":"21.9 lb","conn":"Wi-Fi and Bluetooth Low Energy through the Alexa Connect Kit module (pairs as a smart-home device in the Alexa app)","disp":"Digital time readout; no speech of its own (spoken feedback comes from the Echo)","used":"No resale price found; Reddit users reported in 2025 that it can no longer be bought new"},"f":["Alexa voice control through any Echo on the same Wi-Fi network, for example 'Alexa, microwave for 2 minutes' or 'Alexa, reheat coffee'","Raised 'Ask Alexa' button: press it and speak the command without saying the wake word","Voice power levels ('five minutes on power six' or 'on medium')","Quick-cook voice presets (potatoes, frozen vegetables, coffee and others)","Optional Dash Replenishment reordering of popcorn"],"src":["https://www.theverge.com/2018/9/20/17882140/amazon-basics-microwave-alexa-2018-smart-features-price-release-date","https://www.aftvnews.com/amazon-announces-new-amazonbasics-microwave-with-alexa/","https://www.fonearena.com/blog/264036/amazon-echo-show-2nd-gen-amazon-basics-microwave-echo-wall-clock-smart-plug-echo-input.html","https://afb.org/aw/20/12/16848","https://www.forbes.com/sites/stevenaquino/2021/01/14/the-amazonbasics-microwave-with-alexa-shows-how-gimmicks-are-gold/","http://www.nfbnet.org/pipermail/electronics-talk_nfbnet.org/2020-July/017897.html","https://www.reddit.com/r/alexa/comments/1ngto3z/i_think_the_wifi_card_in_my_amazon_basics_smart/"],"desc":["The AmazonBasics Microwave is a small white countertop microwave. AccessWorld gives its outside dimensions as 17.3 inches wide, 14.1 inches deep and 10.1 inches high, and its weight as 21.9 pounds. Inside is a 0.7 cubic foot cavity with a 10-inch glass turntable. It is rated at 700 watts of cooking power, lower than most full-size microwaves, though owners on NFB's lists said food needs only a little longer.","The door is hinged on the left, and its handle runs down the strip just left of the control panel. All controls and the display sit in a strip about three inches wide on the right front. At the top is the digital time readout. Below it is a row of three buttons: Power Level, Time Defrost and Weight Defrost.","Next comes a standard keypad, numbers 1 to 9 in three rows. The row below has Popcorn on the left, 0 in the middle and Kitchen Timer on the right. The bottom row has Pause/Stop on the left, the Alexa button in the middle and Start/+30 Sec on the right. The Alexa button is the only raised button. The others are flat membrane keys marked only by small indentations, so AccessWorld suggests locator dots or braille labels for anyone who wants to use the keypad by touch.","To set up the turntable, you feel for three taped bumps on the cavity floor, remove the tape, and seat the roller ring around them. The glass tray's three bumps then lock loosely into place on the rollers. The microwave has no microphone or speaker. It pairs over Wi-Fi as a smart-home device in the Alexa app. AccessWorld's tester needed sighted help for one step of pairing, holding the 2 key for four seconds, because the keys are hard to identify by touch.","Once paired, it is controlled entirely by voice through any nearby Echo: 'Alexa, microwave for one minute,' 'add 30 seconds,' 'reheat coffee' or 'five minutes on medium.' Pressing the raised Alexa button and simply saying 'one minute' does the same thing without the wake word. Alexa answers through the Echo, which gives a blind cook the spoken confirmation the microwave itself cannot."]},{"id":"amzsmartoven","n":"Amazon Smart Oven / Amazon Basics 4-in-1 Smart Oven (EB544N)","co":"amazon","cat":"Miscellaneous","yr":2019,"y":"Announced September 25, 2019; shipped from November 14, 2019. Later sold under the Amazon Basics name (Woot listings as 'Amazon Basics EB544N Smart Oven'). No 2021 launch and no second-generation model were found; user reports from September 2025 describe it as discontinued, with Alexa connections failing.","o":"A 4-in-1 countertop appliance (microwave, convection oven, air fryer and food warmer) controlled by voice through an Echo. Amazon offers a free braille keypad overlay.","h":"Amazon announced it on September 25, 2019 as the follow-up to the 2018 AmazonBasics Microwave. It sold for $249.99 bundled with an Echo Dot and shipped on November 14, 2019. The launch press release called it 'Voice-Controlled 4-in-1 Oven' and paired it with the new 'Certified for Humans' program for easy-setup smart-home devices. Like the microwave, it has no microphone or speaker and was described by The Verge as a reference design for Alexa appliance APIs. New at launch were 30 cooking presets, a temperature probe, Alexa voice preheat and temperature setting, Alexa Announcements when preheating finishes or food is done, and 'scan-to-cook.' Scan-to-cook reads the barcode of hundreds of packaged foods (Whole Foods Market, 365, Gardein, Marie Callender's and others) with the Alexa app and loads the cooking program onto the oven. Amazon's help page states that a free braille keypad overlay is available and has instructions for applying it. The oven was later listed as the 'Amazon Basics EB544N Smart Oven,' including refurbished units on Woot at $149.99 to $189.99 against a $249.99 reference price. A 2021 launch date and a 2025 second generation were both searched for and not found. The model number stayed EB544N. In September 2025 several owners on Reddit reported that their 4-in-1 ovens and Basics microwaves had lost Alexa connectivity, and that the products could no longer be bought new.","s":{"price":"$249.99 with an included Echo Dot (2019)","pwr":"Input 1,600 W; microwave output 1,000 W; convection output 1,400 W; keep-warm 1,300 W; 120 V / 60 Hz","cap":"1.5 cu ft, 13.6 in turntable; large enough for a 5 lb chicken","dim":"21.73 × 21.38 × 12.83 in","wt":"About 44.75 lb","conn":"Wi-Fi, set up through the Alexa app","used":"Refurbished units on Woot at $149.99 to $189.99 (reference price $249.99)"},"f":["Microwave, convection bake, air fry and keep-warm modes, plus defrost, reheat, auto roast and preset cook","30+ built-in presets","Alexa voice control through any compatible Echo ('Alexa, bake for 25 minutes at 350 degrees')","Alexa Announcements when preheating finishes or food is done","Temperature probe that plugs into the inside wall; the display shows the probe temperature","Scan-to-cook for packaged foods with the Alexa app","Free braille keypad overlay from Amazon"],"src":["https://press.aboutamazon.com/2019/9/amazon-introduces-an-array-of-new-devices-and-features-to-help-make-your-home-simpler-safer-and-smarter","https://www.theverge.com/2019/9/25/20883867/amazon-smart-oven-features-specs-price-release-date-alexa-echo-dot","https://customerdocumentation.s3-us-west-2.amazonaws.com/Alexa+Devices/Amazon+Smart+Oven+Manual+(Accessible+HTML).html","https://www.amazon.com/b?ie=UTF8&node=21341314011","https://www.utahsweetsavings.com/amazon-basics-eb544n-smart-oven-149-99-reg-249-99-today-only-2-08/","https://www.reviewed.com/cooking/features/amazon-smart-oven-is-it-worth-buying","https://www.reddit.com/r/alexa/comments/1ngto3z/i_think_the_wifi_card_in_my_amazon_basics_smart/","https://www.indiatoday.in/technology/features/story/amazon-event-2019-echo-studio-echo-buds-all-new-echo-and-all-other-devices-announced-1603344-2019-09-26"],"desc":["The Amazon Smart Oven is a large countertop box that looks like an oversized microwave. Its manual gives outside dimensions of 21.73 by 21.38 by 12.83 inches and a weight of about 44.75 pounds, roughly twice the size and weight of the 2018 AmazonBasics Microwave. The 1.5 cubic foot cavity has a 13.6-inch turntable and holds a 5-pound chicken.","It combines four appliances. As a microwave it puts out 1,000 watts, and as a convection oven 1,400 watts. Air frying is convection cooking on the tall rack with the air-fry pan, and keep-warm runs at 1,300 watts. The whole unit draws up to 1,600 watts from a standard 120-volt outlet.","Accessories include a tall rack, a short rack, a perforated air-fry tray and a temperature probe. The manual explains which go with which mode: the tall rack and air-fry tray for air fry and convect, the short rack for keep warm, and the probe required for auto roast. No racks or metal may be used in the microwave, defrost, reheat or preset-cook modes. The probe plugs into a socket on the inside wall, and the display then shows its reading.","The front has a control panel with a display, a keypad and mode keys such as Convect. Amazon offers a free braille keypad overlay that marks the key functions, with instructions on its help page for applying it. As with the microwave, the oven has no microphone or speaker, so all speech comes from a nearby Echo.","By voice you can preheat, set the temperature, start, stop and add time, for example 'Alexa, bake for 25 minutes at 350 degrees.' Alexa announces when the oven has preheated and when food is done, so a blind cook does not need to read the display. With scan-to-cook, the Alexa app reads a packaged food's barcode and loads the right program. Owners reported in 2025 that Alexa control had stopped working on some units and that Amazon no longer sells the oven new."]},{"id":"vox2","n":"Vox-2 Talking Kitchen Scale","co":"myweigh","cat":"Miscellaneous","yr":0,"y":"Current (Maxi-Aids listing, 2025 reviews). AccessWorld's 2018 and 2021 guides name a 'Vox 20' ($42 and $42.99); its relationship to the Vox-2 is not stated.","o":"A talking kitchen scale that announces weights in four languages, up to 11 lb (5 kg) in 1 g steps.","h":"AccessWorld's 2018 holiday guide listed the Vox 20 at $42, describing it as speaking five languages and weighing up to 11 pounds. Its 2021 accessible-kitchen guide listed it at $42.99 with four languages (English, German, French, Spanish) and tare, and noted that BlindMiceMart's Dale uses it to calculate postage. The current Maxi-Aids listing is for the Vox-2, made by My Weigh.","s":{"price":"$46.95 at Maxi-Aids (list $59.95); the Vox 20 was $42 to $42.99 in 2018 to 2021","bat":"4 × AA (included); auto-off after 90 seconds","dim":"9.0 × 6.5 × 1.75 in","wt":"1.0 lb","cap":"11 lb (5 kg) in 0.1 oz (1 g) steps","disp":"Large blue-backlit LCD"},"f":["Speaks weights in English, German, French or Spanish","Grams or pounds and ounces","Hi/Low volume, and speech can be turned off","Tare to subtract a bowl or container","Oversized 1.5 × 1.2 in keys"],"src":["https://www.maxiaids.com/product/vox-2-talking-kitchen-scale2","https://afb.org/aw/21/11/17296","https://afb.org/aw/18/11/15267"],"desc":["The Vox-2 is a flat kitchen scale made for blind and low-vision cooks. Maxi-Aids lists it at 9.0 by 6.5 by 1.75 inches and 1 pound. It has a gray case and a stainless-steel weighing platform that wipes clean.","The controls are oversized keys, each about 1.5 by 1.2 inches, black with white print. One owner said they are big and easy to identify by touch. A large LCD with blue backlighting shows the weight for anyone with some vision.","Place an item on the platform and the scale speaks its weight. It weighs up to 11 pounds (5 kg) in 1 gram (0.1 ounce) steps, in grams or in pounds and ounces. Tare zeroes out a bowl so only the ingredient is weighed.","It speaks English, German, French or Spanish, with a high/low volume switch, and speech can be switched off. One 2025 reviewer described the voice as clear and polite, saying 'Hello' and 'Goodbye' at power on and off. The same reviewer noted that it does not announce the unit mode, and that it beeps rapidly before speaking a negative weight when a container is lifted off.","It runs on four AA batteries (included) and turns itself off after 90 seconds idle. The reviewer also wished the print manual came in large print or electronic form. Maxi-Aids lists a lifetime limited warranty (30 years in Europe)."]},{"id":"rt8400","n":"ThermoWorks RT8400 Talking Thermometer","co":"thermoworks","cat":"Miscellaneous","yr":0,"y":"On the market by 2012 (AccessWorld review); still recommended in 2026","o":"A talking probe thermometer for food, liquids and bath water, from −58 to 572 °F.","h":"AccessWorld's Janet Ingber reviewed it in 2012 at $36.00 from Blind Mice Mart. The Blind Bridge (October 2026) calls it the talking thermometer blind cooks write in about, priced up to about $60.","s":{"price":"$36.00 (AccessWorld, 2012); about $60 in 2026 (The Blind Bridge)","bat":"2 × AAA (included); auto-off after 10 minutes","dim":"About 9 in long with a 5 in metal probe","disp":"Display window plus spoken readout","cap":"−58 to 572 °F, accurate to within 1.8 °F per the manual"},"src":["https://afb.org/aw/13/5/15813","https://theblindbridge.com/shopping/talking-thermometer/"],"desc":["The RT8400 is a long, thin probe thermometer about 9 inches long. The upper part is plastic and the lower 5 inches is a slender, pointed metal probe. A clip-on cover protects the probe and lets you hang the thermometer up.","At the top is a loop for hanging it on a hook. Below that are a small display window, a single large oval button and the speaker openings. The oval button is the only control you need, and it is easy to find by touch.","On the back, the battery compartment at the top opens with a small loop and holds two AAA batteries (included). Below it a small switch selects Fahrenheit or Celsius; it ships set to Fahrenheit.","Press the oval button and it beeps within a couple of seconds. Insert the probe and press again, and it speaks the temperature almost at once. It shuts itself off after ten idle minutes. AccessWorld measured boiling water at 211.5 °F and ice water at 33.4 °F, and found the first reading of a session slightly less accurate than later ones.","Its range is −58 to 572 °F, accurate to within 1.8 °F per the manual. Uses include checking that chicken is cooked through or that a child's bath water is safe. AccessWorld's one complaint was that the manual was not accessible out of the box."]},{"id":"talkingthermo","n":"TALKiNG Fast Reading Thermometer (Ultmost HE-113-EN)","co":"ultmost","cat":"Miscellaneous","yr":0,"y":"On the market by 2012 (AccessWorld review)","o":"An inexpensive talking body thermometer for oral, underarm or rectal use.","s":{"price":"$12.95 (AccessWorld, 2012); talking body thermometers about $13 in 2018 (AccessWorld)","bat":"2 × AG13 button cells (pre-installed); auto-off after 3 minutes","disp":"Small display window plus female voice"},"src":["https://afb.org/aw/13/5/15813","https://afb.org/aw/18/11/15267"],"desc":["This is a slim stick-shaped digital thermometer that speaks body temperature. AccessWorld found that its packaging did not name the maker; a search identified it as the Ultmost HE-113-EN.","Hold it with the probe tip pointing down. The broad top section has a display window and two buttons. The upper button repeats the last temperature, and the lower one is power. A small speaker is inside.","The mouth end has a removable plastic protective cover and a flexible tip. The battery compartment on the back is closed by two tiny screws and holds two AG13 button cells, already installed.","Press power and a clear female voice says 'Ready.' It beeps every few seconds while measuring, then announces 'Your body temperature is' and the reading. Holding the power button switches it from Fahrenheit to Celsius, and it turns itself off after three minutes.","AccessWorld found it accurate against non-talking thermometers read by a sighted helper, and more consistent than the Lumiscope ear thermometer. It criticized the lack of an accessible manual or usable website. It cost $12.95."]},{"id":"lumiscopeear","n":"Lumiscope Talking Digital Ear Thermometer","co":"grahamfield","cat":"Miscellaneous","yr":0,"y":"On the market by 2012 (AccessWorld review)","o":"A fast talking ear thermometer that also speaks the time.","s":{"price":"$32.85 (AccessWorld, 2012); spare probe covers $7.99 per 40","bat":"2 × AAA (included)","disp":"Display window covering most of the front, plus speech"},"src":["https://afb.org/aw/13/5/15813"],"desc":["The Lumiscope is an oval handheld ear thermometer. A large ridged button on top turns it on and takes a reading once the probe is in the ear. The probe is on the back. It comes with a stand and ten disposable probe covers.","A display window covers most of the front. Below it are two buttons, Memo and Talk, for stepping through earlier readings. Pressing Talk while it is on speaks the time, because when idle it works as a clock. Setting that clock needs sighted help.","Small recessed holes on the sides are pressed with an unbent paper clip: one labeled C/F on the right switches Fahrenheit and Celsius, and one on the left resets the unit. Two AAA batteries go in a compartment held by a tiny screw just below the probe.","To take a reading, you slide a clean cover over the probe, insert it gently into the ear canal and press the top button. It beeps, plays a short melody and speaks the temperature. The manual asks for 30 minutes in the room first, and ten minutes between readings in the same ear.","AccessWorld found it very fast, but it read consistently higher than the TALKiNG oral thermometer, by as much as three degrees during a fever. The reviewer advised checking with a doctor when accuracy matters."]},{"id":"reizenatomic","n":"Reizen Talking Atomic Alarm Clock","co":"reizen","cat":"Miscellaneous","yr":0,"y":"Current (Maxi-Aids listing, 2026)","o":"A radio-controlled talking alarm clock that sets itself from the US atomic time signal.","h":"Maxi-Aids lists it at $44.95 (list $55.00). LS&S sells a comparable Talking Radio Controlled Atomic Clock (SKU 101021) at $42.95.","s":{"price":"$44.95 at Maxi-Aids (list $55.00)","bat":"2 × AA (not included); low-battery reminder","disp":"LCD, 1¾ × 3 in, showing time with seconds, month, date, day of week and alarm time","conn":"Receives the US atomic time radio signal broadcast from Colorado; 8 time zones"},"f":["Female voice announces time and date","Optional hourly announcements from 8 AM to 10 PM","Automatic daylight-saving changes","5-minute alarm with beeps and spoken time; 5-minute snooze","High/low volume switch","Voice guidance during setup; press a button 3 times to hear the time zone"],"src":["https://www.maxiaids.com/product/reizen-talking-atomic-alarm-clock","https://lssproducts.com/clocks-watches/talking-clocks/"],"desc":["The Reizen Talking Atomic Alarm Clock is a battery-powered talking clock that never needs setting. It picks up the radio time signal broadcast from the US atomic clock in Colorado, and changes for daylight saving time on its own.","Press its talk button and a natural-sounding female voice announces the time and date. It can also announce every hour from 8 AM to 10 PM, which can be turned off. A high/low volume switch helps people with hearing loss.","The front has an LCD about 1¾ by 3 inches showing the time with running seconds, the month, date, day of the week and the alarm time. The retailer listings used do not give the case's dimensions or button layout.","The alarm sounds for an extra-long five minutes, beeping and announcing the current time, and a snooze gives five more minutes. Newer units add eight selectable time zones (Pacific, Mountain, Central, Eastern, Alaska, Hawaii, Atlantic and UTC). Pressing a button three times speaks the current zone.","It runs on two AA batteries, which are not included. When batteries go in, it plays a self-introduction, and the voice then guides setup. It also warns when the batteries are low."]},{"id":"noteteller2","n":"Note Teller 2 Money Identifier","co":"brytech","cat":"Miscellaneous","yr":0,"y":"On sale by January 2007 (AccessWorld, May 2007); launch year not stated","o":"A tabletop talking identifier for U.S. paper money, $1 to $100, in English or Spanish.","h":"AFB TECH evaluated it in May 2007, shortly after a federal judge ruled in December 2006 that U.S. currency was inaccessible to people who are visually impaired. Expert lab testers identified bills about 80% of the time; good-condition bills were easy and worn or wrinkled ones harder. $2 bills succeeded on only 6 of 36 tries (16.7%) and were called $50 five times. In the user study in Dallas, two $10 bills were announced as $100. AFB praised it as one of the easiest devices it had tested and its large-print and audio-CD manual. It found it too big for a pocket and questioned the $270 price.","s":{"price":"$270 (AccessWorld, 2007)","dim":"6 × 3 × about 1 in","wt":"8 oz with battery","bat":"One 9-volt battery; says 'replace battery' when weak","out":"Male voice, English or Spanish; headphone jack"},"f":["Recognizes U.S. bills $1 to $100; manufacturer-upgradable for new designs","Either end, either face up; insert 'swiftly'","Announces in 2 to 4 seconds; says 'cannot read' if unsure","Says 'out of order' when it needs repair","Manual in large print and on audio CD, English and Spanish"],"src":["https://www.afb.org/aw/8/3/14354"],"desc":["The Note Teller 2 from BRYTECH of Canada is a talking money identifier for U.S. paper currency. It is a black rectangular box 6 inches long, 3 inches wide and about 1 inch thick, weighing 8 ounces with its 9-volt battery.","On top, about two thirds of the way toward the back, is a slot for the bill. Molded edges along the sides guide the bill into it. Sliding the end of a bill in turns the unit on, and it does not matter which end or which face is up.","The front edge has a headphone jack and a slider switch. When the unit is silent, the slider sets the volume to low, medium or high; while it is speaking, the slider switches between English and Spanish.","The back edge is slightly thicker than the front and has a ring for a neck or wrist strap, or for securing the unit to a desk or counter. A vinyl sleeve protects it when not in use.","Within two to four seconds a clear male voice announces the denomination, or says 'cannot read.' It says 'replace battery' when the battery is weak and 'out of order' when it needs service. AFB found it very easy to use but too large for a pocket, and its accuracy was about 80% in lab tests."]},{"id":"verbaliserolx","n":"Verbalise Rol-X and Swarovski-crystal talking watches","co":"verbalise","cat":"Miscellaneous","yr":2016,"y":"2016 (reviewed as new additions in November 2016)","o":"Radio-controlled talking wristwatches designed to look stylish, with natural-sounding voices at a discreet volume.","h":"Disability Now editor Ian Macrae reviewed the range in November 2016. Martin Begg set out to fix two complaints about talking watches: that they look cheap and that their voices are cartoonish or so loud that everyone nearby hears. Macrae found the voices neutral and audible in average noise. He found the clasp and strap adjustment awkward at first. He wished the hourly announcements could be limited to daytime, since they had to be switched off at night.","s":{"price":"£149.99, all models (2016)","models":"Men's Rol-X GB (gold and black) and SB (silver and black); women's Swv-855 gold, Swf-887 rose gold, Swf-863 silver","time":"Radio-controlled, set automatically from the atomic clock signal"},"f":["Two voices: male (24-hour time) and female (12-hour time)","Optional hourly time announcement","Speech feedback when setting controls","Men's model has a 24-hour scale on the bezel"],"src":["https://disabilitynow.wordpress.com/2016/11/21/product-review-verbalise-talking-watches-talking-the-talk-looking-the-look/"],"desc":["Verbalise talking watches are radio-controlled wristwatches from a company set up by blind entrepreneur Martin Begg. They were designed to look like ordinary fashion watches and to speak quietly in natural voices. All models cost £149.99 in 2016.","The men's watch is modeled on a 'Rol-X' design, in black and silver or black and gold. It has a decorative edge to the bezel, which also shows 24-hour time around the face. It comes on a leather strap with a clasp and can take most other straps.","The women's watch is decorated with Swarovski crystals and comes in gold, rose gold and silver.","Each watch offers two voices and two time formats: a male voice speaks 24-hour time and a female voice 12-hour time. Both have neutral British accents. The reviewer found them audible in average background noise without being loud. The watch can also announce the time every hour.","Because the watches are radio-controlled, they set themselves from the atomic clock signal. Other settings are easy, with speech feedback guiding you. The reviewer found the clasp fiddly at first and noted that the hourly announcement had to be switched off at night."]},{"id":"eyenote","n":"EyeNote (BEP money identifier app)","co":"bep","cat":"Miscellaneous","yr":2011,"y":"2011 (iOS); EyeNote 4.0 on August 16, 2024; later released for Android","o":"The U.S. government's free app that names the denomination of U.S. Federal Reserve notes from Series 1996 onward, using the phone camera.","h":"The BEP released EyeNote for iOS in 2011. Version 4.0 (August 16, 2024) is 64-bit and needs iOS 11 or later, covering the iPhone 6 and newer. The Android version needs Android 11 and at least 4 GB of RAM. It scans continuously, so there is no need to hold still or take a photo. It reads the face or back in any orientation, even part of a note, works offline, and speaks English or Spanish to match the device. It doesn't check whether a note is genuine. In AccessWorld's July 2020 test on an iPhone SE, it named every U.S. bill within a second and showed front or back on a braille display. It gave no ready prompt, though, and spoke in the Samantha voice rather than the user's VoiceOver voice. The BEP's older IDEAL Currency Identifier for Android has been withdrawn.","s":{"price":"Free","plat":"iOS 11 or later; Android 11 or later with 4 GB RAM","out":"Speech through VoiceOver; braille on a connected display","lang":"English, Spanish"},"f":["U.S. notes only, Series 1996 to present","Continuous scanning, no photo needed","Works offline","Either side, any orientation, partial notes","Does not detect counterfeits"],"src":["https://www.bep.gov/services/currency-accessibility/mobile-applications/","https://afb.org/aw/21/7/17116"]},{"id":"cashreaderapp","n":"Cash Reader","co":"cashreader","cat":"Miscellaneous","yr":2018,"y":"Started 2018","o":"A banknote-recognition app for iOS and Android that works offline and covers nearly every currency in the world.","h":"Built in Brno because no app could read the Czech koruna. It grew from one currency to ten, then fifty, and its makers say it now covers nearly every banknote, trained on over 10 million photos. AccessWorld's July 2020 review found it supporting nearly 100 currencies, with a 14-day trial, then $0.99 a month, $5.99 a year or $17.99 for life. It offered Siri shortcuts for each currency, optional haptic patterns for each denomination, an automatic flashlight in the dark, low-vision contrast settings and a choice of front or back camera.","s":{"price":"Free trial, then subscription ($0.99/month, $5.99/year or $17.99 lifetime in July 2020)","plat":"iOS, Android","out":"Speech, haptics, beeps"},"src":["https://cashreader.app/about/","https://afb.org/aw/21/7/17116"]},{"id":"looktelmr","n":"LookTel Money Reader","co":"ipplex","cat":"Miscellaneous","yr":2011,"y":"March 8, 2011 (iOS)","o":"An early iPhone app that named U.S. bills from $1 to $100 in real time through the camera, without an internet connection.","h":"IPPLEX released it on March 8, 2011 for $1.99, for the iPhone 4, iPhone 3GS and fourth-generation iPod touch. It used LookTel's patented object recognition on a continuous video stream, so you didn't need to hold still or take a photo, and it spoke results in a clear female voice. AccessWorld's Scott Davert called it unequivocally a top performer. In 2016 NantMobile Health bought it and moved it to a subscription; by 2020 the version he had bought in 2011 was no longer available.","s":{"price":"$1.99 at launch (2011)","plat":"iPhone 4 / 3GS, 4th-generation iPod touch (2011)","out":"Female voice"},"src":["https://www.freelists.org/post/real-eyes/Ipplex-Releases-LookTel-Money-Reader-for-iOS-Devices","https://www.engadget.com/2011-03-10-iphone-app-helps-the-blind-id-currency.html","https://afb.org/aw/21/7/17116"]},{"id":"franklinbill","n":"Franklin Bill Reader","co":"franklin","cat":"Miscellaneous","yr":2010,"y":"On the market by February 2010","o":"A handheld talking identifier for U.S. paper money from $1 to $100, speaking English or Spanish.","h":"The New York Times described it in February 2010 as a $300 device using object recognition to name a bill's denomination aloud. It recognized current and recent series, and new designs could be downloaded into it from Franklin's website using a Windows PC. Results came through a built-in speaker or wired earbuds. The article placed it in the context of a 2008 court ruling that the U.S. government discriminated against blind people by not making bills distinguishable.","s":{"price":"$300 (2010)","out":"Speech, English or Spanish; speaker or earbuds"},"src":["https://archive.nytimes.com/gadgetwise.blogs.nytimes.com/2010/02/19/for-the-visually-impaired-money-talks/"]},{"id":"bi20x","n":"Brailliant BI 20X","co":"hw","cat":"Braille Displays","yr":2021,"y":"2021 (reviewed June 2021)","o":"A 20-cell braille display and notetaker from HumanWare with an eight-dot Perkins-style keyboard, the smaller sibling of the BI 40X.","h":"Scott Davert reviewed it for Helen Keller Services in June 2021, after the BI 40X. It runs the same software, with an editor, PDF reading (plain text, slow to open) and Exam Mode added by firmware 1.1.1. Unlike the 40X, it has an SD card reader and a removable battery. It lacks the 40X's C keys, stereo speakers and microphone, and has half the internal memory. It uses Bluetooth 4.2 and 2.4 GHz-only Wi-Fi, against Bluetooth 5 on the 40X, and he found its Bluetooth reliable to about 20 feet versus 30 for the 40X. Price: $1,895 at review, $2,199 by January 2023.","s":{"cells":"20, 8-dot","price":"$1,895 (2021); $2,199 (January 2023)","dim":"7.2 × 3.3 × 0.8 in","wt":"0.88 lb","sto":"16 GB, SD card, USB-A","net":"Bluetooth 4.2, 2.4 GHz Wi-Fi, USB-C"},"desc":["The Brailliant BI 20X is a small, flat braille display about 7.2 inches long, 3.3 inches deep and 0.8 inch thick, weighing just under a pound. It comes in a snug nylon case with a lanyard that closes with a magnet and leaves the ports uncovered.","Hold it with the spacebars toward you. On the top, nearest you, are two spacebars. Behind them are the 20 braille cells, each with a cursor routing key behind it. Behind those is the eight-dot Perkins-style keyboard.","The front edge has five buttons, left to right: the Previous key, the Left thumb key (about twice as long), a round Home key in the middle that takes you back a menu, the Right thumb key and the Next key. The two long thumb keys pan the braille display.","On the left edge, front to back, are a USB-A port for thumb drives, the power button (hold for several seconds to switch on or off, tap to sleep or wake) and a USB-C port for charging and computers. The right edge has a mono speaker, two volume buttons and a 3.5 mm headphone jack.","Along the back edge is a full-size SD card reader. Underneath are a braille serial number, rubber feet, and a removable battery held by two screws."],"src":["https://www.helenkeller.org/a-review-of-the-brailliant-bi-20x/"]}],"OSL":[{"id":"keysoft","n":"KeySoft","co":"hw","h":"The BrailleNote software suite (word processor, book reader, email, web, planner) from Pulse Data and HumanWare. It ran on Windows CE from 2000, moved to Android on the BrailleNote Touch (2016), and to Windows 11 on the BrailleNote Evolve (2026). KeySoft applications also run on the Monarch.","v":[["6.2","2005","Shipping version on the BrailleNote mPower at launch."],["7.5","By 2008","Last release for BrailleNote and VoiceNote Classic. Build 29 (May 2008) added 802.11g Wi-Fi card support (Ambicom WL54G, USR5421), fixed appointment scheduling, fixed USB and CD-ROM devices being identified as printers, and fixed spell-check word retention."],["8.0","Announced January 2009; released July 2009","For mPower and PK only, not Classic. Added real-time communication features, a richer book-reading experience and a 90-day Sendero GPS trial. Required one SMA count; free for units bought after January 1, 2009. mPower releases stopped at 8.1."],["9.1","Date not given in the sources cited for this history","For the Apex. Enhanced tables and formatting support."],["9.3","Previewed March 31, 2012","For the Apex. Bluetooth file transfer, opening Word 2007/2010 and OpenOffice documents, saving to online services such as Google Docs, and third-party development tools with a BrailleNote simulator."],["9.4.1","2014","For the Apex. Added KeyMaps, a free virtual navigation and map-exploration tool."],["KeySoft for Android","2016","On BrailleNote Touch (Android 4.4)."],["Touch Plus (Android 8.1)","February 2019","BrailleNote Touch Plus ships with Android 8.1."],["KeySoft Lite","February 2021","On the Brailliant BI 20X and BI 40X displays."],["Touch Plus update","September 2025","KeyMath renamed KeyGraph; KeyRecorder added (user reports). Still Android 8.1."],["KeySoft on Windows 11","2026","On BrailleNote Evolve, alongside a customized NVDA."]],"d":["bnclassic","bnpk","bnmp","bnmpqt","vnclassic","vnmp","vnapex","bnapex","bnapex18","bntouch","bntp","evolve","dbc","monarch","bi40x"],"src":["http://therangerstation.blogspot.com/2008/05/press-release-humanware-releases.html","http://www.nfbnet.org/pipermail/nfbwatlk_nfbnet.org/2009-January/000811.html","http://www.nfbnet.org/pipermail/nfbcs_nfbnet.org/2009-July/001125.html","https://www.mail-archive.com/ ookshare API 2.0, switching between text and audio in dual-format books, moving all podcasts to SD, and many bug fixes."],["Stream 3 v1.6","February 2026","Experimental eBraille support (back-translated and read aloud)."],["Stream 3 v1.7","September 23, 2026","eSpeak NG alongside Acapela (up to 4 voices), NLS BARD 2, skippable DAISY 2 elements, larger text files, looping and play-all highlight bookmarks, bookshelf search, and Bluetooth device battery reporting."]],"d":["vrs1","vrs2","vrs3","trek"],"src":["http://nfbnet.org/pipermail/nfbcs_nfbnet.org/2009-March/000628.html","https://www.humanware.com/news/stream-3-evolves/","https://www.braillists.org/uncategorised/the-victor-reader-stream-3-now-supports-ebraille/","https://milled.com/humanware-uk/stream-3-version-1-7-new-voices-new-languages-Kt8Q3AENeTWOm1mU"]},{"id":"android","n":"Android (on blindness devices)","co":"google","h":"Google's mobile OS, used by braille notetakers and magnifiers from 2016.","v":[["Android 4.4","2016","BrailleNote Touch."],["Android 5.1.1","2017","BrailleSense Polaris."],["Android 8.1","2019","BrailleNote Touch Plus."],["Android 10 (later 12)","2021","BrailleSense 6."],["Android 12","2024","Braille eMotion; current Connect 12 tablet."],["Android (version not stated in the sources cited)","2024","Monarch."],["Android 15","2026","BrailleSense 7."]],"d":["bntouch","polaris","polmini","bntp","bs6","bs6mini","emotion","connect12","monarch","bs7","bplus18"],"src":["https://www.humanware.com/microsite/bntouch/specs.php","https://www.himsintl.com/en/company/prd_history.php"]},{"id":"linuxdev","n":"Linux (on blindness devices)","co":"linuxcommunity","h":"Linux-based devices and accessible distributions.","v":[["Linux (StrongARM)","2001","Papenmeier ELBA."],["Linux 2.6.18","2006 to 2007","LevelStar Icon and APH Braille+."],["Arch Linux base","2020s","Jenux."],["Ubuntu MATE 22.04 / 24.04","2020s","Accessible-Coconut."]],"d":["elba","icon","brplus","jenux","coconut","vinux","sonar","talkingarch","oralux","adriane"],"src":["https://linuxdevices.org/device-profile-levelstar-icon-pda-for-visually-impaired-users/index.html","https://github.com/zendalona/accessible-coconut"]},{"id":"jawsv","n":"JAWS versions","co":"fs","h":"JAWS release history and Windows support by version. Freedom Scientific releases a new major version around the end of October each year.","v":[["JAWS for DOS","1989","First JAWS, from Henter-Joyce (founded 1985)."],["JFW 1.0","January 1995","First Windows version; Windows 3.1 and Windows for Workgroups 3.11."],["2.0","About 1996","Windows 95 support."],["4.0","September 14, 2001","Many user interface changes; an optional tutor and access-key help."],["4.5","August 30, 2002","Quick navigation keys for web pages."],["JAWS for Pocket PC","2002 to 2003","On PAC Mate."],["5.0","October 9, 2003","Big improvements to Internet support; Speech and Sounds Manager to indicate fonts, controls and web elements by voice or sound."],["6.0","March 3, 2005","Internet licensing; separate user settings; a demo of FSReader, Freedom Scientific's DAISY reader, for training material."],["7.0","October 14, 2005","Runs from a thumb drive; Firefox support; dropped Windows 95."],["7.1","June 21, 2006","Automatic updates; DOM-based web engine."],["8.0","November 17, 2006","RealSpeak Solo voices; Windows Vista; dropped Windows 98 and ME."],["9.0","November 19, 2007","HTML composition support (for example, writing HTML email); new Adjust JAWS Options dialog."],["10.0","November 3, 2008","JAWS Tandem for remote access to another computer running JAWS; support for iTunes 8 and the iTunes Store."],["11.0","October 23, 2009","Research It (definitions, weather, sports scores); shipped on DVD with the full FSReader 2.0."],["12.0","October 21, 2010","Settings Center, virtual ribbon, ARIA improvements."],["13.0","October 24, 2011","Built-in OCR for on-screen graphics; Quick Settings replaced Adjust JAWS Options."],["14.0","October 22, 2012","Windows 8 support; Flexible Web."],["JAWS 15","November 2014 (per AT Observatory; Freedom Scientific's own date list was not checked)","Touch cursor navigation and Windows 8 touch support, FSReader 3, Speech History and braille improvements. Last version for Windows XP."],["JAWS 17","Date not given in the sources cited for this history","Last version for Windows Vista."],["JAWS 18","2017","Free migration target for Window-Eyes 9 owners; Vocalizer Expressive 2.2 voices."],["JAWS 2018","October 2017","Year-based naming begins."],["Picture Smart","2019","Image description feature introduced."],["JAWS 2021","2020","Last version for Windows 7."],["JAWS 2022","2021","Minimum version for Windows 11 at its release."],["JAWS 2023","2022","Dropped 32-bit systems; first with ARM64 (Windows 11) support."],["JAWS 2024 March update","March 2024","Picture Smart AI."],["JAWS 2025","October 2024","FSCompanion AI assistant; minimum for Windows 11 25H2."],["JAWS 2026 (2026.2609.84)","September 2026 update","AI page explorer, AI graphic labeling on by default, Java Swing improvements, braille text-attribute indicators, EPUB improvements. Eloquence and Vocalizer Expressive included."]],"d":["jawsdos","jaws","pacmate","pacomni"],"req":["Current: Windows 11, 10 or Server 2025, 2022, 2019 or 2016; x64, plus ARM64 on Windows 11","2.0 GHz i5 dual-core; 16 GB RAM recommended; 2 GB disk, SSD recommended; DirectX 9 graphics (WDDM 1.0), 1024x768; sound card","Windows 7: JAWS 2021 or earlier","Windows Vista: JAWS 17 or earlier","Windows XP: JAWS 15 or earlier","JFW 1.0: Windows 3.1 or Windows for Workgroups 3.11"],"src":["https://support.freedomscientific.com/Downloads/JAWS/jaws-system-requirements","https://sastltd.zohodesk.eu/portal/en/kb/articles/jaws-zoomtext-fusion-and-windows-11-0","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/jaws-version-2026","https://support.freedomscientific.com/Downloads/jaws","https://www.liquisearch.com/jaws_screen_reader/release_history","https://en.wikipedia.org/wiki/JAWS_(screen_reader)","https://blog.freedomscientific.com/2024-year-end-review/","https://support.freedomscientific.com/Downloads/JAWS/JAWS-System-Requirements","http://www.liquisearch.com/jaws_screen_reader/release_history","https://www.tecnoaccesible.net/en/content/jaws-15"]},{"id":"nvdav","n":"NVDA versions","co":"nv","h":"NVDA release history. Michael Curran began NVDA in April 2006 and invited James Teh, who had just finished his IT degree; the two had met as children at a music camp for the blind. They founded the non-profit NV Access in early 2007. NVDA has been translated into more than 55 languages and used in more than 175 countries.","v":[["Development start","April 2006","Python-based with SAPI speech; supported Windows 2000 onward; basic web browsing."],["0.5","2007","First release under the NVDA name."],["0.6.x","2008 to 2009","Enhanced web browsing, more applications, braille display output, more languages."],["2009 releases","2009","64-bit Windows support."],["2011 releases","2011","Add-on restructuring; Windows 8 support."],["2012 releases","2012","Automatic updates, add-ons manager, touchscreen support."],["2013 releases","2013","PowerPoint support."],["2015 releases","2015","MathML through MathPlayer; Windows 10 and Edge."],["2017.3","2017","Last version to support Windows XP and Vista."],["2019.3","February 10, 2020","Released February 2020. Moved NVDA from Python 2 to Python 3 (breaking older add-ons), rewrote the speech framework, added Screen Curtain and Focus Highlight, 64-bit Java VM support and braille improvements."],["2024.1","2024","Minimum Windows 8.1; dropped Windows 7 and 8; built with Python 3.11."],["2025.1","2025","Built-in Remote Access, so one NVDA computer can control another (replacing the NVDA Remote add-on). Last line to support Windows 8.1 and 32-bit Windows."],["2026.1","2026","Minimum Windows 10 (1507); dropped Windows 8.1, Windows 10 on ARM and 32-bit Windows; 64-bit SAPI5 voices."],["2026.2","August 31, 2026","Requires 64-bit Windows 10 or 11."],["2026.3","October 26, 2026","Current release; Windows 11 ARM64 supported."]],"d":["nvda","evolve"],"req":["NVDA 2025.x: Windows 8.1, 10 or 11, 32- or 64-bit; about 500 MB storage.","NVDA 2026.1 and later: 64-bit Windows 10 or 11 only (Windows 10 22H2 or 11 recommended); no Windows 8.1, 32-bit Windows or Windows 10 on ARM; 500 MB storage; 4 GB RAM recommended.","NVDA 2017.3 was the last version for Windows XP and Vista."],"src":["https://en.wikipedia.org/wiki/NonVisual_Desktop_Access","https://download.nvaccess.org/documentation/en/userGuide.html","https://www.nvaccess.org/post/nvda-2019-3-released/","https://download.nvaccess.org/releases/2024.1/documentation/changes.html","https://download.nvaccess.org/releases/2026.1/documentation/en/changes.html","https://www.nvaccess.org/post/nvda-2026-3/","https://www.nvaccess.org/about-nv-access/","https://www.nvaccess.org/post/nvda-2019-3-released/","https://download.nvaccess.org/releases/2019.3/nvda_2019.3_changes.html","https://www.nvdacn.com/index.php/nvda-archive.html","https://api.nvaccess.org/releases/2025.1/documentation/en/userGuide.html","https://download.nvaccess.org/releases/2026.1/documentation/userGuide.html"]},{"id":"vov","n":"VoiceOver versions","co":"apple","h":"Milestones in Apple's VoiceOver.","v":[["Spoken Interface Preview","2003 to 2004","Preview for Mac OS X 10.3 Panther."],["Mac OS X 10.4 Tiger","2005","VoiceOver introduced."],["Mac OS X 10.5 Leopard","2007","Alex voice."],["iPod shuffle","2009","VoiceOver announces songs."],["iPhone 3GS / iOS 3","2009","VoiceOver on iOS."],["iOS 4","2010","Braille display support."],["iPod nano","September 2010","VoiceOver on iPod nano."],["Mac OS X 10.7 Lion","2011","Downloadable Nuance RealSpeak voices in many languages."],["iOS 8","2014","Braille Screen Input."],["2025 releases","2025","Braille Access."]],"d":["vomac","voios","mac_alex"],"src":["https://en.wikipedia.org/wiki/VoiceOver","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html"]},{"id":"talkbackv","n":"TalkBack and Android screen-reader milestones","co":"google","h":"TalkBack and Android screen-reader milestones, from Google's 2009 announcement and Wikipedia's release table.","v":[["TalkBack, SoundBack and KickBack","October 20, 2009","Released for Android 1.6 Donut's new accessibility API; trackball navigation; might need an Android Market install."],["Android 4.0","October 2011","TalkBack added to the system."],["Android 4.1","2012","Single-finger gestures."],["BrailleBack","2012","Braille display support."],["5.2","April 2017","Verbosity settings; Select to Speak."],["6.1","Early 2018","Language switching."],["6.2","June 2018","Renamed Android Accessibility Suite."],["7.2","November 2018","Changes not listed in the sources cited for this history"],["7.3","March 2019","Screen search."],["8.2","April 2020","Braille keyboard."],["Android 11 / One UI 3.0","2020","Multi-finger gestures on Pixel and Samsung; Samsung Voice Assistant discontinued in favor of Samsung TalkBack."],["9.1","February 2021","Multi-finger gestures and a new menu."],["12.1","September 2021","Image text captions."],["Android 12","2021","Multi-finger gestures on more devices."],["Android 13","2022","Built-in braille display support in TalkBack."],["17.1","September 17, 2026","Requires Android 9 or later."]],"d":["talkback","samsungva"],"src":["https://accessibleandroid.com/a-decade-with-android-highlighting-observations-and-shifts/","https://accessibleandroid.com/opinion-why-samsung-google-talkback-separation-is-nothing-but-a-headache/","https://opensource.googleblog.com/2009/10/talkback-open-source-screenreader-for.html","https://en.wikipedia.org/wiki/TalkBack"],"req":["TalkBack 17.1: Android 9 or later","2009: Android 1.6"]},{"id":"narv","n":"Narrator versions","co":"ms","h":"Milestones in Microsoft Narrator.","v":[["Windows 2000","February 17, 2000","Narrator debuts, speaking with Microsoft Sam."],["Windows Vista / 7","2007 / 2009","Default
