icom Corporation made the Accent line: the external Accent SA, which connects over a serial port, and the full-length ISA Accent PC card. The Accent was established by fall 1992, when Artic made its new TransPort synthesizer able to emulate the external Accent so that screen readers already supporting it could use the TransPort. Users remember the Accent PC as the fastest of the ISA speech boards, though they found its speech less accurate and understandable than DoubleTalk's. In April 2005 a user on the JAWS mailing list wrote that Aicom had closed and that he had bought its last 12 Accent SAs and 30 Accent PC cards. Users at the time reported that JAWS 5 and later no longer drove the SA properly. Some blind Linux users kept the SA in service, though in 2005 an Emacspeak user found it unsupported there."},{"id":"kngold","n":"Keynote Gold","co":"pulse","cat":"Speech Synthesizers","yr":2001,"y":"In production by 2001","o":"Pulse Data's synthesizer, built on a custom 12-pole LPC chip. It was the speech in early BrailleNotes.","s":{"syn":"LPC (linear predictive coding)"},"src":["https://afb.org/aw/2/4/15017","https://github.com/cullen-gallagher/BestSpeechForMac","http://qcsalon.net/en/forum32/topic107910","https://bluegrasspals.com/pipermail/dectalk/2022-September/005776.html"],"h":" Keynote Gold was the speech built into Pulse Data International's products in New Zealand, including early BrailleNotes running KeySoft. Users and developers identify its voice as BestSpeech, a formant text-to-speech engine from Berkeley Speech Technologies. A Spanish-language user forum says Dr. Michael O'Malley created BestSpeech in 1987 and that Pulse Data licensed it and renamed it Keynote Gold, with the 2009 BrailleNote Apex as the last product to use it; those details come from the forum, not from HumanWare. The software form of the engine survives as b32_tts.dll, a 32-bit Windows file dated 1995, and a hobby project on GitHub runs that file unchanged in an emulator so Keynote Gold's voice can serve as a macOS system voice with VoiceOver. A 2022 post on the DECtalk mailing list recalls that KeySoft could also use DECtalk as an alternative to Keynote Gold."},{"id":"apollo","n":"Dolphin Apollo","co":"dolphin","cat":"Speech Synthesizers","yr":0,"y":"A hardware speech synthesizer from Dolphin's DOS-era range, alongside Hal for DOS. No release year was found in Wikipedia's list of screen readers or on Dolphin's site.","o":"Dolphin's hardware synthesizer, often paired with Hal.","src":["https://en.wikipedia.org/wiki/List_of_screen_readers","https://www.prweb.com/releases/dolphin_computer_access_celebrate_their_30th_anniversary_launching_an_accessible_ios_reading_app_for_blind_low_vision_dyslexic_readers/prweb14405612.htm"],"h":" Dolphin built the Apollo hardware speech synthesizer as the voice for its Hal for DOS screen reader. Dolphin says the combination was available in more than 30 languages."},{"id":"votraxvoice","n":"Votrax SC-01 phoneme voice","co":"votrax","cat":"TTS Voices","yr":1980,"y":"1980s","o":"The phoneme-based voice of Votrax products and the voice of the first-generation Kurzweil Reading Machine.","h":"Votrax (founded 1971, a Federal Screw Works division) produced phoneme synthesizers. The SC-01 chip was used in the Type 'N Talk (1980). Votrax began in 1971 as a division of Federal Screw Works in the Detroit area. It took its name in 1974 from its first commercial product, the VS4 'Votrax', and became the independent Votrax International in 1980. The SC-01 chip (1980) put a whole phoneme synthesizer on a single integrated circuit. The SC-01-A (1981) was used in the Type 'N Talk and the Personal Speech System, as well as arcade games such as Wizard of Wor and Gottlieb pinball machines. It was succeeded by the SC-02, made by Silicon Systems as the SSI-263P, which became the voice of Artic's SynPhonix cards. A Votrax synthesizer was also part of the first Kurzweil Reading Machine.","s":{"syn":"Phoneme-based (formant-style hardware)","plat":"Votrax hardware","def":"Type 'N Talk, Personal Speech System, Kurzweil Reading Machine (1st generation)"},"src":["https://en.wikipedia.org/wiki/Votrax"]},{"id":"dt_paul","n":"DECtalk Perfect Paul","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984 to present (via DECtalk software)","o":"The standard male DECtalk voice and the factory default.","h":"Created from Dennis Klatt's MITalk/Klattalk formant synthesis-by-rule research and commercialized by DEC in 1984. Voices are selected with [:np]. DECtalk passed to Fonix, and Fonix DECtalk was used by Code Factory's Mobile Speak. In the DECtalk Software reference (2001, Force Computers), Paul is described as the 'default male voice' and is chosen with the in-line command [:name PAUL] or [:np]. The Speak applet gives it local names: Pablo in Spanish, Paul in German and Oliver in French. Its stock settings include an average pitch of 122 Hz, a head size of 100%, breathiness of 0 dB and a pitch range of 100%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant (Klatt synthesis by rule)","plat":"DECtalk hardware (DTC01, Express), DECtalk Software for Windows NT and others","def":"DECtalk DTC01 (factory default)"},"src":["https://en.wikipedia.org/wiki/DECtalk","https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://afb.org/aw/8/1/14407","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"dt_betty","n":"DECtalk Beautiful Betty","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984","o":"The standard female DECtalk voice, selected with [:nb].","h":"One of DECtalk's nine built-in voices. Voice parameters such as throat size were editable. In the DECtalk Software reference (2001, Force Computers), Betty is described as the 'full female voice' and is chosen with the in-line command [:name BETTY] or [:nb]. The Speak applet gives it local names: Berta in Spanish, Beate in German and Marjolaine in French. Its stock settings include an average pitch of 208 Hz, a head size of 100%, breathiness of 0 dB and a pitch range of 240%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant","plat":"DECtalk hardware and software","def":"Not a default (Perfect Paul is DECtalk's factory default)"},"src":["https://en.wikipedia.org/wiki/DECtalk","https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"dt_harry","n":"DECtalk Huge Harry","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984","o":"The deep male DECtalk voice, selected with [:nh].","h":"One of DECtalk's nine built-in voices. In the DECtalk Software reference (2001, Force Computers), Harry is described as the 'full male voice' and is chosen with the in-line command [:name HARRY] or [:nh]. The Speak applet gives it local names: Humberto in Spanish, Hans in German and Michel in French. Its stock settings include an average pitch of 89 Hz, a head size of 115%, breathiness of 0 dB and a pitch range of 80%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant","plat":"DECtalk hardware and software","def":"Not a default (Perfect Paul is DECtalk's factory default)"},"src":["https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://en.wikipedia.org/wiki/DECtalk","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"dt_frank","n":"DECtalk Frail Frank","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984","o":"The older male DECtalk voice, selected with [:nf].","h":"One of DECtalk's nine built-in voices. In the DECtalk Software reference (2001, Force Computers), Frank is described as the 'aged male voice' and is chosen with the in-line command [:name FRANK] or [:nf]. The Speak applet gives it local names: Francisco in Spanish, Frank in German and François in French. Its stock settings include an average pitch of 155 Hz, a head size of 90%, breathiness of 50 dB and a pitch range of 90%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant","plat":"DECtalk","def":"Not a default (Perfect Paul is DECtalk's factory default)"},"src":["https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://en.wikipedia.org/wiki/DECtalk","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"dt_kit","n":"DECtalk Kit the Kid","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984","o":"A child's voice (about 10 years old), selected with [:nk].","h":"One of DECtalk's nine built-in voices. In the DECtalk Software reference (2001, Force Computers), Kit is described as the 'child's voice' and is chosen with the in-line command [:name KIT] or [:nk]. The Speak applet gives it local names: Juanito in Spanish, Karsten in German and Sébastien in French. Its stock settings include an average pitch of 306 Hz, a head size of 80%, breathiness of 47 dB and a pitch range of 210%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant","plat":"DECtalk","def":"Not a default (Perfect Paul is DECtalk's factory default)"},"src":["https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://en.wikipedia.org/wiki/DECtalk","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"dt_rita","n":"DECtalk Rough Rita","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984","o":"The deep female DECtalk voice, selected with [:nr].","h":"One of DECtalk's nine built-in voices. In the DECtalk Software reference (2001, Force Computers), Rita is described as the 'female voice' and is chosen with the in-line command [:name RITA] or [:nr]. The Speak applet gives it local names: Rita in Spanish, Rita in German and Jacqueline in French. Its stock settings include an average pitch of 106 Hz, a head size of 95%, breathiness of 46 dB and a pitch range of 80%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant","plat":"DECtalk","def":"Not a default (Perfect Paul is DECtalk's factory default)"},"src":["https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://en.wikipedia.org/wiki/DECtalk","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"dt_ursula","n":"DECtalk Uppity Ursula","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984","o":"The light female DECtalk voice, selected with [:nu].","h":"One of DECtalk's nine built-in voices. In the DECtalk Software reference (2001, Force Computers), Ursula is described as the 'aged female voice' and is chosen with the in-line command [:name URSULA] or [:nu]. The Speak applet gives it local names: Úrsula in Spanish, Ursula in German and Angèle in French. Its stock settings include an average pitch of 240 Hz, a head size of 95%, breathiness of 0 dB and a pitch range of 135%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant","plat":"DECtalk","def":"Not a default (Perfect Paul is DECtalk's factory default)"},"src":["https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://en.wikipedia.org/wiki/DECtalk","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"dt_dennis","n":"DECtalk Doctor Dennis","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984","o":"The breathy male DECtalk voice, selected with [:nd].","h":"One of DECtalk's nine built-in voices. Its name nods to Dennis Klatt. In the DECtalk Software reference (2001, Force Computers), Dennis is described as the 'male voice' and is chosen with the in-line command [:name DENNIS] or [:nd]. The Speak applet gives it local names: Domingo in Spanish, Dieter in German and Joël in French. Its stock settings include an average pitch of 110 Hz, a head size of 105%, breathiness of 38 dB and a pitch range of 135%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant","plat":"DECtalk","def":"Not a default (Perfect Paul is DECtalk's factory default)"},"src":["https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://en.wikipedia.org/wiki/DECtalk","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"dt_wendy","n":"DECtalk Whispering Wendy","co":"dec","cat":"TTS Voices","yr":1984,"y":"1984","o":"The whispery female DECtalk voice, selected with [:nw].","h":"One of DECtalk's nine built-in voices. In the DECtalk Software reference (2001, Force Computers), Wendy is described as the 'whispering female voice' and is chosen with the in-line command [:name WENDY] or [:nw]. The Speak applet gives it local names: Wendy in Spanish, Wendy in German and Nadia in French. Its stock settings include an average pitch of 200 Hz, a head size of 100%, breathiness of 55 dB and a pitch range of 175%. Any voice can be reshaped with the Design Voice [:dv] command, and changes can be saved as a tenth voice, Val.","s":{"syn":"Formant","plat":"DECtalk","def":"Not a default (Perfect Paul is DECtalk's factory default)"},"src":["https://dectalk.nu/Artists/Jayson%20Smith/Text/sample.txt","https://en.wikipedia.org/wiki/DECtalk","https://dectalk.github.io/dectalk/idh_ref_1_voice_selection_voice.htm","https://dectalk.github.io/dectalk/idh_sdk_3_definitions_of_dectalk_software_voices.htm","https://dectalk.github.io/dectalk/idh_sdk_3_design_voice_dv.htm"]},{"id":"eti","n":"ETI-Eloquence (engine)","co":"eti","cat":"TTS Voices","yr":1990,"y":"1990s to present","o":"A rule-based formant synthesizer known for clarity at high speech rates. It has long shipped with JAWS and many notetakers.","h":"Developed at Eloquent Technology (founded 1983 by Susan R. Hertz) using the Delta rule system and a Klatt-style formant synthesizer. Extended from General American English to nine more languages in the late 1990s. Sold to SpeechWorks in January 2001, which later became part of Nuance. Code Factory sells an Android port (Android 7 or later, 10 languages, 8 voices). JAWS 2026 includes Eloquence and Vocalizer Expressive.","s":{"syn":"Formant (rule-based, Delta system)","plat":"Windows, Solaris, SunOS, SGI and RS/6000 (1990s); Windows CE notetakers; Symbian (TALKS); Android (Code Factory)","def":"PAC Mate, BrailleSense U2, Nuance TALKS; included with JAWS"},"src":["https://www.synfonicaspeech.com/about","http://mi.eng.cam.ac.uk/comp.speech/Section5/Synth/eloquence.html","https://play.google.com/store/apps/details?hl=en_US&id=com.codefactoryglobal.eloquencetts","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/jaws-version-2026"]},{"id":"el_reed","n":"Eloquence Reed","co":"eti","cat":"TTS Voices","yr":1995,"y":"1995 (ETI-Eloquence introduced)","o":"The first of Eloquence's eight classic voice presets (voice 0) and the familiar default male voice.","h":"Part of the ETI-Eloquence voice set. Code Factory's Android version still lists it. Eloquence, the default speech in JAWS, came to Apple devices with iOS 16 (public release September 12, 2022), in both U.S. and U.K. English, as one of eight voices: Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy and Shelley. AppleVis noted that many users like Eloquence for its fast response and predictable, comparatively robotic sound, which can be easier to follow at high rates. iOS 17 added per-voice settings for Eloquence: rate multiplier, head size, pitch, pitch range, breathiness and roughness, plus a higher sampling rate, phrase prediction, an abbreviation dictionary and a community pronunciation dictionary.","s":{"syn":"Formant","plat":"Wherever Eloquence runs","def":"Default JAWS voice"},"src":["https://github.com/Mudb0y/eloquence","https://play.google.com/store/apps/details?hl=en_US&id=com.codefactoryglobal.eloquencetts","http://qcsalon.net/en/forum32/topic40905p74","https://www.thisisgain.com/post/how-to-configure-jaws-individual-voice-settings","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16","https://www.applevis.com/blog/whats-new-ios-16-accessibility-blind-deafblind-users","https://www.applevis.com/blog/whats-new-ios-17-accessibility-blind-deaf-blind-users"]},{"id":"el_shelley","n":"Eloquence Shelley","co":"eti","cat":"TTS Voices","yr":1995,"y":"1995 (ETI-Eloquence introduced)","o":"An Eloquence female voice preset (voice 1). Code Factory spells it Shelly.","h":"Part of the ETI-Eloquence voice set. Eloquence, the default speech in JAWS, came to Apple devices with iOS 16 (public release September 12, 2022), in both U.S. and U.K. English, as one of eight voices: Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy and Shelley. AppleVis noted that many users like Eloquence for its fast response and predictable, comparatively robotic sound, which can be easier to follow at high rates. iOS 17 added per-voice settings for Eloquence: rate multiplier, head size, pitch, pitch range, breathiness and roughness, plus a higher sampling rate, phrase prediction, an abbreviation dictionary and a community pronunciation dictionary.","s":{"syn":"Formant","plat":"Wherever Eloquence runs","def":"Not a default (Reed is the default Eloquence voice in JAWS)"},"src":["https://github.com/Mudb0y/eloquence","http://qcsalon.net/en/forum32/topic40905p74","https://www.thisisgain.com/post/how-to-configure-jaws-individual-voice-settings","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16","https://www.applevis.com/blog/whats-new-ios-16-accessibility-blind-deafblind-users","https://www.applevis.com/blog/whats-new-ios-17-accessibility-blind-deaf-blind-users"]},{"id":"el_bobby","n":"Eloquence Bobby","co":"eti","cat":"TTS Voices","yr":1995,"y":"1995 (ETI-Eloquence introduced)","o":"An Eloquence child voice preset (voice 2).","h":"Part of the ETI-Eloquence voice set. Bobby was not among the eight Eloquence voices Apple added in iOS 16 (Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy and Shelley).","s":{"syn":"Formant","plat":"Wherever Eloquence runs","def":"Not a default (Reed is the default Eloquence voice in JAWS)"},"src":["https://github.com/Mudb0y/eloquence","http://qcsalon.net/en/forum32/topic40905p74","https://www.thisisgain.com/post/how-to-configure-jaws-individual-voice-settings","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16"]},{"id":"el_rocko","n":"Eloquence Rocko","co":"eti","cat":"TTS Voices","yr":1995,"y":"1995 (ETI-Eloquence introduced)","o":"An Eloquence voice preset (voice 3).","h":"Part of the ETI-Eloquence voice set. Eloquence, the default speech in JAWS, came to Apple devices with iOS 16 (public release September 12, 2022), in both U.S. and U.K. English, as one of eight voices: Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy and Shelley. AppleVis noted that many users like Eloquence for its fast response and predictable, comparatively robotic sound, which can be easier to follow at high rates. iOS 17 added per-voice settings for Eloquence: rate multiplier, head size, pitch, pitch range, breathiness and roughness, plus a higher sampling rate, phrase prediction, an abbreviation dictionary and a community pronunciation dictionary.","s":{"syn":"Formant","plat":"Wherever Eloquence runs","def":"Not a default (Reed is the default Eloquence voice in JAWS)"},"src":["https://github.com/Mudb0y/eloquence","http://qcsalon.net/en/forum32/topic40905p74","https://www.thisisgain.com/post/how-to-configure-jaws-individual-voice-settings","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16","https://www.applevis.com/blog/whats-new-ios-16-accessibility-blind-deafblind-users","https://www.applevis.com/blog/whats-new-ios-17-accessibility-blind-deaf-blind-users"]},{"id":"el_glen","n":"Eloquence Glen","co":"eti","cat":"TTS Voices","yr":1995,"y":"1995 (ETI-Eloquence introduced)","o":"An Eloquence voice preset (voice 4).","h":"Part of the ETI-Eloquence voice set. Glen was not among the eight Eloquence voices Apple added in iOS 16 (Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy and Shelley). AppleVis listeners hoped it would come later.","s":{"syn":"Formant","plat":"Wherever Eloquence runs","def":"Default JAWS voice"},"src":["https://github.com/Mudb0y/eloquence","http://qcsalon.net/en/forum32/topic40905p74","https://www.thisisgain.com/post/how-to-configure-jaws-individual-voice-settings","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16"]},{"id":"el_sandy","n":"Eloquence Sandy","co":"eti","cat":"TTS Voices","yr":1995,"y":"1995 (ETI-Eloquence introduced)","o":"An Eloquence voice preset (voice 5).","h":"Part of the ETI-Eloquence voice set. Eloquence, the default speech in JAWS, came to Apple devices with iOS 16 (public release September 12, 2022), in both U.S. and U.K. English, as one of eight voices: Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy and Shelley. AppleVis noted that many users like Eloquence for its fast response and predictable, comparatively robotic sound, which can be easier to follow at high rates. iOS 17 added per-voice settings for Eloquence: rate multiplier, head size, pitch, pitch range, breathiness and roughness, plus a higher sampling rate, phrase prediction, an abbreviation dictionary and a community pronunciation dictionary.","s":{"syn":"Formant","plat":"Wherever Eloquence runs","def":"Not a default (Reed is the default Eloquence voice in JAWS)"},"src":["https://github.com/Mudb0y/eloquence","http://qcsalon.net/en/forum32/topic40905p74","https://www.thisisgain.com/post/how-to-configure-jaws-individual-voice-settings","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16","https://www.applevis.com/blog/whats-new-ios-16-accessibility-blind-deafblind-users","https://www.applevis.com/blog/whats-new-ios-17-accessibility-blind-deaf-blind-users"]},{"id":"el_grandma","n":"Eloquence Grandma","co":"eti","cat":"TTS Voices","yr":1995,"y":"1995 (ETI-Eloquence introduced)","o":"An older female Eloquence preset (voice 6).","h":"Part of the ETI-Eloquence voice set. Eloquence, the default speech in JAWS, came to Apple devices with iOS 16 (public release September 12, 2022), in both U.S. and U.K. English, as one of eight voices: Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy and Shelley. AppleVis noted that many users like Eloquence for its fast response and predictable, comparatively robotic sound, which can be easier to follow at high rates. iOS 17 added per-voice settings for Eloquence: rate multiplier, head size, pitch, pitch range, breathiness and roughness, plus a higher sampling rate, phrase prediction, an abbreviation dictionary and a community pronunciation dictionary.","s":{"syn":"Formant","plat":"Wherever Eloquence runs","def":"Not a default (Reed is the default Eloquence voice in JAWS)"},"src":["https://github.com/Mudb0y/eloquence","http://qcsalon.net/en/forum32/topic40905p74","https://www.thisisgain.com/post/how-to-configure-jaws-individual-voice-settings","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16","https://www.applevis.com/blog/whats-new-ios-16-accessibility-blind-deafblind-users","https://www.applevis.com/blog/whats-new-ios-17-accessibility-blind-deaf-blind-users"]},{"id":"el_grandpa","n":"Eloquence Grandpa","co":"eti","cat":"TTS Voices","yr":1995,"y":"1995 (ETI-Eloquence introduced)","o":"An older male Eloquence preset (voice 7).","h":"Part of the ETI-Eloquence voice set. Eloquence, the default speech in JAWS, came to Apple devices with iOS 16 (public release September 12, 2022), in both U.S. and U.K. English, as one of eight voices: Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy and Shelley. AppleVis noted that many users like Eloquence for its fast response and predictable, comparatively robotic sound, which can be easier to follow at high rates. iOS 17 added per-voice settings for Eloquence: rate multiplier, head size, pitch, pitch range, breathiness and roughness, plus a higher sampling rate, phrase prediction, an abbreviation dictionary and a community pronunciation dictionary.","s":{"syn":"Formant","plat":"Wherever Eloquence runs","def":"Not a default (Reed is the default Eloquence voice in JAWS)"},"src":["https://github.com/Mudb0y/eloquence","http://qcsalon.net/en/forum32/topic40905p74","https://www.thisisgain.com/post/how-to-configure-jaws-individual-voice-settings","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16","https://www.applevis.com/blog/whats-new-ios-16-accessibility-blind-deafblind-users","https://www.applevis.com/blog/whats-new-ios-17-accessibility-blind-deaf-blind-users"]},{"id":"ms_sam","n":"Microsoft Sam","co":"ms","cat":"TTS Voices","yr":2000,"y":"2000 (Windows 2000) to Windows XP","o":"The default English male voice of Windows 2000 and XP, used by Narrator.","h":"Released in SAPI 4 and SAPI 5 versions, which differ in pronunciation. Windows Vista and 7 replaced it with Microsoft Anna. The SAPI 5 version can still be installed on later Windows through the SAPI 5.1 SDK. SAPI 4 versions of Sam, Mike and Mary (SAPI 4.0 dates from 1998) and SAPI 5 versions (SAPI 5.1 shipped with Windows XP) differ in speech patterns, pronunciation and some words. Sam's SAPI 5 version has a known 'soy/soi' glitch. Redistributable SAPI 4 versions were offered for Windows 9x but are no longer on Microsoft's site; programs such as Speakonia and TTSReader still run them on XP, Vista and later. Microsoft's 2006 Vista article had Sam say 'Anna will make me redundant'. Windows Vista and 7 shipped no male voice.","s":{"syn":"Concatenative (Microsoft Research Whistler engine with unit selection and LPC vocoder)","plat":"Windows 2000 and XP (SAPI 4 and 5)","def":"Windows 2000 and XP; Narrator"},"suc":["ms_anna"],"src":["https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices","https://learn.microsoft.com/en-us/archive/blogs/speech/speech-api-and-engine-availability","https://www.microsoft.com/en-us/research/project/whistler-text-to-speech-engine/","https://learn.microsoft.com/en-us/archive/msdn-magazine/2006/january/exploring-speech-recognition-and-synthesis-apis-in-windows-vista","https://github.com/LouisGameDev/Microsoft-Sam-Mary-Mike-TruVoice-WSAPI4"]},{"id":"ms_mike","n":"Microsoft Mike","co":"ms","cat":"TTS Voices","yr":2000,"y":"Windows 2000 / XP era","o":"An optional male voice, downloadable for Windows 2000 and XP.","h":"SAPI 5 versions were distributed as a Merge Module and installed by apps such as Microsoft Reader. It does not work on Windows 7 without third-party software. Mike existed in SAPI 4 and SAPI 5 forms that sound different. The SAPI 5.1 SDK installs the SAPI 5 Mike, Mary and Sam on Windows NT 4.0 SP6a and Windows 98 onward, and on Vista and later. The SAPI 4 Mike runs on later Windows through third-party programs such as Speakonia.","s":{"syn":"Concatenative (Microsoft Research Whistler engine with unit selection and LPC vocoder)","plat":"Windows (SAPI 4 and 5)","def":"None (optional download)"},"src":["https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices","https://www.microsoft.com/en-us/research/project/whistler-text-to-speech-engine/","https://github.com/LouisGameDev/Microsoft-Sam-Mary-Mike-TruVoice-WSAPI4"]},{"id":"ms_mary","n":"Microsoft Mary","co":"ms","cat":"TTS Voices","yr":2000,"y":"Windows 2000 / XP era","o":"An optional female voice, downloadable for Windows 2000 and XP.","h":"Distributed the same way as Microsoft Mike. Mary is Microsoft's optional female voice for Windows 2000 and XP. Its SAPI 5 version was distributed as a Merge Module and installed by apps such as Microsoft Reader; the SAPI 4 version differs in pronunciation. Michael and Michelle, licensed from Lernout & Hauspie, came with Office XP, Office 2003 and Microsoft Reader as other optional voices.","s":{"syn":"Concatenative (Microsoft Research Whistler engine with unit selection and LPC vocoder)","plat":"Windows (SAPI 4 and 5)","def":"None (optional download)"},"src":["https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices","https://www.microsoft.com/en-us/research/project/whistler-text-to-speech-engine/","https://github.com/LouisGameDev/Microsoft-Sam-Mary-Mike-TruVoice-WSAPI4"]},{"id":"ms_anna","n":"Microsoft Anna","co":"ms","cat":"TTS Voices","yr":2007,"y":"Windows Vista (2007) and Windows 7","o":"A SAPI 5-only female voice designed to sound more natural than Sam. It was the default English voice in Vista and Windows 7.","h":"Microsoft Streets & Trips 2006 and later installed it on Windows XP. Vista and 7 shipped no male voice. Anna became the default English voice in Windows Vista and Windows 7. She is a SAPI 5-only voice designed to sound more natural than Microsoft Sam, and Microsoft Streets & Trips 2006 and later installed her on Windows XP for spoken directions. No male voice shipped with Vista or 7. Windows 8 brought David, Zira and Hazel as more natural-sounding successors.","s":{"syn":"Concatenative: selects and splices segments from hours of recorded speech (Microsoft, 2006)","plat":"Windows Vista and 7 (SAPI 5.3)","def":"Windows Vista and Windows 7"},"pre":["ms_sam"],"suc":["ms_david","ms_zira"],"src":["https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices","https://learn.microsoft.com/en-us/archive/msdn-magazine/2006/january/exploring-speech-recognition-and-synthesis-apis-in-windows-vista"]},{"id":"ms_david","n":"Microsoft David","co":"ms","cat":"TTS Voices","yr":2012,"y":"Windows 8 (2012) to present","o":"A US English male voice.","h":"Introduced with Windows 8. It remains in Windows 10 and 11 and is listed as a Narrator voice. David (U.S. male) was one of three new desktop voices in Windows 8, with Zira and Hazel, meant to sound more natural than Anna. Server versions were available through the Microsoft Speech Platform for older Windows. In Windows 11 the Windows 10 voices were reclassed as 'legacy voices', but David remained the default voice for the desktop.","s":{"syn":"Microsoft does not publish the technique. Microsoft lists this as a standard Windows TTS voice, which Windows 11 calls a 'legacy voice', as distinct from the newer neural 'natural voices'.","plat":"Windows 8, 8.1, 10 and 11","def":"Windows 8 and later (US English)"},"pre":["ms_anna"],"src":["https://github.com/MicrosoftDocs/winrt-api/blob/docs/windows.media.speechsynthesis/voiceinformation.md","https://support.microsoft.com/en-us/accessibility/windows/narrator/appendix-a-supported-languages-and-voices","https://support.microsoft.com/en-us/windows/appendix-a-supported-languages-and-voices-4486e345-7730-53da-fcfe-55cc64300f01","https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices"]},{"id":"ms_zira","n":"Microsoft Zira","co":"ms","cat":"TTS Voices","yr":2012,"y":"Windows 8 to present","o":"A US English female voice.","h":"Introduced with Windows 8 and still a Narrator voice in Windows 10 and 11. Zira (U.S. female) arrived with David and Hazel in Windows 8. In Windows 10, Microsoft's mobile voices Mark and Zira, the same as on Windows Phone 8, 8.1 and Windows 10 Mobile, became available on the desktop. Windows 11 reclassed the Windows 10 voices as 'legacy voices' and added Azure 'natural voices' (Aria, Jenny and Guy) for Narrator starting with version 22H2.","s":{"syn":"Microsoft does not publish the technique. Microsoft lists this as a standard Windows TTS voice, which Windows 11 calls a 'legacy voice', as distinct from the newer neural 'natural voices'.","plat":"Windows 8 and later","def":"Windows 8 and later"},"pre":["ms_anna"],"src":["https://github.com/MicrosoftDocs/winrt-api/blob/docs/windows.media.speechsynthesis/voiceinformation.md","https://support.microsoft.com/en-us/windows/appendix-a-supported-languages-and-voices-4486e345-7730-53da-fcfe-55cc64300f01","https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices"]},{"id":"ms_hazel","n":"Microsoft Hazel","co":"ms","cat":"TTS Voices","yr":2012,"y":"Windows 8 to present","o":"A UK English female voice.","h":"Introduced with Windows 8 and still a Narrator voice. Hazel (U.K. female) came with David and Zira in Windows 8 as a more natural-sounding voice than Anna. In Windows 10 she was removed from the U.S. English language pack. In Windows 8, David, Hazel and Zira were designed to sound more natural than Anna, the voice of Vista and Windows 7. Server versions of the same voices were available through the Microsoft Speech Platform for older versions of Windows.","s":{"syn":"Microsoft does not publish the technique. Microsoft lists this as a standard Windows TTS voice, which Windows 11 calls a 'legacy voice', as distinct from the newer neural 'natural voices'.","plat":"Windows 8 and later","def":"Windows 8 and later (UK English)"},"src":["https://github.com/MicrosoftDocs/winrt-api/blob/docs/windows.media.speechsynthesis/voiceinformation.md","https://support.microsoft.com/en-us/windows/appendix-a-supported-languages-and-voices-4486e345-7730-53da-fcfe-55cc64300f01","https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices"]},{"id":"ms_mark","n":"Microsoft Mark","co":"ms","cat":"TTS Voices","yr":2015,"y":"2015 (Windows 10)","o":"An additional US English male voice listed for Narrator in Windows 10 and 11.","s":{"syn":"Microsoft does not publish the technique. Microsoft lists this as a standard Windows TTS voice, which Windows 11 calls a 'legacy voice', as distinct from the newer neural 'natural voices'.","plat":"Windows 10 and 11","def":"Not a default; mobile voice added to the Windows 10 US English language pack (Windows Phone 8 and 10 Mobile voice)"},"src":["https://support.microsoft.com/en-us/accessibility/windows/narrator/appendix-a-supported-languages-and-voices","https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices","https://winaero.com/windows-10-features-new-text-to-speech-voices-for-narrator-and-cortana/","https://support.microsoft.com/en-us/windows/appendix-a-supported-languages-and-voices-4486e345-7730-53da-fcfe-55cc64300f01"],"h":" Mark and Zira are the Windows Phone 8, 8.1 and Windows 10 Mobile voices, made available on desktop Windows 10. Windows 11 reclassified them as 'legacy voices' after the Narrator natural voices arrived. With Windows 10, Microsoft tried to use the same speech voices across all its platforms. Mark is not the voice of Cortana; Cortana's organic responses used a hidden voice called Eva. Microsoft has updated the mobile voices through Windows updates to sound more natural than the originals."},{"id":"ms_george","n":"Microsoft George","co":"ms","cat":"TTS Voices","yr":2015,"y":"2015 (Windows 10 OneCore voice)","o":"A UK English male voice listed for Narrator.","s":{"syn":"Microsoft does not publish the technique. Microsoft lists this as a standard Windows TTS voice, which Windows 11 calls a 'legacy voice', as distinct from the newer neural 'natural voices'.","plat":"Windows 10 and 11","def":"Not the default for US English (Microsoft lists David and Mark as US male voices). George is the English (Great Britain) male voice, alongside Hazel and Susan."},"src":["https://support.microsoft.com/en-us/accessibility/windows/narrator/appendix-a-supported-languages-and-voices","https://en.wikipedia.org/wiki/Microsoft_text-to-speech_voices","https://support.microsoft.com/en-us/windows/appendix-a-supported-languages-and-voices-4486e345-7730-53da-fcfe-55cc64300f01"],"h":" Windows 10 made the mobile voice packs universal: each downloaded language pack adds one male and one female voice. Windows 11 calls these legacy voices. These mobile voices came from Windows Phone 8 and 8.1 and Windows 10 Mobile. Most desktop language packs had only female voices, but every mobile pack came as a male and female pair, so downloading a language added both. Microsoft has updated the mobile voices through Windows updates to sound more natural than the originals."},{"id":"mt1984","n":"MacinTalk (original)","co":"apple","cat":"TTS Voices","yr":1984,"y":"1984 (MacinTalk 1.1 May 1985)","o":"The Macintosh's original speech engine. The Mac used it to introduce itself in 1984 ('Hello. I'm Macintosh.').","h":"Written by Joseph Katz and Mark Barton, who later founded SoftVoice. It had two voices. Apple released MacinTalk 1.1 to developers in May 1985; the Macintosh Repository lists version 1.0.2 dated April 15, 1985, running on Mac OS 1 through 6. Apple notes the original 1984 voice is no longer available.","s":{"syn":"Rule-based, phonetic","plat":"Mac OS 1 to 6","def":"Original Macintosh (1984)"},"suc":["mt2","mtpro","mt3"],"src":["https://www.wap.org/journal/lionspeak/","https://preserve.mactech.com/articles/mactech/Vol.01/01.12/Talking/index.html","https://macintoshrepository.org/2590-macintalk","https://github.com/tgeczy/outspoken-nvda"]},{"id":"mt2","n":"MacinTalk 2","co":"apple","cat":"TTS Voices","yr":1992,"y":"1992 to 1994 (v1.2)","o":"A moderate-quality engine for low-end Macs (minimum a Mac Plus running System 6.0.7). Its ten voices were Ben, Boris, Brenda, Mariel, Marvin, Mr. Hughes, Otis, RoboVox, Votron and Xero.","h":"Shipped with Speech Manager 1.2.1. It was almost immediately made obsolete by MacinTalk 3. In 1994 Apple offered it as the low-end option of its free Speech Manager download. MacinTalk 2 (1.2) gave moderate-quality speech for Macs with little memory or processing power, and ran on System 6 on a Mac Plus. Speech Manager 1.2.1 included the Fred voice, the MacinTalk 2 extension added Marvin, and an extra voices file added nine more.","s":{"syn":"Concatenative (per a 1990s product survey)","plat":"System 6 and 7; about 150 KB of memory","def":"No default voice is named in the sources searched (CMU comp.speech FAQ and the Speech Manager notes). The ten voices were Ben, Boris, Brenda, Mariel, Marvin, Mr. Hughes, Otis, RoboVox, Votron and Xero."},"pre":["mt1984"],"suc":["mt3"],"src":["https://www.cs.cmu.edu/Groups/AI/util/pubs/faqs/speech/mac.txt","https://github.com/tgeczy/outspoken-nvda","http://piisami.net/dippa/appb.html"]},{"id":"mtpro","n":"MacinTalk Pro","co":"apple","cat":"TTS Voices","yr":1993,"y":"September 1993 (v1.0); v1.2 February 1994","o":"Apple's high-quality engine, with the voices Agnes, Bruce and Victoria in High Quality and Small versions.","h":"Required a 68020 or better (later surveys say 68040) and System 7. Described as the first concatenative Macintosh voices. A Mexican Spanish edition (Carlos and Catalina) was given away with PlainTalk 1.5 in 1996. In 1994, MacinTalk Pro 1.2 was a free download from Apple, installed by putting the voices in a Voices folder inside the Extensions folder. Joe Campbell rated it among the best text-to-speech he had heard, though he thought Bellcore's Orator might handle proper nouns better.","s":{"syn":"Concatenative","plat":"System 7 on 68020/68040 and PowerPC Macs; about 1.5 MB of memory","def":"No default voice is named in the sources searched. The voices were Agnes, Bruce and Victoria, each in High Quality and Small versions."},"pre":["mt1984"],"vo":["mac_agnes","mac_bruce","mac_victoria"],"src":["https://www.cs.cmu.edu/Groups/AI/util/pubs/faqs/speech/mac.txt","https://github.com/tgeczy/outspoken-nvda","https://macintoshrepository.org/2590-macintalk"]},{"id":"mt3","n":"MacinTalk 3","co":"apple","cat":"TTS Voices","yr":1994,"y":"1994 to 1995 (v1.4 in 1995); standard until Mac OS X","o":"Apple's text-to-speech standard in System 7, Mac OS 8 and Mac OS 9, with 19 voices including Fred, Kathy, Ralph, Junior, Princess and the novelty voices.","h":"The voices shipped with Speech Manager 1.2 in 1994. Each voice stored a joke phrase as its comment, revealed by the 1994 Talking Eggs utility. Fred later survived byte-identical into Mac OS X. One 1994 report said a Quadra was needed for smooth speech. René Ros's Talking Eggs utility (version 1.0, June 18, 1994) revealed that each MacinTalk III voice had an age and a joke phrase stored as its comment instead of a description. Fred's was \"I sure like being inside this fancy computer,\" Kathy's \"Isn't it nice to have a computer that will talk to you?\" and Zarvox's \"That looks like a peaceful planet.\"","s":{"syn":"Not described in the sources searched (CMU comp.speech FAQ, Speech Manager notes). The same survey labels MacinTalk 2 and MacinTalk Pro concatenative but gives no method for MacinTalk 3.","plat":"System 7, Mac OS 8 and 9 (68030 at 33 MHz, about 300 KB of memory)","def":"Mac OS 7 to 9 (Fred and others)"},"pre":["mt2"],"suc":["macosxspeech"],"vo":["mac_fred","mac_kathy","mac_ralph","mac_junior","mac_princess","mac_zarvox","mac_whisper","mac_bells","mac_boing","mac_bubbles","mac_cellos","mac_albert","mac_badnews","mac_goodnews","mac_trinoids","mac_hysterical","mac_pipeorgan","mac_deranged","mac_bahh"],"src":["https://macintoshrepository.org/2590-macintalk","https://discmaster.textfiles.com/view/21387/Macformat17.cdr/Shareware%20City/Sound/Talking%20Eggs%201.0/Talking%20Eggs%20ReadMe","https://github.com/tgeczy/outspoken-nvda"]},{"id":"macosxspeech","n":"Mac OS X Speech Synthesis (MacinTalk in OS X)","co":"apple","cat":"TTS Voices","yr":2001,"y":"Mac OS X (2001) onward","o":"The system speech in Mac OS X. It carried the classic MacinTalk voices forward, added Alex in 10.5 Leopard (2007), and added downloadable multilingual voices in 10.7 Lion (2011).","h":"Snow Leopard and Lion each showed six default voices, including Alex, Victoria, Bruce and Kathy. Lion added free downloadable English voices with Australian (Karen), Indian (Sangeeta), Irish (Moira), Scottish (Fiona), South African (Tessa), UK (Emily, Serena) and US (Jill, Samantha) accents. Text-to-speech has been part of every version of Mac OS X and macOS. In 10.3 Panther the Victoria voice was rebuilt as Vicki, nearly 20 times larger because of higher-quality diphone samples (Victoria was kept). Alex arrived in 10.5 Leopard. Lion added more English accents and 21 other languages. In macOS Big Sur 11.3, Apple removed gender references from every voice, at the same time as the Siri voice changes in iOS 14.5.","s":{"syn":"Mixed (classic voices plus newer concatenative voices)","plat":"Mac OS X / macOS","def":"Alex (Lion system voice)"},"pre":["mt3"],"vo":["mac_alex","mac_samantha","mac_karen","mac_moira","mac_fiona","mac_tessa","mac_serena","mac_vicki"],"src":["https://www.wap.org/journal/lionspeak/","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://en.wikipedia.org/wiki/PlainTalk"]},{"id":"mac_fred","n":"Fred (Apple)","co":"apple","cat":"TTS Voices","yr":1994,"y":"MacinTalk 3 (1994) to Mac OS X","o":"A classic male Mac voice, age 30 in its voice resource.","h":"In 1994 it shipped with Speech Manager 1.2.1, which 'includes Fred's voice', and it was first among the MacinTalk 3 voices. Its stored phrase: 'I sure like being inside this fancy computer.' It survived byte-identical into Mac OS X. MacinTalk 3 (with MacinTalk Pro, which needed a 68040 and at least 1 MB of RAM; MacinTalk 3 needed a 33 MHz 68030) brought a large set of voices: the adults Ralph, Fred and Kathy, the children Princess and Junior, and novelty voices such as Whisper, Zarvox, Trinoids, the singing Cellos (to Grieg's 'In the Hall of the Mountain King'), Good News, Bad News, Pipe Organ, the hoarse Albert, Bells, Boing and Bubbles. Each voice spoke its own test phrase in the Speech control panel. The voices remain in macOS. macOS Ventura renamed some of them, Princess becoming Superstar. macOS Sonoma changed every test phrase to 'Hello, my name is…', and macOS Tahoe brought back the original phrases.","s":{"syn":"MacinTalk 3 engine","plat":"System 7 to Mac OS X","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.cs.cmu.edu/Groups/AI/util/pubs/faqs/speech/mac.txt","https://discmaster.textfiles.com/view/21387/Macformat17.cdr/Shareware%20City/Sound/Talking%20Eggs%201.0/Talking%20Eggs%20ReadMe","https://github.com/tgeczy/outspoken-nvda","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://en.wikipedia.org/wiki/PlainTalk","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16"]},{"id":"mac_kathy","n":"Kathy (Apple)","co":"apple","cat":"TTS Voices","yr":1994,"y":"MacinTalk 3 (1994) to Mac OS X","o":"A female MacinTalk 3 voice, age 30. Phrase: 'Isn't it nice to have a computer that will talk to you?'","h":"Among the voices added in 1994. Macworld lists Kathy as one of the six default voices in Snow Leopard and Lion. MacinTalk 3 (with MacinTalk Pro, which needed a 68040 and at least 1 MB of RAM; MacinTalk 3 needed a 33 MHz 68030) brought a large set of voices: the adults Ralph, Fred and Kathy, the children Princess and Junior, and novelty voices such as Whisper, Zarvox, Trinoids, the singing Cellos (to Grieg's 'In the Hall of the Mountain King'), Good News, Bad News, Pipe Organ, the hoarse Albert, Bells, Boing and Bubbles. Each voice spoke its own test phrase in the Speech control panel. The voices remain in macOS. macOS Ventura renamed some of them, Princess becoming Superstar. macOS Sonoma changed every test phrase to 'Hello, my name is…', and macOS Tahoe brought back the original phrases. iOS 16 (2022) also added Junior, Kathy and Ralph to VoiceOver in U.S. English, alongside Agnes, Bruce and Vicki.","s":{"syn":"MacinTalk 3","plat":"System 7 to Mac OS X","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://discmaster.textfiles.com/view/21387/Macformat17.cdr/Shareware%20City/Sound/Talking%20Eggs%201.0/Talking%20Eggs%20ReadMe","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://en.wikipedia.org/wiki/PlainTalk","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16"]},{"id":"mac_ralph","n":"Ralph (Apple)","co":"apple","cat":"TTS Voices g me!'","h":"Added in the 1994 MacinTalk voice set. A macOS novelty voice. It was not on AppleVis's list of novelty voices added to iOS 16, which were Albert, Bad News, Bahh, Bells, Boing, Bubbles, Cellos, Good News, Jester, Organ, Superstar, Trinoids, Whisper, Wobble and Zarvox. René Ros's Talking Eggs utility (version 1.0, June 18, 1994) revealed that each MacinTalk III voice had an age and a joke phrase stored as its comment instead of a description. Hysterical's listed age was 30, and its phrase was \"Please stop tickling me!\" The readme warned that the voices could sound chopped up and that a Quadra seemed to be needed for them to work properly.","s":{"syn":"MacinTalk 3","plat":"System 7 and later","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://discmaster.textfiles.com/view/21387/Macformat17.cdr/Shareware%20City/Sound/Talking%20Eggs%201.0/Talking%20Eggs%20ReadMe","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://en.wikipedia.org/wiki/PlainTalk","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16"]},{"id":"mac_pipeorgan","n":"Pipe Organ (Apple)","co":"apple","cat":"TTS Voices","yr":1994,"y":"MacinTalk 3 (1994) to Mac OS X","o":"A singing organ novelty voice, age 500.","h":"Added in 1994 and still among Lion's US novelty voices. MacinTalk 3 (with MacinTalk Pro, which needed a 68040 and at least 1 MB of RAM; MacinTalk 3 needed a 33 MHz 68030) brought a large set of voices: the adults Ralph, Fred and Kathy, the children Princess and Junior, and novelty voices such as Whisper, Zarvox, Trinoids, the singing Cellos (to Grieg's 'In the Hall of the Mountain King'), Good News, Bad News, Pipe Organ, the hoarse Albert, Bells, Boing and Bubbles. Each voice spoke its own test phrase in the Speech control panel. The voices remain in macOS. macOS Ventura renamed some of them, Princess becoming Superstar. macOS Sonoma changed every test phrase to 'Hello, my name is…', and macOS Tahoe brought back the original phrases. iOS 16 (2022) brought the novelty voices to iPhone and iPad: Albert, Bad News, Bahh, Bells, Boing, Bubbles, Cellos, Good News, Jester, Organ, Superstar, Trinoids, Whisper, Wobble and Zarvox.","s":{"syn":"MacinTalk 3","plat":"System 7 to Mac OS X","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://discmaster.textfiles.com/view/21387/Macformat17.cdr/Shareware%20City/Sound/Talking%20Eggs%201.0/Talking%20Eggs%20ReadMe","https://www.wap.org/journal/lionspeak/","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://en.wikipedia.org/wiki/PlainTalk","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16"]},{"id":"mac_deranged","n":"Deranged (Apple)","co":"apple","cat":"TTS Voices","yr":1994,"y":"MacinTalk 3 (1994)","o":"A novelty voice, age 30. Phrase: 'I need to go on a really long vacation.'","h":"Added in the 1994 MacinTalk voice set. A macOS novelty voice. It was not on AppleVis's list of novelty voices added to iOS 16, which were Albert, Bad News, Bahh, Bells, Boing, Bubbles, Cellos, Good News, Jester, Organ, Superstar, Trinoids, Whisper, Wobble and Zarvox. René Ros's Talking Eggs utility (version 1.0, June 18, 1994) revealed that each MacinTalk III voice had an age and a joke phrase stored as its comment instead of a description. Deranged's listed age was 30, and its phrase was \"I need to go on a really long vacation.\" Other voices in the set included Albert, Bad News, Bahh, Bells, Boing, Bubbles, Cellos, Fred, Good News, Junior, Kathy, Pipe Organ, Princess, Ralph, Trinoids, Whisper and Zarvox.","s":{"syn":"MacinTalk 3","plat":"System 7 and later","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://discmaster.textfiles.com/view/21387/Macformat17.cdr/Shareware%20City/Sound/Talking%20Eggs%201.0/Talking%20Eggs%20ReadMe","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://en.wikipedia.org/wiki/PlainTalk","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16"]},{"id":"mac_bahh","n":"Bahh (Apple)","co":"apple","cat":"TTS Voices","yr":1994,"y":"MacinTalk 3 (1994)","o":"A sheep-like novelty voice, age 2. Phrase: 'Do not pull the wool over my eyes.'","h":"Added in the 1994 MacinTalk voice set. MacinTalk 3 (with MacinTalk Pro, which needed a 68040 and at least 1 MB of RAM; MacinTalk 3 needed a 33 MHz 68030) brought a large set of voices: the adults Ralph, Fred and Kathy, the children Princess and Junior, and novelty voices such as Whisper, Zarvox, Trinoids, the singing Cellos (to Grieg's 'In the Hall of the Mountain King'), Good News, Bad News, Pipe Organ, the hoarse Albert, Bells, Boing and Bubbles. Each voice spoke its own test phrase in the Speech control panel. The voices remain in macOS. macOS Ventura renamed some of them, Princess becoming Superstar. macOS Sonoma changed every test phrase to 'Hello, my name is…', and macOS Tahoe brought back the original phrases. iOS 16 (2022) brought the novelty voices to iPhone and iPad: Albert, Bad News, Bahh, Bells, Boing, Bubbles, Cellos, Good News, Jester, Organ, Superstar, Trinoids, Whisper, Wobble and Zarvox.","s":{"syn":"MacinTalk 3","plat":"System 7 and later","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://discmaster.textfiles.com/view/21387/Macformat17.cdr/Shareware%20City/Sound/Talking%20Eggs%201.0/Talking%20Eggs%20ReadMe","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://en.wikipedia.org/wiki/PlainTalk","https://www.applevis.com/podcasts/sneak-peek-additional-non-us-english-voices-coming-voiceover-ios-16"]},{"id":"mac_agnes","n":"Agnes (Apple)","co":"apple","cat":"TTS Voices","yr":1993,"y":"MacinTalk Pro (1993/1994) to Mac OS X","o":"A female MacinTalk Pro voice, offered in High Quality and Small versions.","h":"One of the three original MacinTalk Pro voices, described as the first concatenative Mac voices. A Mac voice that reached iPhone and iPad with iOS 16 (2022), when it was added to VoiceOver's U.S. English voices. In September 1994 Joe Campbell's comp.speech guide explained how to get Apple's Speech Manager free from ftp.apple.com, or with At Ease 2.x and the System 7.5 CD-ROM. MacinTalk Pro (1.2) needed a 68020 or better and System 7, and came with Agnes, Bruce and Victoria, each in a large high-quality version and a small lower-quality one; the voices download was about 12.5 MB. Campbell rated the high-quality voices among the best synthesized speech he had heard.","s":{"syn":"Concatenative (MacinTalk Pro)","plat":"System 7 (68020 or later) to Mac OS X","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.cs.cmu.edu/Groups/AI/util/pubs/faqs/speech/mac.txt","https://github.com/tgeczy/outspoken-nvda","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16"]},{"id":"mac_bruce","n":"Bruce (Apple)","co":"apple","cat":"TTS Voices","yr":1993,"y":"MacinTalk Pro (1993/1994) to Mac OS X","o":"A male MacinTalk Pro voice, still a default voice in Snow Leopard and Lion.","h":"Original MacinTalk Pro voice. Macworld described Bruce and Katy as 'more robotic' than Alex. A Mac voice that reached iPhone and iPad with iOS 16 (2022), when it was added to VoiceOver's U.S. English voices. In September 1994 Joe Campbell's comp.speech guide explained how to get Apple's Speech Manager free from ftp.apple.com, or with At Ease 2.x and the System 7.5 CD-ROM. MacinTalk Pro (1.2) needed a 68020 or better and System 7, and came with Agnes, Bruce and Victoria, each in a large high-quality version and a small lower-quality one; the voices download was about 12.5 MB. Campbell rated the high-quality voices among the best synthesized speech he had heard.","s":{"syn":"Concatenative (MacinTalk Pro)","plat":"System 7 to Mac OS X","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.cs.cmu.edu/Groups/AI/util/pubs/faqs/speech/mac.txt","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16"]},{"id":"mac_victoria","n":"Victoria (Apple)","co":"apple","cat":"TTS Voices","yr":1993,"y":"MacinTalk Pro (1993/1994) to Mac OS X","o":"A female MacinTalk Pro voice. In Mac OS X, Macworld calls her the female equivalent of Alex.","h":"Original MacinTalk Pro voice, still a default voice in Snow Leopard and Lion. Lion included a recreation of the 1984 introduction speech in Victoria's voice. Macworld called Victoria 'the female equivalent of Alex' and one of the six voices shown by default in Snow Leopard and Lion. In September 1994 Joe Campbell's comp.speech guide explained how to get Apple's Speech Manager free from ftp.apple.com, or with At Ease 2.x and the System 7.5 CD-ROM. MacinTalk Pro (1.2) needed a 68020 or better and System 7, and came with Agnes, Bruce and Victoria, each in a large high-quality version and a small lower-quality one; the voices download was about 12.5 MB. Campbell rated the high-quality voices among the best synthesized speech he had heard.","s":{"syn":"Concatenative (MacinTalk Pro)","plat":"System 7 to Mac OS X","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.cs.cmu.edu/Groups/AI/util/pubs/faqs/speech/mac.txt","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.wap.org/journal/lionspeak/","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html"]},{"id":"mac_alex","n":"Alex (Apple)","co":"apple","cat":"TTS Voices","yr":2007,"y":"Mac OS X 10.5 Leopard (October 2007) onward","o":"Apple's natural-sounding male voice with breath and pause modeling, beloved by VoiceOver users for fast listening.","h":"Introduced in Leopard as part of its updated accessibility features. Engadget compared it favorably with AT&T Natural Voices and Cepstral. It became the default system voice (Lion). Alex arrived with Mac OS X 10.5 Leopard (2007) as a much more natural-sounding voice than earlier Mac voices. With Mac OS X 10.7 Lion, voices became available in more English accents and 21 other languages.","s":{"syn":"Enhanced-quality concatenative voice with natural breathing (Leopard)","plat":"Mac OS X 10.5 and later","def":"Default system voice in Mac OS X 10.5 Leopard"},"src":["https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://www.macworld.com/article/185797/voicemac.html","https://www.wap.org/journal/lionspeak/","https://en.wikipedia.org/wiki/PlainTalk"]},{"id":"mac_samantha","n":"Samantha (Apple)","co":"apple","cat":"TTS Voices","yr":2011,"y":"Mac OS X 10.7 Lion (2011) onward","o":"A US English female voice, downloadable in Lion. Macworld called it close to, but not exactly, Siri.","h":"Added as a free download in Lion. Snow Leopard had no Samantha. Its relationship to Nuance voices is not confirmed in these sources. AppleInsider listed Samantha in March 2011 as one of three new high-quality US English voices for Lion, with Tom and Jill. In April 2012 9to5Mac, following a Reddit user, reported that the downloadable Samantha was the same voice as Siri's in the United States; Lion asked to confirm a 469 MB download when it was selected.","s":{"syn":"Nuance (licensed by Apple)","plat":"Mac OS X 10.7 and later","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.wap.org/journal/lionspeak/","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://9to5mac.com/2011/05/14/nuance-and-apple-partnership-is-all-but-confirmed-lion-uses-nuance-speech-technology/","https://appleinsider.com/articles/11/03/02/inside_mac_os_x_10_7_lion_dozens_of_high_quality_new_multilingual_speech_voices","https://9to5mac.com/2012/04/20/tip-bring-siris-voice-to-your-mac-with-samantha-downloadable-voice-for-lion/"]},{"id":"mac_karen","n":"Karen (Apple, Australian English)","co":"apple","cat":"TTS Voices","yr":2011,"y":"Mac OS X Lion (2011)","o":"An Australian English female voice, downloadable in Lion.","h":"Part of Lion's new free downloadable voices. In March 2011, before Lion shipped, AppleInsider reported that Apple would offer 53 new high-quality voices in more than 40 languages and dialects. Each was about a third to more than half a gigabyte, so they came as optional downloads instead of being preinstalled. They joined Alex (Leopard, 2007) and Vicki (Panther, 2003). The new English voices were Tom, Samantha and Jill (US); Karen and Lee (Australia); Daniel, Emily and Serena (UK); Fiona (Scotland); Sangeeta (India); Moira (Ireland); and Tessa (South Africa). 9to5Mac later identified the voices as Nuance speech technology, the same company that powered Siri. To install one: System Preferences, Speech, Text to Speech, System Voice, Customize. Karen was one of two Australian English voices, with Lee.","s":{"syn":"Nuance (licensed by Apple)","plat":"Mac OS X 10.7 and later","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.wap.org/journal/lionspeak/","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://9to5mac.com/2011/05/14/nuance-and-apple-partnership-is-all-but-confirmed-lion-uses-nuance-speech-technology/","https://appleinsider.com/articles/11/03/02/inside_mac_os_x_10_7_lion_dozens_of_high_quality_new_multilingual_speech_voices","https://9to5mac.com/2012/04/20/tip-bring-siris-voice-to-your-mac-with-samantha-downloadable-voice-for-lion/"]},{"id":"mac_moira","n":"Moira (Apple, Irish English)","co":"apple","cat":"TTS Voices","yr":2011,"y":"Mac OS X Lion (2011)","o":"An Irish English female voice, downloadable in Lion.","h":"Part of Lion's new downloadable voices. In March 2011, before Lion shipped, AppleInsider reported that Apple would offer 53 new high-quality voices in more than 40 languages and dialects. Each was about a third to more than half a gigabyte, so they came as optional downloads instead of being preinstalled. They joined Alex (Leopard, 2007) and Vicki (Panther, 2003). The new English voices were Tom, Samantha and Jill (US); Karen and Lee (Australia); Daniel, Emily and Serena (UK); Fiona (Scotland); Sangeeta (India); Moira (Ireland); and Tessa (South Africa). 9to5Mac later identified the voices as Nuance speech technology, the same company that powered Siri. To install one: System Preferences, Speech, Text to Speech, System Voice, Customize. Moira was the only Irish English voice.","s":{"syn":"Nuance (licensed by Apple)","plat":"Mac OS X 10.7 and later","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.wap.org/journal/lionspeak/","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://9to5ma -mac-with-samantha-downloadable-voice-for-lion/"]},{"id":"mac_tessa","n":"Tessa (Apple, South African English)","co":"apple","cat":"TTS Voices","yr":2011,"y":"Mac OS X Lion (2011)","o":"A South African English female voice, downloadable in Lion.","h":"Part of Lion's new downloadable voices. In March 2011, before Lion shipped, AppleInsider reported that Apple would offer 53 new high-quality voices in more than 40 languages and dialects. Each was about a third to more than half a gigabyte, so they came as optional downloads instead of being preinstalled. They joined Alex (Leopard, 2007) and Vicki (Panther, 2003). The new English voices were Tom, Samantha and Jill (US); Karen and Lee (Australia); Daniel, Emily and Serena (UK); Fiona (Scotland); Sangeeta (India); Moira (Ireland); and Tessa (South Africa). 9to5Mac later identified the voices as Nuance speech technology, the same company that powered Siri. To install one: System Preferences, Speech, Text to Speech, System Voice, Customize. Tessa was the only South African English voice.","s":{"syn":"Nuance (licensed by Apple)","plat":"Mac OS X 10.7 and later","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.wap.org/journal/lionspeak/","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://9to5mac.com/2011/05/14/nuance-and-apple-partnership-is-all-but-confirmed-lion-uses-nuance-speech-technology/","https://appleinsider.com/articles/11/03/02/inside_mac_os_x_10_7_lion_dozens_of_high_quality_new_multilingual_speech_voices","https://9to5mac.com/2012/04/20/tip-bring-siris-voice-to-your-mac-with-samantha-downloadable-voice-for-lion/"]},{"id":"mac_serena","n":"Serena (Apple, UK English)","co":"apple","cat":"TTS Voices","yr":2011,"y":"Mac OS X Lion (2011)","o":"A UK English female voice, downloadable in Lion.","h":"Part of Lion's new downloadable voices, alongside Emily. In March 2011, before Lion shipped, AppleInsider reported that Apple would offer 53 new high-quality voices in more than 40 languages and dialects. Each was about a third to more than half a gigabyte, so they came as optional downloads instead of being preinstalled. They joined Alex (Leopard, 2007) and Vicki (Panther, 2003). The new English voices were Tom, Samantha and Jill (US); Karen and Lee (Australia); Daniel, Emily and Serena (UK); Fiona (Scotland); Sangeeta (India); Moira (Ireland); and Tessa (South Africa). 9to5Mac later identified the voices as Nuance speech technology, the same company that powered Siri. To install one: System Preferences, Speech, Text to Speech, System Voice, Customize. Serena was one of three British English voices, with Daniel and Emily.","s":{"syn":"Nuance (licensed by Apple)","plat":"Mac OS X 10.7 and later","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.wap.org/journal/lionspeak/","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://9to5mac.com/2011/05/14/nuance-and-apple-partnership-is-all-but-confirmed-lion-uses-nuance-speech-technology/","https://appleinsider.com/articles/11/03/02/inside_mac_os_x_10_7_lion_dozens_of_high_quality_new_multilingual_speech_voices","https://9to5mac.com/2012/04/20/tip-bring-siris-voice-to-your-mac-with-samantha-downloadable-voice-for-lion/"]},{"id":"mac_vicki","n":"Vicki (Apple)","co":"apple","cat":"TTS Voices","yr":2003,"y":"Mac OS X 10.3 Panther (2003)","o":"A US English female voice listed among Lion's English voices.","s":{"syn":"Apple does not describe the technique. AppleInsider says Vicki was added in Mac OS X Panther (2003), before Alex (10.5) and the Nuance voices of Lion.","plat":"Mac OS X","def":"Not the system default (Alex is the default from Mac OS X 10.5)"},"src":["https://www.wap.org/journal/lionspeak/","https://www.macworld.com/article/216121/how-to-change-the-mac-s-system-voice.html","https://www.engadget.com/2007-10-26-24-hours-of-leopard-alex-the-new-voice-of-mac-os-x.html","https://alvinalexander.com/mac-os-x/mac-osx-text-to-speech-default-system-voice/","https://appleinsider.com/articles/11/03/02/inside_mac_os_x_10_7_lion_dozens_of_high_quality_new_multilingual_speech_voices","https://en.wikipedia.org/wiki/MacInTalk","https://forums.appleinsider.com/discussion/31630/panther-and-vicki","https://en.wikipedia.org/wiki/PlainTalk","https://www.applevis.com/podcasts/sneak-peek-additional-us-voices-coming-voiceover-ios-16"],"h":" A user's guide to Mac OS X speech listed Vicki among the standard system voices alongside Alex, Fred and Bruce. Vicki came from Mac OS X 10.3 (Panther, 2003): Apple greatly improved the Victoria voice and shipped the result as Vicki, keeping Victoria. Its higher-quality diphone samples made it almost 20 times larger. iOS 16 (2022) added Vicki to VoiceOver in U.S. English."},{"id":"vocalizer","n":"Nuance Vocalizer / RealSpeak (engine)","co":"nuance","cat":"TTS Voices","yr":0,"y":"Mid-2000s to present. Nuance built its TTS line through acquisitions, including Rhetorical (2004) and SVOX (2011), and Vocalizer was the TTS in the first-generation Victor Reader Stream (2007). The first release date of the Vocalizer brand itself was not found.","o":"Nuance's concatenative TTS family. Voices include Tom, Samantha, Daniel and Karen, according to a fan-maintained list that should be treated as a weak source.","h":"Nuance assembled its speech portfolio through acquisitions, including Rhetorical (2004) and SVOX (2011). Vocalizer was the TTS in the 1st-generation Victor Reader Stream and the ClassMate Reader. JAWS 2026 includes Vocalizer Expressive voices.","s":{"syn":"Concatenative (unit selection)","plat":"Windows, embedded devices, mobile","def":"Victor Reader Stream (1st generation), ClassMate Reader; included with JAWS (Vocalizer Expressive)"},"src":["http://truegryc.blogspot.com/2011/06/nuance-corporate-acquisition-history.html","https://jctnpedia.fandom.com/wiki/Text-to-Speech_Downloadables_List","https://www.avh.asso.fr/implantations/certam/evaluations-de-produits/jaws-version-2026"]},{"id":"nu_tom","n":"Nuance Tom","co":"nuance","cat":"TTS Voices","yr":0,"y":"By 2016 (updated in Vocalizer Expressive 2.2)","o":"A US English male Vocalizer/RealSpeak voice.","h":"A US English male Nuance Vocalizer voice. Freedom Scientific's JAWS 18 notes describe Samantha, Tom, Daniel and Karen as familiar voices updated for Vocalizer Expressive 2.2, and Nuance's Vocalizer documentation lists Tom. Freedom Scientific's JAWS 18 notes (2016) describe it as a familiar voice updated for Vocalizer Expressive 2.2. Apple also shipped Tom and Samantha as new voices in Mac OS X 10.7 Lion in 2011 (AppleInsider). No first-release date was found in Nuance's documentation.","s":{"syn":"Nuance Vocalizer: concatenates recorded speech units, with a multiform mode that alternates unit selection and statistical parametric generation","plat":"Nuance Vocalizer (enterprise and Expressive); JAWS 18 and later","def":"An optional voice; no source documents it as the out-of-box default of a screen reader. JAWS 18 notes list it among the voices updated for Vocalizer Expressive 2.2."},"src":["https://docs.nuance.com/nuance-vocalizer-for-enterprise/voc-dev/lang.html","https://saomaicenter.org/en/blog/whats-new-jaws-180","https://docs.nuance.com/speech-suite/voc-dev/primer.html","https://speech.zone/courses/speech-synthesis/module-1-introduction/current-technology/","https://appleinsider.com/articles/11/03/02/inside_mac_os_x_10_7_lion_dozens_of_high_quality_new_multilingual_speech_voices"]},{"id":"nu_samantha","n":"Nuance Samantha","co":"nuance","cat":"TTS Voices","yr":0,"y":"By 2016 (updated in Vocalizer Expressive 2.2)","o":"A US English female Vocalizer/RealSpeak voice.","h":"A US English female Nuance Vocalizer voice. Freedom Scientific's JAWS 18 notes describe Samantha, Tom, Daniel and Karen as familiar voices updated for Vocalizer Expressive 2.2, and Nuance's Vocalizer documentation lists Samantha. Freedom Scientific's JAWS 18 notes (2016) describe it as a familiar voice updated for Vocalizer Expressive 2.2. Apple also shipped Tom and Samantha as new voices in Mac OS X 10.7 Lion in 2011 (AppleInsider). No first-release date was found in Nuance's documentation.","s":{"syn":"Nuance Vocalizer: concatenates recorded speech units, with a multiform mode that alternates unit selection and statistical parametric generation","plat":"Nuance Vocalizer (enterprise and Expressive); JAWS 18 and later","def":"An optional voice; no source documents it as the out-of-box default of a screen reader. JAWS 18 notes list it among the voices updated for Vocalizer Expressive 2.2."},"src":["https://docs.nuance.com/nuance-vocalizer-for-enterprise/voc-dev/lang.html","https://saomaicenter.org/en/blog/whats-new-jaws-180","https://docs.nuance.com/speech-suite/voc-dev/primer.html","https://speech.zone/courses/speech-synthesis/module-1-introduction/current-technology/","https://appleinsider.com/articles/11/03/02/inside_mac_os_x_10_7_lion_dozens_of_high_quality_new_multilingual_speech_voices"]},{"id":"nu_daniel","n":"Nuance Daniel","co":"nuance","cat":"TTS Voices","yr":0,"y":"By 2016 (updated in Vocalizer Expressive 2.2)","o":"A UK English male Vocalizer voice.","h":"A British English male Nuance Vocalizer voice. Freedom Scientific's JAWS 18 notes describe Samantha, Tom, Daniel and Karen as familiar voices updated for Vocalizer Expressive 2.2, and Nuance's Vocalizer documentation lists Daniel. Freedom Scientific's JAWS 18 notes (2016) describe it as a familiar voice updated for Vocalizer Expressive 2.2. Apple also shipped Tom and Samantha as new voices in Mac OS X 10.7 Lion in 2011 (AppleInsider). No first-release date was found in Nuance's documentation.","s":{"syn":"Nuance Vocalizer: concatenates recorded speech units, with a multiform mode that alternates unit selection and statistical parametric generation","plat":"Nuance Vocalizer (enterprise and Expressive); JAWS 18 and later","def":"An optional voice; no source documents it as the out-of-box default of a screen reader. JAWS 18 notes list it among the voices updated for Vocalizer Expressive 2.2."},"src":["https://docs.nuance.com/nuance-vocalizer-for-enterprise/voc-dev/lang.html","https://saomaicenter.org/en/blog/whats-new-jaws-180","https://docs.nuance.com/speech-suite/voc-dev/primer.html","https://speech.zone/courses/speech-synthesis/module-1-introduction/current-technology/","https://appleinsider.com/articles/11/03/02/inside_mac_os_x_10_7_lion_dozens_of_high_quality_new_multilingual_speech_voices"]},{"id":"acapela","n":"Acapela voices","co":"acapela","cat":"TTS Voices","yr":2004,"y":"Merger announced January 2004; name unveiled April 2004","o":"Acapela Group's TTS voices are the default in HumanWare's Stream 2, Stream 3 and Trek.","h":"On Stream 3, firmware 1.7 (September 2026) allows up to 2 Acapela voices plus up to 2 eSpeak NG voices. Acapela's roots go back to Babel Technologies, founded in 1997 under Vincent Fontaine as the University of Mons's first spin-off. Babel took over Infovox, a subsidiary of the Swedish operator Telia, in 2001. Babel and the Toulouse text-to-speech company Elan Speech announced their merger on January 7, 2004. Their combined revenue had been €4.7 million in 2003. In April 2004 the group, with Babel Infovox, took the name Acapela Group, with offices in Mons, Toulouse and Stockholm and about 70 staff. Its own timeline lists Infovox Desktop and Virtual Speaker in 2004, Infovox iVox in 2006, an iPhone SDK for Acapela TTS and its first HMM-based TTS project in 2008, and in 2010 Infovox3, a portable talking companion for visually impaired users. Lars-Erik Larsson took over as chief executive from Fontaine in December 2007.","s":{"syn":"Unit selection (concatenating studio recordings); later Acapela DNN neural voices","plat":"Embedded devices and others","def":"Victor Reader Stream 2 and 3, Victor Reader Trek"},"src":["https://www.humanware.com/microsite/stream/index.html","https://milled.com/humanware-uk/stream-3-version-1-7-new-voices-new-languages-Kt8Q3AENeTWOm1mU","https://www.acapela-group.com/news/brainy-voices-innovative-voice-creation-based-on-deep-learning-by-acapela-group-research-lab/","https://www.speechtechmag.com/Articles/ReadArticle.aspx?ArticleID=32697","https://www.acapela-group.com/voiceai-people-behind-technology-at-acapela-group/company-timeline/","https://connaitrelawallonie.wallonie.be/wallons-marquants/dictionnaire-des-wallons/fontaine-vincent","https://www.01net.com/actualites/les-technologies-vocales-europeennes-parlent-dune-meme-voix-230735.html"]},{"id":"ivona","n":"IVONA voices","co":"ivona","cat":"TTS Voices","yr":0,"y":"Acquired by Amazon January 2013","o":"IVONA's TTS powered Kindle Fire accessibility features.","h":"Amazon announced the acquisition of IVONA Software on January 24, 2013. IVONA was built by IVO Software in Gdańsk, Poland. Its U.S. English entry in the 2006 Blizzard Challenge got the highest naturalness (mean opinion score) ratings from the expert listeners. It entered again in 2007 and 2009; at the time of the 2009 challenge it offered voices in U.S. English, Polish and Romanian, with two British English voices to follow. Amazon announced on January 24, 2013 that it had bought IVONA Software, whose voices then powered Text-to-Speech, Voice Guide and Explore by Touch on Kindle Fire tablets. At that point IVONA had 44 voices in 17 languages and worked with the RNIB and the DAISY Consortium.","s":{"syn":"Concatenative unit selection with limited time-scale modification (USLTM), using diphones with a half-phone fallback (IVO Software Blizzard Challenge papers)","plat":"Kindle Fire and others","def":"Kindle Fire text-to-speech"},"src":["https://press.aboutamazon.com/2013/1/amazon-com-announces-acquisition-of-ivona-software","https://www.theverge.com/2013/1/24/3911056/amazon-acquires-kindle-fire-text-to-speech-provider-but-this-isnt","http://festvox.org/blizzard/bc2009/ivona_Blizzard2009.pdf","https://www.isca-archive.org/blizzard_2007/kaszczuk07_blizzard.pdf","https://www.isca-archive.org/blizzard_2006/osowski06_blizzard.pdf","https://www.isca-archive.org/blizzard_2009/kaszczuk09_blizzard.pdf"]},{"id":"neo_voices","n":"NeoSpeech Kate, Paul and Julie","co":"neospeech","cat":"TTS Voices","yr":2001,"y":"September 2001 (Kate, as Voiceware VoiceText)","o":"NeoSpeech's US English voices.","h":"NeoSpeech later moved its TTS hosting to Amazon. NeoSpeech's Kate voice was released in September 2001 and Paul in May 2002. Kate was released in September 2001 as the first American English voice in VoiceText, from the Korean company Voiceware (founded 2000). In February 2002 Voiceware set up its US subsidiary NeoSpeech, founded by speech engineers Lin Chase and Yoon Kim, later based in Santa Clara, California. VoiceText uses unit selection synthesis, built from large databases of recorded speech. Stephen Hawking briefly used NeoSpeech in 2004 before returning to his DECtalk voice, and Adobe chose it for Captivate. ZoomText 9 offered NeoSpeech voices (Paul and one female US voice) as natural-sounding alternatives to its ViaVoice speech; reviewer Veli-Pekka Tätilä praised Paul's intonation but noted a lag before speech. Pentax bought Voiceware in January 2006, HOYA bought Pentax in 2007 to 2008, and after HOYA bought ReadSpeaker in 2017 it put NeoSpeech, Voiceware and VoiceText under the ReadSpeaker brand.","s":{"syn":"Unit selection synthesis (corpus-based concatenation of recorded speech; VoiceText engine, originally from Voiceware)","plat":"Windows (SAPI) and others","def":"No single default. The BookSense uses Paul and Kate as its two reading voices."},"src":["https://www.speechtechmag.com/Articles/News/News-Feature/NeoSpeech-Turns-TTS-Over-to-Amazon-Hosting--89128.aspx","https://en.wikipedia.org/wiki/NeoSp
